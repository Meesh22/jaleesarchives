    const INITIAL_ARCHIVE = {"محمد الدبيخي": [{"type": "article", "title": "النَّحليون والذُّبابيون", "date": "4/6/2026", "body": "في مجالسنا ومجموعاتنا الرقمية، يتسلل إلى نفوسنا من حيث لا نشعر، ويستوطن عاداتنا من حيث لا نعي، نزوع خفي إلى اصطياد العثرات.\n- في مجلس عامر يُتداول عشرات الأسماء من أصحاب المواقف وأهل العطاء، فلا تسمع لصاحبنا همسا، ولكن ما إن يُذكر اسمٌ دارت حوله الأقاويل، حتى ينتفض كـ\"السيل الجارف\"؛ ينقل ما سَمِع وما لم يسمع، وما قِيل وما لم يُقَل.\n- وفي مجموعات \"الواتساب\"، تراه ساكناً كامناً \"كجلمود صخر لم يحطه السيل من عل\"، لا يشارك بلفظةِ نفع أو حتى برمز إعجاب. حتى إذا تخيّل زلةً أو تيقن هفوة، انطلق كـ\"السهم المارد والفهد الجارح\" تعديلاً وتبديلاً وربما تبكيتاً وتجريحاً.\nخاتمة: إن العقل والخُلق يقتضيان أن نوطن أنفسنا أن نكون نحليين نلتقط المكارم ونحتفي بالجمال ونبرز الحسنات، نلتمس الأعذار ونستر العثرات."}, {"type": "article", "title": "أوهام المفاضلة: القرآن أم القراءة؟", "date": "10/6/2026", "body": "سألني -وكنت أحدثه عن النادي-: \"أليس الأولى.. بدلاً من أقرأ نصف ساعة في كتاب، أن أتلو جزءاً أو أحفظ وجهاً من القرآن الكريم؟\"\nقلت له يا صاحبي: السؤال هنا مجانب للصواب؛ فلا تفاضل بين أصلٍ وتكميل.\nالقرآن قوت الروح، ومنهج الحياة، وحق رباني لا يقبل المزاحمة. أما القراءة، فهي وسيلة لبناء الوعي ومكملة لبناء العقل.\nولتقريب الصورة؛ فإن مَن يسأل عن الموازنة بينهما كمن يسأل: \"هل الأفضل لجسدي أن آكل وأشرب، أم أمارس الحركة والرياضة؟\" فالطعام والشراب أصل البقاء، والرياضة تقوية للجسد.\nلفتة: لا يعني ذلك فصل القراءة عن سياق التعبد؛ فكثيراً ما تكون الكتب بوابات تُعمّق فهمنا للقرآن، وتزيدنا بصيرة في الدين والنفس والآفاق.\nخاتمة: الإشكالية ليست في ضيق الوقت فالوقت يتسع للكثير، بل في فوضى الأولويات. فإذا انتظمنا امتلاء القلب بنور الوِرد القرآني، واتسع الوقت بعده للعقل ثقافةً، واطلاعاً، ونماء."}, {"type": "article", "title": "استمتع باللحظة (تأمل في حديث: فإن الخل نعم الأدم)", "date": "12/8/2026", "body": "في صحيح مسلم: حدثني طلحة بن نافع؛ أنه سمع جابر بن عبد الله يقول: أخذ رسول الله صلى الله عليه وسلم بيدي، ذات يوم، إلى منزله. فأخرج إليه فلقا من خبز. فقال (ما من أدم؟) فقالوا: لا. إلا شيء من خل. قال (فإن الخل نعم الأدم).\nتأمل في حديث: (كسرة خبز وخلٍ) تستحق الاحتفاء؛ فجمال الحياة في تفاصيلها الصغيرة.. استمتع بـ شربة ماء.. بنسمة هواء.. بفنجانِ قهوة.. بمذاقِ تمرة.. بمنظر شجرة.. بجلسة مع قريب.. ببراءة طفل.. بتوفيق لعبادة.. بـفراغ ساعة.. بقراءةِ صفحة."}, {"type": "article", "title": "الذهن العامي والذهن البليغ", "date": "20/9/2023", "body": "الذهن العامي يركز ويناقش الأحداث، أما الذهن البليغ يركز على الأفكار.\nالذهن العامي يتحدث عما يراه، أما الذهن البليغ يحلل ما يراه.\nالذهن العامي ينقل كل ما يقال، والذهن البليغ يبدع الفكرة والمقولة فتنقل عنه."}, {"type": "article", "title": "لماذا جلسات النقاش القرائي؟", "date": "21/9/2023", "body": "١- ترسيخ أهم مفاهيم الكتاب من خلال الاستماع والحوار حولها، فكأنك قرأت الكتاب أكثر من مرة.\n٢- تنمية مهارات الحوار والإقناع من خلال المشاركة في النقاش.\n٣- تنمية التفكير النقدي بسماع تفسيرات متعددة حول الكتاب وموضوعه.\n٤- التشجيع على قراءة الكتاب في المدة المحددة."}, {"type": "article", "title": "أثر فهم المغالطات المنطقية في كشف الخلل", "date": "22/9/2023", "body": "أحياناً تدرك أن هذه المقولة المنتشرة خاطئة لكنك لا تستطيع تحديد مكمن الضعف فيها الذي لو حددته لسقطت المقولة جملة وتفصيلا، فهم المغالطات يسلط الضوء على مكامن الخلل."}, {"type": "article", "title": "لا نخادع أنفسنا: الوقت والقراءة", "date": "9/12/2023", "body": "الدكتور صالح الأنصاري يتكلم عن تخصيص وقت للمشي: (لا تقل أنا ما عندي وقت، لكن قل أنا ما خصصت وقت) وهذه القاعدة تنطبق على كل مجالات الحياة، كالقراءة مثلاً.... لم نخصص وقتاً لما نريد، فضاعت كثير من أوقاتنا في الجوال."}, {"type": "article", "title": "قراءة نقدية في ورقة سخرية الجاحظ في كتابه البخلاء", "date": "31/12/2023", "body": "هنا الورقة التي ألقى منها الغالي محمد العمر في لقاء جليس الماضي: سخرية الجاحظ في كتابه البخلاء. هذه الورقات لفتت انتباهي ليس ما فيها من تقييد ومعلومات رائعة بل في الطريقة التي كُتبت فيها؛ فالكاتب هنا لم يقيد اقتباسات مجردة، بل سجّل تأملات جاءت من هضم ومعالجة ما قرأه، وهي تنم عن استيعاب وإدراك عالي فأصبحت في نظري مثالاً نموذجياً في القراءة النقدية."}, {"type": "article", "title": "قراءة في كتاب: مفاتح إقامة الصلاة", "date": "10/2/2024", "body": "جميعنا يعلم أهمية الصلاة ومكانتها وفضلها. لكن السؤال الذي يدور في ذهن الكثير: هل يصح أن تسمى صلاتنا صلاة؟ هل قلوبنا وأرواحنا حاضرة في الصلاة؟ هل نشتاق إليها، ولماذا نتأخر بالحضور لها؟ هذا الكتاب يجيب على هذه الأسئلة وغيرها، للوصول إلى إقامة الصلاة الخاشعة."}, {"type": "article", "title": "خاطرة: القراءة من السعادة (شجرة المعرفة)", "date": "4/5/2024", "body": "القراءة من السعادة وذلك عندما يصل القارئ إلى مرحلة الفرح بالمعرفة؛ فكلما قرأ معلومة أو معنى جديداً ينتشي سعادة وحبوراً، يشعر بأنه نبتت في داخله شجرة ظليلة، حتى تتكون لديه غابة من المعرفة يستظل بها متى شاء، وليس أن يعيش في صحراء جرداء خالية من الظل والجمال."}, {"type": "article", "title": "خاطرة: القراءة المتأنية في الغابة (جليسيات)", "date": "26/5/2024", "body": "أتى إلى الغابة ليستمتع بالطبيعة لكنه كان يقود سيارته مسرعاً بين المروج والأنهار ففاتته مناظر جميلة مر بها مرور الكرام. إنه ذلك القارئ الذي يقرأ قراءة سريعة في كتاب مثمر؛ استمتع وتأن بالقراءة لتجعل فرصة للمعاني الجميلة أن تنسكب في أعماق نفسك."}, {"type": "quote", "title": "تفسير القرطبي", "date": "", "body": "في قول الله تعالى: 【 وَلا تَمْنُنْ تَسْتَكْثِرُ 】 يقول القرطبي في تفسيره: التأويل الْعَاشِرُ: لَا تَعْمَلْ طَاعَةً وَتَطْلُبَ ثَوَابَهَا، وَلَكِنِ اصْبِرْ حَتَّى يَكُونَ اللَّهُ هُوَ الَّذِي يُثِيبُكَ عَلَيْهَا."}, {"type": "quote", "title": "كيف تقنع الآخرين — ص٣٢٣", "date": "", "body": "نصائح في الإقناع تتعلق بآداب الاستماع: ربط بداية حديثك بنهاية حديث المتلقي حتى يشعر باعتبارك لحديثه وتقديرك لشخصه وأهميته، وقدم له الحقائق والأرقام والمعلومات التي تشعره بقوة معلوماتك وأهميتها وواقعية حديثك ومصداقيته، ثم سر به شيئا فشيئا أثناء تقديم المقدمات المعلوماتية حتى يصل بنفسه إلى النتيجة التي تريدها."}, {"type": "quote", "title": "كيف تقنع الآخرين؟ — ص١٨١", "date": "", "body": "إن المقارنة بين جلسة الاعتراف بكل ما ارتكبه من أفعال أمام القس لطلب الغفران وبين التوبة في الإسلام بين العبد وربه من غير اطلاع الآخرين وفضولهم، تبني في الفكر تساؤلا طويلا ومحيراً يقود إلى الاقتناع بهذا الدين بل والانتماء إليه لأن الإسلام لا يعرف وسيطاً بين العبد وربه، وإذا كان القس يغفر للناس والبابا يغفر للقس وغيره فمن يغفر للبابا ؟!"}, {"type": "quote", "title": "كيف تقنع الآخرين — ص٢٠٠ (الحسن اليوسي)", "date": "", "body": "وتتسم الأمثال بالقبول وسرعة التناول: يقول الحسن اليوسي: «إن ضرب المثل يوضح المبهم ويفتح المنغلق، وبه يصور المعنى في الذهن، ويكشف المعمى عند اللبس، وبه يقع الأمر في النفس أحسن موقع، وتقبله فضل قبول، وتطمئن به اطمئنانا، وبه يقع إقناع الخصم وقطع تشوف المعترض»."}, {"type": "quote", "title": "الشوق للقرآن — ص١٩٤ (ابن القيم)", "date": "", "body": "فَلَو علم النَّاس مَا فِي قِرَاءَةِ الْقُرْآن بالتدبر لاشتغلوا بها عن كل ما سواها."}, {"type": "quote", "title": "الشوق للقرآن — ص٥٠", "date": "", "body": "القرآن لا يرتبط بفراغ الوقت وإنما بحاجة القلب له واضطراره له. هناك ثلاث فئات من المسلمين أمروا بقراءة القرآن مع ضيق أوقاتهم【 عَلِمَ أَن سَيَكُونُ مِنكُم مَّرْضَىٰ وَءَاخَرُونَ يَضْرِبُونَ فِي ٱلْأَرْضِ يَبْتَغُونَ مِن فَضْلِ ٱللَّهِ وَءَاخَرُونَ يُقَٰتِلُونَ فِي سَبِيلِ ٱللَّهِۖ فَٱقْرَءُوا۟ مَا تَيَسَّرَ مِنْهُۚ 】"}, {"type": "quote", "title": "اشرح أفكارك / ياسر الحزيمي — ص٣٧", "date": "", "body": "كتمان هذه المشاعر (مشاعر عدم الرضا) يُفسد نفسيتك، بل ويُفسد حتى جسدك، لماذا؟ لأنَّ النفس إذا سكتت وسكتت وسكتت، تكلم الجسد، وكلام الجسد يكون بالأمراض، فتبدأ الأعراض بالظهور...، وسببها أنك تكتم كثيرا، فيكون ذلك على حساب صحتك وصحبتك."}, {"type": "quote", "title": "المواهب الربانية للسعدي — ص٩٩", "date": "", "body": "النقص إنما يصيب العبد من أحد أمرين: ١- إما من عدم عزمه على الرشد الذي هو الخير ٢- وإما من عدم ثباته واستمراره على عزمه. ولهذا كان دعاء النبي اللهم إني أسألك الثبات في الأمر، والعزيمة على الرشد من أنفع الأدعية وأجمعها للخيرات."}, {"type": "quote", "title": "غرة في الجبين — د. عبدالله البريدي ص٢٤", "date": "", "body": "حدد الدكتور عبدالله البريدي مقومات الشخصية القصيمية وفق هذه المميزات: التجارية والصمودية، والقيادية، والجدية، والقصيمية (الثقافة الخاصة) والاجتماعية، والأفقية (من سعة الأفق) والاعتدادية."}, {"type": "quote", "title": "جوزيات — ابن الجوزي ص١٨ وص٧٨", "date": "", "body": "عُدَّ مَنْعَ اللَّهِ إِيَّاكَ عَطَاءَ مِنْهُ لك؛ فَإِنَّهُ لَمْ يَمْنَعْكَ بُخْلا، إنما مَنَعَكَ لُطفا. | ينبغي أَنْ يَسْتَعِد المرء لآخِرِ عُمره بالمال؛ مَخَافَةَ أَنْ يحتاج فَيَذِلْ."}, {"type": "quote", "title": "كتاب أربعون — ص١٠٦ وص١٥٦", "date": "", "body": "أنا لست صالحاً، أنا فقط مستور: أنا لست بالحسن الذي يظنه المحبون، ولا بالسوء الذي يظنه الكارهون. قد أبدو مثالياً لظهوري بالكلام النافع، سأقول ما يفيد وأسكت عن الباقي من باب الستر، والستر نعمة."}, {"type": "quote", "title": "جدد حياتك — ص١٣٨، ١٥٦، ١٦٤، ١٧٤، ٢٦٠", "date": "", "body": "ارتفاع الإنسان في مدارج الارتقاء الثقافي والكمال الخلقي يغير كثيرا من أفكاره وأحاسيسه، ويبدل أحكامه على كثير من الأشخاص والأشياء، مثل من يرتفع عن سطح الأرض تتغير الأشكال والأحجام في عينه، وتكون نظرته إلى ما دونه أوسع مدى وأرحب أفقًا."}, {"type": "quote", "title": "أيام القراءة — مارسيل بروست ص٣٣", "date": "", "body": "بروست يتحدث عن الميزة التي تمتاز بها القراءة عن الصداقة: في القراءة تعود الصداقة فجأةً إلى نقائها الأصلي، ليس ثمة ود زائف حيال الكتب."}, {"type": "quote", "title": "التفكير الناقد — ص٤٠ وص١١٧", "date": "", "body": "من ترسيخ مبدأ التفكير النقدي للذات في الشريعة: ممارسة النبي ﷺ للنقد الذاتي مع نفسه رغم عصمته: لو استقبلت من أمري ما استدبرت؛ ما سقت الهدي ولحللت مع الناس حين حلوا."}, {"type": "quote", "title": "الظل والحرور — إبراهيم المازني ص٢٨٩", "date": "", "body": "إن فائدة القراءة كفائدة الطعام، والمرء يأكل ليصح بدنه، ولو أني نسيت اليوم ما أكلت في أمسي لما منع ذلك أن الفائدة قد حصلت."}, {"type": "quote", "title": "مختصر المغالطات المنطقية — ص١٠", "date": "", "body": "ليس بالحق وحده تكسب جدلاً أو تقنع الناس."}], "محمد عبدالعزيز العمر": [{"type": "article", "title": "خاطرة: كاريزما المستبد الجميل والعمى العاطفي", "date": "17/6/2024", "body": "اليوم لفت انتباهي مصطلح أو مسمى لفكرة كانت تختلج عقلي، وفي صراع مابين إعجاب ونقد لشخصية أدبية عظيمة لها مالها وعليها الشيء الكثير... الإعجاب بهم وأخذ (البرنت) الناصع عنهم يجعلك تصاب بالعمى العاطفي. الفتح الذي أدركته اليوم هو (كاريزما المستبد الجميل)، لما مررت على هذا المصطلح حالاً كتبت هذه الخاطرة لأنه كانت لي مخرجاً من الزحام كمخرج 13 يخرجك من زحام الرياض."}, {"type": "article", "title": "قراءة وتأمل في مذكرات (عهد الصبا في البادية) لإسحاق الدقس", "date": "22/1/2025", "body": "شدني ما ذكره الباحث الأستاذ منصور في جلسة صباحية عن مذكرات إسحاق الدقس (عهد الصبا في البادية) التي نقلها عزيز ضياء بالعربية... جمال هذه المذكرات انخراطك في أحداثها برفقة الراعي إسحاق وشادي، ومواقف الرعاة الصبيان وما يصاحبها من أحداث ومغامرات تبقى عصية على النسيان. ونختم بهذه الرؤية التربوية قالها إسحاق متحدثاً عن الأمهات: (ما من أحد أكثر من الأمهات مقدرة على الإلمام بمتاعب أبنائهن، واكتشاف خواطرهم المبلبلة وقراءة أفكارهم مهما حاول هؤلاء إخفاء ما في صدورهم). هذه الرواية أو المذكرات تسرك وتأسرك."}, {"type": "article", "title": "خاطرة: متلازمة ملَهِّي الرِّعيان", "date": "1/1/2026", "body": "اليوم، وككل يوم، تُصيبني متلازمة “ملَهِّي الرِّعيان”، ولها -والله- لذّة عجيبة، واسأل من جرّبها. ولمن لا يعرف المثل، فهو يُقال عن طائرٍ صغير الحجم، بين الحمامة والعصفور، يشاكس الرعاة في المراعي، فيُلهيهم؛ إذ لا يطير بعيداً، فيظن الراعي أن بإمكانه الإمساك به، فيتبعه… ثم يفلت منه في كل مرة. وهكذا حالي مع الكتب وشبكات التواصل؛ أتنقّل من هنا إلى هناك، أظن أني أمسكت بالفائدة، أو ظفرت بالمعلومة، فإذا بها قد ألهتني، وخرجت من المولد بلا حُمُّص."}, {"type": "article", "title": "مقال: قاعدة النجاح أدومها وإن قلّ", "date": "7/1/2026", "body": "من أهم أركان النجاح في الشؤون الدينية والدنيوية معا قاعدة أخبر عنها من أُتي جوامع الكلم \"أدومها وإن قلّ\"؛ إذ ليست العبرة بإشراقة البداية وضجيجها ووهجها، بل بثبات المسير... ومن هنا جاء قول ابن القيم في مفتاح السعادة: \"كثرة المزاولات تُعطي المَلَكات، فتبقى للنفس هيئة راسخة وملكة ثابتة\". هكذا يُبنى النجاح: فعل صغير مستمر، يتراكم حتى يصير طبعا؛ إنما السيل من النقط."}, {"type": "article", "title": "مقال: داء الادعاء عند المثقفين والكذبات البيضاء", "date": "11/1/2026", "body": "المثقف كغيره، قد يُصاب بداء الادعاء، والسعيد من ينتبه إليه ويتجاوزه. ادعاء القراءة أو الإلمام بكتاب لم يُقرأ، أو رواية لم تُعاش، أو قصة لم تُسمع حقاً؛ كلّها إشارات أنك تحتاج لمزيد من القراءة والاطلاع، لا إلى مراكمة الأسماء والعناوين. لا أنكر أنّي وقعت في هذا الفخّ مراراً، وكم تمنّيت لو عادت عقارب الساعة ليوبّخني أحدهم قائلًا: كُف عن الزيف، فالحقيقة أول أبواب المعرفة."}, {"type": "article", "title": "مقال: مرآة العيوب ووقع النصيحة على النفس", "date": "30/4/2026", "body": "(رحم الله من أهدى إليّ عيوبي)، مقولة تنسب إلى عمر بن الخطاب رضي الله عنه؛ فهذه الهدية تشبه المرآة، تكشف ما خفي من عيوب وعذاريب وملامح. غير أن النفس البشرية لها خدع وحيل؛ وإن رحّبت، إلا أنها تنقبض لا إرادياً حين ترى أو تسمع ما لا يسرها. ليست المشكلة في المرآة، بل في وقع الصورة على النفس، ورحم الله امرأً لم يكشف ستري."}, {"type": "article", "title": "تأمل في الحرب والسلام: الابن المستهتر وكبرياء الاعتراف بالخطأ", "date": "29/7/2026", "body": "من المشاهد التي تتكرر في جميع طبقات المجتمعات: ذلك الابن المستهتر الذي يستند إلى ثراء أبيه ومكانته، فيرتكب الخطأ تلو الخطأ، ثم يترك لأبيه أو أسرته تبعات الأذى. وهذا ما نجده عند تولستوي في \"الحرب والسلام\" في قصة نيكولا روستوف مع أبيه العجوز الكونت إيليا أندرييفيتش... ومتى شعر بعظم المسؤولية، وأدرك أن أخطاءه لا يتحملها وحده، بل يدفع ثمنها أبوه وأسرته، بدأ يتعلم معنى المسؤولية."}, {"type": "article", "title": "قراءة في رواية (الحرافيش) وذكريات دار الندوة ببريدة", "date": "13/8/2024", "body": "رواية (الحرافيش) لنجيب محفوظ، اختلفوا حول مسماها وتداعياتها... كل هذا عاد بذاكرتي للوراء أربعين عاماً، كانت هناك شلة تشبه شلة الحرافيش، لها تجمع في حي شعبي من حارات بريدة (حي الهلال) يسمونها (دار الندوة)، الداخل لها مفقود، والخارج منها مولود."}, {"type": "article", "title": "قراءة نقدية لمذكرات (خطى مشيناها) لعباس خضر", "date": "28/4/2024", "body": "سيرة مختصرة عن المؤلف عباس خضر وتنقلاته بين القرية والفيوم والقاهرة والأزهر، والتشابه العجيب بين مفردات أهل الفيوم وكلماتنا في نجد مثل (مرمط، صم، الزير، القربة، نبلبط، الطاسة، كركرنا) ونقده الهادف للنخبة المثقفة بأسلوب سهل كأنك في فيلم."}, {"type": "article", "title": "خاطرة: الأسرار لا تنام", "date": "17/8/2025", "body": "الأسرار لا تنام! يقول المتنبي: وللسِّرِّ مني موضعٌ لا يناله نديمٌ، ولا يُفضى إليه شراب... إنّ من أصعب مواطن الكتمان: كتمان السر؛ إذ يتحشرج في الصدر ويغلي غليان المرجل... وقد أمتعنا أبو حيّان التوحيدي في الهوامل والشوامل بقصة صاحبه الذي باح بسر الوزير لدولاب خرب في دار خالية ليجد راحة المثقَل!"}, {"type": "article", "title": "قصة قصيرة واقعية: تجربة المغفّلة لتشيخوف في بريدة", "date": "5/9/2025", "body": "في يوم قائض من أيام أغسطس في بريدة الرمال والتمور، استعنت بعاملين؛ أحدهما باكستاني صامت جميل القسمات، وهندي قصير يوزع الابتسامات... وحين حان وقت الحساب تذكرت قصة \"المغفّلة\" لأنطون تشيخوف، فاختبرت ردة فعلهما بخصم خمسين ريالاً، فغضب الباكستاني وجادل، ورضي الهندي بأدب؛ فأعطيتهما حقهما كاملاً وزدت الهندي خمسين ريالاً وقلت له مبتسماً: خذها، واقرأ قصة المغفّلة لأنطون تشيخوف."}, {"type": "article", "title": "مقال: صكوك النجاح", "date": "6/10/2025", "body": "يقول شارلي شابلن الممثل المشهور الغني الساخر أمام حشد من العمال: “إنه لأمر جيد جدًا بالنسبة لنا نحن أصحاب الملايين أن نقول لكم كيف تتصرفون، لكن ظروف حياتنا مختلفة جداً عن ظروف حياتكم.” لقد اختصر شارلي الطريق، وأخبرنا أن ظروفهم حقاً تختلف عن ظروفنا."}, {"type": "article", "title": "مقال: سقف العتاب (أو سقف المعاتبة)", "date": "16/10/2025", "body": "أرى أنّ ترك العتاب مطلقاً ليس محموداً؛ فكذلك الإكثار ليس محموداً. فالعتابُ بين الناس ميزان دقيق، إذا اختلَّ مال أحد طرفيه واعوج الطريق... وكما نلوم من يُكثر العتاب، ينبغي أن نذكّر المُعاتَب بأنّ العتاب في جوهره دليل اهتمام، وأنّ حبل الودِّ لم يُقطع بعد."}, {"type": "article", "title": "مقال: هل القراءة تجلب العزلة والوحدة؟", "date": "19/10/2025", "body": "علينا أن نفرّق بين العزلة والوحدة؛ فالعزلة اختيار، والوحدة اضطرار. قد تكون مع الناس وأنت في عزلة، ومع الجماعة ولكنك تغرّد خارج السرب وحدك. وما أطيب الوحدة إذا كان جليسك كتابًا أو مقالًا أو بحثًا، وما أروع العزلة إذا دعتك إلى التبصّر والتأمل وأنت بين القوم."}, {"type": "article", "title": "خاطرة: حوض اللذة", "date": "23/10/2025", "body": "\"اللهم وسِّع حوضَ لذّتي\"، دعاءٌ كان يردّده أحمد أمين -رحمه الله- قرأته في فيض خاطره، غريب في ظاهره، عميقٌ في باطنه؛ فوقفتُ عنده متأمّلاً حوضَ لذّتي. يتّسع الحوض باتّساع اللذّة والسعي في طلبها، فتشرق النفس وتبدو الأسارير، وينكسر الحوضُ بكثرة الهمّ والحزن."}, {"type": "article", "title": "مقال وصفي: ملحمة العشرين دقيقة (فسحة الطلاب)", "date": "24/12/2025", "body": "تشير الساعة إلى التاسعة والنصف في صباح من أيام المربّعانية المائلة إلى البرودة... فتحت النافذة لتدخل الشمس الدافئة. وإذا بضجيج ممتع، وسعادة طازجة، تبدد كل هم... ولم تدم هذه الملحمة أكثر من عشرين دقيقة؛ عشرون دقيقة مليئة بالحياة والفرح واللامسؤولية والصخب والضحك."}, {"type": "article", "title": "حكاية كتاب (بورخيس ودسّ الكتب في جيوب المعاطف)", "date": "17/1/2026", "body": "يذكر خورخي بورخيس في هوامش سيرته أن كتابه حماسة بوينس آيرس طُبع بدائياً في نحو ثلاثمئة نسخة... فطلب من صديق له يعمل في إحدى المجلات الأدبية العريقة أن يدسّ نسخها في جيوب معاطف روّاد مجلتكم ليقرأوها رغماً عن أنوفهم؛ ففعل وبعد عام كانت البشائر."}, {"type": "article", "title": "رفقاً بالطلاب (تواضع الأستاذ ماسيدونيو مع تلميذه بورخيس)", "date": "17/1/2026", "body": "يُحدثنا بورخيس عن أستاذه ماسيدونيو وكيف كان مهذباً ورقيقاً؛ فكان يقول مثلاً: أفترض أنك قد لاحظت… ثم يطلق العنان لفكرة مدهشة ومبتكرة، لكنه كان دائمًا ينسبها إلى المستمع. وفرق بين من يسرق الفكرة وينسبها لنفسه."}, {"type": "article", "title": "حكايات الكنوز المدفونة في التراث والأساطير", "date": "5/2/2026", "body": "جولة أدبية ممتعة في حكايات الكنوز المدفونة من الأسطورة الهندية (الذهب في الطريق) إلى قصة الرجل من بريدة والقدس وألف ليلة وليلة، ورحلة مبارك بن لندن في صحراء عُمان، وجبرا إبراهيم جبرا، وختاماً بقوله تعالى: (وَكَانَ تَحْتَهُ كَنزٌ لَهُمَا)."}, {"type": "article", "title": "الذكاء الكبريتي وإعادة قراءة الكتب", "date": "23/5/2026", "body": "قرأت أن هناك ذكاء كبريتي من يتسم به يحفظ بسرعة وينسى بسرعة... وقراءة الكتب مرتين كعبور النهر مرتين كما قال هيراكليتس؛ فالقراءة الأولى مرتبطة بظروف حياة المرء وقت القراءة، وفي كل مرة يعطيك الكتاب معاني جديدة."}, {"type": "article", "title": "لذّة الانتظار", "date": "7/6/2026", "body": "الانتظار؛ ذلك العذاب الخفي... إن ساعات ودقائق الانتظار فرصة للتأمل والتفكير والاسترخاء. يقول كازواكي تاناهاشي: (إذا تعلمنا الاستمتاع بالانتظار، فلن نضطر إلى الانتظار للاستمتاع)."}, {"type": "article", "title": "أمنية يتبعها دمعة", "date": "9/6/2026", "body": "في مشتى اللسيب بعد صلاة العصر مع الوالد وإذاعة القرآن الكريم، سأل المذيع طفلاً صغيراً من حفظة القرآن: هل ترغب أن تكون إماماً أم مؤذناً؟ فقال الصغير من غير تردد: أريد أن أكون إماماً في الحرم. فدمعت عينا الوالد تأثراً ببراءة الصغير وعلو همته."}, {"type": "article", "title": "قانون مورفي وسخرية المواقف اليومية", "date": "15/8/2026", "body": "تأملات ساخرة في قوانين مورفي اليومية: (فرصة نسيان شيء مهم تتناسب طرديا مع أهميته!)، و(المسار الآخر للسيارات يتحرك دائما أسرع من الذي تسير فيه!)، و(يستحيل إيجاد الوثائق الضائعة قبل القيام باستبدالها)."}, {"type": "article", "title": "أعمى بويزو وفراسة التجارب", "date": "15/8/2026", "body": "إن المحقق والمحامي والموجه والوالدين يشبهون أعمى بويزو كما وصفه ديدرو؛ تصنع التجارب من الإنسان ميزاناً داخلياً يزن به الأصوات والعبارات والتصرفات."}, {"type": "article", "title": "الذاكرة الحالمة", "date": "26/8/2026", "body": "الذاكرة الحالمة هي استدعاء الماضي مع تجميله وتزويقه؛ نأخذ من الماضي ما يبهج النفس، ونستحضر منه ما يعين على احتمال الحاضر، بين التشاؤم المفرط والإيجابية السامة."}, {"type": "article", "title": "ذكريات لقاء خطاط المصحف الشيخ د. عثمان طه في المدينة", "date": "13/9/2026", "body": "شرفت بالجلوس مع خطاط المصحف الدكتور عثمان طه لمدة أربع ساعات في بيته بالمدينة المنورة؛ كتب المصحف أكثر من ١٤ مرة، ولم يكتب حرفاً من القرآن إلا وهو على طهارة، ويقول: الخط الجميل لسان اليد."}, {"type": "article", "title": "مقدمة كتاب أنيس منصور حول العالم في ٢٠٠ يوم وطرافة رحلاته", "date": "28/9/2026", "body": "يقول أنيس منصور في مقدمة الطبعة الثانية من كتابه (حول العالم في ٢٠٠ يوم) إن هذه الطبعة تختلف عن سابقتها في أمر مهم جداً: أنه حذف كلمة \"جدا\" من \"جدا جدا جدا\"!"}, {"type": "quote", "title": "أطياف شاردة — د. عبدالله القفاري", "date": "", "body": "هو من جيل عاش ملامح حيوات وليست حياة واحدة. رعى الغنم وفتن بالقلم، وعاش أحلامًا وردية مع مجلات ملونة تأتي للتو من دول المركز العربية التي كانت."}, {"type": "quote", "title": "أحمد حسن الزيات", "date": "", "body": "إنَّ المعنى إذا اتضح في الذهن اتضح في اللفظ، ولا يكون الغموض أو التعقيد إلا حيث تنبهم الفكرة وتختلط الصورة."}, {"type": "quote", "title": "محمد الماغوط", "date": "", "body": "خوفكم من تقييم الآخرين لكم، هو الذي يضطركم إلى أن تظهروا بكل الوجوه ما عدا وجهكم الحقيقي."}, {"type": "quote", "title": "هوس القراءة — جو كوينن", "date": "", "body": "قراءة الكتب قد تجعلك أذكى من الآخرين، لكنها لا تجعلك أفضل منهم."}, {"type": "quote", "title": "سير أعلام النبلاء — الذهبي (١٠/٧٠)", "date": "", "body": "تُنكح المرأة لكُتُبها: قال أحمد بن سلمة النيسابوري: تزوج إسحاق بن راهويه بامرأة رجل -كان عنده كتب الشافعي- مات، لم يتزوج بها إلا للكتب."}, {"type": "quote", "title": "مكتباتهم — آيت حنا", "date": "", "body": "بيت لا تسنده مكتبة آيل للسقوط، المكتبة دعامة البيت."}, {"type": "quote", "title": "ظلال الأشياء — عبدالله الهدلق", "date": "", "body": "بعض الناس مُغرَمٌ بالمخالفة في كل شيء؛ حيلة ساذجة لإثبات الذات وسترِ مَلَكة العقل، يعترض قبل أن يفهم وآراؤه كلها نقض وهدم ولا بناء."}, {"type": "quote", "title": "مسيرتي في التأليف — ستيفن كينغ", "date": "", "body": "أنا قارئ بطيء، لكنني أنهي عادة سبعين أو ثمانين كتابا في السنة... وفي كثير من الأحيان الكتب السيئة تعلمك أكثر من الكتب الجيدة."}, {"type": "quote", "title": "الروح الخريفية — حمد البليهد ص١٢٨", "date": "", "body": "أجمل قصيدة يصيرها الإنسان، وهو أروع القصائد: هي أن يكون خاليًا من الكراهية."}, {"type": "quote", "title": "الناطق الأخرس — نقلاً عن البداية والنهاية", "date": "", "body": "دخل على الفرزدق فتحرك، فإذا في رجله قيد، فقلتُ: ما هذا؟ فقال: حلفتُ أَلَّا أنزعه حتى أحفظ القرآن."}], "أسامة الفلاج": [{"type": "article", "title": "علاقة العلم بالدنيا والآخرة", "date": "9/3/2024", "body": "في تراثنا كأن هناك ملازمة بين العلم وقلة ذات اليد، فلا تجد عالما فحاصا أو أديبا غواصا، إلا والفقر نديمه والفاقة مسكنه؛ ولعل هذا من عزة العلم وفضل غيرته، فلا يقبل شركة المال ولا مجالسة الدنيا. وما العلم في هذه الدار إلا كرسول أوفدته الدار الآخرة للتذكير بها."}, {"type": "article", "title": "موازنة أدبية بين المتنبي والمعري في ترويض الزمن", "date": "11/3/2024", "body": "حين قال المتنبي: أريد من زمني ذا أن يبلغني / ما ليس يبلغه من نفسه الزمن، جعل الزمن مطية لأمانيه. أما المعري فقال: ينافس يومي فيّ أمسي تشرفا / وتحسد أسحاري عليّ الأصائل. فأيهما أبلغ في الوصف وأبهر في البيان؟"}, {"type": "article", "title": "الحكم على الآباء بين الباعث والسلوك", "date": "14/8/2024", "body": "أتصور أن الإنسان يحكم على أبويه بإحدى طريقتين: إما بالنظر لبواعثهم، أو بالنظر لسلوكهم. ففي المراهقة يعمى المراهق عن الباعث ويصوب تركيزه على السلوك، وكلما نضج كانت نظرته للباعث أغلب."}, {"type": "article", "title": "قراءة في منهج الفيلسوف كانط والواجب الأخلاقي", "date": "20/8/2024", "body": "يتسلسل بنا \"كانط\" من الواجب الأخلاقي المرتكز على دعائم ثلاث: حرية الإرادة المصححة لصدور أفعالنا، وخلود الروح التي هي محل السعادة والشقاء الأبدي، ووجود الله تعالى مصدر العدالة والجزاء."}, {"type": "article", "title": "إشكالية التربية بين شخصية المربي وشخصية المربَّى", "date": "3/9/2024", "body": "حقيقة الأمر أننا نربي \"بما يتوافق مع شخصياتنا\"، لا \"بما يتوافق مع شخصية المربى\". فقد يظن المربي أن ابنه سيئ أو متعب، وفي الحقيقة هو \"غيرك\" و\"مختلف عنك\". وختاما: التربية أصعب من الفيزياء النووية."}, {"type": "article", "title": "القراءة بين الجِلْدتين وفن القفز المفيد", "date": "26/8/2025", "body": "فأنا من أصحاب \"الجِلْدتين\"، لا تهدأ لي نفس ولا يطيب لي خاطر إلا \"بجس الخدين\" والتقام ما بينهما... وقد تبين لي غلطي لما قرأت عن كبار القراء أمثال العقاد أنهم يستجيزون القفز المفيد؛ وحسبك تشبيه العقاد قراءته بعض الكتب بصاحب البيت الذي يعرف أن غرضه في هذه الغرفة فيكتفي بالتوجه إليها."}, {"type": "article", "title": "كلام الأقران وموازين الإنصاف", "date": "27/8/2025", "body": "قال الحافظ الذهبي: \"كلام الأقران بعضهم في بعض لا يعبأ به، لا سيما إذا لاح لك أنه لعداوة أو لمذهب أو لحسد...\" وهذا كلام وجيز اختصر أمورا عزيزة، منها أن العاقل لا يكترث فيما يقال بحقه مدحا أو ذما، وإنما العبرة بالموازين."}, {"type": "article", "title": "تباين الأذواق القرائية وسعة عذر القراء", "date": "7/9/2025", "body": "هذا دليل يرشد إلى فسحة الأذواق وسعة باحتها، وما كان مرضيا اليوم قد لا يؤنس غدا، وما أبهج فلانا قد أسخط أخاه، فالعذر واسع بين الكتب وأهلها."}, {"type": "article", "title": "الإحاطة بأصول الشريعة ومذاهب الفقه", "date": "16/9/2025", "body": "الإحاطة بأصول الشريعة تمنع من تعارضها وترفع عن المكلفين الحرج والمشقة؛ فمن لم يحط بالأصول حرم التصرف فيها، وقد ضبطت هذه الأصول في مدارس كبرى لا يسع الخروج منها."}, {"type": "article", "title": "حقيقة التواضع وشُحّ النفوس في الاعتراف به", "date": "22/9/2025", "body": "التواضع خلق يتوسط إكبار النفس وإذلالها، فلا يجعل النفس سامية على الحق غامطة لأقدار الخلق، وليس هو ذلك الإخضاع للنفس السافلُ بها الجاحد فضلها؛ إنما هو بصيرة بقصور النفس وعلاتها."}, {"type": "article", "title": "الفرق الجوهري بين فقه الخلاف والفقه المقارن", "date": "8/1/2026", "body": "فقه الخلاف الذي نجده في كتب (الخلاف العالي) يناقش أدلة المذاهب الأخرى ويثبت أحقية مذهب المناقِش وفق أسس مذهبية. أما الفقه المقارن فلا ينطلق من مذهب محدد إنما يعتمد الترجيح المطلق."}, {"type": "article", "title": "خطة الإمام ابن حبان البستي في روضة العقلاء", "date": "2/8/2026", "body": "لكل شيخ مقصد، ولكل باحث غاية، ولكل صاحب صنعة ملحظ؛ فالإمام ابن حبان غلبت عليه صنعة الحديث فأراد أن يحشد من الأخبار ما استطاع في روضة العقلاء."}, {"type": "article", "title": "مفهوم الضمير ومنازل النفس في القرآن", "date": "1/9/2026", "body": "المصطلح الأوفق للضمير المستعمل عند علماء الأخلاق وفلاسفتها هو ما يعبر عنه القرآن بتسميته \"النفس اللوامة\"، ومنه استمد علماء السلوك تقسيم النفس إلى: الأمارة بالسوء، واللوامة، والمطمئنة."}, {"type": "article", "title": "خاطرة أصولية: منزلة كتاب الموافقات للشاطبي", "date": "3/9/2026", "body": "الناظر في موقف علماء الأصول المعتبرين، شرقا قطنوا أو غربا، لا يجدهم يحتفون بكتاب الموافقات كما احتفى به الاتجاه الإصلاحي، فجعلوه في رتبة دون الاعتماد وفوق الترك."}, {"type": "article", "title": "قصة أدبية: أدعية تهتك المستور (زيارة شيخ الثمانين)", "date": "5/10/2026", "body": "ترافقت مع صديق عزيز لزيارة أحد كبار السن، رجل تضمخ بعطر الثمانين... فلما دعا له صاحبي: أطال الله عمرك وأبقاك! كسفت شمس الشيخ بعد بزوغها... وقد آليت على نفسي ألا أدعو بالعمر لشيخ يواري ضعفه، ولا بالصحة لمريض يخفي مرضه؛ هذه قد تكون هتكا لمستور."}, {"type": "article", "title": "قضية في الشعر الجاهلي لطه حسين", "date": "7/10/2026", "body": "تساؤل طه حسين عن الشعر الجاهلي ليس من قبيل الإشكالات العلمية، ولا من طراز التدقيقات المنهجية، إنما هو ضرب لقيمة وقطع لصلة واستخفاف بموروث."}, {"type": "article", "title": "مطالع الموت ومطامع الخلود (الزركلي والأمير مصطفى الشهابي)", "date": "11/10/2026", "body": "كان الأمير مصطفى الشهابي يدعو الله أن يموت قبل الزركلي حتى يترجم له في الأعلام... وقال الزركلي لصهره: أما كتابي هذا فسيذكرني الناس به ألف عام."}, {"type": "article", "title": "مسايرة المؤلف وطقوس القراءة", "date": "12/10/2026", "body": "من عادات القراءة اللطيفة مسايرة المؤلف؛ تقرأ للعقاد فتشرب عصير الليمون ثم فنجان قهوة سوداء، أو لعلامة شنقيط في أضوائه الباهرة مع بيالات شاي معتق في إبريق أصفر."}, {"type": "quote", "title": "النفّري", "date": "", "body": "إذا اتسعت الرؤية ضاقت العبارة."}, {"type": "quote", "title": "فرانز كافكا", "date": "", "body": "تبدأ حياتك محاولا فهم كل شيء .. ثم تنتهي بك الحال محاولا النجاة من كل ما فهمت."}, {"type": "quote", "title": "مداواة النفوس — ابن حزم", "date": "", "body": "تطلبْتُ غرضًا يستوي الناس كلهم في استحسانه وفي طلبه، فلم أجده إلا واحدًا، وهو طرد الهم."}, {"type": "quote", "title": "تفسير القرطبي — عن الإمام مالك", "date": "", "body": "قال الإِمامُ مالكٌ رضي الله عنه: (ما في زماننا شيء أَقَلُّ مِنَ الْإِنْصَافِ)."}], "عبدالله إبراهيم الشبرمي": [{"type": "article", "title": "حُمّى الاستدراك", "date": "2/6/2026", "body": "من الظواهر اللطيفة المزعجة في آنٍ واحد ما يمكن أن نسميه \"حمى الاستدراك\"، حالة ذهنية تصيب بعض الناس كلما سمعوا فكرة أو نصيحة، فما إن يكتمل الكلام حتى يهبّ أحدهم مستدركاً: \"نعم، ولكن...\"، ولعل أول علاج لحمى الاستدراك أن ندرك أن المشاركة الحقيقية ليست في إضافة تعليق على كل شيء، بل في العمل بما نسمع."}, {"type": "article", "title": "الكلمة التي لم تُقَل", "date": "14/6/2026", "body": "ليست كل الكلمات تضيع؛ فبعضها يبقى معنا، تلك الكلمات الطيبة التي هممنا أن نقولها ثم أخرناها أو كتمناها لا تصل إلى أصحابها، وإنما تستقر في الذاكرة حسرةً على لحظةٍ كان يمكن أن تصنع فرقاً."}, {"type": "article", "title": "مشاريع العمل تنتصر على مشاريع النقد والتحذير", "date": "28/7/2026", "body": "في اجتماع نادي جليس صباح السبت الماضي، شدّني حديث أبي عبد الرحمن الواصل عن أصحاب المشاريع، فذكّرني بعبارة قرأتها ذات يوم: «مشاريع العمل تنتصر على مشاريع النقد والتحذير»."}, {"type": "article", "title": "عزوف المثقف المسلم وعلماء نجد عن كتابة السيرة الذاتية", "date": "17/9/2026", "body": "اجتمع في منهج علماء نجد الستر على أخطاء النفس، والعزوف عن مدح الذات وذكر مناقبها؛ فالنجاحات لا تُذكر خشية الوقوع في مدح النفس، والأخطاء تُستر حفظاً للنفس وصيانةً لها."}, {"type": "article", "title": "مقالة: لعنة النضج", "date": "16/10/2026", "body": "هنا تكمن لعنة النضج؛ أن تعرف من الناس ما يحملك على الحذر منهم، ومن الحياة ما يسرق منك عفويّتك... فليس النضج أن ترى قبح العالم فحسب، بل أن تراه، ثم تظلّ قادرًا على أن تحبّ فيه ما يستحقّ الحبّ."}, {"type": "article", "title": "فلسفة شخصية في الصداقة وتبادل المعروف", "date": "20/10/2026", "body": "أرى أن الصداقة الحقيقية أن تَخدم وتُخدم؛ لأن بقاءك في خانة المعطي دائمًا قد يُحرج أصدقاءك من طلب المساعدة منك، ومن حسن الخلق أن تطلب منهم أحيانًا لتُشعرهم أن العلاقة متبادلة."}, {"type": "article", "title": "داء الوتيرة السريعة واستعادة فضيلة الصبر", "date": "7/6/2026", "body": "ألاحظ انتشار ما يمكن تسميته بـ \"داء الوتيرة السريعة\"؛ الكل يريد النتائج فوراً. لذلك ربما التحدي الحقيقي اليوم ليس في زيادة السرعة، بل في استعادة فضيلة الصبر."}, {"type": "article", "title": "سرّ متعة كتاب الذكريات للطنطاوي وفلسفة الاستطراد", "date": "30/7/2026", "body": "ما سرُّ متعة «الذكريات»؟ تلك الاستطرادات لم تكن خروجًا عن الطريق، بل كانت هي الطريق نفسه."}, {"type": "article", "title": "طبيعة الشر في الإنسان بين الفلسفة والمتنبي", "date": "22/8/2026", "body": "يقول المتنبي: «كلما أنبت الزمان قناةً / ركّب المرء في القناة سنانا»؛ المشكلة ليست فيما نملك، بل فيما تفعله نفوسنا بما نملك."}, {"type": "article", "title": "الفرق بين المؤلفات الحرة والرسائل العلمية المطبوعة", "date": "15/9/2026", "body": "الكتب التي يكتبها المؤلف ابتداءً من رغبته واختياره تكون أكثر انسجامًا وترتيبًا من الرسائل العلمية المقيدة بمتطلبات البحث الأكاديمي."}, {"type": "article", "title": "التطوير الحقيقي للطبعات المنقحة والمزيدة", "date": "27/9/2026", "body": "التطوير الحقيقي الذي يُنتظر من اختلاف الطبعات هو التوسع المعرفي والإثراء الحقيقي في المحتوى، لا مجرد تغيير الغلاف أو تصحيح الأخطاء المطبعية."}, {"type": "article", "title": "سرّ انتشار كتب تطوير الذات", "date": "2/10/2026", "body": "السر في نجاح كتب تطوير الذات أنها تلامس أحاسيس كامنة في النفس؛ فكل قارئ يجد شيئًا من نفسه بين صفحاتها، ويشعر أن المؤلف يتحدث عنه شخصيًا."}, {"type": "article", "title": "نظرة فلسفية: وهم الفراغ وتنوع طرق السعادة", "date": "23/10/2026", "body": "لا أظن أن في الدنيا شيئًا اسمه الفراغ؛ والخطأ أن نجعل الأمر اختلاف تضاد، فالجميع يطلب السعادة، ولكن هذا يلتمسها في السكون، وذاك يجدها في الإنجاز."}, {"type": "quote", "title": "أعط الصباح فرصة — عبدالوهاب مطاوع", "date": "", "body": "مؤونة الشكر والعرفان ثقيلة على بعض النفوس، وتحرك في أصحابها الإحساس بالنقص إزاء من يستحقونها، ولا يقوى عليها إلا أهل الحق، وأصحاب النفوس الكبيرة."}, {"type": "quote", "title": "جان جاك روسو", "date": "", "body": "ليس بالضرورة أن تصبح أكثر ثراءً بأن تملك أكثر، فقد تصبح أكثر ثراءً بأن تريد أقل، فالثروة ليست فقط ما في يدك، وإنما المسافة بين ما تملك وما ترغب فيه."}, {"type": "quote", "title": "الداء والدواء — ابن القيم", "date": "", "body": "العشق للأرواح بمنزلة الغذاء للأبدان: إن تركتَه ضرّك، وإن أكثرتَ منه قَتَلك."}], "عبدالله التويجري": [{"type": "quote", "title": "مودة الغرباء — محمد الهجين ص٦٥", "date": "", "body": "إن روح العصر تترك أثرها في أفكار المثقفين وحياتهم، ولا يليق بمن يقرأ التاريخ أن يقيم المحاكمات، وأن يُلبس المواقف التاريخية ثوبا أخلاقيا."}, {"type": "quote", "title": "سبعون — ميخائيل نعيمة ج٢ ص١٥ وص٣٦٣", "date": "", "body": "إني لأوثر القلة مع صفاء الذهن والقلب على الوفرة مع اضطراب العقل والقلب معاً. وأن يكون لي هدف نبيل فأدب إليه دبيب النملة وأدركه لخير عندي من أن أطير بجناحي نسر من هدف خسيس إلى هدف أخس."}, {"type": "quote", "title": "العلاج بالقراءة — بيجال شاة ص٦٣ وص١٥٢", "date": "", "body": "ظلت القراءة ملاذي في بدايات الرشد؛ أحببت كيف منحتني الكتب فرصة عيش حيوات بديلة في عوالم متخيلة، حيث يمكن اختبار معنى الحياة بأمان."}, {"type": "quote", "title": "قصتي مع النوم — د. أحمد باهمام ص١٧٩ وص١٩٥", "date": "", "body": "الذكاء الاصطناعي موجة عاتية (تسونامي) قادمة لا محالة، وأمامنا خياران لا ثالث لهما: إما أن نستعد لها ونتجهز، فنأخذ أفضل ما فيها ونتجنب سيئاتها... ومن يستعد اليوم يقود غداً."}, {"type": "quote", "title": "رسائل كافكا", "date": "", "body": "بعض الكتب تبدو أشبه بمفاتيح لغرف مجهولة في معقل النفس."}, {"type": "quote", "title": "ذاكرتي الأدبية — ناصر البكر ص١٥ وص١١٣", "date": "", "body": "أجمل ما في القراءة أنها تجعلك تتألم دون أن تجرح... وكان والدي يضع مصروفنا داخل الكتب؛ كنا نبحث عن النقود، لكنه كان يزرع فينا شيئاً أبقى."}, {"type": "quote", "title": "أنا — عباس العقاد ص٥٩ وص١٣٦", "date": "", "body": "والقراءة دون غيرها هي التي تعطيني أكثر من حياة واحدة في مدى عمر الإنسان الواحد... وأجمل ما في الحياة يوم تملك فيه نفسك، فتعلم أنك ملكت الثروة التي لا يُقاس بها ملك المال."}, {"type": "quote", "title": "ألوان أخرى — أورهان باموق ص١٢٧", "date": "", "body": "القراءة الجيدة ليست هي تمرير العين والعقل ببطء وبحرص على النص، وإنما أن يغرق المرء نفسه تماما في روح النص."}, {"type": "quote", "title": "تأملات في الإنسان — رجاء النقاش ص١٤٠ وص٢٢٠", "date": "", "body": "أرقى مقياس للعاطفة الصادقة هو: (ضبط النفس)... فالثقافة العميقة تربي الإرادة، وتخلق الشخصية المستقلة الفعالة."}], "عبدالله الزويد": [{"type": "quote", "title": "دليل الإرشاد الأسري — أ. جابر المقبل ص١٠٤", "date": "", "body": "تمثل مشكلة تبني المراهقين للقيم والأفكار التي تُسوَّق بشكل جذاب إحدى المظاهر السيئة لمواقع التواصل الاجتماعي، لا سيما أن مظاهرها لا تتضح إلا بعد أن يتشربها الابن."}, {"type": "quote", "title": "عقبات خفية في طريق الشباب — عبدالكريم القصير ص٢٠", "date": "", "body": "يقول الدكتور مصطفى السباعي: «لأن تُحْسِن الظن فتندم، خير من أن تسيء الظن فتندم»."}, {"type": "quote", "title": "هكذا ربانا جدي علي الطنطاوي — عابدة العظم ص٣٢", "date": "", "body": "القوة لا تعني القسوة، ولو كانت كذلك لكان النبي -صلى الله عليه وسلم- أضعف الناس. ليكن اعتمادكم في تربية أبنائكم على المحبة والمودة والرحمة."}, {"type": "quote", "title": "من الحوار مع الذات إلى الحوار مع الآخر — محمد عبدالجواد ص٦١", "date": "", "body": "نص القرآن على أن الاختلاف بين الناس سُنَّة من سنن اللّٰه تعالى في الكون، وأن اللّٰه خلق الناس وأرادهم مختلفين، وجعلهم شعوباً وقبائل لكي يتعارفوا، لا لكي يتعاركوا."}, {"type": "quote", "title": "أغنى رجل في بابل — ص٢٥", "date": "", "body": "أتقولون على صياد بأنه محظوظ بالرغم من أنه ظل طوال سنوات يدرس جيداً عادات الأسماك حتى إنه مع كل تغير لاتجاه الرياح استطاع أن يلقي بشباكه نحوها؟"}], "عبدالله عبدالعزيز الفهيد": [{"type": "article", "title": "انتقال الأرض المقدسة من بني إسرائيل إلى أمة محمد ﷺ", "date": "20/6/2024", "body": "سرد تاريخي وعقدي لانتقال الفوقية والعزة والتمكين في الأرض المقدسة من بني إسرائيل مع موسى وسليمان وعيسى عليهم السلام إلى أمة محمد ﷺ بعد مبعثه الشريف، وبيان انقسام اليهود حول إقامة دولتهم."}, {"type": "article", "title": "كيف تتجاوز إحباط تكدس الكتب وكثرة العلوم؟", "date": "2/9/2024", "body": "يخفف شدة هذا الشعور إذا قرأت الكتب وأنت معتمد على ركنين مهمين: الأول ترتيب العلوم النافعة ترتيباً تنازلياً وفق الأولوية بالنسبة إليك، والثاني الاستعانة بأصحاب الخبرة والمجربين في كل باب ليختصروا لك الطريق."}, {"type": "article", "title": "تأمل تربوي: الأب الهادي والأب الشديد وأثر البيئة", "date": "8/9/2024", "body": "الأب الهادي يفرض التعاليم والأخلاق بالإقناع والاستدلال مع شيء من السلطة، أما الأب الشديد فيتبنى سياسة الفرض والإجبار؛ فإذا كبر الأبناء رأوا أن ما تربوا عليه عن قناعة هو الحق."}, {"type": "article", "title": "في تفتيق العقول بقراءة كتب عباقرة الشريعة", "date": "12/3/2025", "body": "إن من أعظم ما يفتق العقول ويزيد قدرتها هو قراءة كتب عباقرة الشريعة، فتتعلم الربط والمقارنة والاستقراء والتحليل والاستنباط والترجيح بين الفاضل والمفضول."}, {"type": "article", "title": "ضوابط العرف واللباس وفهم التاريخ في سياقه", "date": "8/5/2026", "body": "كل ما زادت مرتبة الإنسان كان أخذه للمروءة ألزم... وهنا نقطة مهمة، وهي معرفة تاريخ كل قضية ودواعي إنكارها وتشنيعها، فليس صحيحاً من يأتي بعد جيل ويتعجب أو يستنقص ما قيل في تلك الفترة قياساً على زمانه الآن."}, {"type": "quote", "title": "المستويات السبعة في القراءة", "date": "", "body": "إن من يملك قضية، يتعلم كل ما هو في حاجة إلى تعلمه. | المبدع الحر حرية مطلقة أشبه ما يكون بجرم تائه في الفضاء."}, {"type": "quote", "title": "ظلال الأشياء — عبدالله الهدلق ص٢٣٠", "date": "", "body": "إذا كان يلازمك شعور دائم بأنك تثقل على الآخرين فاعلم أنك خفيف الروح لطيف المعشر، لأن ثقيل الروح -أبعده اللّٰه- لا يشعر بشيءٍ من ذلك أبدًا."}], "محمد بن عبدالمحسن الضويان": [{"type": "article", "title": "التعبيرات الجمالية وتأثر الكاتب ببيئته", "date": "6/1/2024", "body": "\"البيئة الخصبة لنمو حشائش المشاعر المزعجة\"؛ تستوقفني هذه التعبيرات الجمالية أحياناً وأنا أقرأ لبعض المؤلفين، وتكشف مدى تأثر الكاتب ببيئته واهتماماته اليومية، مما يعطي للقراءة بعداً جديداً من المتعة."}, {"type": "article", "title": "هل يكفي أن يكون مصدر رزقك عملاً تهواه؟", "date": "10/1/2024", "body": "العمل الذي نقوم به خدمة للآخرين ويكون مصدر رزقك لا بد أن يصاحبه التزام بروتين معين ومكابدة للمشاق، مما يجعل فكرة \"أننا لا نشعر بالوقت الذي نمضيه فيها\" غير واقعية عند التطبيق العملي."}, {"type": "article", "title": "التوازن بين السعي والسكينة", "date": "22/10/2026", "body": "لا تثريب على الإنسان لو اختار أن يكون من أحد الفريقين، فالاختلاف بينهما اختلاف تنوع لا اختلاف تضاد؛ المهم أن تعيش في هذه الدنيا سعيداً ما استطعت وتكون بوصلتك موجهة إلى الآخرة."}, {"type": "quote", "title": "ألبرت أينشتاين", "date": "", "body": "حياة هادئة ومتواضعة تجلب قدراً من السعادة أكثر من السعي للنجاح والمصحوب بالتعب الدائم."}, {"type": "quote", "title": "الحارث المحاسبي", "date": "", "body": "إذا أردت أن ينظر الله إليك بالرحمة؛ فانظر إلى الصالحين بالغبطة، وإلى العاصين بالرحمة. | الإنسان عند معرفة عيب نفسه أبله، وعند معرفة عيب غيره جهبيذ."}, {"type": "quote", "title": "الظل والحرور — غازي القصيبي ص٤٥٣", "date": "", "body": "إن الشعراء ليسوا أكثر ذكاء، ولا أكثر حكمة، ولا أكثر أخلاقية... كل ما يميز الشعراء عن سواهم هو أنهم يحملون في ضلوعهم تلك الكيمياء العجيبة التي تنتج شعراً."}], "عبدالرحمن الجريش": [{"type": "quote", "title": "عيون الأخبار — مسعر بن كدام (٢/١٧)", "date": "", "body": "قال مسعر بن كدام: (ما نصحت أحدًا قطّ إلّا وجدته يفتّش عن عيوبي)."}, {"type": "quote", "title": "تهذيب الوابل الصيب — ابن القيم", "date": "", "body": "السخاء نوعان: فأشرفهما: سخاؤك عما بيد غيرك. والثاني: سخاؤك ببذل ما في يدك. فقد يكون الرجل من أسخى الناس وهو لا يعطيهم شيئًا؛ لأنه سخا عما في أيديهم."}, {"type": "quote", "title": "إبداعات العلماء والمؤلفين — للبداح", "date": "", "body": "ممن حفظوا ديوان المتنبي: الأديب عبدالعزيز الربيعي (ت:١٤٤٢).. ومن حُبه للمتنبي فقد سمى أحد أبنائه بـ محسَّد، على اسم ابن المتنبي، ومن وفائه للمتنبي فهو يضحّي عنه كل سنة."}, {"type": "quote", "title": "وحي القلم — مصطفى صادق الرافعي", "date": "", "body": "ما أصدق ما قالوه: إنّ المرئيَّ في الرائي. مرضتُ مدةً في المصيف، فانقلبتِ الطبيعة العروس، التي كانت تتزيّنُ كل يوم، إلى طبيعةٍ عجوز، تذهبُ كل يوم إلى الطبيب."}], "عبدالرحمن عمر الصعب": [{"type": "article", "title": "مقال تأملي: الوقوف على قارعة الطريق ونموذج التشييء", "date": "1/12/2025", "body": "توقفت العربة فجأة، كما يتوقف القلب عن نبضه... ووقفت على قارعة الطريق وحيدا أمد يدي، وتذكرت يوما كنت فيه أنا السيد القابع خلف المقود ومررت برجل مثلي ولم أقف؛ لقد مارست عليه نوعا من التشييء. فيا أيها العابرون في دروب الحياة، تمهلوا.. فإن المواقف ديون، والأيام دول."}, {"type": "article", "title": "قصة حلم ساخرة: المسيري والتمور القصيمية", "date": "20/12/2025", "body": "أغفيت إغفاءة المُحِب للكتاب، فانسللت إلى برزخ الرؤى لأفتتح ندوة عن \"رحلتي الفكرية\" لعبدالوهاب المسيري، فقفز العرق القصيمي إلى لساني فقلت: نتحدث عن رحلته في البذور.. والجذور.. والتمور! فنهض المسيري ضاحكاً: أبعدوا هذا الفتى عن المنبر فقد حوّل الثمار إلى سكري وبرحي!"}, {"type": "article", "title": "تجربته مع القراءة الإلكترونية", "date": "18/1/2025", "body": "انتقلت من الجوال والآيباد إلى الكندل ثم جهاز بوك 5 من بوكس الذي جمع كل ما أحتاجه مع إمكانية تدوين الملاحظات بالقلم؛ ومع كل هذه المزايا التقنية، يظل الكتاب الورقي متربعاً على عرش القراءة."}, {"type": "article", "title": "الثانية ليلاً", "date": "8/6/2026", "body": "لا أحد يعرف تماماً ما الذي يحدث لجاذبية الأرض عند الساعة الثانية ليلاً، حيث يسلم العقل الرصين القيادة للقلب المتهور الذي يرسم الإمبراطوريات ويعد بالاستيقاظ السابعة صباحاً، وحين تشرق الشمس يختار العقل خاصية الغفوة!"}, {"type": "quote", "title": "الناطق الأخرس — إبراهيم المازني ص٢٩", "date": "", "body": "وليس لي طريقة خاصة، أو وقت خاص للقراءة؛ فكل وقت صالح لذلك، وكل مكان أستطيع فيه القراءة ولو كان حماما بغير ماء!"}], "مشعل عبدالرحمن الحفير": [{"type": "article", "title": "مقال: نصف عطاء", "date": "2/6/2026", "body": "في الجدِّ نتمنى الراحة، وفي الراحة يمتلئُ تفكيرنا بمشاغلنا؛ فلا هناءَ مع الأهل، ولا كاملُ العطاءِ للشغل.\nفي الجدِّ يمتلئُ تفكيرنا بشواغل الأهل، ويمتلئُ وقتُ الأهل بمطالب الشغل.. تداخلت الحدود، واشتبكت الخيوط!\nفلا شغلاً أنجزنا، ولا أهلاً أبهجنا، ولا نفساً أرحنا، ولا عيناً أغمضنا."}, {"type": "quote", "title": "سورة القصص — آية ٢٤", "date": "", "body": "﴿ثُمَّ تَوَلَّىٰ إِلَى الظِّلِّ﴾ بكل هدوء وسكينة، دلالة على أنّه انتهى دوره، سقى لهما ثم تولّى إلى الظل، ما أجمل السعي في خدمة الآخرين بدون مقابل! إنها من أعظم الخصال."}, {"type": "quote", "title": "علم النفس الإرشادي — عن ابن خلدون ص١٠٢", "date": "", "body": "يدعو ابن خلدون إلى الأخذ بالمسايرة والملاينة لأن الغلظة والشدة تضر بالمتعلم، لا سيما في الصغار... لذا فهذه إشارات من ابن خلدون في أهمية إظهار الحب والتقبل للمتعلم، لكي يعطي العلم وعملية التعلم ثمارها."}, {"type": "quote", "title": "تذكرة السامع والمتكلم في أدب العالم والمتعلم — ص٨٩", "date": "", "body": "أجود الأوقات للحفظ الأسحار وللبحث الإبكار وللكتابة وسط النهار وللمطالعة والمذاكرة الليل."}, {"type": "quote", "title": "أحاديث الأخلاق — الشيخ عبدالرزاق البدر ص١٦٤", "date": "", "body": "فإذا رأى في أخيه عيبًا دلَّه على عيبه برفقٍ دون أذًى، بالكلمة الحسنة والقول الطيِّب، وهو مشفق عليه مُحِبٌّ لزوال هذا العيب عن أخيه، والحرص على الستر، فلا يُشهِّر به ولا يفضحه."}], "محمد العييري": [{"type": "quote", "title": "فائدة مأثورة", "date": "", "body": "كلمتان ممنوعتان في بابين: (كيف) في باب الغيب، و(لِمَ) في باب القدر."}, {"type": "quote", "title": "تقريب الفتاوى — شيخ الإسلام ابن تيمية ج١ ص٢٩٤", "date": "", "body": "فمن جعل شخصاً من الأشخاص -غير رسول الله ﷺ- من أحبه ووافقه كان من أهل السنة والجماعة، ومن خالفه كان من أهل البدعة والفُرقة: كان من أهل البدع والضلال والتفرق."}, {"type": "quote", "title": "قصة الأشاعرة — عمار خنفر ص١٠٣", "date": "", "body": "تقول العربُ: قالت الناقة كذا…، ولا تقول تكلمت الناقة؛ فهم يفرقون بين القول والكلام.. كذلك قالوا: كلامٌ فصيح، وقولٌ بليغ؛ لأن الفصاحة مبناها على انتقاء الألفاظ، والبلاغة على قوة المعنى."}, {"type": "quote", "title": "فضل علم السلف على علم الخلف — الإمام الشافعي ص٩٩", "date": "", "body": "قال الشافعي، رحمه الله: ما جهِل الناسُ ولا اختلفوا إلا لتركهم لسان العرب، وميلهم إلى لسان أرسطاطاليس."}], "رائد عبدالله القرعاوي": [{"type": "quote", "title": "سير أعلام النبلاء — الذهبي", "date": "", "body": "تزوج إسحاق بن راهويه أرملة لأن زوجها المتوفى كانت عنده كتب الإمام الشافعي، فقيل له: ما حملك على ذلك؟ فقال: «تنكح المرأة لكتبها»."}, {"type": "quote", "title": "كل يوم ناصية — توماس ماكوين", "date": "", "body": "الأدب هو الدرع الذي جعلني أتوقع كل مفاجآت الدنيا، ومنحني رؤية ما سيقع، والصبر حينما أبتلى، وشجاعة أن أواجه الموت غير آبه بشيء."}, {"type": "quote", "title": "التعافي بالكتب — ص١٠٤ وص١٠٦", "date": "", "body": "الكتب وحدها لا تصنع الإنسان الكامل. إنَّما يُصقل عقل المرء بالعمل كما يُصقل بالقراءة، بل ربما بالعمل أكثر... وقد قيل بحق: «رغباتنا بشائر قدراتنا»."}, {"type": "quote", "title": "العالم في كتاب — ص٧٦", "date": "", "body": "للكتاب قيمة واحدة لا غير، فحواها: أن يقود إلى الحياة، وأن يخدمها، وأن ينفع قارئه، وكل ساعة تنفق في قراءة لا تمنح القارئ شرارة قوة أو لمحة انتعاش فهي ساعة ضائعة لا محالة."}], "عبدالرحمن بن أمين مجيد": [{"type": "quote", "title": "ذكريات علي الطنطاوي — (٧/١٨٢)", "date": "", "body": "وليس في بلاد الناس شيء أسهل من الشراء. يدخل الرجلُ المخزنَ فيرى البضائع المعروضة وعليها أثمانها، فيختار ما يشاء ويدفع الثمن ويمضي."}, {"type": "quote", "title": "قوانين النجاح", "date": "", "body": "قوانين النجاح: الرغبة، والقدرة، والإرادة. فالرغبة عند كل الناس، والقدرة عند غالب الناس، والإرادة عند أقل الناس."}, {"type": "quote", "title": "سبيل الرشاد — محمد تقي الدين الهلالي", "date": "", "body": "بقدر لغات المرء يكثر نفعه / وتلك له عند الشدائد أعوان / فبادر إلى حفظ اللغات مسارعًا / فكل لسان في الحقيقة إنسان."}, {"type": "quote", "title": "معايشة النمرة وأوراق أخرى — جبرا إبراهيم جبرا ص٧-٨", "date": "", "body": "قد لا يُدرك المرء قيمة الشيء اللصيق بحياته، إلا إذا حُرم منه. ولا يعرف المرء عمق المتعة بالقراءة، إلا إذا حرم منها لمدة طويلة."}], "نعيم محمد الغضية": [{"type": "article", "title": "مقال: سِياسةُ النَّفسِ في مِضمارِ الوقتِ وبلوغِ رُتبةِ العِلم", "date": "3/5/2026", "body": "إنَّ المتأملَ في حالِ جِلّةِ العلماءِ يجدُ أنَّ القومَ لم يبلغوا رُتبةَ الإمامةِ إلا بضنّهم بالزمانِ وصيانتهم للعمرِ عن الضياعِ في فضولِ المآكلِ والمشاربِ والمنامات؛ فالعمرُ بضعةُ أنفاس فمن ضيَّعَ ساعاتِ ليله ونهاره فقد ضيَّعَ من دنياه وآخِرته جُلَّ نفعه."}, {"type": "quote", "title": "الفوائد — ابن القيم ص٥٨", "date": "", "body": "فأشرفُ الأحوالِ أن لا تختارَ لنفسِكَ حالةً سوى ما يختارُهُ لك ويُقِيمُكَ فيه؛ فكنْ مع مرادِهِ منكَ، ولا تكنْ مع مرادِكَ منه."}, {"type": "quote", "title": "الداء والدواء — ابن القيم ص٤٥٠", "date": "", "body": "تأمّلتُ مقاصد الناس، فإذا هم – على اختلاف طرقهم – إنما يطلبون دفع الهمّ والغمّ عن نفوسهم... ولم أرَ طريقًا موصِّلةً إلى ذلك إلا الإقبال على الله، ومعاملته وحده، وإيثار مرضاته على كل شيء."}], "عبدالرحمن مفرح علي القحطاني": [{"type": "quote", "title": "إغاثة اللهفان — ابن القيم (٢/٩٢٥)", "date": "", "body": "أكثر الناس يرون مساوئ أنفسهم محاسنًا، ومحاسن خصومهم مساوئا: وما أكثر مَنْ يعتقد أنه هو المظلوم المُحِقُّ من كل وجه، ولا يكون الأمر كذلك، بل يكون معه نوعٌ من الحقّ ونوعٌ من الباطل والظلم."}, {"type": "quote", "title": "بستان الواعظين — ابن الجوزي ص٣٠٠", "date": "", "body": "إذا أراد الله بعبده خيرًا يسَّر لسانه للصلاة على محمد ﷺ."}, {"type": "quote", "title": "الوصية — ابن قدامة ص٤٨", "date": "", "body": "ولا تحقرن مسلمًا، ولا تظنن أنك خير منه، فإن ذلك ربما أحبط عملك!"}], "سليمان إبراهيم العمر": [{"type": "quote", "title": "الصحيحان — المداومة على العمل", "date": "", "body": "الدائم مخيف ولو كان قليلاً.. كم وكم من أيام ذهبت علينا ونحن لم نقرأ فيها شيئاً.. وكنا لو داومنا على قراءة قليلة ولكنها دائمة لخرجنا بحصيلة عظيمة مع مرور الأيام؛ إنما السيل اجتماع النقط."}, {"type": "quote", "title": "د. عبدالله الشهري", "date": "", "body": "لن تستطيع الإحاطة بكل الفنون والعلوم... ينبغي أن يدفعك هذا الشعور بالبعد إلى ضبط أسس تلك العلوم ومعرفة التاريخ والنشأة ومجالات الاتصال بالعلوم القريبة."}, {"type": "quote", "title": "أ.د. خالد بن منصور الدريس", "date": "", "body": "بعد رحلة استمرت لسنوات طويلة وتنوع في مشارب القراءة لم أجد أنفع ولا ألذ من كتب التفسير والشروح الحديثية.. محروم من حُرم الاستمتاع بما فيها من كنوز."}], "عبدالله صائغ العوفي": [{"type": "article", "title": "في الطريق إلى نادي جليس", "date": "18/5/2024", "body": "سلكت الطريق باتجاه مدينة العلم والأدب والمعرفة (بريدة) التي تبعد عن مكان إقامتي قرابة مائتي كيلومتر ذهاباً وإياباً... وصلت إلى مقر النادي واستقبلنا قائد ورئيس النادي أخي وصديقي الأستاذ محمد الدبيخي صاحب الوجه البشوش... وختمت ذلك اليوم بتساؤل: ماذا خبأت لي يا جليس في الأيام القادمة."}, {"type": "article", "title": "بين عقلية الثراء وواقعنا المالي", "date": "23/5/2024", "body": "اكتشفت أن بيني وبين عقلية الثراء بوناً شاسعاً، أنا في واد والثراء في واد، ولست حول الحمى... وما أن تعمقت بالكتاب وتأملت ما جاء فيه، أخذ الضباب الحائل بيني وبين عقلية الثراء يتلاشى شيئاً فشيئاً."}, {"type": "article", "title": "في المكتبة: متى سأقرأ كل هذه الكتب؟", "date": "2/9/2024", "body": "أصل لنهاية آخر ممر في المكتبة وبداخلي سؤال: متى سأقرأ كل هذه الكتب؟ ثم انبثق في عقلي سؤال خفف من وطأة الإحباط: هل قرأ جميع الأدباء والمفكرين والعلماء جميع الكتب؟ لا أعتقد.. ومضيت لأستمتع بكتاب الأسبوع."}], "عادل بن عبدالله الكبيّر": [{"type": "article", "title": "الخليفة الإمام الحكم المستنصر بالله", "date": "3/6/2024", "body": "سيرة الخليفة الأموي العالم الفقيه المؤرخ النسابة الحكم المستنصر بالله الذي بلغت الأندلس في زمانه قمة مجدها الحضاري، وجمع مكتبة عظيمة فيها آلاف الكتب وعليها تعليقاته وملاحظاته."}, {"type": "article", "title": "المقاومة الأندلسية وقصة القائد سليم المنصور", "date": "30/7/2024", "body": "صفحة من صفحات البطولة والشجاعة سطرها الموريسكيون في جبال سيرا دي إسبادان بقيادة الملك المنتخب سليم المنصور سنة 922هـ / 1526م دفاعاً عن دينهم وأرضهم."}, {"type": "article", "title": "تأمل أمام قصور الحمراء في ليالي غرناطة", "date": "21/8/2024", "body": "في غرناطة الجميلة وعيني تراقب التاريخ والأثر في قصور الحمراء ليلاً، تخيلت ملوك بني نصر والوزير لسان الدين بن الخطيب يتجول بين أروقة القصور على ضوء القمر."}, {"type": "quote", "title": "معجم أسر بريدة — (١٩/٣١١)", "date": "", "body": "من قصص الكرم ما يذكر عن عبدالعزيز بن عبدالله المديفر (ت 1354هـ) أنه شاهد رجلاً يأخذ من تمر نخله في الصباخ خلسة، فجاء وساعده في حمل المحفر وهو يقول: عجّل لا يشوفك راعي النخل!"}], "عبدالعزيز بن إبراهيم الدوسري": [{"type": "article", "title": "خاطرة للسهارى: كيف تتعامل مع الرغبة في الذنب؟", "date": "17/8/2025", "body": "1- لا تحارب الرغبة، بل تعامل معها على أنها فكرة عابرة لاحظتها ثم تجاهلها.\n2- واجهها بجواب واحد ثابت: \"إني أخاف الله رب العالمين\" وانتقل مباشرة لشيء يشغلك.\n3- تقبّل وجود الغريزة واحتسب تركها لله، والله سيعوضك بما هو أجمل."}, {"type": "quote", "title": "أشياء أتمنى أنني عرفتها قبل الزواج — جاري تشابمان", "date": "", "body": "يقدم الكتاب دليلاً عملياً ينقلنا من خيالات (العزوبية) إلى واقع الحياة الزوجية، مؤكداً أن الحب وحده ليس كافياً لبناء زواج سعيد."}, {"type": "quote", "title": "عقلك يتلاعب بك — ألبرت مخيبر", "date": "", "body": "يقدم فهماً بسيطاً لآلية عمل أدمغتنا، وكيف يشكل الدماغ آراءنا وتصوراتنا، ليحررنا من الانحيازات والأوهام التي تسيطر على يومياتنا."}], "عبدالعزيز عبدالله الطويان": [{"type": "quote", "title": "توما الكمبيسي", "date": "", "body": "بحثت عن السعادة في كل مكان، ولم أجدها إلا في زاوية ومعي كتاب."}, {"type": "quote", "title": "قراءة القراءة — فهد صالح الحمود ص٢٥ وص٢٧", "date": "", "body": "ينبغي أن تتصدر أفكار الكتب أحاديثنا في لقاءاتنا ومنتدياتنا؛ بدلاً عن الأحاديث في مجريات الناس ولهواتهم... والذي يريد أن يقرأ لا بد له من جعل وقت محدد للقراءة لا يتخلف عنه."}, {"type": "quote", "title": "علي الطنطاوي", "date": "", "body": "الحياة ليست بطول السنين ولكن بعرض الأحداث."}], "صالح جاسر الجاسر": [{"type": "article", "title": "مقال بمناسبة اليوم العالمي للكتاب", "date": "23/4/2026", "body": "القارئ الحقيقي ليس من ينهي الكتاب بل من يتغير بعده (فكرياً).\nالقراءة تقود إلى فهم، والفهم يقود إلى وعي، والوعي يتحول إلى سلوك، والسلوك يصنع تأثير.\nأخطر نوع من القراءة قراءة لا تغيّر شيئاً في حياتك وآخرتك. الكتاب لم يعد الخيار الوحيد للمعرفة، لكنه ما زال الطريق الأهم لبناء الإنسان."}, {"type": "quote", "title": "عن الجاحظ", "date": "", "body": "وجميع الخير راجعٌ إلى سعة الصدر. فقد صحّ الآن أن سعة الصدر أصل، وما سوى ذلك من أصناف الخير فرع."}, {"type": "quote", "title": "أرسطو", "date": "", "body": "فالذين يفكرون يرون الحياة كوميديا والذين يشعرون يرونها تراجيديا."}], "خلف سليمان اللهيدي": [{"type": "quote", "title": "الطريق إلى مكة — محمد أسد ص٨٠", "date": "", "body": "المياه الراكدة في بركة تتعطن وتتشبع بالطين والعكر، أما المياه المتحركة المتدفقة، فإنها تظل نقية.. هكذا الإنسان في سكونه أو تجواله."}, {"type": "quote", "title": "تاريخ الفلسفة — برتراند راسل", "date": "", "body": "إسبارطة هزمت أثينا هزيمة نكراء (404 ق.م) غير أن مكانة أثينا لم تزل رفيعة على الرغم من سقوطها السياسي."}], "عمر علي الشعيبي": [{"type": "article", "title": "التأثر بالقدوات والحكم على الناس", "date": "17/8/2026", "body": "هل من الطبيعي أن أتأثر بمن أحب رغم بلوغي منتصف الثلاثينات؟ نعم، ولكن بطريقة متوازنة تليق بعقل ناضج... ولعل عينًا ترمقك وأنت لا تدري، فتثبت لثباتك."}, {"type": "article", "title": "صداقة لم تكن في الخطة", "date": "28/9/2026", "body": "دخلت هذه الرحلة وأنا أقول لنفسي: لا علاقات، فقط تعلّم. وخرجت منها وأنا أدرك أن بعض ما نتعلمه في الحياة لا نجده في المحاضرات ولا الكتب؛ بل نتعلمه من أشخاص تضعهم الأقدار في طريقنا دون موعد."}, {"type": "article", "title": "خاطرة أثناء كتابة خاطرة", "date": "20/10/2026", "body": "قرأت في سيرة الخليفة عمر بن عبد العزيز عن رقة قلبه ورحمته بالناس، وكيف كانت تفيض عيناه حين يتفكر في أحوالهم؛ ومنذ ذلك الحين تغيّرت نظرتي إلى دموعي، فما كل دمعة ضعف، بل قد تكون رحمةً فاض بها القلب."}, {"type": "quote", "title": "من آداب الحسن البصري — ابن الجوزي ص٥٩", "date": "", "body": "إذا رأيت في ولدك ما تكره فاستعتب ربك، أي راجعه وتب إليه، واستغفره ذنوبك."}], "يزيد سلمان الصلعاء": [{"type": "quote", "title": "مختصر جامع العلوم والحكم — ص٥٥", "date": "", "body": "أعمال البر يعملها البرُّ والفاجر وأما المعاصي فلا يترُكها إلا صديق."}, {"type": "quote", "title": "الداء والدواء — ابن القيم ص١١", "date": "", "body": "والدعاء من أنفع الأدوية، وهو عدو البلاء، يدافعه ويعالجه، ويمنع نزوله، ويرفعه، أو يخففه إذا نزل."}], "معاذ بن عمر العليان": [{"type": "quote", "title": "ذكريات علي الطنطاوي — (٤/٣١١)", "date": "", "body": "قال دانته شاعر الطليان الأكبر: \"إن ذكرى اللذات الماضية تؤلمنا\". ولعل مفهوم مخالفة كلامه صحيح أيضاً، فذكرى الآلام الماضية تسرنا."}, {"type": "quote", "title": "موت الأسرار — للوهيبي ص٣٠٨", "date": "", "body": "ومن جملة محامد العزلة عن الفضاء الرقمي تكميل الاستمتاع بالمباحات؛ لأن الارتباط الهوسي بالتصوير ومشاركة اليوميات يعكر صفو التجارب واللحظات الطيبة."}, {"type": "quote", "title": "عبدالله الهدلق", "date": "", "body": "إذا كنتَ ستعادي كلّ من لا يوافقك الرأي؛ فعليك أن تعاديَ نفسك أولا، لأنك ما تزال تغيّر آراءك في كلّ مرحلة من مراحل حياتك."}], "عبدالعزيز العقيل": [{"type": "quote", "title": "عبدالله الهدلق", "date": "", "body": "حين يفقد الإنسان الدهشة يفقد بهجة الحياة، عادة اللامبالاة هي سمة الأغبياء."}, {"type": "quote", "title": "مذكرات قارئ — محمد الأحمري ص٣٣", "date": "", "body": "فالوعي ليس حفظا والعلم ليس جمعا فقط، لأن القراءة الواعية عملية إحياء وبحث للروح في الكلام المسطور أمامك."}, {"type": "quote", "title": "بستان العارفين — الإمام النووي ص٢٣", "date": "", "body": "منَ النصيحة أن تضافَ الفائدةُ التي تُستغرَبُ إلى قائلها، فمَن فعل ذلك بُوركَ له في علمه وحاله."}], "معاذ عطافي": [{"type": "article", "title": "خاطرة وعظية: لا تكن ضيفاً مستعجلاً على ربك!", "date": "30/7/2026", "body": "البعض إذا دخل الصلاة ظنَّ أن المطلوب هو الوصول إلى السلام بأقصر وقت ممكن... لا تجعل همَّك أن تنتهي من الصلاة بل اجعل همَّك كيف تُقبِل على مالك الملك؛ هي دقائق تُصليها قد تكون آخر عهد لك، راقِب صلاتك قبل أن تُراقب ساعتك."}, {"type": "quote", "title": "المساكين — مصطفى صادق الرافعي ص٥٧", "date": "", "body": "أينما يذهب الإنسان تقتله أسئلة كثيرة: ما اسمك؟ ما صناعتك؟ كم عمرك؟ ماذا تملك؟ ما رأيك؟ ثم يبطل هذا كله عند القبر.. وهناك يتحرك اللسان الأزلي بسؤال واحد للإنسان: ما أعمالك؟"}, {"type": "quote", "title": "عباس العقاد", "date": "", "body": "إن لم تلاحق حلمك لن تحققه أبداً، إن لم تسأل فسيبقى الجواب دائماً 'لا'، إن لم تخطِ للأمام ستبقى عالقاً أبداً في نفس المكان."}], "عبدالعزيز علي الوهيبي": [{"type": "quote", "title": "أدب الدنيا والدين — الماوردي (٧٠/١)", "date": "", "body": "من تفرد بالعلم لم توحشه خلوة، ومن تسلى بالكتب لم تفته سلوة، ومن آنسه قراءة القرآن، لم توحشه مفارقة الإخوان. وقال بعض العلماء: لا سمير كالعلم، ولا ظهير كالحلم."}, {"type": "quote", "title": "وليم هازلت", "date": "", "body": "إنّ أعظم متعة في الحياة: هي متعة القراءة والاطلاع."}], "تركي عبدالرحمن العمران": [{"type": "quote", "title": "عجائب وأسرار — للبداح ص٥٩", "date": "", "body": "قال الشيخ بكر أبو زيد رحمه الله: كنت أقرأ على الشيخ ابن باز صحيح البخاري بالحرم المكي عام ١٣٨٥هـ، ولم يكن معي غيري."}, {"type": "quote", "title": "سنوات وذكريات — د. أحمد هيكل ص٣٩", "date": "", "body": "اشتر الكتب ما استطعت، فالكتب زينة للرجال كما الحلي زينة للنساء."}], "صالح محمد الضحيان": [{"type": "quote", "title": "تفسير السعدي", "date": "", "body": "«ويقيمون الصلاة» لم يقل: يفعلون الصلاة؛ لأنه لا يكفي فيها مجرد الإتيان بصورتها الظاهرة. فإقامة الصلاة: إقامتها ظاهراً بإتمام أركانها، وباطناً بحضور القلب فيها."}], "سلطان بن خالد بن برغش": [{"type": "quote", "title": "اجتماع الجيوش الإسلامية — ابن القيم ص٤٣", "date": "", "body": "وتأمل كيف قال الله: (ذَهَبَ اللَّهُ بِنُورِهِمْ) فوحَّده، ثم قال: (وَتَرَكَّهُمْ فِي ظُلَّمَاتٍ) فجمعها، فإن الحق واحد، أما طرق الباطل والضلال والبدع فمتعددة متفرقة."}], "إبراهيم الشويهي": [{"type": "quote", "title": "المرونة النفسية — ليس براون ص١٥٠", "date": "", "body": "الأوقات الطيبة نضعها في جيوبنا، أما الأوقات السيئة فنضعها في قلوبنا!"}], "عبدالله سليمان المحيميد": [{"type": "quote", "title": "جورج مارتن", "date": "", "body": "القارئ يعيش ألف حياة قبل أن يموت، والشخص الذي لا يقرأ يعيش حياة واحدة فقط."}, {"type": "quote", "title": "الإمام الشافعي", "date": "", "body": "العلم ثلاثة أشبار: فمن أدرك الشبر الأول تكبّر، ومن أدرك الثاني تواضع، ومن أدرك الثالث علم أنّه لا يعلم."}], "باسل عبدالله أحمد الرميح": [{"type": "quote", "title": "د. عبدالكريم بكار", "date": "", "body": "مقالات وأفكار في القراءة وتكوين العقل والوعي وبناء الذات."}], "بدر الشايعي": [{"type": "quote", "title": "مختصر منهاج القاصدين — ابن قدامة ص٣٢٤", "date": "", "body": "اعلم أن اللَّه تعالىٰ إذا أراد بعبدٍ خيرًا بصَّره بعيوب نفسه، فمن كانت له بصيرةٌ لم تَخْفَ عليه عيوبه، وإذا عرف العيوب أمكنه العلاج."}], "عبدالرحمن سليمان الثنيان": [{"type": "quote", "title": "الآثار — محمد البشير الإبراهيمي ج٤ ص٣٧٢", "date": "", "body": "إن الكتاب الذي يقرأ كالطعام الذي يؤكل، فطعام يعطي آكله القوة والفراهة، وطعام يعطي آكله الضعف والهزال."}], "عمر بن إبراهيم القريعان": [{"type": "quote", "title": "مصطفى صادق الرافعي", "date": "", "body": "ليكن غرضك من القراءة اكتساب قريحة مستقلّة، وفكر واسع، وملكة تقوى على الابتكار، لا مجرّد حشو الذاكرة بالمعلومات والمحفوظات."}], "فهد بن عبدالعزيز الشيبان": [{"type": "quote", "title": "شرح رياض الصالحين — الشيخ ابن عثيمين", "date": "", "body": "إذا طلب العلم ورأى من نفسه مللا في مراجعة كتاب فلينتقل لكتاب آخر، حتى ينشط، ثم يعود للأول؛ لأن النفوس تمل وتكل، وتحتاج إلى تنويع."}], "أحمد محمد الأكيزم": [{"type": "quote", "title": "قصة هاجر وإسماعيل عليهما السلام", "date": "", "body": "فقالت له: “الله أمرك بهذا؟” قال: “نعم”. فقالت بيقين المؤمنة الثابتة: “إذن لا يضيعنا”."}], "عبدالملك علي الضبعان": [{"type": "quote", "title": "معاوية بن أبي سفيان رضي الله عنه", "date": "", "body": "العقل مكيال؛ ثلثه الفطنة، وثلثاه التغافل."}], "خالد بن عبدالرحمن الواصل": [{"type": "quote", "title": "جزيرة العرب في القرن العشرين — حافظ وهبة", "date": "", "body": "مقتطفات تاريخية حول أحوال الجزيرة العربية وتاريخها وتطورها."}], "إبراهيم سليمان النغيمشي": [{"type": "article", "title": "تأمل: الحياة الروتينية والحياة القتالية", "date": "22/10/2026", "body": "يقول الإمام النووي: جربنا الانشغال وجربنا الراحة فوجدنا أن الراحة أتعب من الانشغال؛ الإنسان مفطور فطرة على الانشغال. جالس شخصاً بدأ حياة قتالية يسعى في الأرض في كل يوم عنده تجربة جديدة، وتجد عنده من النشاط والحيوية ولو كان عمره ٨٠ سنة."}, {"type": "quote", "title": "الإمام أبو حامد الغزالي", "date": "", "body": "مقولة في تزكية النفس ومجاهدة الهوى والانشغال بالعلم النافع."}], "عبد الله بن محمد المنصور": [{"type": "quote", "title": "إشراقة صباحية", "date": "", "body": "القراءة تصنع إنسانًا كاملًا، والمشورة تصنع إنسانًا مستعدًا، والكتابة تصنع إنسانًا دقيقًا."}], "أحمد مدشر الظاهر": [{"type": "quote", "title": "الأخلاق والسير — ابن حزم", "date": "", "body": "لَو علم النَّاقِص نَقصه لَكَانَ كَامِلا فلَا يَخْلُو مَخْلُوق من عيب فالسعيد من قلت عيوبه ودقت."}], "عمار عبدالله الفايز": [{"type": "quote", "title": "صيد الخاطر — عن الشعبي ص٣٥٠", "date": "", "body": "العلم أكثر من أن يُحصى، فخذوا من كل شيء أحسنه."}], "صالح عبدالله صالح السمحان": [{"type": "quote", "title": "أبيات ابن حزم الأندلسي", "date": "", "body": "هَلِ الدَّهْرُ إِلاَّ مَا عَرَفْنَا وَأَدْرَكْنَا / فَجَائِعُهُ تَبقَى وَلَذَّاتُهُ تَفْنَى / كَأنَّ الَّذِي كُنَّا نُسَرُّ بِكَوْنِهِ / إِذَا حَقَّقَتْهُ النَّفْسُ لَفْظٌ بِلاَ مَعْنَى."}], "راكان خلف الحربي": [{"type": "quote", "title": "تفسير ابن كثير — (٤/٥١٢)", "date": "", "body": "قال نبي الله داود عليه السلام: يا رب، كيف أشكرك وشكري لك نعمة منك عليّ؟ فقال الله تعالى: الآن شكرتني يا داود، أي حين اعترفت بتقصيرك عن أداء شكر النعم."}], "محمد حمدان سهرابي": [{"type": "quote", "title": "الأوائل — أبو بكر الجراعي ص١٠٧", "date": "", "body": "عن الوليد بن عمرو: بلغني أن أول شيء يجد الميت حوله عند رجليه، فيقول: ما أنت؟ فيقول: أنا عملك."}], "عمر مجري البقمي": [{"type": "quote", "title": "ابن القيم", "date": "", "body": "وأرباب الطريق مجمعون على أن مراقبة الله تعالى في الخواطر سبب لحفظها في حركات الظواهر، فمن راقب الله في سره حفظه الله في حركاته في سره وعلانيته."}], "عبدالرحمن صالح العبيشي": [{"type": "quote", "title": "جامع العلوم والحكم — ابن رجب", "date": "", "body": "وربما دعا المؤمنُ المجابُ الدعوة بما يعلم الله الخِيَرَةَ له في غيره، فيصرف الله عنه من السوء مثلها، أو يدّخرها له في الآخرة، فيكون عطاء الله له في المنع أعظم من عطائه في الإجابة."}], "البراء بن يوسف الراجحي": [{"type": "quote", "title": "ابدأ كتابة حياتك — ص١٣", "date": "", "body": "(كل ابن آدم خطّاء) هذا قَدَرُ الإنسان.. وقَدَرُه الآخر: أن له الحرية المطلقة في التحرر من ربق الخطأ مهما كان كبيراً!!"}]};

    let archiveData = {};
    let globalFilter = 'all';
    let currentMemberName = null;
    let currentModalTab = 'all';

    function loadArchive() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
            archiveData = parsed;
            return;
          }
        } catch (e) {}
      }
      archiveData = JSON.parse(JSON.stringify(INITIAL_ARCHIVE));
      saveArchive();
    }

    function saveArchive() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(archiveData));
      } catch (e) {}
      updateStats();
    }

    function updateStats() {
      let totalQuotes = 0;
      let totalArticles = 0;
      DEFAULT_MEMBERS.forEach(m => {
        const list = archiveData[m.name] || [];
        list.forEach(item => {
          if (item.type === 'article') totalArticles++;
          else totalQuotes++;
        });
      });
      document.getElementById('statMembers').textContent = DEFAULT_MEMBERS.length;
      document.getElementById('statQuotes').textContent = totalQuotes;
      document.getElementById('statArticles').textContent = totalArticles;
    }

    function setGlobalFilter(filter, btn) {
      globalFilter = filter;
      document.querySelectorAll('.controls-section .pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderMembers();
    }

    function renderMembers() {
      const q = document.getElementById('globalSearch').value.trim().toLowerCase();
      const grid = document.getElementById('membersGrid');
      grid.innerHTML = '';

      DEFAULT_MEMBERS.forEach(member => {
        const items = archiveData[member.name] || [];
        const quotesCount = items.filter(i => i.type === 'quote').length;
        const articlesCount = items.filter(i => i.type === 'article').length;

        if (globalFilter === 'hasContent' && items.length === 0) return;
        if (globalFilter === 'hasArticles' && articlesCount === 0) return;
        if (globalFilter === 'hasQuotes' && quotesCount === 0) return;

        if (q) {
          const nameMatch = member.name.toLowerCase().includes(q);
          const contentMatch = items.some(i =>
            (i.title && i.title.toLowerCase().includes(q)) ||
            (i.body && i.body.toLowerCase().includes(q))
          );
          if (!nameMatch && !contentMatch) return;
        }

        const card = document.createElement('div');
        card.className = 'member-card';
        card.onclick = () => openMemberModal(member);

        let badgesHTML = '';
        if (articlesCount > 0) {
          badgesHTML += `<span class="badge-count badge-articles">✍️ ${articlesCount} مقال وخاطرة</span>`;
        }
        if (quotesCount > 0) {
          badgesHTML += `<span class="badge-count badge-quotes">📖 ${quotesCount} اقتباس</span>`;
        }
        if (items.length === 0) {
          badgesHTML = `<span class="badge-count badge-empty">سجل العضو (اضغط للإضافة)</span>`;
        }

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div>
                <div class="member-name">${member.name}</div>
                <div class="member-role">${member.role}</div>
              </div>
              <span class="member-rank">#${member.id}</span>
            </div>
          </div>
          <div class="card-badges">${badgesHTML}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openMemberModal(member) {
      currentMemberName = member.name;
      currentModalTab = 'all';
      document.getElementById('modalMemberName').textContent = member.name;
      document.getElementById('modalMemberSubtitle').textContent = `الترتيب في النادي: #${member.id} — ${member.role}`;
      document.getElementById('addEntryForm').classList.remove('open');
      updateModalTabsUI();
      renderModalEntries();
      document.getElementById('memberModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('memberModal').classList.remove('open');
      currentMemberName = null;
    }

    function setModalTab(tab) {
      currentModalTab = tab;
      updateModalTabsUI();
      renderModalEntries();
    }

    function updateModalTabsUI() {
      document.getElementById('tabAll').classList.toggle('active', currentModalTab === 'all');
      document.getElementById('tabArticles').classList.toggle('active', currentModalTab === 'article');
      document.getElementById('tabQuotes').classList.toggle('active', currentModalTab === 'quote');
    }

    function renderModalEntries() {
      const container = document.getElementById('modalEntriesList');
      const items = archiveData[currentMemberName] || [];
      const filtered = currentModalTab === 'all' ? items : items.filter(i => i.type === currentModalTab);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:2.5rem 1rem; color:var(--text-muted); background:#fff; border-radius:14px; border:1px dashed var(--border-soft);">لا توجد مشاركات مسجلة في هذا القسم حالياً. يمكنك إضافة مشاركة جديدة من الزر أعلاه.</div>`;
        return;
      }

      container.innerHTML = filtered.map((item, idx) => {
        const isArticle = item.type === 'article';
        return `
          <article class="entry-card ${isArticle ? 'article-type' : 'quote-type'}">
            <div class="entry-meta">
              <span class="entry-tag ${isArticle ? 'tag-article' : 'tag-quote'}">${isArticle ? 'مقال / خاطرة' : 'اقتباس موثق'}</span>
              ${item.date ? `<span class="entry-date">📅 ${item.date}</span>` : ''}
            </div>
            ${isArticle && item.title ? `<h3 class="entry-title">${item.title}</h3>` : ''}
            <div class="entry-text">${item.body}</div>
            <div class="entry-source">
              <span>${!isArticle && item.title ? '📚 ' + item.title : '✍️ ' + currentMemberName}</span>
              <button class="copy-btn" onclick="copyText(${idx})">📋 نسخ النص</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function toggleAddForm() {
      document.getElementById('addEntryForm').classList.toggle('open');
    }

    function saveNewEntry(e) {
      e.preventDefault();
      if (!currentMemberName) return;
      const type = document.getElementById('entryType').value;
      const title = document.getElementById('entryTitle').value.trim();
      const date = document.getElementById('entryDate').value.trim();
      const body = document.getElementById('entryBody').value.trim();

      if (!archiveData[currentMemberName]) archiveData[currentMemberName] = [];
      archiveData[currentMemberName].unshift({ type, title, date, body });
      saveArchive();
      renderMembers();
      renderModalEntries();
      e.target.reset();
      toggleAddForm();
      showToast('تم حفظ المشاركة في سجل العضو بنجاح');
    }

    function copyText(filteredIndex) {
      const items = archiveData[currentMemberName] || [];
      const filtered = currentModalTab === 'all' ? items : items.filter(i => i.type === currentModalTab);
      const item = filtered[filteredIndex];
      if (!item) return;
      const full = `${item.title ? item.title + '\n' : ''}${item.body}\n— ${currentMemberName} (نادي جليس)`;
      navigator.clipboard.writeText(full).then(() => showToast('تم نسخ النص إلى الحافظة'));
    }

    function exportArchiveJSON() {
      const payload = {
        club: "نادي جليس - أصدقاء القراءة",
        title: "أرشيف الأعضاء",
        exportedAt: new Date().toISOString(),
        membersCount: DEFAULT_MEMBERS.length,
        members: DEFAULT_MEMBERS,
        archive: archiveData
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'jalees-archive.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('تم تصدير ملف الأرشيف (JSON)');
    }

    function resetToDefault() {
      if (!confirm('هل تريد استعادة النسخة المعتمدة من الأرشيف؟')) return;
      archiveData = JSON.parse(JSON.stringify(INITIAL_ARCHIVE));
      saveArchive();
      renderMembers();
      if (currentMemberName) renderModalEntries();
      showToast('تمت استعادة النسخة المعتمدة بنجاح');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadArchive();
      updateStats();
      renderMembers();
    });
  </script>
</body>
</html>
