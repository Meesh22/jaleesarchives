      {member:'محمد عبدالعزيز العمر',title:'خاطرة: بين النصيحة والفضيحة',date:'٢٥/١٠/٢٠٢٥',body:'لا أدري كيف يتحول مسار النصيحة بيننا إلى فضيحة، وكأن بينهما رابطة نسب! إلى أن وقعت على مثل في فصل الأمثال السائرة من كتاب «مجاني الأدب في حدائق العرب»، جمعه الأديب لويس شيخو: «إذا بالغت في النصيحة هجمت بك الفضيحة». ويبدو أننا جعلنا من هذا المثل منهج حياة؛ فلا نقدم النصح إلا متبوعًا بفضح، وكأن الستر عندنا عيب يحتاج إلى استظهار. بل إنا طورنا المثل وصقلناه: نبدأ بالفضيحة، ثم نغلفها باسم النصيحة! فإياك أن تهديني عيوبي، فقد صار كشفها فضيحة بجلاجل.'},
      {member:'محمد عبدالعزيز العمر',title:'خاطرة: في أمسية جليس ومنتجع نخيل',date:'٤/١٢/٢٠٢٥',body:'حرارة المتسابقين كانت لنا لبسًا وغطاء عن البرد. ضحكاتكم المبعثرة هنا وهناك، ونظرات التمويه التي أعطت اللقاء نكهة وحيوية، ومشاكساتكم البريئة والخبيثة أضفت للقاء متعته وصنعت أنسه. كنتم الكرم قبل أن يكون الكرم منكم، بشر شع من الوجوه للحاضر والقادم.\n\nتحية إعجاب لمكتبة الجامعة التي كانت وما زالت منبرًا للقراء وبيتًا حاضنًا للمريدين. بين يدي أبي أيوب عرفنا تلك الكواليس والمراحل والمشاق والألغاز للكتبيين قبل أن نحتضن الكتاب ونتذوقه ونشمه ونلمسه ونطبطب عليه. لا أستثني أحدًا في تلك الجلسة؛ فالجميع يحبونك وتحبهم ويجبرونك على الإنصات والتأمل والثناء والقرب والدعاء. منتجع يجعل الحليم حيرانًا، والصامت متكلمًا، والساكن راقصًا. لأعدمنا مثل هذه المنتجعات وزادنا ربي من خيراته. نادي جليس إلى الأمام والله يحرسك ويرعاك.'},
      {member:'محمد عبدالعزيز العمر',title:'قصة قصيرة ساخرة: رحلتي الظهرية',date:'١٧/١٢/٢٠٢٥',body:'كنت أترقب طلوع الشمس من بين العمارات المجاورة لبيتنا وهي تصوب أشعتها في حوش بيتي، فأعد سريرًا في المشراق، وهو مكان قصي في البيت يبحث عنه صغار السن للتدفئة. السرير بسيط من كرسيين متقابلين ألقيت عليهما لحافًا أنام فوقه، ومعه وسادة من خيشة حطب مرمية على قارعة السيب. وبعد أن أسندت ظهري إلى الحصير البلاستيكي، إذا بدبدبة كدبدبة كرة تتراقص حول رأسي اعتدت سماعها في ساعات يلذ النوم فيها، وإذا بصوت مهموس يوشوش عند أذني بلطف لم أعهده: «يا والدي… هل تسمح لي باللعب؟»\n\nجاءت الموافقة سريعة، ثم غفت عيناي ولا أدري هل أنا في منام أم يقظة! شات طفلي الكرة في فناء البيت، فانطلقت كالسهم مخترقة حواجز الهواء لتستقر على شاشة التلفاز المثمنة بألف ريال. فهرعت شجرة الدر المصونة الحنونة الجميلة، مهرولة مولولة، فعثرت بفناجين القهوة الفاخرة فتناثرت مخلفة أضرارًا جسيمة في أثاث البيت وفرشه. فقمت فزعًا مذعورًا، ولا أدري لماذا اتجهت للباب الخارجي؛ ويظهر أن هذا من علامات الشجاعة وفوائد التدريب، لأنهم قالوا لنا عند الخطر اتجه لأقرب مخرج للطوارئ. متى وقعت مثل هذه الحوادث؟ وكيف تكررت؟ إن لم يكن شيء من ذلك قد أصابك، فأنت تعيش في نعم عظيمة حقها الثناء والشكر للمنعم جل في علاه، والآخرة خير من الأولى.'},
      {member:'محمد عبدالعزيز العمر',title:'خاطرة: بين عدستي القوقعة والمرأة المجهولة',date:'٣١/١٢/٢٠٢٥',body:'بين عدستين: عدسة القوقعة وعدسة المرأة المجهولة. الأولى جحيم يتقدم أمام ناظري الفتى المسجون بلا ذنب؛ عذاب جسدي وروح قوية استمدت قوتها من مشاهدتها. والثانية عدسة فتاة مجهولة، تبصر بها كل يوم ما يؤلم الفؤاد ويعذب الروح؛ عذاب خفي يتسلل من نوافذ ضيقة إلى الروح فيعبث بها؛ إن العشق عذاب آخر.\n\nفالأول سجين الجسد مطلق العنان، والثاني سجين القلب والروح مطلق الجسد، يجمعهما أسر عدسة لا ترحم. وما كان الرفق في شيء إلا زانه. القوقعة رواية لمصطفى خليفة تحكي واقعًا مؤلمًا في السجون السورية وتحتاج قلبًا قويًا. ورسالة من امرأة مجهولة يمكن أن نسميها رواية أو قصة طويلة لفتاة عشقت كاتبًا أو فنانًا لتسافيغ، وعليها ملاحظات.'},
      {member:'أسامة الفلاج',title:'علاقة العلم بالدنيا والآخرة',date:'٩/٣/٢٠٢٤',body:'في تراثنا كأن هناك ملازمة بين العلم وقلة ذات اليد، فلا تجد عالمًا فحاصًا أو أديبًا غواصًا إلا والفقر نديمه والفاقة مسكنه؛ ولعل هذا من عزة العلم وفضل غيرته، فلا يقبل شركة المال ولا مجالسة الدنيا.\n\nومنافرة العلم للدنيا تشعرك بأنه ليس من أبناء هذه الدار ولا سليلاً لها، إنما تعلقه بضرتها واجتماعه بها؛ فكما أن الآخرة دار الحق والعدل، ولا غاية للعلم إلا كشف الحقائق والقيام بالقسط، فكان أحرى به أن يكون من أبناء الآخرة.\n\nوما العلم في هذه الدار إلا كرسول أوفدته الدار الآخرة للتذكير بها والتنبيه على ضرتها وقلة شأنها وبخس قيمتها، فلا جرم أن ترى العلم منها هذا التجافي والعناد.'},
      {member:'أسامة الفلاج',title:'موازنة أدبية بين المتنبي والمعري في ترويض الزمن',date:'١١/٣/٢٠٢٤',body:'حين قال المتنبي معتزًا بنفسه ومفتخرًا بها واصفًا طموحه وعظم همته:\n«أريد من زمني ذا أن يبلغني / ما ليس يبلغه من نفسه الزمن»\n\nجعل الزمن أقل منه عزمًا وأقصر في بلوغ مآربه. والزمن وما أدراك ما هو، مفني الممالك ومبيد الجبابرة، يتطاول على العتاة فيعجزهم، وينقلب على ذوي السلطان فيهلكهم؛ ضحكه رخاء وعبوسه شقاء. ومع ما رأيت من شدة بأسه وعظيم فعله، جعله المتنبي مطية لأمانيه ومركبًا لمراداته، وفي هذا براعة لا تخفى على ذي الذوق.\n\nأما حين تقرأ البيت متفردًا بنفسه وقد ذقت حلاوة بيانه وخبرت متانة بنيانه، فإنك ستقف حائرًا بينه وبين بيت المعري الذي يقول فيه:\n«ينافس يومي فيّ أمسي تشرفًا / وتحسد أسحاري عليّ الأصائل»\nفأيهما أبلغ في الوصف وأبهر في البيان: من جعل الزمان مروضًا لهمته، أم من أصبح الزمان ينافس بعضه فيه؟'},
      {member:'أسامة الفلاج',title:'الحكم على الآباء بين الباعث والسلوك',date:'١٤/٨/٢٠٢٤',body:'أتصور أن الإنسان يحكم على أبويه بإحدى طريقتين: إما بالنظر لبواعثهم، أو بالنظر لسلوكهم.\n\nففي المراهقة يعمى المراهق عن الباعث ويصوب تركيزه على السلوك، وكلما نضج كانت نظرته للباعث أغلب.\n\nويخطئ كثير من الآباء في التعويل على بواعثهم وإهمال سلوكهم تجاه أبنائهم، فتجدهم يلوكون الألم والحسرة على جفاء الأبناء، مع أن الواحد منهم قد لا ينام ليله حبًا لهم وحرصًا عليهم، لكن هيهات أن يغلب المخفي الظاهر.'},
      {member:'أسامة الفلاج',title:'قراءة في منهج الفيلسوف كانط والواجب الأخلاقي',date:'٢٠/٨/٢٠٢٤',body:'اقتنع «كانت» بأن الطرق العقلية لا تؤدي إلى حقائق ميتافيزيقية ذات جدوى، فكل فريق يقيم حججه على الآخر ويعتقد أن صنيعه محقق للبرهان واليقين.\n\nوحين قارن «كانت» بين عدة آراء حول مسألة ميتافيزيقية كمسألة الكون قدمًا وحدوثًا، رأى أنصار الرأيين في ذروة التناقض، مع أن كل واحد منهم يزعم تمسكه بذات الطريق وعين الآلة؛ كل هذا جعل «كانت» زاهدًا في القدرة الاستدلالية العقلية في شؤون الميتافيزيقا.\n\nومنهج «كانت» - أي القول بعدم جدوى العقل في الميتافيزيقيا - منهج عرفه تراثنا باسم «مذهب المهندسين»، وهم الذين يقصرون الاستدلال العقلي على الشاهد دون الغائب كما عبر عنه الإمام السنوسي خير تعبير. إلا أن «كانت» مع استدباره الطريق العقلي، أو كما يعبر عنه بالعقل النظري، يمم وجهه شطر طريق آخر رآه خير موصل لهذه الحقائق، وجعل مرتكز طريقه مستندًا على مفهوم الواجب الأخلاقي الذي هو الركن الركين في الأخلاق حسب وصفه، فكيف عبّد هذا الطريق الاستدلالي وعالج هذه المشكلات الميتافيزيقية؟\n\nينطلق «كانت» من قيامنا بواجباتنا المختلفة، وهذا القيام بالواجب يشهد بأننا أحرار في تصرفاتنا وما يقع على عواتقنا من مسؤوليات أخلاقية؛ إذًا نحن نمتلك إرادة حرة. ونتيجة لقيامنا بهذه الواجبات الأخلاقية التي تصدر من إرادة حرة نصبح أهلًا للسعادة والخير الأسمى، إلا أن هذه السعادة القصوى وهذا الخير الأسمى لا يكفي لتحقيقه حياة كحياتنا هذه، فلا بد من حياة أخرى نستوفي فيها هذه الثمرات؛ إذًا الروح خالدة. ولكن كيف نضمن العدالة لاستيفاء هذه السعادة؟ لا محيص أن قوة ما هي من ينجز لنا ذلك؛ فالله إذا موجود.\n\nيتسلسل بنا «كانت» من الواجب الأخلاقي المرتكز على دعائم ثلاث: حرية الإرادة المصححة لصدور أفعالنا، وخلود الروح التي هي محل السعادة والشقاء الأبدي، ووجود الله تعالى مصدر العدالة والجزاء.'},
      {member:'أسامة الفلاج',title:'إشكالية التربية بين شخصية المربي وشخصية المربى',date:'٣/٩/٢٠٢٤',body:'هذا السؤال أردت منه أمرًا واحدًا، وأظنه هامًا كذلك.\n\nظاهر السؤال أنه عن التربية، إلا أن حقيقته - وهذا ما ظهر من تباين الإجابات - أننا نربي «بما يتوافق مع شخصياتنا»، لا «بما يتوافق مع شخصية المربى».\n\nولست أمانع أن يكون كلامي هذا كله خطأ، إلا أن الملحظ الذي أحببت الالتفات إليه هو تبين الخط الفاصل بين الشخصيتين: المربي والمربى. فقد يظن المربي أن ابنه سيئ أو متعب أو لا يستمع لنصائحه، وفي الحقيقة ليس سيئًا ولا متعبًا ولا مجافيًا للنصائح؛ إنما هو غيرك ومختلف عنك، وأنت أيها المربي تسيره وفق طباعك وأنت تظنها أسلوبًا للتربية.\n\nوختامًا: التربية أصعب من الفيزياء النووية.'},
      {member:'عبدالله صائغ العوفي',title:'في الطريق إلى نادي جليس',date:'١٨/٥/٢٠٢٤',body:'بقي على بداية جلسة مناقشة الكتاب ساعتان، شرعت في الاستعداد للذهاب إلى النادي. أخذت الكتاب المقرر للمناقشة بعد أن انتهيت من قراءته، وبداخله بعض التعليقات على الجمل والعبارات المميزة والاقتباسات الجميلة، وبعض أرقام الصفحات والملاحظات والخربشات على هامش صفحاته.\n\nحملت بيدي الأخرى حقيبة اعتدت أن أحملها معي، وبداخلها بعض الأقلام ومذكرة تسجيل صغيرة وقلم إضاءة أستعين به على إضاءة بعض الجمل وفقرات الكتب، وبعض قطع الحلوى أتسلى بها في طريقي إلى النادي مع كوب قهوة تداعب أنفاسي رائحتها أثناء الطريق.\n\nسلكت الطريق باتجاه مدينة العلم والأدب والمعرفة، مدينة الأدب والأدباء بريدة، التي تبعد عن مكان إقامتي قرابة مئتي كيلومتر ذهابًا وإيابًا. ومددت يدي إلى جهاز التسجيل لأستمع إلى مادة صوتية حول موضوع كتاب المناقشة، أعددتها مسبقًا للإثراء والاستزادة، مستغلًا وقت الطريق.\n\nوصلت إلى مقر النادي بوقت كاف قبل بداية الجلسة، وأنا أرى أعضاء النادي يتوافدون وخطاهم تسابق بعضها بعضًا، تعلو وجوههم ابتسامات الترحيب والاشتياق، ويتبادلون السلام والتحايا بفرحة غمرتها حلاوة اللقاء. استقبلنا قائد ورئيس النادي أخي وصديقي الأستاذ محمد الدبيخي، صاحب الوجه البشوش والابتسامة الجميلة، مرحبًا بالجميع.\n\nجلست في مكاني بجانب طاولة المناقشة، وأخذت أتأمل وجوه الحضور من الأعضاء، ولكل واحد منهم ذكرى جميلة تركت بصماتها على جدران ذاكرتي. منهم من أخذ بخيالنا من بلاد الشام مرورًا بشمال القارة الأفريقية ووقف بنا على ضفاف مضيق جبل طارق، ومنهم من أبحر بنا في بحر العقيدة والتوحيد، ومنهم من أنار عقولنا بأسمار قانونية، ومنهم من أمتعنا بأمسيات أدبية جاحظية.\n\nبدأ محاور اللقاء جلسة النقاش مرحبًا بالحضور، ولم نمكث طويلًا إلا وفاح عبير الأعضاء من أفواههم وعطرت أرجاء المكان؛ تعليق من هنا، واقتباس من آخر، ونقد وتساؤل. وبعد مرور ساعة من الوقت - ويا أجملها من ساعة - انتهت جلسة النقاش التي أحياها وأثراها أعضاء وأصدقاء النادي مودعين بعضهم بعضًا على أمل لقاء آخر.\n\nعرجت إلى مركبتي لأعود إلى بلد إقامتي. وكعادة أي سالك طريق بلا مرافق، لا يخلو من شرود ذهني يستعيد به بعض الذكريات، خصوصًا الجميلة منها. ما زلت أستعيد ذكريات أول يوم التحقت به في النادي والأمسيات التي حضرتها والصداقات التي كسبتها، شاكرًا الله وممتنًا له أن وفقني بصحبة وجوه نيرة رائعة وكريمة تجاوزت صداقتهم إطار النادي إلى مشاركتي مرضي وأفراحي وأحزاني، ومنهم من وصل به الحال إلى الاطمئنان على وصولي لبيتي بعد نهاية كل لقاء.\n\nختمت ذلك اليوم بتساؤل: ماذا خبأت لي يا جليس في الأيام القادمة؟'},
      {member:'عبدالله صائغ العوفي',title:'بين عقلية الثراء وواقعنا المالي',date:'٢٣/٥/٢٠٢٤',body:'لا أخفيكم سرًا أني أول ما تقرر الكتاب لجلسة المناقشة القادمة لا تكاد الفرحة تحملني، خصوصًا أن الكتاب يتعلق بالمال. دفعتني الحماسة لاقتناء الكتاب وانطلقت لأقرب مكتبة، وما أن وقعت عيني عليه وأمسكت به بين يدي كأنما حصلت على كنز من كنوز بابل.\n\nعدت أدراجي للبيت متلهفًا لقراءة الكتاب، وكان الغرض التعرف على عقلية الثراء المالي ومقدار نصيبي منه ولو كان قدرًا بسيطًا. وما أن تعمقت بصفحاته أخذت رويدًا رويدًا أرفع حاجبًا وأخفض آخر، تصاحبها مطات شفاه تحمل علامات استفهام وتعجب مما جاء في الكتاب.\n\nوعلى مروري على قاعدة الأعشار وتوزيع الدخل بدأت تتلاشى احتمالية القدر الذي كنت أظن أنني أحظى به. اكتشفت أن بيني وبين عقلية الثراء بونًا شاسعًا، أنا في واد والثراء في واد، ولست حول الحمى. وكما يقال بالعامية: داج، ومرادفها ضايع. اكتشفت أني لا عشرًا ادخرت ولا عشران سددت به الدين؛ بل فاق العشران ثلاثة أعشار، والأعشار المتبقية من الدخل في فوضى عارمة ما بين ضروري ورغبة، وكانت الثانية الأكبر حظًا. واكتشفت أني أعمل على قاعدة: «اصرف ما في الجيب يأتيك ما في الغيب».\n\nوما أن تعمقت بالكتاب وتأملت ما جاء فيه، أخذ الضباب الحائل بيني وبين عقلية الثراء يتلاشى شيئًا فشيئًا وبدأت تظهر لي معالم العقلية وطرق الحصول عليها. أخذت أعاود قراءة الدروس والقواعد لزيادة الفهم والعمل بها، إلى أن دفعني ذلك إلى عمل نماذج عملية محاكية للقواعد الواردة، وسأشاركها معكم إذا أسعفني الوقت والظرف في المجموعة أو في جلسة المناقشة. وقريبًا إن شاء الله سأرفع الحظر في هاتفي عن الديانة وأسددهم واحدًا تلو الآخر.'},
      {member:'عبدالله صائغ العوفي',title:'في المكتبة: متى سأقرأ كل هذه الكتب؟',date:'٢/٩/٢٠٢٤',body:'اعتدت قبل ذهابي إلى المكتبة لشراء كتاب الأسبوع أن أحدد في أي مجال سأقرأ، وما هي الكتب التي في ذلك المجال، ومدى احتياجي للقراءة فيه. أطلع على تقييمات الكتب والتوصيات وتعليقات من سبقني بالقراءة إلى أن ترجح كفة أحد الكتب، ومن ثم أذهب للمكتبة لاقتنائه.\n\nوأحيانًا أذهب إلى المكتبة بدافع الرغبة لشراء كتاب جديد دون تحديد مجال القراءة، علني أصطاد كتابًا أو يصطادني، وغالبًا ما أكون أنا الفريسة واقعًا بشباك عنوان جميل أو ألوان غلاف كتاب براقة.\n\nوقبل أن أذهب إلى صندوق المحاسبة أتأمل الكتب المصفوفة على الأرفف، متنقلًا بنظري هنا وهناك متفحصًا عناوين الكتب وتصنيفاتها وخطاي تعبر الممرات واحدًا تلو الآخر. وما أن أصل لنهاية آخر ممر إلا وأستدير وآخذ نظرة عامة على الكتب، وبداخلي سؤال يصاحبه شعور محبط: متى سأقرأ كل هذه الكتب حتى وإن استطعت اقتناءها كلها؟\n\nأصوب نظرة إلى الكتاب الذي بين يدي، وما هو إلا قطرة في محيط من الكتب! كم من الوقت والعمر أحتاجه لقراءة كل تلك الكتب؟ أحيانًا أتسلح برغبتي الجامحة لقراءة الكثير من الكتب، إلا أن هذه الرغبة لا تدوم طويلًا وتنهار عندما أرى أكوام الكتب المتراكمة في الكثير من المكتبات، وأن فكرة قراءة جميع الكتب ضرب من الجنون.\n\nحاولت أن أصرف ذهني عن هذا السؤال في كل مرة حتى لا أصاب بإحباط كما في المرات السابقة. وبينما كنت أبحث عن مخرج، انبثق في عقلي سؤال خفف من وطأة الإحباط على نفسي: هل قرأ جميع الأدباء والمفكرين والعلماء والمؤلفين والكتاب جميع الكتب؟ لا أعتقد.\n\nهنا تنفست الصعداء وهدأت نفسي واهتزت قواعد الإحباط، ومضيت في أمري لأستمتع بكتاب الأسبوع. سؤال لأعضاء النادي: هل سبق لأحدكم أن وقع بنفس الشعور؟ وكيف تعامل معه؟'},
      {member:'عادل بن عبدالله الكبيّر',title:'الخليفة الإمام الحكم المستنصر بالله',date:'٣/٦/٢٠٢٤',body:'الخليفة الأموي الحكم المستنصر بالله بويع له بالخلافة في الثالث من رمضان سنة ٣٥٠هـ، وبلغت الأندلس في زمانه قمة مجدها وتقدمها الحضاري.\n\nلن أتحدث عن الخليفة الحكم كحاكم للأندلس، ولا عن غزواته العظيمة أو الرخاء الاقتصادي والتقدم العمراني في زمانه، بل سيكون الحديث عن العالم الفقيه المؤرخ النسابة الأديب الحكم المستنصر بالله.\n\nجمع الحكم بين شرف العلم وشرف النسب؛ فهو من أفضل العرب ومن قريش: الحكم بن عبدالرحمن بن محمد بن عبدالله بن محمد بن عبدالرحمن بن الحكم بن هشام بن عبدالرحمن الداخل بن معاوية بن هشام بن عبدالملك بن مروان بن الحكم بن أبي العاص بن أمية.\n\nكان اهتمام الخليفة الناصر وحبه لابنه الحكم عظيمًا، فحرص على تنشئته أفضل تنشئة، وخصص لتأديبه وتعليمه ثلاثة من كبار علماء زمانه: الأديب عثمان بن نصر بن عبدالله القيسي، والنحوي هشام بن الوليد بن محمد الغافقي، والنحوي محمد بن إسماعيل القرطبي. فنشأ الحكم محبًا للعلم والعلماء، مكرمًا لهم، يحضر مجالسهم ويسمع منهم ويروي عنهم.\n\nتخصص الحكم في عدة علوم كالفقه والحديث والتاريخ والأنساب والشعر، وكان رأسًا بها ثقة يأخذ عنه العلماء. ويعتبر أكثر الخلفاء حبًا للعلم والعلماء وحرصًا على جمع الكتب من مختلف البلدان. يقول الحافظ ابن كثير عنه: «الحكم المستنصر بالله، كان عالمًا بالفقه والخلاف والتواريخ».\n\nكان عظيم الهمة حريصًا على أخذ العلم من كبار علماء زمانه المتبحرين في شتى الفنون. ومن شيوخه: أحمد بن دحيم بن خليل القرطبي، وتميم بن محمد بن أحمد التميمي، وثابت بن قاسم بن ثابت السرقسطي، وزكريا بن خطاب بن إسماعيل الكلبي التطيلي، ومحمد بن مروان بن رزيق البطليوسي. ويقول الذهبي بعد أن ذكر بعض شيوخه: «كتب عن خلق كثير سواهم».\n\nوكان للحكم مكتبة عظيمة فيها آلاف الكتب التي جمعها من كل مكان، فكان يرسل موظفيه لمختلف البلدان ليشتروا له جديد الكتب مهما كان ثمنها. ولا يوجد كتاب في مكتبته العظيمة إلا عليه تعليقاته وملاحظاته، وهذا دليل كثرة قراءته وعظيم علمه. هذه لمحة مختصرة عن جانب من جوانب هذا الخليفة العظيم، وإلا فالحديث عنه يطول، وبإذن الله سأتحدث مستقبلًا عن مكتبته واهتماماته العلمية.'},
      {member:'عادل بن عبدالله الكبيّر',title:'المقاومة الأندلسية وقصة القائد سليم المنصور',date:'٣٠/٧/٢٠٢٤',body:'بعد سقوط غرناطة سنة ٨٩٧هـ/١٤٩٢م عاش الموريسكيون أبشع أنواع العذاب والاضطهاد، وخان الإسبان في ذلك الوقت كل العهود والمواثيق.\n\nلم يكن أمام الباقين من أهل الأندلس إلا الثورة والمقاومة في محاولة أخيرة لإنقاذ الأندلس وحفظ الدين والنفس والعرض والوطن. وعندما نتحدث عن ثورة الموريسكيين تحضر لأذهاننا ثورة جبال غرناطة المعروفة بالبشرات وقائدها محمد بن أمية، وهي ثورة قوية كان لها تأثير كبير، ولكنها لم تكن الوحيدة.\n\nثار الأندلسيون، الذين عرفوا بالموريسكيين، في تلك الفترة في أماكن عديدة ومدن مختلفة في الجنوب الأندلسي، وكان لكل ثورة تأثيرها وتضحياتها الباسلة. ومن هذه الثورات الخالدة ثورة ضاحية بني وزير (Benaguacil) في منطقة بلنسية، حيث وقعت عدة اشتباكات سنة ٩٢٢هـ/١٥٢٦م بين الأهالي وممثلي الكنيسة ورفضوا التجاوب معهم.\n\nانضم إلى هؤلاء الثوار المزيد من سكان المدن والقرى المحيطة، ولما كثر عددهم توجهوا إلى حصن بولبة (Polopie) وقاتلوا القوات الحكومية الإسبانية بكل شجاعة وحققوا انتصارات كبيرة، ولكن قلة المؤن والأسلحة اضطرت الثوار للانسحاب والاتجاه إلى مدينة سيجوربة (Segorbe)، ثم الاعتصام في جبال (Sierra de Espadan).\n\nفي تلك المرحلة اجتمع الثوار الأبطال وقرروا انتخاب ملك عليهم اسمه سليم المنصور. كان هذا القائد قويًا ونشيطًا، فقام بحفر العديد من الخنادق العميقة وبناء الأسوار لتكون عائقًا أمام العدو.\n\nاستمر الثوار بمقاومة العدو الظالم وتسببوا بخسائر كبيرة للسلطات الإسبانية، مما أجبر الملك شارل الأول على الحضور إلى بلنسية ليشرف على هذه الحرب. دافع الثوار بقيادة سليم المنصور دفاعًا مستميتًا عن مواقعهم وقاتلوا القوات الإسبانية التي تفوقهم عددًا وعدة، واضطر الملك الإسباني أن يستعين بالجيش الألماني حتى يواجه هؤلاء الأبطال. كان عدد الجيش الإسباني ثمانية آلاف، أما الثوار فكانوا ثلاثة آلاف فقط.\n\nفي الهجوم الأخير ثبت الثوار ثبات الشجعان وقاتلوا العدو بكل بسالة، ولكنهم خسروا واستشهد القائد سليم المنصور وسلاحه بيده، واستشهد معه أكثر من ألفي مقاتل. كانت هذه صفحة من صفحات البطولة والشجاعة سطرها الأندلسيون بدمائهم الزكية دفاعًا عن وطنهم وأعراضهم ودينهم. رحمهم الله وعوضهم بالفردوس الأعلى من الجنة. وحتى لا ننسى، هذه قصة القائد سليم المنصور ورفاقه الأبطال.'},
      {member:'عادل بن عبدالله الكبيّر',title:'تأمل أمام قصور الحمراء في ليالي غرناطة',date:'٢١/٨/٢٠٢٤',body:'في غرناطة الجميلة كنت عندما أذهب للنوم وأتمدد على فراشي يقابلني هذا المنظر البديع، منظر قصور مدينة الحمراء وهي تتوشح ظلام الليل وتتزين سماؤها بالنجوم اللامعة والهدوء سيد المكان.\n\nومع هذا الهدوء ونسمات هواء ليل غرناطة الباردة وعيني تراقب التاريخ والأثر، تراقب الحمراء، ذهب فكري بعيدًا وسألت: كيف كانت ليالي غرناطة؟ كيف كانت ليالي الملوك والسلاطين؟ كيف كانت أسوار غرناطة ورايات بني نصر متزينة بـ«ولا غالب إلا الله» ترفرف فوقها؟\n\nتخيلت الحرس بحرابهم يقفون بكل عزة وشموخ وعيونهم تراقب كل حركة وآذانهم تسمع كل همسة. تخيلت السلطان أبا الحجاج قائمًا لله ويدعو بضراعة أن يحفظ مملكته، وتخيلت السلطان الغني بالله وهو يقلب أوراقه وفيها خطط بناء بهو السباع.\n\nتخيلت الوزير لسان الدين بن الخطيب وهو يتجول بين أروقة القصور ويداه خلف ظهره، متأملًا مفكرًا، لا صاحب له إلا ضوء القمر. تخيلت معاناته مع مرض الأرق والخفقان والهلع. تخيلته يمشي بين حدائق القصور ليستنشق هواء نقيًا، ولا يقطع هدوء ليله إلا صوت نافورة الماء، ويهز رأسه أسفًا أمام عجزه عن إيجاد حل لهذا المرض، وهو الطبيب الذي يداوي غيره.\n\nوفجأة انقطع النور وعم الظلام! عدت لواقعي بعد أن أغلق المسؤولون عن إدارة المدينة أنوار مدينة الحمراء، وبعدها غرقت في نوم عميق.'},
      {member:'محمد بن عبدالمحسن الضويان',title:'التعبيرات الجمالية وتأثر الكاتب ببيئته',date:'٦/١/٢٠٢٤',body:'«البيئة الخصبة لنمو حشائش المشاعر المزعجة»\n\nتستوقفني هذه التعبيرات الجمالية أحيانًا وأنا أقرأ لبعض المؤلفين، وتطرح على ذهني عددًا من التساؤلات: إلى أي مدى نحن متأثرون فيما نهتم به، أو ما نعمله ونمارسه بشكل يومي؟\n\n«نمو حشائش المشاعر المزعجة» معنى مستوحى من الحقول الزراعية، من المزارع، من البيئة الزراعية. وغالب الظن أن هذا المعنى - إذا كان مولدًا من الكاتب نفسه وليس مستعارًا - أنه يعبر عن اهتمام الكاتب بهذه البيئة، فتجد أن مثل هذه التعبيرات تطغى على الأسلوب بشكل تلقائي. وقس على ذلك من له اهتمام بالأمور التقنية أو الميكانيكية أو الطبخ مثلًا، ستجد التعبيرات والمعاني متولدة من تلك البيئات المختلفة.\n\nهذا النوع من التأمل في المقروء يعطي للقراءة بعدًا جديدًا من المتعة، ويذهب بالذهن إلى تعبيرات جمالية مستوحاة من اهتماماتنا وتخصصاتنا، ويجعل للقراءة لذة لا تضاهيها لذة.\n\nكتبها: محمد الضويان - أبو أسامة.'},
      {member:'محمد بن عبدالمحسن الضويان',title:'هل يكفي أن يكون مصدر رزقك عملًا تهواه؟',date:'١٠/١/٢٠٢٤',body:'هذا سؤال جميل، فما أجمل أن يكون مصدر رزقك عملًا تهواه وتحبه.\n\nلكن أعتقد أن الإجابة عن مثل هذه الأسئلة تنطوي على شيء من المثالية؛ ذلك أن العمل الذي نقوم به خدمة للآخرين ويكون هو مصدر رزقك - سواء خدمات طبية أو تعليمية أو استشارية وغيرها - لا بد أن يصاحبه التزام بروتين معين واقتطاع من نفيس وقتك للقيام بهذا العمل، وهذا ثقيل على النفس أحيانًا.\n\nكما أن التزامك تجاه الآخرين يتخلله أوقات تمر فيها بظروف اجتماعية أو ذهنية تجعل من الوقت الذي يمضي في هذا العمل طويلًا، وتحول العمل المحبوب إلى عمل شاق نريد التخلص منه للراحة، وهذه طبيعة الدنيا والسعي فيها: كد وتعب، وطبعت على مكابدة المشاق.\n\nفرغم كون العمل الذي نقوم به محبوبًا للنفس، إلا أن الوقت الذي يمضي فيه قد نشعر بثقله أحيانًا، مما يجعل فكرة «أننا لا نشعر بالوقت الذي نمضيه فيها» غير واقعية عند التطبيق العملي.\n\nمحمد الضويان - أبو أسامة.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'انتقال الأرض المقدسة من بني إسرائيل إلى أمة محمد ﷺ',date:'٢٠/٦/٢٠٢٤',body:'يذكر أهل التاريخ أن نبي الله يعقوب كان في بادية فلسطين، وكان هو وغيره من الناس يعيشون في البلد نفسه. ثم انتقل نبي الله يعقوب وأبناؤه إلى نبي الله يوسف في مصر واستقروا فيها، وحصل لهم الاستضعاف في حكم فرعون حتى بعث الله موسى وفلق الله لهم البحر ووصلوا إلى سيناء، وأمرهم موسى بدخول الأرض المقدسة فلسطين وقتال الجبارين، فرفضوا وحصل لهم التيه أربعين سنة، ثم فتحوا واستوطنوا فلسطين.\n\nوتسلسلت الرسل في بني إسرائيل، وكان الجهاد مشروعًا من خروج بني إسرائيل من مصر مع موسى، فكانوا يقاتلون ويتوسعون في الأرض مع أنبيائهم وملوكهم حتى بلغ ملك نبي الله سليمان - وهو من بني إسرائيل - أغلب الأرض، ثم مع مر العصور تصغر وتنحسر أرضهم إلى أن بعث الله نبيه عيسى وأخبر قومه أنه آخر أنبياء بني إسرائيل، وأنه يبعث بعده نبي اسمه أحمد من نسل نبي الله إسماعيل يبعثه الله لكل الأمم. وقد أخبر الله أن من اتبع عيسى سيجعله الله فوق غيره من الأمم: ﴿وجاعل الذين اتبعوه فوق الذين كفروا إلى يوم القيامة﴾. واتباع عيسى يكون بتصديق أخباره، ومن جملتها الإيمان بمحمد ﷺ إذا بعث؛ فالعزة والفوقية لعيسى واتباعه من يوم بعث عيسى إلى أن بعث محمد، فصارت لمحمد ﷺ وأمته بعد بعثه إلى يوم القيامة، وقد مكن الله لأمة محمد من حدود الصين شرقًا إلى الأندلس غربًا، والأرض لله يورثها من يشاء.\n\nوكان أحبار اليهود والنصارى عندهم في كتبهم البشارة بمحمد ﷺ وصفته، وقد كانوا ينتظرونه ويعرفون مكان مبعثه. فلما بعث كفر اليهود به حسدًا لظنهم أنه سيبعث من بينهم فخرج من نسل العرب، وكفر النصارى لأطماع السياسة والحكم كما في قصة هرقل مع أبي سفيان، وإن كان كثير منهم دخلوا في الإسلام وقت الفتوحات لأن مبعث محمد مصدق لما بين يديه من الكتب. ثم صار أحبار الطائفتين يحرفون في كتبهم النصوص التي لا يريدون ويضيفون أكاذيب من عندهم تعزز أطماعهم وبقاء مصالحهم الدنيوية.\n\nفتوارث اليهود في كتبهم أنهم ستكون لهم دولة في الأرض المقدسة فلسطين، وأنه سيخرج الرجل المنتظر (المشيخ) يقيم دولتهم، لكنهم اختلفوا: هل تقام الدولة قبل ثم يخرج، أو لا يقاتلون أبدًا ولا يقيمون دولة حتى يخرج فيقيم لهم دولتهم؟ فافترقوا فرقتين؛ منهم من طلب من بريطانيا توطينهم فلسطين لتقوم دولتهم ثم يخرج فيهم الرجل المنتظر، وبسبب هذا نشأت إسرائيل، ومنهم من يخطئ إسرائيل ويقول: انتظروا إلى أن يخرج المنتظر فيقيم دولتنا.\n\nهذا سرد مختصر يعتريه الخطأ والنسيان، ومن أراد التفصيل يرجع لكتاب البداية والنهاية وسلسلة رواية رحلة إبراهام.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'كيف تتجاوز إحباط تكدس الكتب وكثرة العلوم؟',date:'٢/٩/٢٠٢٤',body:'كل من جعل القراءة مبدأ عنده إلى أن يموت من المؤكد أن يلم به هذا الشعور. يخفف شدة هذا الشعور إذا قرأت الكتب وأنت معتمد على ركنين مهمين.\n\nالأول: أن تنظر لجميع العلوم النافعة ثم ترتبها ترتيبًا تنازليًا وفق الأولوية بالنسبة إليك؛ فهناك علم تريد أن تتخصص به، وبعده علم تريد أن تكون متوسطًا فيه، وآخر يكفيك أن تتعلم أساسياته، والذي بعده مهم أن تكون عندك ثقافة عامة، والذي يليه يكفي فهم عن ماذا يتكلم، وهناك علوم إن كان في العمر بقية تطلع عليها. ويكون تحديد الأولوية والأهمية وفق اعتبارات كثيرة، منها الأهمية الدينية ونفعه في آخرة المرء ومقدار نفع هذا العلم للقارئ وللمسلمين، كذلك المنفعة الدنيوية وميول النفس وما تهوى من أصناف العلوم وغيرها من الاعتبارات.\n\nالركن الثاني: أن تعلم أن في كل باب من أبواب العلم ألفت كتب كثيرة، ولو نظرت في محتواها وقارنت بينها وجدت خطوطها العريضة متفقة وغالب التفاصيل متشابهة، لكن هناك فروقات دقيقة تميز كل كتاب أو مؤلف عن شبيهه. وهنا تستعين بأصحاب الخبرة والمجربين قبلك فيختصرون لك الطريق، فيقولون لك: اقرأ هذين الكتابين تجمع وتختصر لك أغلب الكتب المؤلفة في هذا الباب.\n\nولا يخفى أن لكل علم مستويات؛ فيكفيك في مستوى المبتدئين هذا الكتاب، وفي المتوسط هذه الكتب الثلاثة، وهكذا. ويبقى كما ذكرنا سابقًا أن الاهتمامات والميول هي التي تحدد التفاصيل؛ فعلم التاريخ في الأساس قصة واحدة، ولكن هناك كتب تعتمد على ما صح من الروايات، وأخرى تذكر لك كل ما قيل، وأخرى تركز على الجانب الاقتصادي أو السياسي أو العلمي في تلك الحقبة... فتختار منها ما يوافق اهتماماتك. وهكذا يكون سقط عن كاهلك كثير من كتب الدنيا.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'تأمل تربوي: الأب الهادي والأب الشديد وأثر البيئة',date:'٨/٩/٢٠٢٤',body:'الأب الهادي يفرض التعاليم والأخلاق بالإقناع والاستدلال مع شيء من السلطة، أما الأب الشديد فالأكثر يتبنى سياسة الفرض والإجبار، وإذا سأل الابن لماذا كان الجواب: لأن هذا صح وهذا خطأ فقط.\n\nفالابن عندما يصل المراهقة ويستطيع الاستقلال، فكل ما فرض عليه أبوه ليس إلا أعباء وأشياء تخالف هوى النفس المحبوب، والصواب ما أعجبني وما كان غالبية المجتمع يثني عليه ويؤيده.\n\nأحد معارفي كان رجلًا طالب علم ومربيًا، ووفق بزوجة وإخوان صالحين، فنشأت ذريته وخاصة البنات على حب الستر والحياء. وكان كل مسألة يريد أمرهم بها يعرض عليهم الأدلة الشرعية فيها وفضلها وكلام العلماء عنها، فيقبلونها عن قناعة واعتزاز.\n\nالعجيب أن لعائلته اجتماعًا سنويًا، والمشكلة أن بعض النساء البعيدات القرابة في لباسهن تعرٍ وفساد في أخلاقهن، فكان وقت الاجتماع السنوي يذهب بأبنائه وبناته في رحلة أو سفرة تعويضًا عن ذهابهم للاجتماع، ويخبرهن أنه لا يرضى بأن يذهبن لعدم مناسبة بيئة الحاضرين لنا، ويذكر لهن بعض التفاصيل الخاطئة في تلك البيئة. لكن في خاطر البنات أن يذهبن للاجتماع ويشعرن بالمبالغة في وصف أبيهم.\n\nفقدر الله أنه في أحد الاجتماعات السنوية لم تسمح له الظروف بتعويضهن برحلة، وطلبت البنات الذهاب للاجتماع فسمح بذلك. ولما دخلن على النساء الحاضرات تفاجأن بلباس بعضهن، وظهر من بعض الحاضرات ازدراء لعباءاتهن المحتشمة، وأيقنّ أن ما قاله أبوهن صحيح، وأن ما يرينه مخالف لما تربين عليه عن قناعة، فاتصلن على من أحضرهن ورجعن معه بدون أن يقول لهن أبوهن شيئًا.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'في تفتيق العقول بقراءة كتب عباقرة الشريعة',date:'١٢/٣/٢٠٢٥',body:'على هامش لقاء الليلة تناقشنا عن تطوير القدرات العقلية وما المجدي في ذلك، وأقول إن من أعظم ما يفتق العقول ويزيد قدرتها هو قراءة كتب عباقرة الشريعة، فتتعلم الربط والمقارنة والاستقراء والتحليل والاستنباط والتوقع، ويزيد الفهم والتصور والنقد والحجة والموازنة والترجيح بين الفاضل والمفضول أو أي المفاسد أخف، وسلسلة طويلة من العمليات العقلية، فيذهلك إتقانهم لأدق تفاصيلها. رحمهم الله وجمعنا بهم في جنات النعيم.'}
    ];

      {member:'محمد الدبيخي',title:'الذهن العامي والذهن البليغ',date:'٢٠/٩/٢٠٢٣',body:'ما فهمته من الكاتب:\n\nالذهن العامي يركز ويناقش الأحداث، أما الذهن البليغ فيركز على الأفكار.\n\nالذهن العامي يتحدث عما يراه، أما الذهن البليغ فيحلل ما يراه.\n\nالذهن العامي ينقل كل ما يقال، والذهن البليغ يبدع الفكرة والمقولة فتنقل عنه.'},
      {member:'محمد الدبيخي',title:'لماذا جلسات النقاش القرائي؟',date:'٢١/٩/٢٠٢٣',body:'لماذا جلسات النقاش؟\n١- ترسيخ أهم مفاهيم الكتاب من خلال الاستماع والحوار حولها، فكأنك قرأت الكتاب أكثر من مرة.\n٢- تنمية مهارات الحوار والإقناع من خلال المشاركة في النقاش.\n٣- تنمية التفكير النقدي بسماع تفسيرات متعددة حول الكتاب وموضوعه.\n٤- التشجيع على قراءة الكتاب في المدة المحددة.'},
      {member:'محمد الدبيخي',title:'أثر فهم المغالطات المنطقية في كشف الخلل',date:'٢٢/٩/٢٠٢٣',body:'أحيانًا تدرك أن هذه المقولة المنتشرة خاطئة لكنك لا تستطيع تحديد مكمن الضعف فيها الذي لو حددته لسقطت المقولة جملة وتفصيلًا؛ فهم المغالطات يسلط الضوء على مكامن الخلل.'},
      {member:'محمد الدبيخي',title:'لا نخادع أنفسنا: الوقت والقراءة',date:'٩/١٢/٢٠٢٣',body:'مقطع أعجبني: لا نخادع أنفسنا.\n\nالدكتور صالح الأنصاري يتكلم عن تخصيص وقت للمشي: «لا تقل أنا ما عندي وقت، لكن قل أنا ما خصصت وقت».\n\nوهذه القاعدة تنطبق على كل مجالات الحياة، كالقراءة مثلًا؛ لم نخصص وقتًا لما نريد، فضاعت كثير من أوقاتنا في الجوال.'},
      {member:'محمد الدبيخي',title:'قراءة نقدية في ورقة سخرية الجاحظ في كتابه البخلاء',date:'٣١/١٢/٢٠٢٣',body:'ملف رائع. هذه الورقة التي ألقى منها الغالي محمد العمر في لقاء جليس الماضي: سخرية الجاحظ في كتابه البخلاء.\n\nلفتت انتباهي ليس بما فيها من تقييد ومعلومات رائعة، بل في الطريقة التي كتبت بها؛ فالكاتب لم يقيد اقتباسات مجردة، بل سجل تأملات جاءت من هضم ومعالجة ما قرأه، وهي تنم عن استيعاب وإدراك عالٍ، فأصبحت في نظري مثالًا نموذجيًا في القراءة النقدية. أستطيع أن أسميها: تأملات ومراجعات عقلية ولغوية واجتماعية في كتاب البخلاء للجاحظ.'},
      {member:'محمد الدبيخي',title:'قراءة في كتاب: مفاتح إقامة الصلاة',date:'١٠/٢/٢٠٢٤',body:'مقتطفات من كتاب مفاتح إقامة الصلاة.\n\nجميعنا يعلم أهمية الصلاة ومكانتها وفضلها، لكن السؤال الذي يدور في ذهن الكثير: هل يصح أن تسمى صلاتنا صلاة؟ هل قلوبنا وأرواحنا حاضرة في الصلاة؟ هل نشتاق إليها، ولماذا نتأخر بالحضور لها؟ لماذا نتضجر عندما يطيل الإمام الصلاة؟ ولماذا لا تنهانا صلاتنا عن الفحشاء والمنكر؟\n\nهذا الكتاب يجيب على هذه الأسئلة وغيرها للوصول إلى إقامة الصلاة الخاشعة. حري بكل من يشعر بتقصير في الصلاة والخشوع فيها أن يعيد القراءة في هذا الموضوع ويجاهد نفسه على تطبيق ما فيه.'},
      {member:'محمد الدبيخي',title:'خاطرة: القراءة من السعادة (شجرة المعرفة)',date:'٤/٥/٢٠٢٤',body:'القراءة من السعادة، وذلك عندما يصل القارئ إلى مرحلة الفرح بالمعرفة؛ فكلما قرأ معلومة أو معنى جديدًا انتشأ في داخله سعادة وحبورًا، ويشعر بأنه نبتت في داخله شجرة ظليلة، حتى تتكون لديه غابة من المعرفة يستظل بها متى شاء، وليس أن يعيش في صحراء جرداء خالية من الظل والجمال.'},
      {member:'محمد الدبيخي',title:'خاطرة: القراءة المتأنية في الغابة (جليسيات)',date:'٢٦/٥/٢٠٢٤',body:'أتى إلى الغابة ليستمتع بالطبيعة، لكنه كان يقود سيارته مسرعًا بين المروج والأنهار، ففاتته مناظر جميلة مر بها مرور الكرام. إنه ذلك القارئ الذي يقرأ قراءة سريعة في كتاب مثمر. استمتع وتأن بالقراءة لتجعل فرصة للمعاني الجميلة أن تنسكب في أعماق نفسك. — جليسيات.'},
      {member:'عبدالرحمن عمر الصعب',title:'تجربته مع القراءة الإلكترونية',date:'١٨/١/٢٠٢٥',body:'أما عن طريقتي في قراءة الكتب الإلكترونية وأفضل البرامج لتصفحها، فقد وجدت أن الإجابة على هذين السؤالين تتداخل بشكل كبير مما دفعني لدمجهما في حديث واحد. في البداية كنت أقرأ من الجوال أو الآيباد، لكن بصراحة لم تكن تلك التجربة التي أبحث عنها؛ شعرت دائمًا بأن ثمة عنصرًا مفقودًا. بعدها انتقلت إلى جهاز الكندل، ولفترة كان رفيقًا جيدًا في القراءة، لكنه بقي مقيدًا بنظام مغلق يحد من طرق الإتيان بالكتاب ومن حرية التعامل مع الكتب والمحتويات.\n\nثم جاء الاكتشاف الحقيقي مع جهاز بوك ٥ من بوكس، والذي جمع كل ما أحتاجه في جهاز واحد، أتاح لي تحميل ما أريد من الكتب بسهولة، وعاش معي ببطارية تدوم لأسابيع طويلة، مما أعطاني تجربة قراءة متواصلة دون انقطاع. والأجمل من ذلك كله أن الجهاز يجعلني أشعر وكأني أقلب صفحات كتاب حقيقي مع إمكانية تدوين الملاحظات بالقلم، مما أضفى بعدًا جديدًا على تجربتي.\n\nومع كل هذه المزايا التقنية الرائعة، يظل الكتاب الورقي متربعًا على عرش القراءة؛ فلا شيء يضاهي تلك اللحظات التي تلامس فيها الورق، أو تستنشق عبق الصفحات، أو تستمتع بصوت تقليبها. إنها تجربة خاصة لا يستطيع أي جهاز مهما بلغ من تطور أن ينتزعها أو يحل محلها.'},
      {member:'أسامة الفلاج',title:'القراءة بين الجِلْدتين وفن القفز المفيد',date:'٢٦/٨/٢٠٢٥',body:'وليتني كنت أعرف هذا من سنين؛ فأنا من أصحاب «الجلدتين»، لا تهدأ لي نفس ولا يطيب لي خاطر إلا بجس الخدين والتقام ما بينهما؛ أما غير هذا فلا أسميه إلا اطلاعًا، ولا أحل لنفسي وصفه بالقراءة.\n\nوقد تبين لي غلطي، وعلى الأخص لما قرأت عن كبار القراء، أمثال العقاد، أنهم يستجيزون هذا، بل ويعدونه لونًا من الخبرة وشكلًا من البراعة؛ وحسبك تشبيه العقاد قراءته بعض الكتب بصاحب البيت الذي يعرف أن غرضه في هذه الغرفة فيكتفي بالتوجه إليها ولا يعدوها لغيرها.\n\nولا يخفى عليك - أدامك الله - ما في هذا من حفظ الوقت وتثمير الجهد.'},
      {member:'أسامة الفلاج',title:'كلام الأقران وموازين الإنصاف',date:'٢٧/٨/٢٠٢٥',body:'قال الحافظ الذهبي: «كلام الأقران بعضهم في بعض لا يعبأ به، لا سيما إذا لاح لك أنه لعداوة أو لمذهب أو لحسد، وما ينجو منه إلا من عصم الله، وما علمت أن عصرًا من العصور سلم أهله من ذلك سوى الأنبياء والصديقين، ولو شئت لسردت من ذلك كراريس».\n\nوهذا كلام وجيز اختصر أمورًا عزيزة؛ منها أن الأقران لا يكاد يسلم بعضهم من بعض، فهم أبدًا في سباق وتعقب، ومنها أن العاقل لا يكترث بما يقال بحقه مدحًا أو ذمًا، وإنما العبرة بالموازين. ومنها أن يبصر الإنسان من نفسه ما يحس به إزاء غيره، فيعلم أن محبته وكرهه ومدحه وذمه ليست دائمًا على وفق العدل ونهج الإنصاف، إنما هي خلجات قد لا تفسر أحيانًا؛ والإنسان إذا أعطي ما يشتهي أحب، وإن حجب عن مراده كره.'},
      {member:'أسامة الفلاج',title:'تباين الأذواق القرائية وسعة عذر القراء',date:'٧/٩/٢٠٢٥',body:'جمع الكاتب الكريم فهد الجريوي جملًا منتخبة من السير الذاتية في كتابه المكتظ بالأعلام وذكرياتهم، ممزوجة بآلامهم وجراحاتهم وأفراحهم وتطلعاتهم، ويذكر الكاتب عن نفسه أنه جمع ألف عنوان أو تزيد.\n\nفي مفتتح كتابه سمى أفضل ما مر به من سير، ومع تعداد السير واحدة بعد أخرى تعجبت من تباين أذواق الناس ومشاربهم؛ فبعض ما استملحه الكاتب لم أجد فيه ما ينتخب من بين ألف عنوان، بل بعضه قرأته على مضض والآخر لم أطق المسير معه، وهو الرجل الخبير الذي عالج صنوف السير والمذكرات وطويت تحت يده عشرات الآلاف من الصفحات.\n\nوهذا دليل يرشد إلى فسحة الأذواق وسعة باحتها؛ وما كان مرضيًا اليوم قد لا يؤنس غدًا، وما أبهج فلانًا قد أسخط أخاه، فالعذر واسع بين الكتب وأهلها.'},
      {member:'أسامة الفلاج',title:'الإحاطة بأصول الشريعة ومذاهب الفقه',date:'١٦/٩/٢٠٢٥',body:'الإحاطة بأصول الشريعة تمنع من تعارضها وترفع عن المكلفين الحرج والمشقة؛ فمن لم يحط بالأصول حرم التصرف فيها. وهذه الأصول متفاوتة المنازع مختلفة الرتب، فمنازعها نصية وإجماعية ولغوية وقياسية ومصلحية وغيرها، ورتبها ليست على نمط واحد؛ فمنها ما حقه التقديم ومنها ما حقه التأخير ومنها ما يقدم في صورة ويؤخر في أخرى.\n\nوهذا النظم للأصول الحاكم على الاستدلال في آحاد المسائل شرطه العموم في الأحوال والاطراد في الآثار وملاءمة المصلحة، وقد ضبطت هذه الأصول في مدارس كبرى لا يسع الخروج منها، وإلا وقع الناظر في تناقض الأحكام أو تفويت مصالح الأنام.'},
      {member:'أسامة الفلاج',title:'حقيقة التواضع وشح النفوس في الاعتراف به',date:'٢٢/٩/٢٠٢٥',body:'التواضع خلق يتوسط إكبار النفس وإذلالها، فلا يجعل النفس سامية على الحق غامطة لأقدار الخلق، وليس هو ذلك الإخضاع للنفس السافل بها الجاحد فضلها؛ إنما هو بصيرة بقصور النفس وعلاتها، وإقرار بأن لها وعليها، ثم إنفاذ تلك البصيرة وإظهار ذلك الإقرار حتى تتجلى على جوارحه. ولا يكون التواضع سمة له إن أمضاها في زمان دون زمان أو أبداها في مكان دون غيره؛ بل حقيقة الصفة أن تترسخ في النفس حتى تصدر أفعاله بعد ذلك طيعة دون تكلف، بلا احتياج إلى فكر أو روية.\n\nومن العجب أن ترى إنسانًا لا تسخو نفسه أن يصف آخر بالتواضع حتى يراه في غاية التنزل له والخضوع بين يديه، وإن رأى أمارة لعزة أو لمحة من إباء انكمشت نفسه وغلت يده حتى يشح عليه بأدنى نسب للتواضع.'},
      {member:'أسامة الفلاج',title:'الفرق الجوهري بين فقه الخلاف والفقه المقارن',date:'٨/١/٢٠٢٦',body:'يشتبه على بعض الدارسين والباحثين نوعان من الفقه: فقه الخلاف والفقه المقارن، وبينهما فرق جوهري لا يجعل أحدهما مرادفًا للآخر. ففقه الخلاف الذي نجده في كتب الخلاف العالي يناقش أدلة المذاهب الأخرى ويثبت أحقية مذهب المناقش وفق أسس مذهبية تعتمد أصول المذهب وقواعده.\n\nأما الفقه المقارن فلا ينطلق من مذهب محدد، إنما يعتمد الترجيح المطلق؛ فهو ينظر لكل مسألة بدليلها الخاص أو قاعدتها الخاصة أو ما يدانيها من أقيسة قريبة دون استصحاب للأصول المرعية والقواعد الكلية الحاكمة لكل مذهب؛ وهذا يوقع الباحث في تناقضات أو تفاوتات في أحكامه من دون مستند.'},
      {member:'أسامة الفلاج',title:'خطة الإمام ابن حبان البستي في روضة العقلاء',date:'٢/٨/٢٠٢٦',body:'من الملاحظ على المحدث المتفنن، أحد أذكياء العالم أبي حاتم ابن حبان البستي رحمه الله، في كتابه «روضة العقلاء ونزهة الفضلاء»، تصديره فصوله بالأحاديث النبوية ولا يكاد يستشهد بآية إلا عرضًا أو في تضاعيف الكتاب، وتراك تطوي الفصل تلو الفصل دون تعريج عليها. وليس هذا إهمالًا منه حاشاه أو تقصيرًا، ولكن لكل شيخ مقصد، ولكل باحث غاية، ولكل صاحب صنعة ملحظ؛ فالإمام غلبت عليه صنعة الحديث فأراد أن يحشد من الأخبار ما استطاع، وأن يجمع من الآثار ما يفيد مقصده. وهذا طرف من تعاملات الأئمة ولحاظهم، حتى لا يتعجل القُصّر بالاستدراك على الكُمّل، وفي التنويه على خطة هذا الإمام تنبيه على غيره.'},
      {member:'أسامة الفلاج',title:'مفهوم الضمير ومنازل النفس في القرآن',date:'١/٩/٢٠٢٦',body:'ينتشر ذكر الضمير عند علماء الأخلاق وفلاسفتها بأنه ذلك الإحساس المؤنب لصاحبه والمذكر له حين يقترف فعلًا رذيلًا مناقضًا للفضيلة.\n\nوالضمير في الاستعمال العربي هو ما أخفاه الإنسان وستره، ومنه ما يروى عن بعض الصحابة رضي الله عنهم: «ما أضمر أحد شيئًا إلا ظهر على صفحات وجهه وفلتات لسانه».\n\nوالمصطلح الأوفق للضمير المستعمل عند علماء الأخلاق وفلاسفتها هو ما يعبر عنه القرآن بتسميته «النفس اللوامة»، ومنه استمد علماء السلوك والتزكية تقسيم النفس لعدة أقسام بحسب أحوالها لا بتعدد ذاتها؛ فجعلوا أقلها مرتبة وأرذلها النفس الأمارة بالسوء، وهي النفس التي تدعو صاحبها لعاقبة السوء، وللسوء طريقان: إما الجلب أو الحجب؛ أي جلب ما تشتهيه نفسه من الملذات الحسية، وهي لذات البدن ولذات الجاه والرئاسة، أو حجب ما يؤلمها بدفعه وإبعاده. فالجلب لا يكون إلا بالشهوة، والحجب لا يكون إلا بالغضب. فهاتان هما وسيلتا النفس الأمارة بالسوء: الهتك والفتك.\n\nوتأتي بعدها النفس اللوامة، وهي التي تحاسب صاحبها عما صدر منه وتقرعه وتذكره؛ فهي نفس شريفة أقسم الله تعالى بها، وتقوى وتشتد بالمحاسبة والاختلاء بالنفس وذكر الله تعالى، لا سيما الاستغفار والإنابة، وتضعف وتذبل عند الغافل والمتكبر عن سماع الحق والمحتقر لعباد الله والمعجب بنفسه المسوغ لها كل عمل.\n\nوهكذا تترقى النفس حتى تصل إلى النفس المطمئنة التي يقبلها الله في رجوعها إليه فيسبغ عليها السعادة الأبدية فتكون بذلك راضية مرضية. بلغنا الله وإياكم.'},
      {member:'أسامة الفلاج',title:'خاطرة أصولية: منزلة كتاب الموافقات للشاطبي',date:'٣/٩/٢٠٢٦',body:'الحمد لله على التمام والكمال.\n\nتعليق استبطنته في بداية شروعنا بقراءة مقدمات الموافقات للإمام الشاطبي، وقد آثرت تأخيره بعد استجلاء شيء من كلام المؤلف رحمه الله ليكون أوقع في النفس وأوفق لمقصده.\n\nللوقائع والمناهج أثر بيّن في إبراز عالم أو إشهار كتاب، وقد وقع أول نفخ لروح المتن الشاطبي على يد المرحوم محمد عبده الذي أوحى لتلميذه الشيخ عبدالله دراز إخراج الكتاب وتحقيقه والتعليق عليه، بل لم يكتف الشيخ دراز بهذا حتى قدمه على غيره متأسفًا على هجرانه؛ ثم راج الكتاب عند بعض علماء المغرب ممن يختطون خطة إصلاحية قريبة من خطة الشيخ محمد عبده.\n\nبعد ذلك لقي الكتاب فسحته لدى اتجاه يظهر الانتماء للشريعة وباطنه ضيق بها حرج منها، سعى لتفعيل المقاصد لتخطي الاستدلال الراسخ المنضبط الذي انتهجته المدارس العتيقة وأسست له.\n\nوالناظر في موقف علماء الأصول المعتبرين، شرقًا قطنوا أو غربًا، لا يجدهم يحتفون بالكتاب كما احتفى به من ذكرت بعاليه، فجعلوه متراجعًا عن المرجعية؛ فليس هو من الكتب المقدمة كما أنه ليس من المهجورات، إنما في رتبة دون الاعتماد وفوق الترك.'},
      {member:'أسامة الفلاج',title:'قصة أدبية: أدعية تهتك المستور (زيارة شيخ الثمانين)',date:'٥/١٠/٢٠٢٦',body:'ترافقت مع صديق عزيز لزيارة أحد كبار السن، رجل تضمخ بعطر الثمانين، طيب القلب وقور الحركة والسكون تملؤه حكمة موفر العقل، ولربما عرته أحيانًا غضبة في طيها رحمة وصدق لهجة.\n\nجاذبنا فيها أطراف الحديث، فكانت القصة أو السؤال يبدأ طرفه منه ثم يجيل نظره على أكبر الجالسين أو من يقدر تأهله للإجابة. وكان مجلسه عامرًا برفقائه وأحفاده وأصهاره. وعجبت حين رأيته قادمًا من سيارته يسير بطريقة فيها شيء من التهالك والتثاقل، يتكئ بعصاه على الأرض وكأنه يوقظها من سبات عميق، لكنه فور مسيره على فناء داره شككت بأن الجاذبية قد خامرها الحياء فتخلت عن عملها، فهو يسير بنشاط تام واستقامة كاملة، ولا يكاد يضرب بعصاه الأرض؛ إن هي إلا وخزات رقيقة كوخز الواشم على وجنة حسناء. شيخ ترى الحياة في عينيه وسواد لحيته، يشعرك وأنت تصافحه بأنه يهزأ بالحياة وأحداثها، فقد جرب منها ما أعياها، فلقته صبورًا شامخًا عزيزًا.\n\nأديرت القهوة وقد فاحت رائحة زعفرانها، ولا يجاري دندنة فناجيلها إلا تطرب هذا الشيخ بأضيافه. يحيينا وكأنه لأول مرة يرانا، ويسأل عنا وكأننا نشاركه مصيرنا. قام أحد أحفاده بالضيافة، الحفيد الذي لا يقل بشاشة عن جده، فهذه أرومته وسنخ جرثومته.\n\nاقترب أذان العشاء وتحفز الحاضرون للصلاة، وبدأ الكل ينظر في ساعته وبقايا بيالته تأهبًا للفريضة، وبدا لصاحبي مسايرة الضيف للمسجد وأومأ لي بمرافقتهم. استطببت الفكرة، ورأيت صاحبي مبهورًا بالشيخ، يقرضه كلمة فيردها الشيخ بأضعافها فكاهة وحكمة ودعاء ومشاغبة، حتى قال صاحبي كلمة سمعت دويها في قلب الضيف، وكأن صداها عزل بقية الأصوات، حتى ليخيل إلي أنها حجبت أصوات من بعد من المؤذنين. ثم رأيت الشيخ كسفت شمسه بعد بزوغها، مع غاية محاولته كظم ما نغش فؤاده. قال صاحبنا: «أطال الله عمرك وأبقاك!» ليس في الكلمة شيء، لكن سياقها لمن هذا عمره توحي بالحاجة للعمر، وأن الأطراف قد بدت معالمها. لامس هذا الدعاء شيئًا في نفس الشيخ، وكأنه يقول: ألم يثبت لكم بعد أني على خير ما يرام، وأنه لا يزال من عمري وقوتي ما لا يحوجك إلى الدعاء بمثل هذا؟!\n\nصلينا وودعنا المضيف وأضيافه، وبقيت مع صاحبي وقد استولى علي وجه الشيخ وتعابيره التي تحولت بعد الدعاء. فاتحت صاحبي بما حدست به نفسي، استمع بكل جوارحه ثم وقف قليلًا والتفت إلي وقد عرته ضيقة وانقباضة ظهرت على نفسه وأوائل كلماته، قال: هل أخطأت عليه؟ فأنا أدعو له صادقًا بطول العمر وبقاء العافية؟ أو ترى صدقي هذا ورطني وكشف عما طوته نفسي من الرغبة بذلك؟\n\nفقلت له إن لهذا الشيخ من الفطنة ما يجلي قرارة قلبك من لحظ عينيك، فكيف بك وقد نطقت؟ سكتنا ثم تفرقنا وذهب كل لسبيله، وقد آليت على نفسي ألا أدعو بالعمر لشيخ يواري ضعفه، ولا بالصحة لمريض يخفي مرضه، ولا بالغنى لمتعفف يدرأ حاجته؛ هذه يا سادة قد لا تكون أدعية بقدر ما تكون هتكًا لمستور أو إظهارًا لمغمور، وكأنك تقول: قد علمت ما تود أن يجهل ولا يذكر ثم دعوت لك.'},
      {member:'أسامة الفلاج',title:'قضية في الشعر الجاهلي لطه حسين',date:'٧/١٠/٢٠٢٦',body:'يقول طه حسين: «إن من الحق علينا لأنفسنا وللعلم أن نسأل: أليس هذا الشعر الجاهلي الذي ثبت أنه لا يقبل حياة العرب الجاهليين ولا عقيدتهم ولا ديانتهم ولا حضارتهم، بل ولا يمثل لغتهم، أليس هذا الشعر قد وضع وضعًا وحمل على أصحابه حملًا بعد الإسلام؟»\n\nهكذا تساءل طه حسين، وهكذا نفض يده من جملة الشعر الجاهلي وصلة أسبابه بالعرب والمسلمين؛ وهو تساؤل شحنه صاحبه بجوابه أو الإشارة إليه.\n\nفجر هذا التشكيك سدود الأحبار، وأسَال مدامع الأقلام، وأقلق ذوي الغيرة على تراثها. فليس هذا التساؤل من قبيل الإشكالات العلمية، ولا من طراز التدقيقات المنهجية التي تستحث العلماء والباحثين للظفر بحلها والمتعة باستجلاء ما استجد وحدث منها؛ إنما هو ضرب لقيمة وقطع لصلة واستخفاف بموروث.\n\nولو أن الأمر وقف عند التشكك أو التساؤل أو الافتراض لهان الأمر، وافترض في صاحبه حسن النية وجدية البحث، لكنها سؤالات المتريب وقدحات المعترض، أعان صاحبها على نفسه وسوغ للمتهمين دعواهم.'},
      {member:'أسامة الفلاج',title:'مطالع الموت ومطامع الخلود (الزركلي والأمير مصطفى الشهابي)',date:'١١/١٠/٢٠٢٦',body:'كانت من عادة العلامة خير الدين الزركلي أن يجمع تراجم أعلام عصره وأن يستقصي ما وقعت يده عليه، لكنه اشترط على نفسه ألا ينشر منها شيئًا وصاحبها على قيد الحياة. وكان المرحوم مصطفى الشهابي أحد أبناء الإمارة الشهابية يدعو الله أن يموت قبل الزركلي حتى يترجم له في الأعلام.\n\nفي جلسة من جلسات الأمير الشهابي مع العلامة الزركلي كان الزركلي يستعرض شيئًا مما جمعه عن الأمير، لكنه أورد الترجمة من دون ذكر الأمير! فقال له الشهابي: ولم أسقطت اللقب؟ فرد عليه الزركلي بأن الإمارة قد انتهت من أمد وليس لإدراج اللقب معنى، فما كان من الشهابي إلا أن يقول بصوت خافت وكأني أرى علائم الحياء والرجاء على وجهه: قل العلامة العلامة!\n\nوعجب أمرهما إذ كل منهما يحضر لما بعد حياة الآخر، وكأنهما في فناء الحياة يتطلعان إلى ساحة البرزخ، وترى أحدهما يدعو بسبق الموت ليخلد.\n\nوقريب منه ما حدث لصاحب الأعلام نفسه، حين نادمه أحد أصهاره فقال له إنك تعكف على كتاب قد أكل من عمرك عقودًا، فلو ألفت كما يؤلف الناس ويتلقف القراء كتبهم ويأنس الكتبة بأثرهم؟ فقال الزركلي: وهل تذكر أنت أسماء هؤلاء الذين يلقون كتبهم للناس في كل يوم؟ أما كتابي هذا فسيذكرني الناس به ألف عام.\n\nوهكذا الخلود يطل برأسه بين أماني الإنسان، لكنها إطلالة صامتة وإغراء ساكن، فكل التفاتة إليه تذكر بنقيضه، ولا عجب أن عرف إبليس هذا في الإنسان، فجعله إدلاء بإخراج بني آدم: ﴿هل أدلك على شجرة الخلد﴾.'},
      {member:'أسامة الفلاج',title:'مسايرة المؤلف وطقوس القراءة',date:'١٢/١٠/٢٠٢٦',body:'من عادات القراءة اللطيفة، والتي يغبق بها بين حين وآخر، مسايرة المؤلف. تقرأ لعالم أو شاعر أو روائي تركي مثلًا فتسايره بصنع قهوة تركية أو شاي تركي، أو كان أمريكيًا فلا بأس بقهوة أمريكية مع الكوكيز الساخن! أو إن كنت تعرف عادة أو مزاجًا خاصًا للمؤلف تسايره عليه، كما أصنع أحيانًا حين أقرأ للعقاد فأشرب شيئًا من عصير الليمون، ثم أتبعه بعد ما يقرب من الساعة أو يزيد عليها بفنجان من القهوة السوداء، أو حين القراءة لعلامة شنقيط في أضوائه الباهرة ونميره العذب فلا أقل من بيالات شاي معتق في إبريق أصفر.\n\nهذه المسايرة لا تقف عند نزهة الخاطر وراحة البال وطرد الملل، لكنها تتيح للقارئ تمثل شخص الكاتب والتعاطف مع أفكاره، وكأنه هو الكاتب أو مشاركه الكتابة. لست أزعم أنها عادات فارقة، لكنها على الأقل تعطي شيئًا من الشعور تجاه الكاتب وما كتب.\n\nأما إن جهلت محببات المؤلف ومزاجه، ولم تقف على كيوفه الخاصة، فاقرأ على كيفك ومزاجك واعتسف ما شئت أن تعتسف؛ فالكيف كيفك والعبرة بفهمك لا ما كتب، والسلام.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'حُمّى الاستدراك',date:'٢/٦/٢٠٢٦',body:'من الظواهر اللطيفة المزعجة في آن واحد ما يمكن أن نسميه «حمى الاستدراك»، وهي ليست مرضًا جسديًا، بل حالة ذهنية تصيب بعض الناس كلما سمعوا فكرة أو نصيحة أو تذكيرًا بفضيلة، فما إن يكتمل الكلام حتى يهب أحدهم مستدركًا: نعم، ولكن... أو لا تنس أيضًا... أو ينبغي أن نضيف...\n\nتحدث عن فضل قيام الليل فيذكرك أحدهم بألا تنام عن صلاة الفجر، واذكر بر الوالدين فينبهك آخر إلى حقوق الزوجة والأبناء، وحث على الصدقة فيأتي من يذكر بأهمية الادخار وعدم الإسراف. ولا تكاد تنتهي من فكرة حتى تجد من يسابق إلى وضع ملحق لها أو هامش عليها أو قيد يرافقها.\n\nوالمفارقة أن هذه الاستدراكات تكون صحيحة في كثير من الأحيان، لكن السؤال ليس عن صحتها، بل عن دوافعها وتوقيتها. لعل السبب أن التلقي الخالص أصعب مما نظن؛ فالإنسان يحب أن يشعر بأنه مشارك في صناعة المعنى لا مجرد متلقٍ له. وبعض النفوس تستثقل موقع المستمع، فتبحث سريعًا عن زاوية تتيح لها الانتقال إلى موقع المعلق أو المصحح أو المكمل.\n\nومع الوقت قد تفقد الموعظة أثرها، لا لأن مضمونها ضعيف، بل لأن الأذهان انشغلت بالحواشي قبل أن تستوعب المتن. من حسن الأدب الفكري أن نمنح الفكرة حقها قبل أن نضيف إليها، وأن نصغي قبل أن نعقب، وأن نسمح للكلام أن يؤدي رسالته. فليس كل مقام مقام تصحيح، وليس كل حديث بحاجة إلى ملحق. وربما كانت الحكمة أن نقاوم رغبة الاستدراك ونكتفي بالإنصات والانتفاع؛ فالمشاركة الحقيقية ليست في إضافة تعليق على كل شيء، بل في العمل بما نسمع. — عبدالله بن إبراهيم الشبرمي، بريدة، ١٦/١٢/١٤٤٧.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'الكلمة التي لم تُقَل',date:'١٤/٦/٢٠٢٦',body:'ليست كل الكلمات تضيع؛ فبعضها يبقى معنا، تلك الكلمات الطيبة التي هممنا أن نقولها ثم أخرناها أو كتمناها، لا تصل إلى أصحابها، وإنما تستقر في الذاكرة حسرة على لحظة كان يمكن أن تصنع فرقًا.\n\nأما الكلمة التي تقال فإنها تخرج خفيفة من اللسان، لكنها قد تستقر عميقًا في قلب من يسمعها، ثم تعود إلى قائلها محبة وتقديرًا وأثرًا حسنًا. كم من كلمة شكر كان أصحابها ينتظرونها فلم تأتهم، وكم من ثناء صادق حال دونه التردد، وكم من مشاعر ود بقيت حبيسة الصدور حتى غيبها الزمن.\n\nوالعجيب أن الكلمة الطيبة لا تكلف قائلها كثيرًا، لكنها قد تمنح غيره دفعة من الأمل، أو تشعره بقيمة ما يصنع، أو تدخل إلى قلبه سرورًا يبقى زمنًا طويلًا. لذلك لا تؤجلوا الكلمات الجميلة؛ قولوا شكرًا لمن أحسن، وأثنوا على من أجاد، وعبروا عن محبتكم لمن تحبون، فالكلمات الطيبة إذا قيلت في وقتها كانت من أجمل الهدايا. — عبدالله بن إبراهيم الشبرمي، بريدة - القصيعة، ٢٨/١٢/١٤٤٧.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'مشاريع العمل تنتصر على مشاريع النقد والتحذير',date:'٢٨/٧/٢٠٢٦',body:'في اجتماع نادي جليس صباح السبت الماضي، شدني حديث أبي عبدالرحمن الواصل عن أصحاب المشاريع، فذكرني بعبارة قرأتها ذات يوم: «مشاريع العمل تنتصر على مشاريع النقد والتحذير».\n\nالنقد سهل؛ أن ترى ما لم يحسن الآخر ثم تقول: أخطأت. أما أن تنزل إلى الميدان، وتبني مشروعًا، وتصبر عليه حتى ينضج ويثمر، فتلك حكاية أخرى.\n\nتأملت نماذج معاصرة كثيرة، مثل أيمن العتوم وخالد الزعاق. فهذا أيمن العتوم شرح ديوان المتنبي كاملًا على يوتيوب في أكثر من ٥٠٠ حلقة، وشرح المعلقات في ١١٠ حلقات، وهذا خالد الزعاق قرب علم الفلك للناس وجعل كثيرًا منهم يعرفون مواسم الحر والبرد وما كان يقوله أهلنا الأولون عنها.\n\nوغيرهم كثير ممن حملوا هم الإنتاج لا هم التعليق؛ قد نتفق معهم أو نختلف، لكنهم اختاروا أن يعملوا وينتجوا ويتركوا أثرًا. لذلك لا تكن مجرد متفرج على مشاريع الآخرين، بل ابدأ مشروعك الخاص، وإن لم تستطع فلا تجعل حياتك مشروعًا لنقد مشاريع الآخرين.\n\nاجعل لك مشروعًا بينك وبين الله، ومشروعًا في مجتمعك، ومشروعًا في علمك وعملك؛ فالمشاريع قد تتعثر وقد تنتقد وقد لا تأتي ثمارها كما أردنا، لكنها في النهاية هي التي تصنع الأثر. — عبدالله بن إبراهيم الشبرمي، بريدة - القصيعة، ١٤/٢/١٤٤٧.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'عزوف المثقف المسلم وعلماء نجد عن كتابة السيرة الذاتية',date:'١٧/٩/٢٠٢٦',body:'هذه النظرة تقترب من فكرة أن المثقف المسلم قد يعزف عن كتابة سيرته الذاتية؛ لأنه لا يرغب في كشف أخطائه وعثراته المستورة.\n\nويبدو هذا المعنى أكثر وضوحًا عند علماء نجد، إذ اجتمع في منهجهم الستر على أخطاء النفس، والعزوف عن مدح الذات وذكر مناقبها، فهذه نقيصة لديهم. ولهذا يصعب أحيانًا العثور على سير ذاتية نجدية تكشف التجربة كاملة؛ فالنجاحات لا تذكر خشية الوقوع في مدح النفس، والأخطاء تستر حفظًا للنفس وصيانة لها.\n\nمع أن السيرة الذاتية إذا خلت من الأمرين فقدت جانبًا مهمًا من صدقها وقيمتها؛ لأن فهم النجاح لا يكتمل إلا بمعرفة ما سبقه من عثرات وتجارب.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'مقالة: لعنة النضج',date:'١٦/١٠/٢٠٢٦',body:'قرأت ذات مرة مقالًا تحدث صاحبه فيه عن معنى سماه «لعنة النضج»، فاستوقفني هذا التعبير طويلًا، ورأيت فيه شيئًا من حقيقة الحياة التي لا ننتبه إليها إلا بعد أن نمضي فيها شوطًا بعيدًا.\n\nيبدأ المرء حياته محبًا للاكتشاف، يسأل عن كل شيء ويحرص على أن يفهم ما يدور حوله، ويظن أن المعرفة كلما ازدادت زاد معها حظه من الراحة والسعادة. حتى إذا تقدم به العمر واتسعت تجاربه وانكشف له من طبائع الناس وأحوال الدنيا ما لم يكن يعرف، تمنى لو بقي على شيء من جهله الأول وبساطته القديمة وحسن ظنه الذي كان يرى به الدنيا.\n\nهنا تكمن لعنة النضج: أن تعرف من الناس ما يحملك على الحذر، ومن الحياة ما يسرق منك عفويتك، ومن الحقائق ما يجعلك ترى خلف الكلمات معاني لم تكن تخطر لك؛ فتصبح أكثر فهمًا ولكن أقل اندفاعًا، وأكثر بصيرة ولكن أقل دهشة.\n\nولعل أشد ما في الأمر أن الإنسان لا يستطيع العودة إلى بساطته الأولى بعد أن يرى ما رأى ويعرف ما عرف؛ فبعض المعارف أبواب إذا فتحت تعذر إغلاقها. وما كل جهل نعمة ولا كل معرفة نقمة، ولكن الحكمة أن تعرف من الحياة ما يعينك على عيشها لا ما يحرمك لذتها؛ وأن تنضج دون أن تفقد براءة روحك، وأن تفهم الناس دون أن تسيء الظن بهم جميعًا، وأن تدرك تقلب الدنيا دون أن تفقد قدرتك على الفرح بها.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'فلسفة شخصية في الصداقة وتبادل المعروف',date:'٢٠/١٠/٢٠٢٦',body:'أرى أن الصداقة الحقيقية أن تخدم وتُخدم؛ لأن بقاءك في خانة المعطي دائمًا قد يحرج أصدقاءك من طلب المساعدة منك، ومن حسن الخلق أن تطلب منهم أحيانًا لا لحاجتك، بل لتشعرهم أن العلاقة متبادلة، وأنهم ليسوا في موضع الأخذ دائمًا.\n\nيقول محمد ابن الذيب: «تعنّا يا قلبي واطرق الكايدات وعَنْ / ضعيف الرجال اللي لا عني ولا عنّا». وفي الطرف الآخر يقول حزمي بن سعد: «ما أحب الرفيق اللي يحب يتجمل في / أحب الرفيق اللي ما قد شفت معروفه..!»، ويقول عكاش الذيابي: «ما يجعل الأحرار مثل المماليك / إلا معاريف الرجال ببعضها».\n\nفي النهاية تتباين فلسفات الصداقة؛ فهل الأريحية في تبادل المعروف أم لا؟ هي في النهاية فلسفات وتجارب، فقد يكون الحل الوسط أن كل صديق تتعامل معه بأسلوب يناسبه، فالتعميم لا يصح.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'سرّ متعة كتاب الذكريات للطنطاوي وفلسفة الاستطراد',date:'٣٠/٧/٢٠٢٦',body:'ما سر متعة «الذكريات»؟ ليس في أحداثها وحدها، بل في أسلوب صاحبها؛ يبدأ الحديث في أمر، ثم لا تلبث أن تجد نفسك معه في أمر آخر، ثم ثالث، ثم رابع، حتى تظن أنه ابتعد عن الموضوع، فإذا به يعود إليك وقد زادك علمًا ومتعة. تلك الاستطرادات لم تكن خروجًا عن الطريق، بل كانت هي الطريق نفسه.\n\nوكلما قرأت «الذكريات» ازددت يقينًا بأن التاريخ يعيد نفسه؛ يروي الشيخ ما جرى في الشام قبل عشرات السنين، فإذا بك ترى كثيرًا من تلك الصور يتكرر في زماننا، حتى ليخيل إليك أن الفارق بين الأمس واليوم هو التاريخ المكتوب في أعلى الصفحة.\n\nومن الطريف أن الطنطاوي كان كثيرًا ما يلوم نفسه على الاستطراد ويراه عيبًا يلازمه في الكتابة والمحاضرات والبرامج التلفزيونية، حاول أن يتخلص منه لكنه لم يستطع، حتى قال ساخرًا: إن من سوء حظه أن الاستطراد ليس حرامًا، وإلا لأجبر نفسه على تركه!'},
      {member:'عبدالله إبراهيم الشبرمي',title:'طبيعة الشر في الإنسان بين الفلسفة والمتنبي',date:'٢٢/٨/٢٠٢٦',body:'المتنبي عنده قناعة غريبة بأن الشر جزء أصيل من طبيعة الإنسان، ويؤكدها في قصيدته التي مطلعها «صحب الناس قبلنا ذا الزمانا»: «كلما أنبت الزمان قناة / ركّب المرء في القناة سنانا». يعني حتى لو أعطاه الزمان شيئًا نافعًا وجميلًا مثل العصا، لا يتركها على حالها؛ يحولها إلى رمح ويبدأ القتال. وكأنه يقول: المشكلة ليست فيما نملك، بل فيما تفعله نفوسنا بما نملك.\n\nكتبت الرد على بيت المتنبي وما بعده، لأنني كنت خلال الإجازة أقرأ عن نظرة بعض الفلاسفة لطبيعة الإنسان، فوجدت عندهم تشاؤمًا لافتًا؛ إذ يرون أن الشر أقرب إلى أصل الإنسان، وأن الأديان والقوانين جاءت لتهذب هذه النزعة وتكبحها. بل إن بعضهم يذهب أبعد من ذلك، فيرى أنك إذا وجدت إنسانًا لا يظلم فلا تعجل بحسن الظن به؛ فربما منعه خوف أو ضعف أو قانون، لا صلاح راسخ في طبعه، وهذا قريب من رؤية المتنبي.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'الفرق بين المؤلفات الحرة والرسائل العلمية المطبوعة',date:'١٥/٩/٢٠٢٦',body:'الشيء بالشيء يذكر: لاحظت أن الكتب التي يكتبها المؤلف ابتداء من رغبته واختياره تكون - في الغالب - أكثر انسجامًا وترتيبًا؛ لأنه يختار موضوعها ويبنيها وفق رؤيته ويضع فيها ما يراه أكثر فائدة للقارئ.\n\nأما الرسائل العلمية فكثيرًا ما تفرض عليها طبيعة البحث الأكاديمي ومتطلبات المشرف والجامعة، فيأتي أسلوبها وترتيبها مختلفًا، وقد ينشغل الباحث باستيفاء متطلبات البحث أكثر من انشغاله بصناعة كتاب متكامل.\n\nولذلك نجد أن بعض الكتب التي كان أصلها رسالة علمية، حين يقرر مؤلفها نشرها في كتاب، يعيد ترتيبها وينقحها ويحذف ما لا يحتاجه القارئ ويضيف ما يكمل الفكرة؛ فتخرج في صورتها النهائية أقرب إلى الكتاب الذي كتب للقارئ، لا إلى الرسالة التي كتبت لاستيفاء متطلبات علمية.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'التطوير الحقيقي للطبعات المنقحة والمزيدة',date:'٢٧/٩/٢٠٢٦',body:'هذا هو التطوير الحقيقي الذي ينتظر من اختلاف الطبعات؛ لأننا للأسف نجد كثيرًا من الكتب تنتقل من طبعة منقحة إلى طبعة مزيدة، ثم منقحة ومزيدة، بينما لا يتجاوز التطوير في كثير من الأحيان تصحيح بعض الأخطاء الإملائية والنحوية أو تغيير الألوان والتصميم، وإن كان التغيير أكبر قليلًا أعيد ترتيب الفصول.\n\nأما إذا كانت لدى المؤلف إضافات وأفكار كثيرة، فكثيرًا ما يختار إخراجها في كتاب جديد، وهذا ظاهر عند بعض المؤلفين؛ فتجد له عدة كتب متقاربة في موضوعاتها ومتداخلة في أفكارها، حتى تشعر أحيانًا أن بعض الاختلافات صنعت عمدًا ليبدو كل كتاب مستقلًا عن الآخر.\n\nلذلك ما فعله صاحب كتابنا هذا الأسبوع يعد أمرًا نادرًا ويستحق الإشادة؛ فالفرق بين الطبعة الأولى والأخيرة تجاوز الضعف، وهذا يدل على أن الطبعات الجديدة لم تكن مجرد تحسينات شكلية، بل شهدت تطورًا حقيقيًا في محتوى الكتاب.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'سر انتشار كتب تطوير الذات',date:'٢/١٠/٢٠٢٦',body:'على الطاري: كثير من هذه الكتب تدور حول فكرة واحدة تقريبًا؛ فإذا قرأت كتابًا منها ثم تصفحت غيره وجدت الأفكار متقاربة جدًا، وهي: اهتم بنفسك ولا تسمح للآخرين أن يؤثروا فيك.\n\nواللافت أن هذه الكتب تنجح بقوة، بل إن بعض المؤلفين يكتبون أكثر من كتاب حول الفكرة نفسها، ومع ذلك تجدها كلها تحقق انتشارًا ونجاحًا.\n\nوأعتقد أن السر في أنها تلامس أحاسيس كامنة في النفس؛ فكل قارئ يجد شيئًا من نفسه بين صفحاتها، ويشعر أن المؤلف يتحدث عنه شخصيًا، وربما لهذا السبب لا يمل القارئ من الفكرة، لأنه لا يقرأ عنها بقدر ما يقرأ عن نفسه.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'نظرة فلسفية: وهم الفراغ وتنوع طرق السعادة',date:'٢٣/١٠/٢٠٢٦',body:'لا أظن أن في الدنيا شيئًا اسمه الفراغ؛ فهذا الكوب الذي نقول إنه فارغ إنما هو مملوء بالهواء، وكذلك أوقات الناس؛ فهذا آثر الراحة والهوايات، وذاك اختار الكد والسعي ومغالبة الصعاب، وبينهما أناس أخذوا من هذا وذاك.\n\nوالخطأ أن نجعل الأمر اختلاف تضاد، فنظن أن أحد الطريقين صواب والآخر خطأ؛ فالناس طبائع، وما يسعد هذا قد لا يسعد ذاك. والحقيقة أن الجميع يطلب السعادة، ولكن هذا يلتمسها في السكون، وذاك يجدها في الإنجاز، وإنما اختلفت الطرق وبقيت الغاية واحدة.'},
      {member:'مشعل عبدالرحمن الحفير',title:'مقال: نصف عطاء',date:'٢/٦/٢٠٢٦',body:'في الجد نتمنى الراحة، وفي الراحة يمتلئ تفكيرنا بمشاغلنا؛ فلا هناء مع الأهل، ولا كامل العطاء للشغل.\n\nفي الجد يمتلئ تفكيرنا بشواغل الأهل، ويمتلئ وقت الأهل بمطالب الشغل.. تداخلت الحدود، واشتَبكت الخيوط!\n\nفلا شغلًا أنجزنا، ولا أهلًا أبهجنا، ولا نفسًا أرحنا، ولا عينًا أغمضنا.'},
      {member:'نعيم محمد الغضية',title:'مقال: سِياسة النفس في مضمار الوقت وبلوغ رتبة العلم',date:'٣/٥/٢٠٢٦',body:'إن المتأمل في حال جلة العلماء يجد أن القوم لم يبلغوا رتبة الإمامة إلا بضنهم بالزمان وصيانتهم للعمر عن الضياع في فضول المآكل والمشارب والمنامات؛ فالعمر بضعة أنفاس، فمن ضيع ساعات ليله ونهاره فقد ضيع من دنياه وآخرته جل نفعه. وقد ذكر الشيخ جميل العظم في كتابه «عقود الجوهر» أن طائفة من الأعلام كابن جرير الطبري وابن الجوزي والسيوطي وابن تيمية بلغت مؤلفاتهم الخمسين فما فوق، وما ذاك إلا لعلو همتهم ومسابقتهم للزمن.\n\nولتحقيق هذه الرتبة سلكوا مسالك حازمة في تدبير شؤونهم، أولها الاقتصاد في القوت؛ إذ إن كثرة الأكل والشرب دليل على النهم، وهي جالبة لأدواء الجسد وخثارة النفس وفتورها عن العبادة. وفي حكم لقمان: «يا بني، إذا امتلأت المعدة نامت الفكرة وخرست الحكمة وقعدت الأعضاء عن العبادة». ومن أعجب ما نقل في ذلك عن أبي الوفاء ابن عقيل أنه كان يقصر غاية جهده في أوقات أكله حتى إنه كان يختار سف الكعك وتحسيه بالماء على مضغ الخبز ضنًا بالوقت.\n\nكما أن من فقه الطالب أن يدرك أن الزمان سارٍ، فمن غفل عن ساعات يومه فقد غفل عن قرب رحيله. وقد نبه الإمام الغزالي في «بداية الهداية» إلى أن من نام ثماني ساعات في يومه فقد ضيع ثلث عمره. لذا وجب على الأشخاص عمومًا وعلى طالب العلم خصوصًا أن يكون حريصًا على التعلم مواظبًا عليه في جميع أوقاته ليلًا ونهارًا، ولا يذهب من أوقاته شيء في غير العلم إلا بقدر الضرورة للأكل والنوم والاستراحة اليسيرة لإزالة الملل.\n\nوعليه أن يعمل ميزان الأهمية في تحصيله؛ فالعلم أكثر من أن يحاط به، فخذ من كل شيء أحسنه واشتغل بالمهم، فإن الشغل بغير المهم إزراء بالمهم. وقد حذر العلماء مما يزينه الشيطان للطالب من الانصراف إلى قراءات أو دروس عامة لا تطلب منه وقت الاختبارات، معتبرين ذلك من سرقة الشيطان ومن علامات اتباع الهوى والكسل عن القيام بالواجبات. فالحق أن العلم ينال بست خصال جمعها الإمام الشافعي: «ذكاء وحرص واجتهاد وبلغة وصحبة أستاذ وطول زمان». فمن استجمعها وعرف قيمة زمانه فقد أتاه الله من أبواب العلم أوسعها.'},
      {member:'إبراهيم سليمان النغيمشي',title:'تأمل: الحياة الروتينية والحياة القتالية',date:'٢٢/١٠/٢٠٢٦',body:'تذكرت مقولة أذكرها للإمام النووي: «جربنا الانشغال وجربنا الراحة فوجدنا أن الراحة أتعب من الانشغال؛ الإنسان مفطور على الانشغال».\n\nجالس شخصًا بدأ حياة روتينية وتحدث معه، وجالس شخصًا بدأ حياة قتالية لا يجد مستقبلًا واضحًا ولا شيئًا يرتكز عليه؛ يومًا تجده غنيًا ويومًا مديونًا، ومع ذلك تجد عنده من النشاط والحياة والحيوية ولو كان عمره ثمانين سنة. بينما تجد الإنسان الروتيني وكأنه يشاهد نهايته، وتجده مخططًا للمستقبل تخطيطًا واضحًا: ١- تقاعد، ٢- شيء ينشغل فيه، ٣- ننتظر الموت.\n\nأما الإنسان الذي يتوكل على الله، وليس عنده ضمان واضح، ويضرب ويسعى في الأرض، فتجده إن كسب أو خسر فكل يوم عنده تجربة جديدة. تنزل ذلك على واقعنا: فترة خدمة عملاء، فترة مسوق، فترة مصور، فترة مفاوض، فترة هو العميل، وفترة هو مقدم الخدمة؛ فتجده يجرب كل شيء والحياة تحمل مواقف وخبرات. اعذرونا على كثرة الكلام، ولكن من محبتنا لكم قلنا نسولف عليكم.'},
      {member:'محمد بن عبدالمحسن الضويان',title:'التوازن بين السعي والسكينة',date:'٢٢/١٠/٢٠٢٦',body:'لا تثريب على الإنسان لو اختار أن يكون من أحد الفريقين؛ فالاختلاف بينهما اختلاف تنوع لا اختلاف تضاد، والمقارنة أحيانًا تجعلنا نصوب طرفًا ونخطئ آخر.\n\nفمن وجد راحة نفسه في الكد والتعب والسعي الدائم فذاك وما اختار، ومن آثر الحياة البسيطة الهادئة بعيدًا عن صخب الحياة وضجيجها فهو وما سلك، وكل ميسر لما خلق له.\n\nالمهم أن تعيش في هذه الدنيا سعيدًا ما استطعت، وتكون بوصلتك موجهة إلى الآخرة، فتعمل بما يوصلك لبلغتك وبغيتك، وتسعد بما لا يحجبك عنها.'},
      {member:'محمد عبدالعزيز العمر',title:'حكاية كتاب (بورخيس ودسّ الكتب في جيوب المعاطف)',date:'١٧/١/٢٠٢٦',body:'يذكر خورخي بورخيس في هوامش سيرته أن كتابه «حماسة بوينس آيرس» ربما لم يولد في ظروف احتفالية، بل طبع بدائيًا في نحو ثلاثمئة نسخة يحوي عشرين قصيدة. أهدى بعضها ووزع بعضها الآخر، ثم قادته الحيلة أكثر مما قاده السوق؛ فاستهدف رواد إحدى المجلات الأدبية العريقة، وطلب من صديق له يعمل فيها أن ينشر الكتاب. فاستغرب قائلًا: كيف أبيع هذه النسخ؟ فأجابه بورخيس ببرود ساخر: لست أطلب منك أن تبيعها، بل أن تدس نسخها في جيوب معاطف رواد مجلتكم ليقرأوها رغمًا عن أنوفهم. ففعل، وبعد عام كانت البشائر: قرأها بعض أولئك وكتبوا عنها، وهكذا بدأت سمعة الشاعر الشاب في الصعود دون ضجيج.'},
      {member:'محمد عبدالعزيز العمر',title:'رفقًا بالطلاب (تواضع الأستاذ ماسيدونيو مع تلميذه بورخيس)',date:'١٧/١/٢٠٢٦',body:'حينما يتفوق التلميذ على الأستاذ، وإن كان التفوق في الشهرة والانتشار، يحدثنا بورخيس عن أستاذه ماسيدونيو وكيف غيره كثيرًا. كان يترقب يوم السبت ترقب العاشق الولهان لمعشوقته، وينهل من سمته وصمته وفكره أكثر مما ينهل من كلامه.\n\nيقول بورخيس ممتدحًا شيخه: «لا يجازف إلا ببعض الملاحظات الهادئة، التي كانت موجهة ظاهريًا إلى من يجاوره ويحاوره فقط. لم تكن هذه الملاحظات أبدًا توكيدية. كان ماسيدونيو مهذبًا ورقيقًا؛ فكان يقول مثلًا: أفترض أنك قد لاحظت... ثم يطلق العنان لفكرة مدهشة ومبتكرة، لكنه كان دائمًا ينسبها إلى المستمع». وفرق بين من يسرق الفكرة وينسيها له.'},
      {member:'محمد عبدالعزيز العمر',title:'حكايات الكنوز المدفونة في التراث والأساطير',date:'٥/٢/٢٠٢٦',body:'والدي يتندر بأنه سيجد كيسًا مملوءًا ذهبًا ومكتوبًا عليه: «هي حلال لمن وجدها»، احترازًا من الحرام، ويوزعه علينا. هذا في اليقظة، أما المنامات ورؤية كنوز الذهب فيها فحدث ولا حرج، واسأل مفسري الأحلام يخبرونك بالعجب.\n\nولهذا الخيال والتمني أساس من التاريخ؛ ففي الأسطورة الهندية الرمزية «الذهب في الطريق» وجد عابد ناسك زاهد في طريقه الوعر قطعة من ذهب وتركها لله، لا يريد أن يدنس دنياه. وفي المرة الثانية وجد قطعًا ذهبية مكتوبًا عليها: «من زهد في الأولى استحق الثانية». ومثلها قصة مشهورة عند الصوفية. وحكى الناس عن زوجين عثرا على كنوز وعملات ذهبية مدفونة تحت شجرة كانا يستظلان بها أثناء المشي، وعن كنز مدفون في صحراء عمان بوادي دفن، وعن قصص الكنوز في كتب الغزالي وجبرا إبراهيم جبرا ومبارك بن لندن. والكنوز المدفونة لا ترتبط بقوم أو عرق، بل نجدها في جميع الديانات والأساطير، وقد تكون فخًا للطماعين؛ كما في كنز عبدو في مسلسل لن أعيش في جلباب أبي. ونذكرك بقول الله تعالى في سورة الكهف: ﴿وكان تحته كنز لهما﴾.'},
      {member:'محمد عبدالعزيز العمر',title:'الناثر البليغ وسيرته المرئية في كتاباته',date:'٧/٢/٢٠٢٦',body:'قال العقاد كلامًا بليغًا في وصف الشاعر البليغ في كتابه «اللغة الشاعرة»، وقد استلهمت تلك المعاني وحورتها لتصدق على الكاتب أو الناثر البليغ. فالناثر البليغ تلتقيه في كتاباته، وتعرفه من نبرته وإن لم يفصح عن نفسه. أسلوبه حي، له قوائم يمشي عليها، يخبرك كيف عاش وكيف يعيش. تقرأ له فتعرف ما يحب وما يكره، وما يثيره وما يطربه، دون أن يشير إلى ذلك صراحة. كأن كتابته سيرة مرئية، وكأن لسان حاله حقًا أصدق من مقاله.'},
      {member:'محمد عبدالعزيز العمر',title:'رمضان جليس',date:'١٧/٢/٢٠٢٦',body:'هناك لحظات تغير مجرى المسار والفكر، ورمضان منها.\n\nهذا هو رمضان الثالث أو الرابع - صححوا لي - في رفقة نادي جليس؛ نجالسه فيجالسنا، وندارسه فيدارسنا، ويداوي قلوبنا فننتفع بعلاجه.\n\nتقبل الله منا ومنكم القرآن والصيام والقيام والقراءة والكتابة والإحسان. هنيئًا لنا برمضان، وهنيئًا لنا بصحبة رمضان.'},
      {member:'محمد عبدالعزيز العمر',title:'ليلة التراويح الأولى وسورة الإسراء',date:'١٧/٢/٢٠٢٦',body:'هذه أول ليلة من رمضان لعام ألف وأربعمائة وسبع وأربعين من هجرة المصطفى صلى الله عليه وسلم. يهنئ بعضنا بعضًا، والكل ينتظر صلاة التراويح؛ لكنها هذه المرة على غير العادة.\n\nبدأ إمامنا بسورة الإسراء: ﴿سبحان الذي أسرى بعبده ليلًا من المسجد الحرام﴾، بصوت خاشع ونغمة قرآنية ندية، كأنه يقول لنا: الليلة ليلة تدبر. فلفت انتباه المصلين إذ اعتدنا البدء بسورة البقرة، ويحسب له هذا الاختيار.\n\nكأننا نسمع السورة لأول مرة؛ فإذا بالآيات تنساب علينا كالمطر الهتان البارد على الأرض الجدباء، وإذا بالرحمات تتنزل والخشوع يعم المكان. في السورة خارطة طريق للحياة الدنيا: كيف نعيشها ونمارس فيها عباداتنا وعاداتنا ونسعى في الأرض؛ وخارطة أخرى ترسم لنا الآخرة والآخرة خير وأبقى.\n\nكأنك تشاهد نفسك من الطفولة إلى الشيخوخة، متقلبًا بين جنبات الحياة، متنعّمًا بلذاتها مؤديًا عباداتك، منتبهًا لجوارحك، ساعيًا في طلب الرزق قاطعًا شوطًا في تحقيق رغباتك، راضيًا بالقضاء والقدر، راجيًا عفو ربك. كأنني أسمعها لأول مرة... تقبل الله طاعتنا وطاعتكم.'},
      {member:'محمد عبدالعزيز العمر',title:'مقال: الجرأة واستراتيجية الصدمة (رثاء د. ضياء العوضي)',date:'٧/٥/٢٠٢٦',body:'الجرأة في اتخاذ القرار صفة من صفات القادة، والجزم بالمعلومة من المتمكن دليل ثقة مبنية على أساس من اليقين، لكن حين تتحول الجرأة إلى تسويق للذات، أو تسليع للفكرة، أو ترويج لمشروع، أو مزيج من هذا وذاك، فهي موضع ريبة وتحفظ؛ لأن الضرر متعد، ولأن مخالفة السائد ليست دائمًا دليل تفرد وتميز، كما أن استراتيجية الصدمة لا يحملها إلا من يملك القدرة على تغيير الواقع، لا من كان جزءًا من ضجيجه.\n\nرحمك الله يا دكتور ضياء العوضي، كنت تملك ثقة تهز الجبال، وقد تفضي بصاحبها إلى المهالك. فالصدمة أثرها قريب، أما العلم المبني على الحقيقة فأثره ممتد، والجرأة - في كثير من الأحيان - تختصر طريق الشهرة.'},
      {member:'محمد عبدالعزيز العمر',title:'الذكاء الكبريتي وإعادة قراءة الكتب',date:'٢٣/٥/٢٠٢٦',body:'قرأت أن هناك ذكاء كبريتيًا، من يتسم به يحفظ بسرعة وينسى بسرعة، وما أخاله إلا أنا. ولا أحب إعادة المقروء أو قراءة ما كتبت إلا لمامًا، وابن شرف القيرواني يؤيد كلامي فيقول: «المكرر مملول». وأين أنا من: «أناشده إلا أعاد حديثه / كأني بطيء الفهم حين يعيد».\n\nوالنفوس مجبولة على معاداة المعادات كما ذكرها ابن بداح في كتابه الممتع إبداعات العلماء، وتكرار الكلام وإعادته علي أشد من نقل الحصى. ومن أعجب ما قرأت أن العلاونة قرأ كتاب الأعلام أكثر من مئة مرة، وسمعت المحدث الحويني أنه قرأ علل ابن أبي حاتم - الواقع في سبعة مجلدات - أكثر من مئة مرة.\n\nوقراءة الكتب مرتين كعبور النهر مرتين، وللأديب حسين بافقيه تدوينات حول تعدد القراءات وأن حياة واحدة لا تكفي، ولكل عبور مسوغاته؛ فالقراءة الثانية تختلف عن السابقة، والكتاب نفسه يعطيك معلومات أخرى كأنك تقرأ كتابًا آخر. والمستشرق الألماني كرر كتاب الأغاني سبع عشرة مرة، والشيخ اللحيدان سبع مرات، والألباني كرر المسند سبع مرات، وأبو بكر ابن زيد كرر الأعلام للزركلي سبع مرات، والطنطاوي قرأ النظرات ثلاثين مرة، والخضير طالع الأيام خمس مرات ومثلها حياتي لأحمد أمين. والأعجب أن العجيري كرر درء التعارض ثلاث مرات، ومحقق كتاب الحيوان قرأه سبع مرات، وسليمان العلوي اليمني تجاوزت قراءاته لصحيح البخاري المئتين مرة.\n\nوخاتمة المطاف أن القراءة الثانية تختلف اختلافًا جذريًا عن الأولى، كما حصل مع ماريو فارغاس يوسا بعد أن قرأ الحرب والسلام لتولستوي، وبين القراءتين عشرون عامًا؛ فقال بعد قراءته الثانية إنها إحدى المعجزات النادرة في عالم الأدب. كما أن الرئيس الأميركي تيودور روزفلت دائم الاطلاع على كتاب فن الحرب، مرجحًا أن عدد مرات قراءته له قارب المئة. ومن أخبار المتقدمين أن الزريراني الحنبلي قرأ المغني ثلاثًا وعشرين مرة.'},
      {member:'محمد عبدالعزيز العمر',title:'لذّة الانتظار',date:'٧/٦/٢٠٢٦',body:'الانتظار، ذلك العذاب الخفي؛ إنه نوع من العذاب يشترك فيه الجلاد والضحية: انتظار موعد الطبيب، وزواج الأبناء، والحمل والولادة. أتفه الأشياء تسبب لك صداعًا عابرًا، لكن هذا الانتظار اللهين يفعل بنا الأفاعيل. ننتظر الماء البارد تحت الدش ليسخن، وننتظر الآيس كريم ليجمد.\n\nتخيل دقائق وثواني الانتظار؛ الانتباه لها يجعلها مزعجة. أما من يتحمل تأخر ابنه فقد بلغ القنطرة، ومن يتحمل انتظار رد مسؤول خدمة العملاء فقد حاز الصبر من جميع أطرافه. قدرت ساعات الانتظار في حياة الشخص العادي في بريطانيا بستة أشهر. فما بالك بانتظار الإشارة الحمراء في تقاطعات الدائري أو وسط البلد؟ لو حسبت لمن يمر عليها يوميًا لتجاوزت اثني عشر شهرًا من عمر من عاش حياته كلها في الرياض.\n\nلم ننتبه لساعات الانتظار ودقائقها إلا بسبب تلك السرعة التي بلينا بها. يقول صديقي البنغالي في مغسلة الثياب: «سعودي يجي كله كلام سرعة سرعة». الحياة بهذا الإيقاع تفقد بريقها؛ «ما كان الرفق في شيء إلا زانه». حين تتريث وتحاول تطبيق السكينة والهدوء تتهم باللامبالاة والأنانية وعدم تحمل المسؤولية.\n\nلقد حرمنا أنفسنا من التلذذ بتفاصيل الحياة؛ مثل الجائع الذي يأكل بشراهة فلا يستطعم الأنواع، ثم يندم أنه لم يأكل ببطء. لماذا نسرع في التهام المستقبل والواقع بين يدينا يحتاج منا انتباهًا؟ ساعات ودقائق الانتظار فرصة للتأمل والتفكير والاسترخاء. يقول كازواكي تاناهاشي: «إذا تعلمنا الاستمتاع بالانتظار، فلن نضطر إلى الانتظار للاستمتاع».\n\nالانتظار المجهول شديد، كما تقول أحلام مستغانمي: «الانتظار أمر مزعج ومرهق... لكن أصعب أنواع الانتظارات تلك التي لا تعرف ما الذي تنتظره على وجه الدقة». والصبر مع الوقت من أقوى ما يعين الإنسان؛ أما الانتظار المؤلم والحلو معًا فهو انتظار الحبيب.'},
      {member:'محمد عبدالعزيز العمر',title:'أمنية يتبعها دمعة',date:'٩/٦/٢٠٢٦',body:'الثلاثاء ٢٣ ذو الحجة ١٤٤٧هـ. المكان: مشتى اللسيب. الوقت: ٤:٤٠ م.\n\nبيني وبين الوالد موعد يتكرر بين الفينة والأخرى بعد صلاة العصر في مشتاه ومصيفه باللسيب. نجلس سويًا نحتسي القهوة والشاي؛ أو بالأصح أحتسي القهوة وحدي، فالوالد لا يشرب القهوة البتة، وإنما يؤثر عليها الشاي ويتعوذ من شرب القهوة، فهو من أنصار حزب الشاهي. وكانت إذاعة القرآن الكريم تبث نورها علينا من خلال برامجها، وخصوصًا ما يأتي بعد صلاة العصر من تلاوات قرآنية وبرامج تعليمية ونماذج مشرقة.\n\nوفي أثناء ذلك كان البرنامج يستضيف طفلين صغيرين من حفظة القرآن أو أجزاء منه. كان أحدهما اسمه عبدالعزيز، وهو اسم لوالدي، يدرس في الصف الثاني المتوسط، فقرأ قراءة حسنة متقنة مجودة. وبعد أن انتهى طلب أن يشارك أخوه الأصغر منه سنًا، وكان في الصف الثاني الابتدائي، وقال: إن شاء الله سأنجح إلى الصف الثالث.\n\nثم قرأ هذا الشبل الصغير قراءة جميلة مجودة، فأخذ بمجامع مشاعرنا وحواسنا. أخذ المذيع يداعبه ويسأله: هل ترغب أن تكون إمامًا أم مؤذنًا؟ فقال: كلاهما. ثم أعاد عليه السؤال بصيغة أخرى، فقال الصغير من غير تردد: أريد أن أكون إمامًا في الحرم.\n\nرفعت بصري بعد هذه الكلمة، فإذا بعيني الوالد تدمعان، وسمعت حشرجة في صوته وصدره وهو يتأثر بما سمع. ولم أدر أكان الذي أبكاه جمال التلاوة أم براءة الصغار أم تلك الهمة العالية التي خرجت من طفل صغير وهو يتطلع إلى أن يكون إمامًا للحرم. وقد أمن الوالد وأمنت معه على تلك الأمنية.\n\nلعل هذا الموقف لا يحتاج إلى تفسير؛ فدمعة صادقة من شيبة كبير تختصر المحبة والشوق للقرآن والفرح بأهله والرجاء فيما عند الله. وقد كان والدي يختم كل أسبوع، ولما ضعف بصره ضعفت قراءته وزاد سماعه للقرآن.'},
      {member:'محمد عبدالعزيز العمر',title:'قانون مورفي وسخرية المواقف اليومية',date:'١٥/٨/٢٠٢٦',body:'«سوف يصدق الناس كل ما تقول إذا قلته لهم همسًا». هذه الحكمة أو التجربة واقعية ولها حظ كبير من الثبات، وبعضهم يعدها قانونًا جاء به مورفي، وهو كابتن ومهندس في القوات الجوية الأمريكية قال: «لو هناك احتمال حدوث خطأ ما فسوف يحدث». فتداولها العاملون معه وتبنتها ناسا ونشرتها الصحف ودرستها الأكاديميات، وبعدها انتشر قانون مورفي وكل الحكم والمقولات التي تتعلق بالتشاؤم الساخر.\n\nومن قوانينه: فرصة نسيان شيء مهم تتناسب طرديًا مع أهميته. وإذا وصلت إلى المحطة باكرًا تأخر القطار، وإذا كنت مستعجلًا فاتك القطار. وإذا ضاعت وثيقة فلن تجدها إلا بعد استخراج بدل فاقد. ومن القوانين المضحكة الواقعة: المسار الآخر للسيارات يتحرك دائمًا أسرع من الذي تسير فيه، وقس عليه طوابير الانتظار. ومما حصل لي ضياع بطاقتي فوجدتها بعد استخراجها من الأحوال. وليست قوانين مورفي رسمية، لكنها تصف مواقف يومية ساخرة تتكرر مع الناس.'},
      {member:'محمد عبدالعزيز العمر',title:'أعمى بويزو وفراسة التجارب',date:'١٥/٨/٢٠٢٦',body:'إن المحقق والمحامي يشبه أعمى بويزو؛ لا يرى الحقيقة كاملة، بل يلتقط التفاصيل الصغيرة بملقاط السنين. والتجارب تصنع فراسة عجنتها السنون، ويدرك بها العلاقة بين المتشابهات والمختلفات، وحواس أخرى تنسج خيوط الفراسة.\n\nتدربه القضايا على أن يميز بين صراخ وصراخ، وبين ارتباك وآخر، وبين كذبة عابرة وكذبة محبوكة، وبين الغبي الذي يكذب فيفضحه كلامه، والمتغابي الذي يفسد الحقيقة بتذاكيه، والصادق الذي قد يتلعثم فيخشى العقوبة لكن ملامحه تنبئك بالصدق.\n\nومثله الوكيل والموجه في المدرسة؛ لكثرة ما رأوا من الطلاب والمعلمين والآباء جعلتهم يقرأون الموقف قبل أن تنتهي القصة. يعرفون من نبرة الطالب إن كان خائفًا أو متصنعًا للخوف، ومن شكوى المعلم إن كان جادًا أو يبحث عن عذر، ومن حديث الأب إن كان ملغمًا أم صادقًا.\n\nوالأب والأم لا يختلفان كثيرًا؛ فسنوات العشرة مع أبنائهم تجعلهم يميزون صمتًا عن صمت، ولطفًا عن خبث، ويعرفون من طريقة فتح الباب أن وراءه فرحًا أو مشكلة، بل ومن نبرة الصوت عبر الهاتف وتوقيت الاتصال. ولا أبالغ إن قلت إن عدد رنات الجوال يعطيهم تصورًا عن الحدث؛ ومن كلمة «ما في شيء» أن هناك أشياء كثيرة.\n\nهذه ليست حاسة سادسة، بل سابعة وثامنة، ولا فراسة يولد بها الإنسان؛ إنها فراسة صنعتها التجربة. فكما جعل أعمى بويزو - كما وصفه ديدرو في رسالته حول العميان - من يديه ميزانين دقيقين ومن أصابعه فرجارًا ذا خبرة، تصنع التجارب من الإنسان ميزانًا داخليًا يزن به الأصوات والعبارات والتصرفات.'},
      {member:'محمد عبدالعزيز العمر',title:'إعادة قراءة الكتب (تجربة مذكرات عربي أفغاني)',date:'٢٢/٨/٢٠٢٦',body:'نادرًا جدًا ما أعيد قراءة كتاب مرة أخرى، وهذا من عيوبي، إلا أن تكون الإعادة عن طريق الخطأ، وهذا - ولله الحمد - من فطنتي وذهانتي، أو يكون الكتاب للمازني.\n\nأما الخطأ فقد وقع لي مع كتاب «مذكرات عربي أفغاني»؛ أسرتني مقدمته، فاسترسلت في القراءة، ثم أخذني شعور غريب بأن هذا الكلام قد مر علي من قبل. بحثت في تدويناتي، فإذا بي قد قرأت الكتاب قبل سنتين أو ثلاث - شك من الرائي وهو ثقة ثبت. وبالعادة إذا علمت أنني قرأت الكتاب من قبل أو أنه قد مر علي فإني أتوقف مباشرة ولا أكمله، لكن هذا الكتاب كان استثناء؛ إذ أكملت قراءته بسبب طريقته في السرد، ولا سيما حديثه عن ذهابه إلى الجهاد وعن وصف تلك المرحلة، مرحلة التسعينات الميلادية.\n\nوهذا الأمر لا يحصل لي وحدي؛ فقد اطلعت على كثير من القراء والأدباء ممن يقولون إنهم أعادوا قراءة كتاب ولم يتذكروا مطلقًا أنهم قرأوه من قبل، حتى يفاجئهم في النهاية تدوين أو ملاحظة كتبوها في آخر الكتاب أو في بدايته. وعليكم بقول: ما شاء الله تبارك الرحمن؛ فإن عيون الحساد مستيقظة.'},
      {member:'محمد عبدالعزيز العمر',title:'الذاكرة الحالمة',date:'٢٦/٨/٢٠٢٦',body:'استدعاني هذا المصطلح لما سمعته من الباحث المصري المتخصص بالأندلس الدكتور إبراهيم العسال، وأشار إلى أن العرب يبرز عندهم مفهوم الذاكرة الحالمة؛ فتتبعت المصطلح واستخداماته ومعناه فوجدت أنها موجودة عند كل الأعراق والأديان دون استثناء.\n\nوقد يتساءل أحدنا: ماذا نقصد بالذاكرة الحالمة؟ ولماذا طرحتها في هذا الوقت؟ قبل الإجابة أبدأ بسؤال آخر: متى نستخدم الذاكرة الحالمة؟ ومتى نستلذ بها؟ تكون جميلة مع كثرة المآسي والمصائب حول الإنسان أو بما أصابه، أو بعد أن تسد الأبواب في وجهه وتغلق نوافذ الفضاء من حوله ويشعر أن الخيارات تصغر والمساحات تضيق.\n\nهنا علينا أن ننشط الذاكرة الحالمة؛ نستدعي مفاخر المسلمين والعرب والنفس، ونستحضر من الماضي ما يبعث الأمل ويقوي العزيمة ويعين على مواصلة الطريق، بعد اللجوء إلى الله والاستعانة به. ونحتاجها في سفراتنا أيضًا؛ فلا نبدأ الرحلة باستعراض العقبات وتوقع المتاعب وصناعة التوتر واستحضار أسوأ الاحتمالات، بل نستدعي الجميل من الذكريات ونتخيل الجميل القادم.\n\nوالذاكرة الحالمة هي استدعاء الماضي مع تجميله وزركشته وتسويقه وتسويغه وتزويقه؛ نأخذ منه ما يبهج النفس ويعين على احتمال الحاضر، ونترك للذكريات مساحتها الجميلة في الذاكرة. وهي تقع بين طرفي نقيض؛ لا تصلح للمتشائم ولا للمفرط في التفاؤل الذي يغطي الواقع بالإيجابية السامة. إنما نأخذ منها بقدر ما يشبع الحاجة ويمنح النفس فسحة، مع بقاء العين مفتوحة على الحقيقة.\n\nولعل أجمل ما فيها أنها تضفي شعورًا بالأمل وراحة البال، فتغير الطريقة والنظرة لما حدث، وتعطي بصيصًا من الأمل وفسحة من الوقت للراحة والهدوء والاسترخاء.'},
      {member:'محمد عبدالعزيز العمر',title:'ذكريات لقاء خطاط المصحف الشيخ د. عثمان طه في المدينة',date:'١٣/٩/٢٠٢٦',body:'تشرفت بالجلوس مع خطاط المصحف الدكتور عثمان طه لمدة أربع ساعات من أجمل اللقاءات. سيرة الشيخ تستحق أن تمثل، وخاصة أنه لا يزال على قيد الحياة. لو كان الشيخ عثمان طه من علماء الغرب لشاهدنا له أفلامًا وروايات.\n\nسيرته في الصغر مليئة بالعبر، وكيف كان عشقه للحرف العربي. قال له والده خطيب القرية وعالمها: اترك عنك الخط واطلب العلم، كأنك ستكون كاتبًا للمصحف؛ فلم يكن يتوقعه والده. هاجر من القرية إلى حلب بحجة الدراسة والعلم وهو يخفي في نفسه البحث عن علماء وفطاحل الخط، ويسرق وقت المساء في النظر إلى خطهم ومشاهدة إبداعاتهم. ومن بروزه وتفوقه أخذ الابتدائية في سنة أو سنتين.\n\nكان الشيخ يجيد الرسم لذوات الأرواح فنهاه والده، فعوضه الله أن كان كاتب المصحف الأول في العالم. يقول: بيت لا خط فيه أو لا لوحة فيه من الحرف العربي لا جمال فيه. الشيخ واسع الصدر، يحب الجمال وصاحب طرفة ونكتة ومزح. كتب المصحف أكثر من أربع عشرة مرة، ويجلس في كتابته مع مراجعته ثلاث سنوات. ملايين النسخ تقرأ من المصحف بخطه؛ يا ترى ما الأجر؟ الخط الجميل لسان اليد، والخطاط يعشق الجمال ويحبه ويتذوقه.\n\nتحدث عن أنواع الخطوط وقال إن النسخ هو المناسب للمصحف والكتب والمجلات والجرائد، وخط الثلث ملك الخطوط. له خط خاص بالكمبيوتر وكذلك في كتابة المصحف. أبى إلا أن يودعنا بهدايا من خطوطه الجميلة، شكر الله له صنيعه. نسأل الله لنا وله التوفيق والسداد.\n\nكان اللقاء الماتع مع الشيخ عثمان طه مغرب يوم الأحد ٢٢ صفر ١٤٣٦هـ في بيته في المدينة المنورة.'},
      {member:'محمد عبدالعزيز العمر',title:'مقدمة كتاب أنيس منصور حول العالم في ٢٠٠ يوم وطرافة رحلاته',date:'٢٨/٩/٢٠٢٦',body:'يقول أنيس منصور في مقدمة الطبعة الثانية أو الثالثة - نسيت - من كتابه «حول العالم في ٢٠٠ يوم» إن هذه الطبعة تختلف عن سابقتها في أمر مهم جدًا: أنه حذف كلمة «جدًا» من «جدًا جدًا جدًا»؛ فقد كان في الطبعة الأولى يقولها ثلاث مرات، أما في الطبعة الثانية فقد رأى أن مرتين تكفيان!\n\nوهذا من الكتب الجميلة التي يتحدث فيها أنيس منصور عن رحلاته، وكعادته يأخذك معه إلى كل شيء؛ فيقول إنه سكن جميع المساكن، ودخل جميع المستشفيات، ونام في جميع الأجواء، وركب جميع المواصلات كالحناطير مثلًا، وأكل جميع الأكلات حتى الثعابين، إلى آخر تلك التفاصيل التي تجعل الرحلة عنده رحلة في الدنيا كلها لا في البلدان وحدها. ولو زاد حبتين لبلغ مبلغ ابن بطوطة الطنجي.\n\nوهو من الكتب التي تستحق القراءة ومسلية، خاصة لمن يحب أنيس منصور حين يحول الرحلة إلى حكايات وملاحظات وتأملات، وفيها من طرافته الشيء الكثير.'},
      {member:'عبدالله إبراهيم الشبرمي',title:'داء الوتيرة السريعة واستعادة فضيلة الصبر',date:'٧/٦/٢٠٢٦',body:'نقاش فكري:\n\nألاحظ في الفترة الأخيرة انتشار ما يمكن تسميته بـ«داء الوتيرة السريعة»؛ وكأن أغلب الأشخاص أصبح لا يطيق الانتظار لأي شيء، حتى في الأمور المتعلقة بصحته أو مستقبله، الكل يريد النتائج فورًا، والإنجاز حالًا، والحلول الآن.\n\nبصراحة لا أملك تفسيرًا علميًا أو طبيًا دقيقًا لهذه الظاهرة، لكن أتساءل: هل السبب تسارع وتيرة الحياة والأحداث من حولنا؟ أم أن الاعتياد على المقاطع القصيرة والمحتوى السريع جعل صبرنا أقل وقدرتنا على الانتظار أضعف؟ هل تلاحظون هذا الأمر أيضًا، أم أنها مجرد ملاحظة شخصية؟\n\nلذلك ربما التحدي الحقيقي اليوم ليس في زيادة السرعة، بل في استعادة فضيلة الصبر. رسالة تصل فورًا، معلومة تبحث في ثوانٍ، طلب ينجز بضغطة زر... مع الوقت يصبح الانتظار استثناء لا قاعدة.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'ضوابط العرف واللباس وفهم التاريخ في سياقه',date:'٨/٥/٢٠٢٦',body:'كلما زادت مرتبة الإنسان كان أخذه للمروءة ألزم، وتركه لها صار عيبًا في حقه، والناس مراتب. كما ورد عن الشافعي فيما معناه: لو كان شرب الماء البارد من خوارم المروءة لتركه.\n\nوالتزام صاحب المكانة بكمال المروءة أدعى لتقدير الناس له وقبول كلامه. والعرف معتبر في الزينة واللباس. لكن اسأل نفسك: هل تلبس البنطال في الزواج؟ أم يعتبر عيبًا ومنقصة؟ ستقول: العرف هو لبس الثوب والغترة أو الشماغ؛ هنا تبين لنا ما هي الزينة والكمال في اللباس في عرفنا.\n\nأما مسألة أن لبس البنطال كان يعد جريمة، فليس السبب هو العرف في تجريم الأمر، بل مرجعه لمسألة فقهية اختلف فيها العلماء وقتها: هل البنطال يعد لباسًا عرف واشتهر عن غير المسلمين، فيعتبر من لبسه متشبهًا بهم؟ أم أن البنطال صار لباسًا عامًا استفاض لبسه ولا يختص به غير المسلمين، فصار لبسه جائزًا ما دام ليس بضيق ولا قصير؟ وهذا قول كثير من العلماء الآن.\n\nوهنا نقطة مهمة، وهي معرفة تاريخ كل قضية ودواعي إنكارها وتشنيعها؛ فليس صحيحًا أن يأتي من بعد جيل فيتعجب أو يستنقص ما قيل في تلك الفترة قياسًا على زمانه الآن. ولست أقصدك يا أبا خليل، لكن أقصد ما نسمع كثيرًا ممن يعلق على أشياء حصلت في التاريخ. والله أعلم.'},
      {member:'عبدالعزيز بن إبراهيم الدوسري',title:'خاطرة للسهارى: كيف تتعامل مع الرغبة في الذنب؟',date:'١٧/٨/٢٠٢٥',body:'أسوأ ما في الذنب هو الإدمان عليه، وأصعب ما على المدمن ترك إدمانه. لكن هناك أمر مشترك بين مدمني المعاصي: أنهم غالبًا يربطون توبتهم بزوال رغبتهم في الذنب، أو يحاولون دائمًا إضعاف هذه الرغبة أو تهميشها.\n\nوالحقيقة أن أغلب الذنوب مرتبطة بغرائز بشرية طبيعية، غرائز خلقها الله لحكمة وجعل لها طريقًا مشروعًا وسليمًا. لكن عندما تساق هذه الغرائز في اتجاه خاطئ يحدث الصدام؛ يقع المذنب في الذنب ثم يسأل نفسه: كيف أقلل رغبتي في المعصية؟ هذا سؤال مشروع، لكن برأيي هناك سؤال أهم: كيف أتعامل مع هذه الرغبة؟\n\nجوابي ببساطة:\n١- لا تحارب الرغبة. لا تحاول تقليلها أو إلغاءها أو تهميشها، بل تعامل معها على أنها فكرة عابرة موجودة، لاحظتها فقط، ثم تجاهلها.\n٢- إن اشتدت الفكرة وألحت عليك، فتذكر النقطة الأولى، ثم واجهها بجواب واحد ثابت: «إني أخاف الله رب العالمين». بعدها انتقل مباشرة إلى شيء يشغلك.\n٣- تذكر أن للغرائز مسارًا صحيحًا؛ إن لم يتيسر لك هذا المسار، لا تحارب الغريزة ولا تهمشها، بل تقبل وجودها واحتسب تركها لله، وكلما زادت شدتها قل لنفسك: تركتها لله، والله سيعوضني بما هو أجمل.\n\nأخي الحبيب، تذكر دائمًا: أنت لست مطالبًا بمحاربة الخواطر أو الأفكار، ولست محاسبًا عليها، إنما المحاسبة على الفعل. قال نبيك ﷺ: «إن الله تجاوز عن أمتي ما حدثت به أنفسها ما لم تعمل أو تتكلم». محبك: العز الدوسري.'},
      {member:'صالح جاسر الجاسر',title:'مقال بمناسبة اليوم العالمي للكتاب',date:'٢٣/٤/٢٠٢٦',body:'القارئ الحقيقي ليس من ينهي الكتاب، بل من يتغير بعده فكريًا.\n\nكيف يصنع الكتاب أثرًا؟ القراءة تقود إلى فهم، والفهم يقود إلى وعي، والوعي يتحول إلى سلوك، والسلوك يصنع تأثيرًا. لكن المشكلة أن كثيرًا يقرأ وقليلًا يتأثر؛ والسبب غالبًا قراءة سطحية أو بلا تطبيق.\n\nفكرة للنقاش: أخطر نوع من القراءة قراءة لا تغير شيئًا في حياتك وآخرتك.\n\nمستقبل الكتاب: في زمن الذكاء الاصطناعي والمحتوى المعلب، هل سيختفي الكتاب؟ الجواب: لا، لكنه سيتغير؛ سيصبح مصدر عمق مقابل سرعة المحتوى للوصول للفائدة، ومرجعًا للتفكير لا مجرد معلومة.\n\nسؤال مهم: هل الجيل القادم سيقرأ ليعرف أم سيقرأ ليفهم نفسه؟ ليس لدي الإجابة.\n\nخاتمة: الكتاب لم يعد الخيار الوحيد للمعرفة، لكنه ما زال الطريق الأهم لبناء الإنسان. السؤال الحقيقي: ما واجبنا تجاه الكتاب؟ بل ماذا سنكون بدونه؟'},
      {member:'معاذ عطافي',title:'خاطرة وعظية: لا تكن ضيفًا مستعجلًا على ربك!',date:'٣٠/٧/٢٠٢٦',body:'لا تكن ضيفًا مستعجلًا على ربك!\n\nالبعض إذا دخل الصلاة ظن أن المطلوب هو الوصول إلى السلام بأقصر وقت ممكن؛ يركع بسرعة ويسجد على عجل ويعلم بأن المهمة قد انتهت، وكأن الصلاة سباق مع عقارب الساعة لا وقوف بين يدي رب الأرض والسماء.\n\nأما إذا دخل إلى مديره أحسن الوقوف والكلام.\n\nرأى النبي ﷺ رجلًا يصلي بلا طمأنينة فقال له: «ارجع فصل فإنك لم تصل». كررها عليه ثلاثًا حتى علمه الصلاة الصحيحة.\n\nلا تجعل همك أن تنتهي من الصلاة، بل اجعل همك كيف تقبل على مالك الملك؛ هي دقائق تصليها قد تكون آخر عهد لك. راقب صلاتك قبل أن تراقب ساعتك.'}
    ];

      {title:'الرد على الجهمية — عثمان بن سعيد الدارمي (تحقيق بدر البدر)',date:'٧/١٢/٢٠٢٣',body:'عدد الصفحات: ١٨٦\n\nرد المؤلف على الجهمية المعطلة الضلال مثبتًا صفات الله سبحانه بالأدلة من القرآن والسنة وأقوال الصحابة والتابعين ومن تبعهم بإحسان. وتطرق إلى إثبات الكلام واليد والوجه والنزول والرؤية والعلم والسمع والبصر والاستواء وغيرها، ثم تكلم عن الواقفين بين القول بخلق القرآن والقول بتنزيله، وحكم الجهمية وقتلهم وهل يستتابون أم لا. كتاب قديم متجدد ينقل قارئه من عالم الغفلة إلى عالم الارتقاء الإيماني.'},
