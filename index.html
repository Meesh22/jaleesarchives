    const MOHAMMED_DUBAIKHI_QUOTES = [
      { title: 'المواهب الربانية من الآيات القرآنية — السعدي ص٦٢', body: 'وَلا تَمُدَّنْ عَيْنَيْكَ: نهى الله رسوله أن يمد عينيه إلى ما متع به هؤلاء ومد العين هو التطلع والتشرف لذلك لا مجرد نظر العين وإنما هو نظر القلب، ولهذا لم يقل ولا تنظر عيناك إلى ما متعنا به أزواجاً (الآية) فمد العين متضمن لاستحسان القلب.' },
      { title: 'المواهب الربانية من الآيات القرآنية — السعدي ص٢٨', body: 'ذكر الله تعالى مرقع للخلل، متمم لما فيه نقص، ودليله قوله تعالى - بعد ما ذكر صلاة الخوف وما فيها من عدم الطمأنينة ونحوها - قال: (فَإِذَا قَضَيتُمُ الصَّلَاةَ فَاذْكُرُوا اللَّهَ قِيَامًا وَقُعُودًا وَعَلَى جُنُوبِكُم) أي: لينجبر نقصكم وتتم فضائلكم.' },
      { title: '١٤٦ كلمة في النعيم النفسي ص٩٩', body: 'إذَا لَمْ تَجِدِ العَمَلَ اللَّذِي تحب فيجب أن تحب العمل الذي وجدت، والمعنى تأقلم مع ظروف وظيفتك. والمقحم يقول: إن ما لقيت اللي تحب .. لازم تحب اللي لقيت / أصعب حياة تعيش ما عندك حياة تحبها.' },
      { title: 'كلمة في النعيم النفسي ص٢٦', body: 'اجعل لك في كل يوم إنجازًا صغيرًا متنوعًا لأن الإنجاز يسعد النفس ويشعرها بقيمتها، مثال: قراءة جزء من القرآن، المشي نصف ساعة، قراءة عشرين صفحة من كتاب نافع، كتابة تأملات في الحياة، مشاهدة محاضرة نافعة في أي مجال يعجبك.' },
      { title: 'جوزيات ص٤٢', body: 'امزج طلب الفقه والحديث بمطالعة سير السلف والزهاد في الدنيا ليكون سببًا لرقة قلبك.' },
      { title: 'جوزيات ص٧٨', body: 'التخطيط المالي لمرحلة الشيخوخة عند ابن الجوزي: ينبغي أن يستعد المرء لآخر عمره بالمال؛ مخافة أن يحتاج فيذل، ولأن يخلف لعدوه أولى من أن يحتاج إلى صديقه.' },
      { title: 'مع ابن تيمية ص٩١', body: 'ألاحظ اندماجًا كبيرًا بين أقوال أهل الكلام وعقائدهم والمذاهب الأربعة... فاعتقاد الشافعي رضي الله عنه واعتقاد السلف الأئمة كمالك والثوري والأوزاعي وابن المبارك وأحمد بن حنبل وإسحاق بن راهويه هو اعتقاد المشايخ المقتدى بهم...' },
      { title: 'مع ابن تيمية ص٧٦', body: 'وقد يكون الرجل من أذكياء الناس وأحدهم نظرًا، ويعميه [الله] عن أظهر الأشياء، ويكون من أبلد الناس وأضعفهم نظرًا ويهديه لما اختلف فيه من الحق بإذنه، فلا حول ولا قوة إلا به. فمن اتكل على نظره واستدلاله أو عقله ومعرفته خُذل...' },
      { title: 'جواهر الأدب ص٢٤٣', body: 'سَيَذكُرُني قَومي إِذا جَدَّ جِدُّهُم / وَفي اللَيلَةِ الظَلماءِ يُفتَقَدُ البَدرُ / وَنَحنُ أُناسٌ لا تَوَسُّطَ عِندَنا / لَنا الصَدرُ دونَ العالَمينَ أَوِ القَبرُ — أبو فراس الحمداني.' },
      { title: 'الأنس بالراحلين ص٩٣', body: 'كانت حياة آغا خان عريضة ومليئة بالترحال والمشاريع... يمكنني القول صادقًا كل الصدق: إن السأم لم يتسرب إلى نفسي لحظة واحدة طوال حياتي المديدة؛ وسر ذلك أن عقله كان دومًا مشغولًا بما هو خارج ذاته من مهام؛ مما جعل السأم والاكتئاب لا يهتديان لنفسه سبيلًا.' },
      { title: 'مجالس تدارس القرآن ص١٤', body: 'تدارس القرآن: تناول آيات القرآن من مجموعة من المتدارسين: ١- لتصحيح القراءة، ٢- والنظر والتأمل في الآيات، ٣- لاستخراج ما تضمنته من المعاني والدلالات والهدايات، ٤- وترويض النفس وتزكيتها بهدايات القرآن وأخلاقه.' },
      { title: 'المذهبات ص١٦٥', body: 'قال أبو علي الحسن بن علي الدقاق رحمه الله: (مَنْ أكثر من ذكر الموت أكرم بثلاثة أشياء: تعجيل التوبة، وقناعة القلب، ونشاط العبادة. ومن نسي الموت عوقب بثلاثة أشياء: تسويف التوبة، وترك الرضى بالكفاف، والتكاسل في العبادة).' },
      { title: 'بيني وبين أخوتي ص١٣٠', body: 'موقف وفاء: أحدهم احترق بيته فجمع إخوته مبلغًا رمزيًا لإعمار جزء من البيت، فقال لهم: «أنا قادر»، فقالوا: «لا تهمنا مقدرتك وإنما يهمنا أن نريك أننا مع بعضنا».' },
      { title: 'أعمق من كلمة ص٧٧', body: 'في الحوار، مهمتك تنتهي ببيان رأيك، وتوضيح أدلتك، أما مهمة إدخال ذلك الرأي إلى رأس صاحبك، فدعه للزمن.' },
      { title: 'بيني وبين أخوتي ص١٣', body: '﴿وقالت لأخته قصيه﴾ ﴿سنشد عضدك بأخيك﴾ في صغره وقفت معه أخته وفي كبره أخوه. وإن بلغت مقام النبوة لا غنى لك عن دفء الأخوة.' },
      { title: 'دون المنحدر ص١٩٠', body: 'إن التفريق بين الرجل والمرأة في بعض الأحكام والحقوق والواجبات بحسب ما يلائم طبيعة كل منهما... وينظر إليه المسلم على أنه من رحمة الله وعلمه بخلقه.' },
      { title: 'كتاب التركيز ص١١٥', body: 'قل لي من تصاحب.. أقل لك من أنت! (من تصاحب) لا يُقصد بها فقط أصدقاؤك في الاستراحة، وإنما تمتد إلى دائرة أوسع، إلى وسائل التواصل الاجتماعي...' },
      { title: 'كتاب التركيز ص٦١', body: 'العمر ببساطة يمضي بسرعة... لنفترض أنك قررت تخصيص ساعة يومية لفعل ثلاثة أشياء أساسية: ربع ساعة لحفظ القرآن، ونصف ساعة لرياضة المشي، وربع ساعة لقراءة كتاب...' },
      { title: 'كتاب هذا ربي ص٢٢', body: 'من التأملات في اسم الله الوهاب شمول هباته للأمور الحسية والمعنوية: الولد من هبات الله تعالى... والعلم من هبات الله تعالى... والمال من هبات الله تعالى...' },
      { title: 'كتاب هذا ربي ص١٠٦', body: 'التأمل في اسم الله الشكور: حث على عمل الخير، وبذل الإحسان، لعلمك بأن ربك سيشكر لك كل صنيع الخير منك، فيعطيك أكثر مما قدمت فله الحمد سبحانه.' },
      { title: 'أيام القراءة', body: 'بروست يتحدث عن الميزة التي تمتاز بها القراءة عن الصداقة: في القراءة تعود الصداقة فجأةً إلى نقائها الأصلي، ليس ثمة ود زائف حيال الكتب...' },
      { title: 'ناجحون ليسوا عباقرة ص٩٦', body: 'النجاح أن تعمل وفق طاقتك وإمكاناتك، وأن تقدم ما تستطيع؛ فالجزاء في الآخرة مبني على القدرة والاستطاعة.' },
      { title: 'أركان الحياة بالقرآن ص١٥', body: 'فَأَيُّ آيَةٍ تَقْرَؤُهَا دُونَ حُضُورِ قَلْبٍ وَإِنْصَاتٍ فَأَعِدْهَا وَلَوْ عِشْرِينَ مَرَّةً. لا تَسْمَحْ لِنَفْسِكَ أَبَداً أَنْ تَقْرَأَ كَلَامَ رَبِكَ الْعَظِيمِ وَقَلْبُكَ مَشْغُولٌ بِغَيْرِهِ...' },
      { title: 'مفاتح ذكر الله وطمأنينة النفس ص١٨', body: 'إِنَّ الْقَلْبَ أَشْبَهُ مَا يَكُونُ بِمِذْيَاعِ قَنَاةِ تِلِفِزْيُونِيَّةٍ أَوْ صَوْتِيَّةٍ، يَعْمَلُ عَلَى مَدَارِ السَّاعَةِ، فَإِنْ كُنْتَ أَنْتَ الْمُتَكَلِّمَ أَمْسَكْتَ بِهِ، وَإِنْ سَكَتَ وَغَفَلْتَ وَلَوْ لَحْظَةً تَكَلَّمَ بِهِ غَيْرُكَ...' },
      { title: 'القراءة بقلب ص٣١', body: 'مِقْوَد القلب هو اللسان... قيادة النفس تكون من خلال قيادة اللسان. على مبدأ: نفسك إن لم تشغلها بالحق شغلتك بالباطل.' },
      { title: 'القراءة بقلب ص١٣', body: 'يقول الشيخ ابن عثيمين في تفسير جزء عم ص١١٩: ولكن الشيطان يجري من ابن آدم مجرى الدم... صليت بجسمك لكن لم تصل بقلبك.' },
      { title: 'أسامة بن منقذ', body: 'ابن منقذ يصف حاله نهاية عمره بوصف مؤلم... مع الثمانين عاث الدهر في جلدي / وساءني ضعف رجلي واضطراب يدي...' },
      { title: 'البيان والتبيين ٢/٤٥', body: 'مكانة جليس عند سليمان بن عبدالملك: قال سليمان بن عبد الملك: قد ركبنا الفاره وتبطنا الحسناء... فما أنا اليوم إلى شيء أحوج مني إلى جليس يضع عني مؤونة التحفظ.' },
      { title: 'البيان والتبيين الجزء الثاني ص٤٤', body: 'قال عتبة بن أبي سفيان لمؤدب ولده: علمهم كتاب الله، ولا تكرههم عليه فيملوه، ولا تتركهم منه فيهجروه...' },
      { title: 'التفكير الناقد ص٤٢', body: 'حدود العقل: وليس العقل بقادر على أن يدرك كل شيء في الوجود... قال ابن القيم رحمه الله: إذا تعارض النقل وهذه العقول أخذ بالنقل الصحيح، ورمى هذه العقول تحت الأقدام.' },

      {title:'التربية بالحوار مع الشباب ص٩',body:'وفي العصر الحاضر تزداد أهمية التربية بالحوار مع الشباب بسبب طبيعة هذا العصر الذي نعيشه؛ حيث كثرت فيه مخاطر الغزو الفكري والثقافي، وتنوعت فيه سلبيات التقنية والاتصالات؛ حتى أصبحت وسائل الإفساد قوية وجذابة ومؤثرة، وانقلبت فيه الموازين واختلطت فيه القيم ومعايير السلوك وانتشرت الدعوات الباطلة والأفكار الضالة والانحرافات الفكرية والسلوكية. — د. سعيد المغامسي.'},
      {title:'كيف تقنع الآخرين — عبدالله العوشن ص٩٣',body:'إن التظاهر بالقدوة الحسنة لا يكفي، ورداء ثقيل يصعب تحمله فلا بد أن ينكشف الغطاء يومًا ويظهر المعدن عاريًا، والتدين الحقيقي ملازم للنفس المؤمنة في السر والعلن، في الرخاء والشدة، في كل الأعمال والتصرفات.'},
      {title:'كيف تقنع الآخرين — عبدالله العوشن ص٥٣',body:'يلعب صوت المذيع كقوة إيحائية دورًا مهمًا في الإقناع، كرفع الصوت عند الاستفهام أو التعجب، ومن الضروري انتقاء الألفاظ القادرة على إثارة مناظر حية بأكملها في ذهن المستمع.'},
      {title:'كيف تقنع الآخرين — عبدالله العوشن ص١٥',body:'إذن نخلص من ذلك كله إلى أن لمادة (ق ن ع) ثلاثة معانٍ: القناع، وهو ما تغطي المرأة به رأسها؛ والإقناع، السؤال بتذلل؛ والاقتناع، الرضا بالفكرة والقبول بها. والاقتناع نتيجة محاولات الإقناع، والإقناع هو: «عمليات فكرية وشكلية يحاول فيها أحد الطرفين التأثير على الآخر وإخضاعه لفكرة ما».'},
      {title:'عقبات خفية في طريق الشباب — عبدالكريم القصير ص٧٤',body:'لقد كان محمد - صلى الله عليه وسلم - في شتى المناسبات يدرب أصحابه على حمل المسؤولية؛ ليضطلعوا بأعباء القيادة من بعده، فكان يستشيرهم في كل مناسبة، وكثيرًا ما يعدل عن رأيه إلى رأيهم؛ لأن في رأيهم صوابًا.'},
      {title:'عقبات خفية في طريق الشباب — عبدالكريم القصير ص٣٦',body:'الحساسية المفرطة: وجود الحساسية المفرطة لدى المتربي مما يجعله يتهم نفسه بأنه هو المعني بكل شيء، فالمتربي المرتاب الذي يفسر المعاني والألفاظ بتفسير ظني وهمي، أو يراقب تصرفات الآخرين وحركاتهم بدقة وحساسية؛ سيموت غمًا وهمًا.'},
      {title:'عقبات خفية في طريق الشباب — عبدالكريم القصير ص٢٠',body:'حينما يتهم المتربي المربي في نيته، ويدخل في السرائر، فإنه ولابد أن يفسر كل تصرف يفعله المربي بأن وراءه شيئًا، فتبدأ حبائل الشيطان تلعب على وتر، وهنا يحصل الخلاف والفرقة، ويبدأ التفكير لدى المتربي للانفصال عن هذه المؤسسات التربوية. يقول الدكتور مصطفى السباعي: «لأن تحسن الظن فتندم، خير من أن تسيء الظن فتندم».'},
      {title:'عقبات خفية في طريق الشباب — عبدالكريم القصير ص١٤',body:'والقناعة الذاتية بأن ما نواجهه من مشكلات اجتماعية تربوية معقدة أو غيرها أمر طبيعي يحتاج منا إلى عمل مستمر متواصل؛ لمحاولة التحرك إلى الاتجاه الصحيح، والتقدم إلى الأفضل.'},
      {title:'هكذا ربانا جدي علي الطنطاوي — عابدة العظم ص١٣٣',body:'المراجعة في الكتب: اجعلوا الكتاب رفيق أبنائكم منذ الصغر، وناقشوهم في مسائل العلم وعلموهم المراجعة في أمهات الكتب وعودوهم أن يبحثوا بأنفسهم في الكتب والمراجع عن أجوبة للأسئلة التي يسألون.'},
      {title:'هكذا ربانا جدي علي الطنطاوي — عابدة العظم ص٦٥',body:'العقاب الرادع: عقاب واحد في الوقت المناسب وبالطريقة الصحيحة يغني المربين عن عشرة. فإذا حزمتم مع أولادكم وشرعتم في العقوبة فاكبتوا عواطفكم ولا تتراجعوا ولا تفسدوا أثر الحزم بالعاطفة والدلال.'},
      {title:'هكذا ربانا جدي علي الطنطاوي — عابدة العظم ص٧',body:'فهو يفتح ويتصفح كل كتاب تصل إليه يده، فإن أعجبه أتم قراءته وإن لم يعجبه تركه إلى سواه. والقراءة أكثر عمل يصرف فيه وقته، فربما قرأ في اليوم الواحد ثماني ساعات أو تسعًا أو أكثر من ذلك، ويقرأ في كل موضوع...'},
      {title:'من الحوار مع الذات إلى الحوار مع الآخر ص١٥١',body:'أما على مستوى الممارسات المحورية التي كانت تشكل الموقف من قضية التعامل مع الآخر، فتنقل لنا أحداث السيرة النبوية استعانة الرسول - صلى الله عليه وسلم - بعبدالله بن أرقط وهو من المشركين... — محمد عبدالجواد.'},
      {title:'من الحوار مع الذات إلى الحوار مع الآخر ص١١١',body:'الحوار الفعال يتيح لنا تربية الأبناء على تفهم مشاعرهم والتعرف عليها بداية، إذ في هذا الحوار يكون هناك تواصل يسمح لكل منهم أن يعبر عما بداخله... — محمد عبدالجواد.'},
      {title:'من الحوار مع الذات إلى الحوار مع الآخر ص٣٣',body:'بحكم أننا بشر فإننا خطاؤون (كل ابن آدم خطاء وخير الخطائين التوابون)... فمع تقرير أن الخطأ لصيق بالإنسان، وإقراره بعيوبه ونقائصه، إلا أنه ليس مطلوبًا أن يكون سلبيًا إزاءها، بل محاولة تقويم ذاته تظل مستمرة وقائمة طالما كان الإنسان حيًا. — محمد أحمد عبدالجواد.'},
      {title:'من الحوار مع الذات إلى الحوار مع الآخر ص١٠ وص١٣',body:'من المقدمة: لماذا لا نعترف بالآخر ونحن مختلفون على مستوى التنوع اللساني واللغوي، ومختلفون على مستوى التنوع الديني... ومن ثم ينبغي أن نتبنى مفردات شتى في التربية على قيمة الحوار مع الآخر وغرس هذه القيم في نفوس أبنائنا منذ نعومة أظفارهم... — محمد أحمد عبدالجواد.'},
      {title:'إدارة الوقت والحياة — فالح الصغير ص٤٨',body:'بالكتابة يتفادى الإنسان النسيان، ويحافظ على أفكاره البعيدة والقريبة ويربط بينها، ليخرج بأفضل النتائج والثمرات.'},
      {title:'إدارة الوقت والحياة — فالح الصغير ص٢٤',body:'التسويف: وهو مرض فتاك يصيب الإنسان في عامل الزمن لديه، فلا أضر على الوقت والزمن من التسويف، وهو تأجيل المهام والأعمال عن أوقاتها لآجال أخرى...'},
      {title:'الذريعة إلى مكارم الشريعة — الراغب الأصفهاني ص٣٣',body:'العقل بصر القلب، وهو بمنزلة البصر من العين تدرك به المعلومات كما يدرك به البصر المشاهدات، قاله أبو الحسن علي بن حمزة الطبري.'},
      {title:'شرح حديث ماذئبان جائعان — ابن رجب ص٣٤',body:'الفرق بين البخل والشح: البخل هو إمساك ما في يده. والشح تناول ما ليس له ظلمًا وعدوانًا من مال غيره، حتى قيل: إنه رأس المعاصي كلها.'},
      {title:'شرح حديث ماذئبان جائعان — ابن رجب ص٢٤',body:'فهذا مثل عظيم جدًا ضربه النبي صلى الله عليه وآله وسلم لفساد دين المسلم بالحرص على المال والشرف في الدنيا...'},
      {title:'المذهبات من تراثنا التربوي ص١٥٣',body:'قال ابن القيم رحمه الله تعالى: «العارف لا يأمر الناس بترك الدنيا، فإنهم لا يقدرون على تركها، ولكن يأمرهم بترك الذنوب مع إقامتهم على دنياهم...»'},
      {title:'المذهبات من تراثنا التربوي ص٦٤',body:'لقد أصبحت حماية الشباب من سطوة الإعلام واجبًا تربويًا، لا يمكن تأخيره ولا تأجيله ولا الاستهانة به...'},
      {title:'المذهبات من تراثنا التربوي ص٥٤',body:'إن المطلوب الحقيقي من المربي هو أن يكون صالحًا وليس المطلوب منه أن يكون قدوة، فإذا أصلح المربي نفسه فلا محالة أن الآخرين سيقتدون به...'},
      {title:'المذهبات من تراثنا التربوي ص٤٦',body:'إصلاح الذات وتهذيب الروح وتزكية النفس أول جهد تربوي تقدمه للناس، وقبل أن تلتفت إلى إصلاح الآخرين عليك بإصلاح ذاتك التي بين جنبيك...'},
      {title:'كيف كان صلح الحديبية فتحًا مبينًا ص١٤',body:'ولقد كان أبو بكر رضي الله عنه يرى في الصلح بمجرد أن وقعه النبي صلى الله عليه وسلم مع قريش الخير والمصلحة للإسلام والمسلمين...'},
      {title:'الحياة الأسرية',body:'الرجل في الرؤية الإسلامية هو الذي يقود الأسرة، وحتى ينجح في قيادتها فإنه في حاجة إلى امتلاك ثقافة إدارية وتربوية جيدة...'},
      {title:'جامع العلوم والحكم — ابن رجب',body:'قال الإمام أحمد: حسن الخلق، أن لا تغضب ولا تحقد.'},
      {title:'مختصر المغالطات المنطقية',body:'التعريف التقليدي للمغالطات هو: «تلك الأنماط من الحجج الباطلة التي تتخذ مظهر الحجج الصحيحة». قلت: ومنها من يحتج بالاستنقاص من الطرف الآخر أو إسقاط كرامته ليغلبه.'}
    ];

      {title:'الحرب والسلام — تولستوي: نيكولا روستوف',body:'قصة نيكولا روستوف مع أبيه الكونت إيليا أندرييفيتش حين خسر في المقامرة، ثم لجأ إلى أبيه ليخرج من ورطته...'},
      {title:'الحرب والسلام — تولستوي: الصدق في السرد',body:'يقول تولستوي متحدثًا عن أحد الضباط الشباب الذي وقع جريحًا وفر من العدو: «لا يمكن لمن يسرد قصة طويلة أن يظل ملازمًا لجادة الصدق طوال الطريق، إلا إذا امتلك قدرة نادرة على كبح عواطفه ومشاعره...»'},
      {title:'الزركلي — الشراكسة والشيشانيون',body:'يخلط كثير من الناس بين الشراكسة والشيشانيين، وقد وضح الزركلي في زيارته لصويلح في عمان الفرق فقال: بعض الناس يسمي الفريقين شراكسة على أن بينهما فروقًا كثيرة في اللغة والعادات والمذهب...'},
      {title:'البئر الأولى — جبرا إبراهيم جبرا',body:'كانت والدتي تسمي المشفى والمستوصف (الصحيّة)... يقول جبرا في مذكرات طفولته الموسومة بـ(البئر الأولى) متحدثًا عن ساحة البير في بيت لحم...'},
      {title:'هوس القراءة — جو كوينن: اليوفوريا',body:'تسمى هذه الحالة (اليوفوريا)، وهي نشوة المتعة، ومنها أن المتعة قد تكون بالترك...'},
      {title:'جو كينن — هوس القراءة',body:'قراءة الكتب قد تجعلك أذكى من الآخرين، لكنها لا تجعلك أفضل منهم.'},
      {title:'إبراهيم أصلان — خلوة الغلبان',body:'«صديقي الناقد أفادته دراسته الأكاديمية حتى بات يكتب ويتحدث عن الكتب في وسائل الإعلام بكلام غاية في الجدية والفائدة دون أن يقرأها».'},
      {title:'المتمردون لوجه الله — محمود عوض',body:'يقول محمود عوض في المتمردون لوجه الله، متحدثًا عن سيرة رفاعة الطهطاوي...'},
      {title:'الذكريات — علي الطنطاوي ٢/٣١٩',body:'من طرائف الشيخ الطنطاوي: مللت من انتظار السيارة كل يوم لتحملني إلى المدرسة، فاشتريت دراجة وتعلمت ركوبها...'},
      {title:'د. ناصر البدر — خير جليس',body:'يقول الدكتور ناصر البدر: أما «خير جليس في الزمان كتاب» فهي نغمة الروح حين تأنس بفكرة، وتتشبث بحرف، وتجد في الصمت المصحوب بالحبر ما لا تجده في ضجيج الأسواق...'},
      {title:'أسماء مستعارة — عبدالرحمن منيف',body:'من يبحث عن العدالة المطلقة أبله. وعلى الإنسانية المعاصرة أن تتخلص منه بسرعة وبوسيلة فعالة!'},
      {title:'أسماء مستعارة — عبدالرحمن منيف ص١٢٢',body:'يقول عبدالرحمن منيف: «من الأمور التي تعذبني كثيرًا، ضعف الذاكرة. إن ذاكرتي ضعيفة لدرجة تشعرني بالتعاسة... وإذا أردت أن أوضحها لكم بعبارة واحدة أقول: البدء من النهاية».'},

      {title:'اقتضاء الصراط المستقيم ١/٨٠',body:'قال شيخ الإسلام: المشاركة في الهدي الظاهر تورث تناسبًا وتشاكلًا بين المتشابهين، يقود إلى موافقة ما في الأخلاق والأعمال...'},
      {title:'روضة المحبين ص٢٠١ — ابن القيم',body:'قال الإمام ابن القيم: «لو صور العلم صورة لكانت أجمل من صورة الشمس والقمر!»'},
      {title:'مذكرات كتبي — مكتبة العز',body:'من الطرائف أن بعض الكتبيين اقتنى ذكريات الطنطاوي وقرأها كلها في الأيام الأربعة الأولى من الامتحانات الجامعية، ورسب في تلك المواد الأربع... وكتابة الذكريات غالبًا إنما يكتبها أصحابها على كبر سن وخشية فوات حفظها...'},
      {title:'نور النبراس على سيرة ابن سيد الناس',body:'ممن ذكر من الجن أنهم صحابة: شاصر، وماصر، ومنشي، وماشي، والأحقب، وعمرو بن طارق، وعمرو بن جابر، ووردان، وسمحج، وهامة بن الهيّم، وعبدالنور، ومالك بن مالك، وزوبعة رضي الله عنهم.'},
      {title:'إعلام الموقعين — ابن القيم',body:'قال ابن القيم رحمه الله: «ليس في الشريعة حكم واحد إلا وله معنى وحكمة، يعقله من عقله، ويخفى على من خفي عليه».'},
      {title:'أثر عن ابن مسعود رضي الله عنه',body:'جاء عن زينب زوجة عبدالله بن مسعود رضي الله عنه قالت: كان عبدالله إذا جاء من حاجة فانتهى إلى الباب، تنحنح وبزق، كراهية أن يهجم منا على شيء يكرهه...'},
      {title:'تقديم كتاب العود الهندي للسقاف',body:'ذكروا له قريبًا من عشرين مؤلفًا... أما العود الهندي فكما قال من قدم لهذا الكتاب: «عشت مع السقاف في عوده الهندي فنسيت كل كتاب أدبي أو ديوان شعري قرأته...»'},
      {title:'وحي القلم — الرافعي: المرئي في الرائي',body:'ما أصدق ما قالوه: إن المرئي في الرائي. مرضت مدة في المصيف، فانقلبت الطبيعة العروس التي كانت تتزين كل يوم إلى طبيعة عجوز تذهب كل يوم إلى الطبيب...'},
      {title:'شرح منظومة الآداب للحجاوي — قيام الإمام أحمد',body:'قال المروذي: كنا عند أبي عبدالله أحمد بن حنبل إذا أراد أن يقوم يضع يده على فخذه مرتين أو ثلاثًا، فكنت ربما غمزت بعض أصحابنا فأقول: قم؛ فإنه يريد أن يقوم. وقصة قيام الإمام أحمد لأبي إبراهيم أحمد بن سعد الزهري...'},
      {title:'نقل أدبي — كتاب الجمهرة',body:'كان عند أبي الحسن الفالي نسخة فاخرة من كتاب الجمهرة لابن دريد، فاحتاج حاجة شديدة فباع الكتاب... فوجدت فيه هذه الأبيات...'},
      {title:'مختصر تفسير ابن كثير',body:'«ثلة من الأولين * وقليل من الآخرين»... و«ورهبانية ابتدعوها ما كتبناها عليهم»...'},
      {title:'أخلاق حملة القرآن — الآجري',body:'قال الآجري رحمه الله: أحب لمن كان يدرس وهو ماش في طريق، فمرت به سجدة أن يستقبل القبلة ويومئ برأسه بالسجود، وهكذا إن كان راكبًا فدرس فمرت به سجدة سجد يومئ نحو القبلة إذا أمكنه.'},
      {title:'ذخر المعاد في الصلاة والسلام على خير العباد ﷺ',body:'قال العلامة الفاكهاني: غاية مطلوب الأولين والآخرين صلاة واحدة من الله تعالى، وأنى لهم بذلك، بل لو قيل للعاقل: أيهما أحب إليك أن تكون أعمال جميع الخلائق في صحيفتك أو صلاة من الله تعالى عليك؟ لما اختار غير الصلاة من الله تعالى...'},
      {title:'زيارة مكتبة د. عبدالعزيز المقبل',body:'مقتطفات من زيارة مكتبة د. عبدالعزيز المقبل: ١٣ فائدة في القراءة التوليدية والمدارسة وتربية الأبناء، ونقولات متفرقة من تحفة المودود وأدب الإملاء والاستملاء للسمعاني ص١٨٤.'}
    ];

    const LATER_MEMBER_QUOTES = [
      {member:'رائد عبدالله القرعاوي',title:'سير أعلام النبلاء — الزواج من أجل الكتب',body:'من طرائف القراءة والبحث في الكتب، يقول الذهبي في سير أعلام النبلاء: تزوج إسحاق بن راهويه أرملة لأن زوجها المتوفى كانت عنده كتب الإمام الشافعي، فقيل له: ما حملك على ذلك؟ فقال: «تنكح المرأة لكتبها».'},
      {member:'رائد عبدالله القرعاوي',title:'كل يوم ناصية — الانتصارات اليومية',body:'لقد وجدت أن الفرح بالانتصارات اليومية الصغيرة يحقق لي أمرين مهمين هما: بناء الثقة بالنفس، وتجميع الانتصارات الصغيرة حتى أصل إلى الانتصارات الكبيرة.'},
      {member:'رائد عبدالله القرعاوي',title:'كل يوم ناصية — توماس ماكوين',body:'وقد أعجبت كثيرًا بالأديب توماس ماكوين حين قال: «الأدب هو الدرع الذي جعلني أتوقع كل مفاجآت الدنيا، ومنحني رؤية ما سيقع، والصبر حينما أبتلى، وشجاعة أن أواجه الموت غير آبه بشيء...»'},
      {member:'رائد عبدالله القرعاوي',title:'أبيات ابن العلاف في رثاء المبرد',body:'قصة من أشهر أخبار الأدب في القرن الثالث الهجري، وتدور حول إمامي النحو في زمانهما: المبرد وثعلب... «مات المبرد وانقضت أيامه / وليذهبن مع المبرد ثعلب / بيت من الآداب أصبح نصفه خربًا / وباقي النصف منه سيخرب... فتزودوا من ثعلب، فبكأس ما شرب المبرد عن قليل يشرب...»'},
      {member:'رائد عبدالله القرعاوي',title:'نشأة الإنسانية ص٤٣٠ — الخليل بن أحمد',body:'المقولة المنسوبة إلى الخليل بن أحمد الفراهيدي: «إن لم تعلم الناس ثوابًا، فعلمهم لتدرس بتعليمهم علمك، ولا تجزع بتفريع السؤال؛ فإنه ينبهك على علم ما لم تعلم». كما نسب إليه: «العلوم أقفال والسؤالات مفاتيحها».'},
      {member:'رائد عبدالله القرعاوي',title:'العالم في كتاب ص٧٦',body:'الكتب لم توجد لتزيد العاجزين عجزًا، ولا لتزود العاجزين عن الحياة بحياة وهمية زائفة يتخذونها عوضًا عن الحياة الحقيقية، بل للكتاب قيمة واحدة لا غير، فحواها أن يقود إلى الحياة، وأن يخدمها، وأن ينفع قارئه، وكل ساعة تنفق في قراءة لا تمنح القارئ شرارة قوة أو لمحة انتعاش أو نفسًا من هواء جديد، فهي ساعة ضائعة لا محالة.'},
      {member:'رائد عبدالله القرعاوي',title:'نور وهداية ص٥٠ — علي الطنطاوي',body:'رحم الله أستاذنا الفقيه الأديب القاضي الشيخ علي الطنطاوي؛ حيث قال: «لا تضيع أيام الصحة بالكسل، ثم تأسى في المرض على العجز عن العمل، ولا تضيع أوقات الفراغ باللهو والعبث، ثم تبكي عليها إذا ازدحمت عليك الأشغال وضاقت الأوقات».'},
      {member:'رائد عبدالله القرعاوي',title:'المذهبات — تأثير اللسان ص٢٦٠',body:'من أهم مخرجات التربية الإسلامية: شاب طويل الصمت، كاف لسانه عن قولة الحرام، متورع عن الحديث وقت الفتن، ولا يتكلم إلا بما يعنيه ويفيده، وإن هذا السلوك الصالح سيورثه صلاحًا في سائر أعماله وجوارحه، وصلاحًا ورقة في قلبه. فاللهم سدد ألسنتنا.'},
      {member:'رائد عبدالله القرعاوي',title:'تهذيب البداية والنهاية ص٤٦ — خطبة أبي بكر',body:'«وإنكم تغدون وتروحون في أجل قد غيب عنكم علمه، وإن استطعتم أن لا يمضي إلا وأنتم في عمل صالح فافعلوا، ولن تستطيعوا ذلك إلا بالله، وسابقوا في مهل آجالكم، من قبل أن تسلمكم آجالكم إلى انقطاع الأعمال، فإن قومًا نسوا آجالهم وجعلوا أعمالهم بعدهم، فإياكم أن تكونوا أمثالهم».'},
      {member:'عبدالرحمن بن أمين مجيد',title:'لباب الآداب — أسامة بن منقذ ١/٢٢٩',body:'قال عبدالملك بن مروان: ما الناس إلى شيء من الأدب أحوج منهم إلى إقامة ألسنتهم التي بها يتعاودون الكلام، ويتعاطون البيان، ويتهادون الحكمة، ويستخرجون غوامض العلم من مخابئها، ويجمعون ما تفرق منها، فإن الكلام قاض يحكم بين الخصوم، وضياء يجلو الظلم، حاجة الناس إلى مواده حاجتهم إلى مواد الأغذية.'},
      {member:'عبدالرحمن بن أمين مجيد',title:'سبيل الرشاد في هدي خير العباد ١/١٠٨',body:'«وكثيرًا ما كان ينشدنا هذين البيتين: بقدر لغات المرء يكثر نفعه / وتلك له عند الشدائد أعوان / فبادر إلى حفظ اللغات مسارعًا / فكل لسان في الحقيقة إنسان». — محمد تقي الدين الهلالي.'},
      {member:'عبدالرحمن بن أمين مجيد',title:'الأعلام للزركلي ٨/٢٦٧',body:'خير الدين الزركلي (١٣١٠-١٣٩٦هـ = ١٨٩٣-١٩٧٦م) قال المترجم عن نفسه: ولدت ليلة ٩ ذي الحجة ١٣١٠ (٢٥ يونيه ١٨٩٣) في بيروت، وكانت لوالدي تجارة فيها، وهو وأمي دمشقيان... (النص الكامل لترجمة الزركلي لنفسه).'},
      {member:'عبدالرحمن بن أمين مجيد',title:'المذهبات من تراثنا التربوي ص٢٦٣',body:'قال علي بن الحسين رضي الله عنهما: «كنا نعلّم مغازي النبي وسراياه كما نعلّم السورة من القرآن»، وليس هذا انتقاصًا للقرآن بل هي منهجية تربوية لتعليم العلوم وغرس القيم، لذلك قال ابن سعد صاحب الطبقات: «يا بني هذه مآثر آبائكم فلا تضيعوها».'},
      {member:'عبدالرحمن بن أمين مجيد',title:'مجلة الأزهر — رعاية الأجيال',body:'رعاية الأجيال: يعلم علماؤنا الصادقون المخلصون أن رفع مستوى الأجيال بالعلم والفهم والوعي واليقظة هو السبيل إلى إصلاح أحوال البلاد والعباد... — د. محمد أبو موسى، مقال مجلة الأزهر، عدد شعبان ١٤٤٢هـ.'},
      {member:'عبدالرحمن بن أمين مجيد',title:'رسائل ابن حزم ١/٣٤٤ — مداواة النفوس',body:'«من مال بطبعه إلى علم ما - وإن كان أدنى من غيره - فلا يشغله بسواه، فيكون كغارس النارجيل بالأندلس وكغارس الزيتون بالهند، وكل ذلك لا ينجب».'},
      {member:'نعيم محمد الغضية',title:'أعذب الخواطر — مختصر صيد الخاطر ص٨٣-٨٤',body:'التفكر في خلق الله: عرض لي في طريق الحج خوف من العرب، فسرنا على طريق خيبر، فرأيت من الجبال الهائلة والطرق العجيبة ما أذهلني، وزادت عظمة الخالق عز وجل في صدري... ثم اخرجي عن الكل، والتفتي إلى ربك؛ فإنك تشاهدين العالم في قبضته. فكيف يغفل أرباب القلوب عن ذكر هذا الإله العظيم؟'},
      {member:'نعيم محمد الغضية',title:'سير أعلام النبلاء — ترجمة أحمد بن حنبل',body:'روي عن المروذي قال: قلت لأحمد: كيف أصبحت؟ قال: كيف يصبح من ربه يطالبه بأداء الفرائض، ونبيه يطالبه بأداء السنة، والملكان يطلبانه بتصحيح العمل، ونفسه تطالبه بهواها، وإبليس يطالبه بالفحشاء، وملك الموت يراقب قبض روحه، وعياله يطالبونه بالنفقة؟!'},
      {member:'نعيم محمد الغضية',title:'المشوق إلى القراءة وطلب العلم',body:'فما هو إلا أن حاز اللقب حتى أعرض عن الطلب، وقد كان يدعي العكس، يقول: دعوني أضع هم اللقب ثم أمعن في الطلب! فما باله انقلب!'},
      {member:'نعيم محمد الغضية',title:'شفاء العليل ١/٣٦٤ — ابن القيم',body:'«إنه لا يذل من واليت». في هذا تنبيه على أن من حصل له ذل في الناس فهو بنقصان ما فاته من تولي الله له، وإلا فمع الولاية الكاملة ينتفي الذل كله، ولو سلط عليه بالأذى من بأقطارها فهو العزيز غير الذليل.'},
      {member:'نعيم محمد الغضية',title:'الداء والدواء ص٣٥-٣٦',body:'يبقى على العبد أمران عظيمان، بهما فلاحه: الأول معرفة أسباب الخير والشر معرفة دقيقة... والثاني الحذر من خداع النفس... فالنجاة: صدق المعرفة، وصدق التوبة.'},
      {member:'نعيم محمد الغضية',title:'بيان فضل السلف على علم الخلف ص٨٥',body:'ومن علامات العلم النافع أنه يدل صاحبه على الهرب من الدنيا وأعظمها الرياسة والشهرة والمدح، فالتباعد عن ذلك والاجتهاد في مجانبته من علامات العلم النافع، فإن وقع شيء من ذلك من غير قصد واختيار كان صاحبه في خوف شديد من عاقبته...'},
      {member:'نعيم محمد الغضية',title:'إرشاد العباد للاستعداد ليوم المعاد ص٧٥',body:'عن بكر بن محمد قال: قلت لداود الطائي أوصني، قال: «عسكر الموتى ينتظرونك».'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'إغاثة اللهفان ٢/٨٤٨ — الملائكة',body:'قال ابن القيم رحمه الله: الملائكة الموكلة بالإنسان من حين كونه نطفة إلى آخر أمره، لهم وله شأن آخر...'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'صحيح مسلم — حسن الظن بالله',body:'قال صلى الله عليه وسلم: «لا يموتن أحدكم إلا وهو يحسن بالله الظن».'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'مفتاح دار السعادة ١/٤٥ — الجنة والنار',body:'اتفق أهل السنة والجماعة على أن الجنة والنار مخلوقتان، وقد تواترت الأحاديث عن النبي ﷺ بذلك، كما في الصحيحين عن عبدالله بن عمر رضي الله عنهما عن النبي ﷺ أنه قال: «إن أحدكم إذا مات عرض عليه مقعده بالغداة والعشي...» — ابن القيم.'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'مفتاح دار السعادة ١/٥٤٢-٥٤٤',body:'التفكر في خلق الرأس وما فيه من الحواس والحكمة الإلهية...'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'صيد الخاطر ص٢٣٧',body:'إن النفس تغفل وتعتاد النعم فتحتاج إلى تذكير...'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'لطائف المعارف ص٥٩٥ — الليالي العشر',body:'قال ابن رجب: وأما الليالي العشر فهي عشر ذي الحجة...'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'لطائف المعارف ص١٨ — استووا',body:'تقدم بعض التابعين ليصلي بالناس إمامًا، فالتفت إلى المأمومين يعدل الصفوف وقال: استووا؛ فغشي عليه...'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'التبيان في آداب حملة القرآن ص١٧٨-١٨٢',body:'آداب حملة القرآن وتعاهده والعمل به...'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'صيد الخاطر ص٢٣١-٢٣٣ وص٨٣٥-٨٣٦',body:'تأملات في تقلب الأحوال وسرعة انقضاء العمر...'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'زاد المعاد ٤/٣٠٦',body:'هدايات نبوية في التعامل مع البلاء والمرض...'},
      {member:'سليمان إبراهيم العمر',title:'تغريدات د. صالح سندي — الكتب المهمة',body:'تغريدات متفرقة للشيخ أ.د. صالح سندي في الكتب المهمة لطالب العلم: الرد على البكري، الرد على الإخنائي، التوسل والوسيلة، طريق الهجرتين، أوائل الوابل الصيب، الرسالة التبوكية، التنبيهات السنية، تيسير العزيز الحميد، شرح العقيدة الطحاوية، معارج القبول، أضواء البيان، اقتضاء الصراط المستقيم، مفتاح دار السعادة، جامع العلوم والحكم. واحرص على جمع الكتب؛ فلا يخلو كتاب من فائدة. — صيد الخاطر ٣١١.'},
      {member:'سليمان إبراهيم العمر',title:'صيد الخاطر — ابن الجوزي في بداية طلبه',body:'كنت في بداية الصبوة قد ألهمت سلوك طريق الزهاد بإدامة الصوم والصلاة، وحببت إلي الخلوة فكنت أجد قلبًا طيبًا، وكانت عين بصيرتي قوية الحدة، تتأسف على لحظة تمضي في غير طاعة، وتبادر الوقت في اغتنام الطاعات، ولي نوع أنس وحلاوة ومناجاة.'},
      {member:'سليمان إبراهيم العمر',title:'د. عبدالله الشهري — الإحاطة بالعلوم',body:'لن تستطيع الإحاطة بكل الفنون والعلوم، وحتى العلوم القريبة لتخصصك سيعسر عليك جدًا ضبطها وإدراك تفاصيلها... ينبغي أن يدفعك هذا الشعور إلى ضبط أسس تلك العلوم ومعرفة التاريخ والنشأة ومجالات الاتصال بالعلوم القريبة... ترتقي وقتها ملكات معرفية ومهارية، وتختصر مسافات طويلة في إدراك المتغيرات...'},
      {member:'سليمان إبراهيم العمر',title:'مجموع فتاوى ابن تيمية — الوصية الصغرى',body:'ست وصايا لطالب العلم أوصى بها ابن تيمية أبا القاسم المغربي: أن يستعين بالله في تلقي العلم الموروث عن النبي ﷺ، وأن تكون همته فهم مقاصد الرسول في أمره ونهيه، فإذا اطمأن قلبه أن هذا مراد الرسول فلا يعدل عنه، وليعتصم في كل باب بأصل مأثور، وإذا اشتبه عليه ما اختلف فيه الناس فليدع بما رواه مسلم عن عائشة... فمن نور الله قلبه هداه، ومن أعماه لم تزده كثرة الكتب إلا حيرة وضلالًا.'},
      {member:'سليمان إبراهيم العمر',title:'رسائل إلى الأئمة والمؤذنين ص١٠٦',body:'الأفضل أن يكون التكبير بين الركنين من أركان الصلاة حسب الإمكان، ولا يلزم أن يكون ابتداء التكبير مع ابتداء الانتقال وانتهاؤه مع انتهائه، والقول بأن ما عدا ذلك يبطل الصلاة لا دليل عليه. — عبدالله بن صالح الفوزان.'},
      {member:'سليمان إبراهيم العمر',title:'رسائل إلى الأئمة والمؤذنين ص١٨١',body:'قال الشافعي: «من أحب أن يفتح الله قلبه أو ينوره، فعليه بترك الكلام فيما لا يعنيه، واجتناب المعاصي، ويكون له خبيئة فيما بينه وبين الله تعالى من عمل».'},
      {member:'سليمان إبراهيم العمر',title:'إغاثة اللهفان ١/٧٠ — القرآن',body:'في القرآن من البينات والبراهين القطعية ما يبين الحق من الباطل، فتزول أمراض الشبه المفسدة للعلم والتصور والإدراك... وليس تحت أديم السماء كتاب متضمن للبراهين والآيات على المطالب العالية مثل القرآن. — ابن القيم.'},
      {member:'سليمان إبراهيم العمر',title:'إغاثة اللهفان ١/٧٤-٧٨ — غض البصر',body:'غض البصر عن المحارم يوجب ثلاث فوائد عظيمة الخطر جليلة القدر: حلاوة الإيمان ولذته، ونور القلب وصحة الفراسة، وقوة القلب وثباته وشجاعته...'},
      {member:'سليمان إبراهيم العمر',title:'الكلام على مسألة السماع ص٢٧٧-٢٧٨',body:'شرح الله صدر رسوله صلى الله عليه وسلم أتم الشرح، ووضع عنه وزره كل الوضع، ورفع ذكره كل الرفع، وجعل لأتباعه حظًا من ذلك... — ابن القيم.'},
      {member:'سليمان إبراهيم العمر',title:'ابن الجوزي — النظر في السير',body:'أنفع العلوم النظر في سير الرسول صلى الله عليه وسلم وأصحابه: ﴿أولئك الذين هدى الله فبهداهم اقتده﴾.'},
      {member:'سليمان إبراهيم العمر',title:'فائدة فقهية — يوم التروية',body:'إذا وافق يوم التروية يوم الجمعة، فالأفضل أن يصليها في منى صلاة الظهر قصرًا، فإن صلى الجمعة في المسجد الحرام فقد خالف السنة.'},
      {member:'سليمان إبراهيم العمر',title:'أ.د. خالد بن منصور الدريس — كتب التفسير',body:'بعد رحلة استمرت لسنوات طويلة وتنوع في مشارب القراءة لم أجد أنفع ولا ألذ من كتب التفسير والشروح الحديثية... محروم من حرم الاستمتاع بما فيها من كنوز.'},
      {member:'سليمان إبراهيم العمر',title:'نقولات في تزكية النفس وعلاج القلوب',body:'نقولات متفرقة من الداء والدواء ص١٨٢، ص١٨٤، ص١٩٦، ص٢٤٩، ومن وحي الرسالة ١/١٣١، ومن العواصم من القواصم ص١١٩.'},
      {member:'أبوفيصل محمد العييري',title:'مقتبس — كيف ولمَ',body:'فائدة: كلمتان ممنوعتان في بابين: «كيف» في باب الغيب، و«لِمَ» في باب القدر.'},
      {member:'أبوفيصل محمد العييري',title:'تقريب الفتاوى ج١ ص٢٩٤-٢٩٥',body:'قال شيخ الإسلام ابن تيمية: «فمن جعل شخصًا من الأشخاص - غير رسول الله ﷺ - من أحبه ووافقه كان من أهل السنة والجماعة، ومن خالفه كان من أهل البدعة والفرقة... وبهذا يتبين أن أحق الناس بأن تكون هي الفرقة الناجية أهل الحديث والسنة، الذين ليس لهم متبوع يتعصبون له إلا رسول الله ﷺ...»'},
      {member:'أبوفيصل محمد العييري',title:'تقريب الفتاوى والرسائل ج١ ص١٥١',body:'حيث أمر النبي ﷺ الأمة بالدعاء له فذاك من باب أمرهم بما ينتفعون به... كما في الصحيحين: «من دعا إلى هدى كان له مثل أجر من تبعه»، وقوله ﷺ لعمر: «يا أخي لا تنسني من دعائك». ولم تجر عادة السلف بأن يهدوا إلى النبي ﷺ ثواب الأعمال؛ لأن له مثل ثواب أعمالهم...'},
      {member:'أبوفيصل محمد العييري',title:'قصة وفائدة — التعصب للأشخاص',body:'رأيت شخصًا مع مجموعة من الناس يريدون أن يسلموا، وهو يلقنهم الشهادة فيقول: أشهد أن لا إله إلا الله وأشهد أن محمدًا رسول الله وأشهد أن النووي إمام المسلمين! فقلت في نفسي: ما مصير الأجيال التي لم تعرف النووي أو ماتت قبل أن يولد؟ فقد جعله هذا الشخص ركنًا من أركان الإسلام! فمثل هذا ينطبق عليه كلام ابن تيمية.'},
      {member:'أبوفيصل محمد العييري',title:'مختصر دعوة أهل البدع ص٨٩-٩١',body:'ورد في الخبر: «إن الله حجب التوبة عن كل صاحب بدعة»... وقد أجاب أهل العلم عنه بأن هذا من نصوص الوعيد، وأن أهل البدعة على صنفين، وأن المبتدع يرى أنه على هدى... — خالد الزهراني.'},
      {member:'أبوفيصل محمد العييري',title:'زغل العلم — الذهبي ص٣٠',body:'قال الذهبي وهو يعاتب طلبة الحديث: بقينا ضحكة لأولي المعقولات (أهل الكلام) يطنزون بنا: هؤلاء هم أهل الحديث. ثم رجع يرد عليهم: نعم ماذا يضر! ولو لم يبق إلا تكرار الصلاة على النبي ﷺ لكان خيرًا من تلك الأقاويل...'},
      {member:'أبوفيصل محمد العييري',title:'فضل علم السلف على علم الخلف ص٩٩',body:'قال الشافعي رحمه الله: «ما جهل الناس ولا اختلفوا إلا لتركهم لسان العرب، وميلهم إلى لسان أرسطاطاليس».'},
      {member:'أبوفيصل محمد العييري',title:'الشيخ بكر أبو زيد — جارودي',body:'أذكر كلامًا للشيخ بكر أبو زيد رحمه الله في أحد كتبه عن جارودي، قال عنه: «النصراني المتلصص إلى الإسلام».'},
      {member:'أبوفيصل محمد العييري',title:'الشرح الممتع ج٧ — الفقه',body:'ليس كل من تعلم الفقه صار فقيهًا!... قصة الإزار المخيط في الحج وفتوى الشيخ ابن عثيمين بجوازه.'},
      {member:'أبوفيصل محمد العييري',title:'الشيخ ابن عثيمين — العمرة ليلة القدر',body:'قال الشيخ محمد العثيمين رحمه الله: «تخصيص العمرة ليلة القدر بدعة... ولما كانت بدعة صار يلحق المعتمرين فيها من المشقة الشيء العظيم».'},
      {member:'أبوفيصل محمد العييري',title:'الشرح الممتع على زاد المستقنع — مسائل فقهية',body:'إذا أمر النبي ﷺ بأمر وفعل خلافه دل على أن الأمر ليس للوجوب... لو مس رجل امرأة فإنه لا ينتقض وضوؤها... الوضوء من ألبان الإبل مستحب وليس بواجب... منع الكافر من قراءة القرآن حتى يغتسل ضعيف لعدم الدليل.'},
      {member:'أبوفيصل محمد العييري',title:'فائدة تاريخية — المعتزلة والواثق',body:'كان رؤوس المعتزلة يحرصون على تعليم أولاد الخلفاء منهجهم حتى يضمنوا استقرارهم قرب السلطة... حتى قال الواثق يومًا لأحمد بن أبي دؤاد: «قد أخليت بيوت الأموال بطلباتك للّائذين بك والمتوصلين إليك».'},
      {member:'أبوفيصل محمد العييري',title:'نقولات موثقة — معالم السور وقواعد المنهج السلفي',body:'نقولات موثقة من معالم السور ص٢٨، ص٥٦، ص٩٤، ومن قواعد المنهج السلفي لمصطفى حلمي ص١٩١.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'مداواة النفوس ص١٧٩',body:'مَنْ جَهِلَ مَعْرِفَةَ الفضائل؛ فليعتمد على ما أمره الله تعالى ورسوله ﷺ فإنه يحتوي على جميع الفضائل.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'عناصر القوة في حياة شيخ الإسلام ابن تيمية ص٦٠',body:'قال ابن تيمية: «فلذا لا ينبغي أن ينهى عن منكر وأمر مبتدع إلا ويبين السنة البديلة والحث عليها. فيغلق باب البدعة ويفتح باب السنة، لا يكون همه غلق الأبواب فقط دون فتحها».'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'المستويات السبعة في القراءة — محور الإبداع',body:'في حديث المؤلف عن المبادئ للقارئ ومحوريتها يقول: «الإبداع ضرورة. لكن إذا لم يكن للمبدع محور مركزي ثابت يدور حوله فأول ما يجني عليه إبداعه. المبدع الحر حرية مطلقة أشبه ما يكون بجرم تائه في الفضاء».'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'المستويات السبعة في القراءة — القراءة الموسوعية',body:'إن من يملك قضية، يتعلم كل ما هو في حاجة إلى تعلمه.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'فتح الباري ٤/١١٧ — ابن حجر',body:'ليس المقصود من شرعية الصوم نفس الجوع والعطش، بل ما يتبعه من كسر الشهوات وتطويع النفس الأمارة للنفس المطمئنة.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'رحلة إبراهام — إيهاب عويص',body:'ذكر إيهاب عويص في كتابه رحلة إبراهام نصوصًا مضافة للإنجيل تدعو للزهد في الدنيا بترك التنظف وأكل الرديء من الطعام وشرب الماء الكدر وغير ذلك... ومما يقال في سبب تصنيع الفرنسيين للأطياب قديمًا أن مبدأه كان لإيجاد حلول لروائح الناس لأنهم لا يتنظفون.'},
      {member:'عبدالله عبدالعزيز الفهيد',title:'أثر عن علي بن أبي طالب رضي الله عنه',body:'قال علي رضي الله عنه: «حدثوا الناس بما يعرفون، أتحبون أن يكذب الله ورسوله؟».'}
    ];

    const FINAL_BATCH_QUOTES = [
      {member:'عادل بن عبدالله الكبيّر',title:'الإمام الشافعي — لقلع ضرس',body:'لَقَلعُ ضِرسٍ وَضَربُ حَبسِ / وَنَزعُ نَفسٍ وَرَدُّ أَمسِ... أَهوَنُ مِن وَقفَةِ الحُرِّ / يَرجو نَوالاً بِبابِ نَحسِ.'},
      {member:'عادل بن عبدالله الكبيّر',title:'عروة بن الورد — الوقائع',body:'فما شابَ رَأسي مِن سنينَ تَتابَعَت / طوالٍ، ولكن شيَّبته الوقائع.'},
      {member:'عادل بن عبدالله الكبيّر',title:'عمرو بن كلثوم',body:'ألا لا يعلم الأقوام أنا / تضعضعنا وأنا قد ونينا / ألا لا يجهلن أحد علينا / فنجهل فوق جهل الجاهلينا.'},
      {member:'عادل بن عبدالله الكبيّر',title:'مقتبس شعري — عجز الرأي',body:'وعاجز الرأي مضياع لفرصته / حتى إذا فات أمر عاتب القدرا.'},
      {member:'عادل بن عبدالله الكبيّر',title:'أبو الطيب المتنبي — العداوة والصداقة',body:'ومن العداوة ما ينالك نفعه / ومن الصداقة ما يضر ويؤلم / والهم يخترم الجسيم نحافة / ويشيب ناصية الصبي ويهرم / ذو العقل يشقى في النعيم بعقله / وأخو الجهالة في الشقاوة ينعم.'},
      {member:'عادل بن عبدالله الكبيّر',title:'توحيد المملكة العربية السعودية — محمد المانع',body:'إسلام فيلبي تم تأكيده في المحكمة بحضور الشهود...'},
      {member:'عادل بن عبدالله الكبيّر',title:'تذكرة أولي النهى والعرفان — ابن عبيد',body:'مقارنة بين الأسعار في الدرعية زمن الدولة السعودية الأولى وغيرها من البلدان النجدية...'},
      {member:'عادل بن عبدالله الكبيّر',title:'فرحة الأنفس ودولة الإسلام في الأندلس',body:'نقولات تاريخية حول الأندلس وقرطبة وصفات أهلها... — فرحة الأنفس لابن غالب الأندلسي، ودولة الإسلام في الأندلس لمحمد عبدالله عنان.'},
      {member:'عادل بن عبدالله الكبيّر',title:'ظلال الأشياء، ليالي عبدالله الهدلق',body:'مقتطفات من كتاب ظلال الأشياء، ليالي عبدالله الهدلق للشيخ صالح الخليفة.'},
      {member:'عبدالعزيز بن إبراهيم الدوسري',title:'المعتقد الخاطئ — دان آريلي',body:'تسامرت مع شخص أحترمه، فوجدته يتحدث بقناعة لا متناهية عن نظريات مؤامرات وأفكار غير منطقية تمامًا... وهذا ما يناقشه كتاب «المعتقد الخاطئ: ما الذي يجعل العقلانيين يصدقون أمورًا غير عقلانية؟».'},
      {member:'عبدالعزيز بن إبراهيم الدوسري',title:'تعافيت — علي موسى',body:'تعطي وتضحي وتتنازل، وللأسف كعادة من يضحي تضع احتياجات الجميع قبل احتياجك، وفي النهاية تجد نفسك مستنزفًا وحيدًا وعالقًا في علاقة تؤذيك... هذا ما يناقشه كتاب «تعافيت: طريقك نحو التحرر من قيود التعلق العاطفي والإساءات النفسية».'},
      {member:'عبدالعزيز بن إبراهيم الدوسري',title:'السماح بالرحيل — ديفيد هاوكينز',body:'تكون في نقاش حاد جدًا وفجأة تشعر بتفاهة الموقف وتضحك فيختفي كل الغضب، وكأن ضغطًا داخليًا قد زال لتشعر براحة؟ هذا بالضبط فكرة كتاب «السماح بالرحيل» للدكتور ديفيد هاوكينز، الذي يقدم آلية عملية وواقعية تفعل قدرتنا الفطرية على السعادة والنجاح وتحررنا من المشاعر السلبية.'},
      {member:'عبدالعزيز بن إبراهيم الدوسري',title:'روضة العقلاء ص١٧٣ — أبو حاتم',body:'قال أبو حاتم: «الكريم يلين إذا استعطف، واللئيم يقسو إذا ألطف، والكريم يجل الكرام، ولا يهين اللئام...»'},
      {member:'عبدالعزيز عبدالله الطويان',title:'فكك عقدك النفسية — قاعدة الضغط',body:'قاعدة: إذا كان عقلك مشغولًا بالأفكار، فاعلم أن جسدك متعب، وكل اضطراب في جسدك مرتبط بألم في نفسك. — فهد بن مسلم.'},
      {member:'عبدالعزيز عبدالله الطويان',title:'فكك عقدك النفسية — السعادة لا تنتظر',body:'لا يمكن أن تسعد بوجود ثلاث فئات في حياتك: من يحاول السيطرة عليك وتوجيهك بالقوة، ومن يقلل من شأنك أو يسخر منك أمام الآخرين، والشخص السلبي المتشائم دائم الشكوى. — فهد بن مسلم.'},
      {member:'عبدالعزيز عبدالله الطويان',title:'فكك عقدك النفسية — التحرر من الضغط',body:'خطوات التحرر من الضغط النفسي: حدد مصدر الضغط، واتخذ القرار لحل المشكلة، وابدأ فورًا بتطبيق نظرية الاختيار: راحتك، الصديق، الزوجة، برنامجك اليومي؛ ثم تطبيق الصورة الذهنية: أن يرى الإنسان كل شيء جميلًا. — فهد بن مسلم.'},
      {member:'عبدالعزيز عبدالله الطويان',title:'فكك عقدك النفسية — الصراعات',body:'لا تدمر حياتك بالصراعات. — فهد بن مسلم.'},
      {member:'عبدالعزيز عبدالله الطويان',title:'الحياة مشاعر — أسامة الجامع',body:'مقتطفات من كتاب «الحياة مشاعر» للدكتور أسامة الجامع.'},
      {member:'عبدالعزيز عبدالله الطويان',title:'قراءة القراءة — فهد الحمود ص١٧',body:'إن اصطحاب الكتاب وجعل القراءة أحد برامجنا اليومية، أسوة بسائر أعمالنا الأخرى التي هي من ضرورات الحياة، يعد أمرًا هامًا في تكويننا العلمي والثقافي.'},
      {member:'عبدالعزيز عبدالله الطويان',title:'علي الطنطاوي — الحياة والأحداث',body:'لله در العلامة الكبير علي الطنطاوي رحمه الله حين كتب قائلًا: «الحياة ليست بطول السنين ولكن بعرض الأحداث».'},
      {member:'عبدالعزيز عبدالله الطويان',title:'مقتبس — الالتزام والنجاح',body:'من المعتقدات التي ينبغي ألا تفارق كل راكض نحو أمانيه: أنه لا نجاح دون التزام، والعظماء ليسوا بالضرورة هم الأفضل والأكثر ذكاء، لكنك ستجد أنهم الأكثر التزامًا... العثرات غالبًا ما تكون شرارة النجاح.'},
      {member:'عبدالعزيز عبدالله الطويان',title:'مقتطفات تربوية — الرسائل الخمس للطفل',body:'مقتطفات من كتاب في التربية حول الرسائل الخمس للطفل والاستبعاد المؤقت.'},
      {member:'صالح جاسر الجاسر',title:'تاريخ المذاهب الإسلامية ص٥١',body:'ليس للعقل سلطان في تأويل القرآن وتفسيره وتخريجه إلا بالقدر الذي تؤدي إليه العبارات وما تضافرت عليه الأخبار، وإذا كان للعقل سلطان فهو التصديق والإذعان وبيان تقريب المنقول من المعقول وعدم المنافرة بينهما.'},
      {member:'صالح جاسر الجاسر',title:'أرسطو — التفكير والشعور',body:'«فالذين يفكرون يرون الحياة كوميديا، والذين يشعرون يرونها تراجيديا» — أرسطو.'},
      {member:'صالح جاسر الجاسر',title:'قد تزهر متأخرًا — ديفيد بروكس',body:'بحلول منتصف العمر، يكون كثير من المتأخرين في التألق قد انطلقوا بالفعل وذاقوا لذة الجهد المركز... ولأنهم أقل تقيدًا بالصلات والأعراف من أصحاب النجاح المبكر فهم أقدر على تغيير آرائهم وتحديث تصوراتهم من غير أن يخشوا خيانة قواعد المهنة.'},
      {member:'صالح جاسر الجاسر',title:'تفاصيل سعودية صغيرة ص٨٣',body:'ما وراء الأسوار العالية: نظرة عميقة على التفاعلات الداخلية للمجتمع... حين تهيمن ثقافة أخرى على المجتمع، فإن الثقافة الأصيلة قد تتوارى، لكنها تحتفظ بتفاصيلها وعاداتها مهما كانت الظروف.'},
      {member:'صالح جاسر الجاسر',title:'ابن تيمية فيلسوف الفطرة ص١٩٢',body:'من أهم سمات فطرنة العقل دفعه نحو البساطة والتلقائية والوضوح ومجافاة التعقيد والغموض واللف والدوران بلا طائل...'},
      {member:'صالح جاسر الجاسر',title:'رحلتي الفكرية — المسيري',body:'إن تأخير تكوين المثقف في العالم العربي يؤثر في التنمية، حيث إن الكثيرين يتساقطون أثناء العملية التربوية، ومن يخرج سليمًا منها فإن سنين العطاء عنده تكون محدودة للغاية.'},
      {member:'خلف سليمان اللهيدي',title:'الطريق إلى مكة ص٨٠ — محمد أسد',body:'عندما سأل محمد أسد نفسه لماذا ارتحل؟ قال: فجأة طفا صوت من أعماق ذاكرتي، صوت رجل عجوز من قبائل الأكراد بشمال إيران، قال لي ذات يوم: المياه الراكدة في بركة تتعطن وتتشبع بالطين والعكر، أما المياه المتحركة المتدفقة فإنها تظل نقية... هكذا الإنسان في سكونه أو تجواله.'},
      {member:'خلف سليمان اللهيدي',title:'اقتباس ص٢٥٤ — الإقناع',body:'من العوامل النفسية التي تجعل الأفراد المتلقين أكثر استعدادًا للاقتناع: انخفاض تقدير الفرد لذاته أو الإحساس بالقلق أو خصوبة الخيال أو التفتح الذهني لديه...'},
      {member:'خلف سليمان اللهيدي',title:'التاريخ الروماني — عبداللطيف أحمد علي',body:'تميز اليونانيون بخيال واسع وجسدوا آلهتهم في صور بشرية تدور حولها العلاقات والقصص البطولية والملحمية مثل الإلياذة، بينما لم يمتلك الرومان في البداية أساطير معقدة من صنعهم، بل كانت آلهتهم مجرد قوى أو أرواح غامضة تؤدي وظائف محددة...'},
      {member:'خلف سليمان اللهيدي',title:'اقتباس عن طبيعة الكتابة',body:'هو لا يعتذر عن الفوضى في كتابه.. هذه هي طبيعة الأشياء.. وهذا هو الفرق بين الحديقة والغابة.. إنه يفضل أن يكون كتابه غابة من الأشجار والحيوانات والصيحات والعطور...'},
      {member:'خلف سليمان اللهيدي',title:'مذكراتي الشخصية — بول جوجان',body:'«ولدت هاربًا.. لا أعتقد أنني من أصل إنساني.. لابد أن بين أجدادي عددًا كبيرًا من الطيور المهاجرة.. فأنا لا أقوى على البقاء كثيرًا في مكان واحد.. لا أعرف ماذا يحدث.. إن المكان نفسه يرفضني.. ينكرني.. يستنكرني!»'},
      {member:'خلف سليمان اللهيدي',title:'تاريخ الفلسفة — برتراند راسل',body:'اسبارطة هزمت أثينا هزيمة نكراء (٤٠٤ ق.م)، غير أن مكانة أثينا لم تزل رفيعة على الرغم من سقوطها السياسي...'},
      {member:'خلف سليمان اللهيدي',title:'هندسة الجمهور — الحسن بن صالح',body:'قال الحسن بن صالح رحمه الله: «إن الشيطان ليفتح للعبد تسعة وتسعين بابًا من الخير، يريد به بابًا من الشر».'},
      {member:'عمر علي الشعيبي',title:'حدود وقيود — تأمل شخصي',body:'قادني تأملي إلى أن الحدود ما تضعه لنفسك، والقيود ما يفرض عليك! علميًا: حدود البحث هي نطاق أحدده بإرادتي، أما القيود فهي تلك الظروف التي تحتم علي التأقلم معها.'},
      {member:'عمر علي الشعيبي',title:'ابني حبيبي ص٥٣',body:'ورد في رواية أنه قال صلى الله عليه وسلم: «من ابتلي من البنات بشيء فأحسن إليهن كن له سترًا من النار».'},
      {member:'يزيد سلمان الصلعاء',title:'مختصر روضة المحبين ص١٨',body:'الهوى هو ميل النفس إلى الشيء، وأكثر ما يستعمل في الحب المذموم كما قال تعالى: ﴿وأما من خاف مقام ربه ونهى النفس عن الهوى فإن الجنة هي المأوى﴾، وقد يستعمل في الحب الممدوح استعمالًا مقيدًا، ومنه قول النبي صلى الله عليه وسلم: «لا يؤمن أحدكم حتى يكون هواه تبعًا لما جئت به».'},
      {member:'يزيد سلمان الصلعاء',title:'صفة الصفوة ١/٣٧٢ — ابن عباس',body:'قال ابن عباس: يا صاحب الذنب لا تأمنن سوء عاقبته... قلة حيائك ممن على يمينك وعلى شمالك وأنت على الذنب أعظم من الذنب... وفرحك بالذنب إذا عملته أعظم من الذنب، وحزنك على الذنب إذا فاتك أعظم من الذنب إذا ظفرت به...'},
      {member:'يزيد سلمان الصلعاء',title:'صفة الصفوة ١/٣٠٢ — أبو الدرداء',body:'كأن أبا الدرداء رضي الله عنه يقول: تبنون شديدًا وتأملون بعيدًا وتموتون قريبًا. وقال: إذا أصبح الرجل اجتمع هواه وعمله، فإن كان عمله تبعًا لهواه فيومه يوم سوء، وإن كان هواه تبعًا لعمله فيومه يوم صالح.'},
      {member:'يزيد سلمان الصلعاء',title:'شرح كتاب التوحيد — فوائد',body:'فوائد: من لم يخف الشرك فهو ناقص التوحيد، ومن لم يخف الشرك الأكبر كان عرضة للوقوع فيه، والشرك الأصغر وسيلة للشرك الأكبر... وتحقيق التوحيد يكون باجتناب الشرك الأكبر والأصغر والبدع القادحة فيه والكبائر، ومنها الإصرار على الصغائر.'},
      {member:'يزيد سلمان الصلعاء',title:'نقولات موثقة — مصادر متنوعة',body:'نقولات إضافية موثقة بالكتاب والصفحة من الداء والدواء ص١٧٨، وسير أعلام النبلاء ٣/٣٥١، وصفة الصفوة ٢/٤٩٠.'},
      {member:'معاذ بن عمر العليان',title:'حادي الأرواح إلى بلاد الأفراح ص٢٤٢',body:'فأخبر أنه أعد الجنة للمتقين دون غيرهم، ثم ذكر أوصاف المتقين، فذكر بذلهم للإحسان في حالتي العسر واليسر والشدة والرخاء...'},
      {member:'معاذ بن عمر العليان',title:'موت الأسرار للوهيبي ص٢١٤',body:'وقد تطور الأمر لاحقًا إلى تطبيع الكشف العلني عن الهوية الجنسية الشاذة والمنحرفة، حيث أسهمت السلطة الملموسة لوسائل الإعلام في ذلك...'},
      {member:'معاذ بن عمر العليان',title:'موت الأسرار للوهيبي ص٣٠٦-٣٠٩',body:'من جملة محامد العزلة عن الفضاء الرقمي تكميل الاستمتاع بالمباحات؛ لأن الارتباط الهوسي بالتصوير ومشاركة اليوميات والرحلات والحركات والسكنات يعكر صفو التجارب واللحظات الطيبة... (ص٣٠٨-٣٠٩، وله مقتطف من ص٣٠٦).'},
      {member:'معاذ بن عمر العليان',title:'وثائقي تايغر وودز — HBO يناير ٢٠٢١',body:'اشتكى لاعب الجولف الأمريكي تايغر وودز في أثناء شهرته الكاسحة من الرقابة الدائمة له، وأخذ يهتم برياضة الغوص في البحر، فسألته صديقته عن ذلك؟ فقال: «إن الأسماك هناك في الأسفل لا تعرف من هو!»'},
      {member:'عبدالرحمن مفرح علي القحطاني',title:'أبيات شعرية — عاشر بمعروف',body:'عاشر بمعروف فإنك راحل / واترك قلوب الناس نحوك صافية / واذكر من الإحسان كل صغيرة / فالله لا تخفى عليه الخافية...'},
      {member:'عبدالعزيز العقيل',title:'ذكريات باريس ص٢٣٢ — زكي مبارك',body:'يقول زكي مبارك في كتابه ذكريات باريس: «بقدر تغني الشعراء بهواجس الأحاسيس يكون نصيبهم من الخلود».'}
    ];

    function applyNewestQuotes() {
      const marker = 'jalees_newest_quotes_v2';
      if (localStorage.getItem(marker)) return;
      NEWEST_QUOTES.forEach(item => {
        const existing = archiveData[item.member] || (archiveData[item.member] = []);
        const match = existing.find(entry => entry.title === item.title && entry.type === 'quote');
        if (match) match.body = item.body;
        else existing.push({ type: 'quote', title: item.title, date: '', body: item.body });
      });
      localStorage.setItem(marker, '1');
      saveArchive();
    }

    function applyMoreMemberQuotes() {
      const marker = 'jalees_more_member_quotes_v1';
      if (localStorage.getItem(marker)) return;
      MORE_MEMBER_QUOTES.forEach(item => {
        const existing = archiveData[item.member] || (archiveData[item.member] = []);
        const match = existing.find(entry => entry.title === item.title && entry.type === 'quote');
        if (match) match.body = item.body;
        else existing.push({ type: 'quote', title: item.title, date: '', body: item.body });
      });
      localStorage.setItem(marker, '1');
      saveArchive();
    }

    function applyArticleBatch() {
      const marker = 'jalees_article_batch_v11';
      if (localStorage.getItem(marker)) return;
      const normalizeTitle = value => value.toLowerCase()
        .normalize('NFKD')
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/[^\p{L}\p{N}]/gu, '');
      ARTICLE_BATCH.concat(ARTICLE_BATCH_ADDITIONS).forEach(item => {
        const existing = archiveData[item.member] || (archiveData[item.member] = []);
        const normalizedTitle = normalizeTitle(item.title);
        const matches = existing.filter(entry => entry.type === 'article' && normalizeTitle(entry.title) === normalizedTitle);
        const match = matches[0];
        if (match) {
          match.title = item.title;
          match.body = item.body;
          if (item.date) match.date = item.date;
          matches.slice(1).forEach(duplicate => existing.splice(existing.indexOf(duplicate), 1));
        } else {
          existing.push({ type: 'article', title: item.title, date: item.date || '', body: item.body });
        }
      });
      const osamaList = archiveData['أسامة الفلاج'] || [];
      const osamaTitle = 'مطالع الموت ومطامع الخلود (الزركلي والأمير مصطفى الشهابي)';
      const osamaMatches = osamaList.filter(entry => entry.type === 'article' && entry.title.includes('مطالع الموت ومطامع الخلود'));
      if (osamaMatches.length > 1) {
        const fullEntry = ARTICLE_BATCH_ADDITIONS.find(entry => entry.member === 'أسامة الفلاج' && entry.title === osamaTitle);
        const keep = osamaMatches.find(entry => entry.title === osamaTitle) || osamaMatches[0];
        if (fullEntry) {
          keep.title = osamaTitle;
          keep.body = fullEntry.body;
          keep.date = fullEntry.date;
        }
        osamaMatches.filter(entry => entry !== keep).forEach(entry => osamaList.splice(osamaList.indexOf(entry), 1));
      }
      localStorage.setItem(marker, '1');
      saveArchive();
    }

    function applySummaryBatch(memberName, batch, marker) {
      if (localStorage.getItem(marker)) return;
      const existing = archiveData[memberName] || (archiveData[memberName] = []);
      const normalizeTitle = value => value.toLowerCase()
        .normalize('NFKD')
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/[^\p{L}\p{N}]/gu, '');
      batch.forEach(item => {
        const normalizedTitle = normalizeTitle(item.title);
        const matches = existing.filter(entry => entry.type === 'summary' && normalizeTitle(entry.title) === normalizedTitle);
        const match = matches[0];
        if (match) {
          match.title = item.title;
          match.date = item.date || '';
          match.body = item.body;
          matches.slice(1).forEach(duplicate => existing.splice(existing.indexOf(duplicate), 1));
        } else {
          existing.push({ type: 'summary', title: item.title, date: item.date || '', body: item.body });
        }
      });
      localStorage.setItem(marker, '1');
      saveArchive();
    }

    const NEWEST_QUOTES = [
      {member:'عبدالعزيز العقيل',title:'عبدالله الهدلق — الدهشة',body:'حين يفقد الإنسان الدهشة يفقد بهجة الحياة، عادة اللامبالاة هي سمة الأغبياء.'},
      {member:'عبدالعزيز العقيل',title:'مذكرات قارئ — محمد الأحمري ص٣٣',body:'فالوعي ليس حفظًا والعلم ليس جمعًا فقط، لأن القراءة الواعية عملية إحياء وبحث للروح في الكلام المسطور أمامك.'},
      {member:'عبدالعزيز العقيل',title:'ابن رجب — تفسير سورة النصر',body:'ذكر ابن رجب في تفسيره لسورة النصر قول ابن عبد البر: لم يمت رسول الله صلى الله عليه وسلم وفي العرب رجل كافر، بل كلهم أسلموا إما رغبة أو رهبة.'},
      {member:'عبدالعزيز العقيل',title:'د. عبدالرحمن قائد — الأدب المترجم',body:'الإغراق في قراءة الأدب المترجم (قصة ورواية وشعرًا) يورث ضعاف قرائه الانفصال عن واقعهم، والذوبان في ثقافة غيرهم، واللهج برموزهم، والإخلاد إلى طرائقهم في التفكير والتعبير... فالأدب المصري الحديث كالمجتمع المصري الحديث، يقوم على موت الشخصية، وفناء الذات، ونسيان التاريخ، ونكران الأصل... — نقلًا عن أحمد حسن الزيات.'},
      {member:'عبدالعزيز العقيل',title:'أبو حامد الغزالي — الغيبة',body:'فللنفس في غيبة الآخرين شهوتان: إحداهما نفي الغير، والأخرى إثبات نفسه. ولاجتماع الشهوتين وتيسر تحريك اللسان ومصير ذلك معتادًا في المحاورات يعسر الصبر عنها، وهي أكبر الموبقات، حتى بطل استنكارها واستقباحها من القلوب لكثرة تكريرها وعموم الأنس بها.'},
      {member:'عبدالعزيز العقيل',title:'بستان العارفين — الإمام النووي ص٢٣',body:'من النصيحة أن تضاف الفائدة التي تستغرب إلى قائلها، فمن فعل ذلك بورك له في علمه وحاله، ومن أوهم فيما يأخذه من كلام غيره أنه له، فهو جدير ألا ينتفع بعلمه، ولا يبارك له في حال.'},
      {member:'عبدالعزيز العقيل',title:'ذكريات باريس ص٢٣٢ — زكي مبارك',body:'يقول زكي مبارك في كتابه ذكريات باريس: «بقدر تغني الشعراء بهواجس الأحاسيس يكون نصيبهم من الخلود».'},
      {member:'معاذ عطافي',title:'مقتبس — نصائح لكبار السن',body:'لا ترهبوا كبار السن بكثرة الفحوصات والإعلانات الطبية... قال مدير أحد المستشفيات في بكين خمس نصائح ثمينة لكبار السن: أنتم لستم مرضى، أنتم فقط تتقدمون في العمر... الشيخوخة ليست عدوًا إنما اسم آخر للحياة، الجمود هو العدو الحقيقي.'},
      {member:'معاذ عطافي',title:'الدر المنثور ٥/٥٢٥ — الحسن البصري',body:'قال الحسن البصري رحمه الله: «كانوا - أي الصحابة - يعدون النعيم: أن يتغدى الرجل، ثم يتعشى!» تصور أن هذا النعيم بمنظور الصحابة، فمن كان يتغدى ثم يتعشى يعتبرونه بلغ أقصى درجات النعيم الدنيوي.'},
      {member:'معاذ عطافي',title:'قصة الأحنف بن قيس ومعاوية',body:'الحوار الذي دار بين الأحنف بن قيس ومعاوية بن أبي سفيان عندما استقر الحكم لمعاوية رضي الله عنهما... فتنهد معاوية وقال: هذا الأحنف ابن قيس، إذا غضب غضب معه مائة ألف رجل لا يدرون فيما غضب.'},
      {member:'معاذ عطافي',title:'الطريق إلى النبوغ العلمي ص٣١٢-٣١٣',body:'قال الشيخ صالح آل الشيخ: «لا تستخسر وقتًا تمضيه في جلسة علمية، ولا وقتًا تمضيه في قراءة كتاب، وسماع شرح كتاب في شريط أو نحوه؛ لأن هذا يورثك حب العلم، ويورثك حب أهله، ويسهل عليك العلم شيئًا فشيئًا».'},
      {member:'معاذ عطافي',title:'منقول — حديث تأبير النخل',body:'حديث تأبير النخل: «أنتم أعلم بأمر دنياكم»، وما فيه من التمييز بين التشريع الديني والخبرة الدنيوية.'},
      {member:'عبدالعزيز علي الوهيبي',title:'مثل منقول — للقادم دهشة',body:'فيه مثل يقول: «إن للقادم دهشة فحيوه بمرحبًا». فهذه الكلمة تفتح قلبه من البداية...'},
      {member:'عبدالعزيز علي الوهيبي',title:'بيت شعر — مراقبة الناس',body:'من راقب الناس لم يظفر بحاجته / وفاز باللذة الفاتك اللهج... والشطر الآخر: وفاز باللذة الجسور.'},
      {member:'عبدالعزيز علي الوهيبي',title:'مثل عربي — التغافل',body:'فيه مثل عربي في التغافل: «طأطئ لها تخطئك»، يعني تغاض قليلًا وتطير الكلمة بالهواء، وإن انتصبت لها أصابتك.'},
      {member:'عبدالعزيز علي الوهيبي',title:'وليم هازلت — متعة القراءة',body:'«إن أعظم متعة في الحياة هي متعة القراءة والاطلاع» — وليم هازلت.'},
      {member:'عبدالعزيز علي الوهيبي',title:'حكمة منقولة — رياضتا القراءة والهرولة',body:'إياك أن تتخلى عن الرياضتين: رياضة القراءة ورياضة الهرولة (الجري - الركض).'},
      {member:'عبدالعزيز علي الوهيبي',title:'ابن الجوزي — فائدة الكتب',body:'قال ابن الجوزي: «لا يخلو كتاب من فائدة».'},
      {member:'عبدالعزيز علي الوهيبي',title:'حديث نبوي — مخالطة الناس',body:'قال رسول الله صلى الله عليه وسلم: «الذي يخالط الناس ويصبر على أذاهم خير من الذي لا يخالط الناس ولا يصبر على أذاهم».'},
      {member:'عبدالعزيز علي الوهيبي',title:'نوادر وطرائف العلماء',body:'فاصل ترفيهي: نوادر وطرائف الإمام الشعبي وأبي حنيفة وعمرو بن قيس والشيخ الألباني والشيخ ابن باز والشيخ ابن عثيمين رحمهم الله (ترجمة السدحان للشيخ ابن باز)...'},
      {member:'عبدالعزيز علي الوهيبي',title:'نماذج من حرص العلماء على الوقت — الألباني',body:'نماذج من حرص العلماء على الوقت: الألباني نموذجًا؛ ستة عشر موقفًا وقصة في استغلال الشيخ الألباني لوقته ومكتبته، رواها تلميذه الشيخ سامي المصري.'},
      {member:'عبدالعزيز علي الوهيبي',title:'فوائد رمضانية — أحمد والخثلان',body:'الإمام أحمد يقول: «لا أهنئ أحدًا برمضان، ومن هنأني رددت عليه». والشيخ سعد الخثلان: أكثروا من قراءة القرآن في رمضان حتى ولو بدون تدبر...'},
      {member:'عبدالعزيز علي الوهيبي',title:'الخليل بن أحمد — طرفة أدبية',body:'أرسل الخليل بن أحمد رحمه الله ولده يأتي بحبل، فقال له ولده: كم طوله؟ قال: كذا. قال: وكم عرضه؟ قال: عرض مصيبتي فيك!'},
      {member:'تركي عبدالرحمن العمران',title:'العوالم الثلاث ص٣١ — د. علي صالح',body:'«لكن القراءة تنسيني أنني أشيخ وتجعلني أحلق مع الأفكار والتجارب الإنسانية. أفضل أن أقضي بقية سنوات عمري في القراءة بدلًا من تحمل مسؤولية تخفيف الوجع لدى الآخرين» — الظل والحرور ص٢١٦.'},
      {member:'تركي عبدالرحمن العمران',title:'سنوات وذكريات ص٣٩-٤٠ — د. أحمد هيكل',body:'كان والدي يقول لي حين يعرف أني اشتريت كتابًا جديدًا: «اشتر الكتب ما استطعت، فالكتب زينة للرجال كما الحلي زينة للنساء» — الظل والحرور ص٤٧.'},
      {member:'تركي عبدالرحمن العمران',title:'النظرات — مصطفى لطفي المنفلوطي',body:'لا مانع من أن يعرب لنا المعربون المفيد النافع من مؤلفات علماء الغرب، والجيد الممتع من أدب كتابهم وشعرائهم، على أن ننظر إليه نظرة الباحث المنتقد لا الضعيف المستسلم...'},
      {member:'صالح محمد الضحيان',title:'الأربعون النبوية في السلامة النفسية — الصيام',body:'عن عبدالله بن عباس رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: «صوم شهر الصبر، وثلاثة أيام من كل شهر يذهبن وحر الصدر». وحر الصدر قيل: غشه أو حقده أو غيظه أو نفاقه، بحيث لا يبقى فيه رين أو عداوة أو أشد الغضب.'},
      {member:'صالح محمد الضحيان',title:'إحياء علوم الدين ٤/٤٠٨ — أبو حامد الغزالي',body:'يقول أبو حامد الغزالي: العجب أنك تعاقب أهلك وولدك على ما يصدر منهم من سوء خلق وتقصير في أمر، وتخاف أنك لو تجاوزت عنهم لخرج أمرهم عن الاختيار وبغوا عليك، ثم تهمل نفسك، وهي أعظم عدو لك؛ فإن نفسك مع أهلك وولدك كراعٍ واحد مع رعية كثيرة، فإذا عجزت عن نفسك الواحدة كيف تضبط رعيتك الكثيرة؟!'},
      {member:'سلطان بن خالد بن برغش',title:'الذيل على طبقات الحنابلة ٤/٤٠٩ — الطوفي',body:'قال ابن رجب رحمه الله عن الطوفي صاحب مختصر الروضة: «وله نظم كثير رائق، وقصائد في مدح النبي صلى الله عليه وسلم، وقصيدة طويلة في مدح الإمام أحمد، وكان مع ذلك كله شيعيًا منحرفًا في الاعتقاد عن السنة، حتى إنه قال في نفسه: حنبلي رافضي أشعري... [ظاهري]، هذه إحدى العبر».'},
      {member:'إبراهيم الشويهي',title:'المرونة النفسية ص٩-١٠ — بندر آل جلالة',body:'المرونة النفسية ليست فقط لتحمل الألم النفسي وإنما أيضًا القدرة على عدم الانشغال به. طبيعة الحياة أنها تحمل في طياتها العديد من المنغصات والأزمات؛ فالحل ليس في محاولة الحياة بدون ضغوط لكن في تحسين المرونة النفسية. وكلمة ضغط لا تعني دومًا معنى سلبيًا، فأحيانًا نحتاج إلى جرعات من الضغط النفسي الإيجابي الذي يدفعنا للعمل والإنجاز.'},
      {member:'إبراهيم الشويهي',title:'تكوين الملكة اللغوية ص١١٥-١١٦ وص٧٨',body:'لا أظنني مبالغًا إن زعمت أن تحصيل الملكة اللغوية له تعلق كبير بمقدار التبحر في نصوص الشريعة الأولى. فهذه النصوص هي اللب والأساس الذي تستخرج منه أعلى قواعد العربية وأكثر التعبيرات بلاغة... وهل أخذت هذه القواعد إلا من القرآن ابتداء، فكيف تعارض الأصل الفرع؟ وورد مقتطف أيضًا من ص٧٨ واقتباس من كتاب البخلاء للجاحظ.'},
      {member:'عبدالله سليمان المحيميد',title:'قصة محمد بن إبراهيم السمالوطي',body:'قصة العالم محمد بن إبراهيم السمالوطي نقلًا عن أحمد بن الصديق الغماري، وعجائب حفظه واطلاعه وسعة معرفته بالكتب والتراجم...'},
      {member:'عبدالله سليمان المحيميد',title:'رحلتي الفكرية — عبدالوهاب المسيري',body:'قصة عبدالوهاب المسيري مع المكرونة والأرز في مذكراته (رحلتي الفكرية)، وطرائف حياته الدراسية... وقصة د. أحمد مطلوب وزوجته د. خديجة الحديثي في شغفهما بالعلم والكتب والبحث اللغوي والأدبي...'},
      {member:'عبدالله سليمان المحيميد',title:'المتلذذون بالعلم — راشد البداح',body:'لا تغفل عن كتب أدب الطلب فإنها للذتك تشحن، ولهمتك تشحذ، وتوقظ في نفسك حب المعرفة والجد في التحصيل...'},
      {member:'عبدالله سليمان المحيميد',title:'حراسة الفضيلة — بكر أبو زيد',body:'زمن التمحيص: قال الشيخ بكر أبو زيد رحمه الله: إن المراهنة على اندثار هذا الدين بشعائره العظيمة وفرائضه، بل وسننه، مراهنة خاسرة لم تفز يومًا منذ زمن أبي جهل حتى زمن أتاتورك؛ ولكنكم قوم تستعجلون!...'},
      {member:'عبدالله سليمان المحيميد',title:'نظم الدرر ٩/٣٦ — المرونة النفسية',body:'الإسلام علمنا المرونة النفسية قبل علماء النفس: غزوة تبوك كانت شهرًا وسماها الله ساعة العسرة. قال البقاعي رحمه الله: وسماها ساعة تهوينًا لأوقات الكروب وتشجيعًا على مواقعة المكاره، فإن أمدها يسير وأجرها عظيم.'},
      {member:'عبدالله سليمان المحيميد',title:'ترتيب العلوم ص٢١٤ — ساجقلي زاده',body:'توبة العلامة ساجقلي زاده من الاشتغال بعلم الكلام: «كما هجر الغزالي الكلام، كذلك هجرته وتبرأت وتبت منه إلى الله... والآن أتمنى أن أجمع نسخه المنتشرة وأحرقها بالنار لئلا يبقى مني أثر في الكلام، لكني لا أقدر على ذلك».'},
      {member:'عبدالله سليمان المحيميد',title:'جمع الجواهر — القيرواني ص٢٦',body:'يقول أشعب الطماع: «ما تناجى اثنان في جنازة إلا ظننت أن الميت أوصى لي بشيء».'},
      {member:'عبدالله سليمان المحيميد',title:'وضاح بن هادي — لا تستعجل الثمرة',body:'لا تستعجل الثمرة: ساعات طويلة من القراءة والاستذكار والتحصيل قد لا تجد ثمرتها المحسوسة اليوم، لكن ستتفاجأ بعد سنوات في موقف أو نقاش أو تأمل أن تلك الساعات قد آتت أكلها حقًا...'}
    ];

    const MORE_MEMBER_QUOTES = [
      {member:'باسل عبدالله أحمد الرميح',title:'د. عبدالكريم بكار — القراءة وتكوين العقل',body:'مقالات وأفكار في القراءة وتكوين العقل والوعي وبناء الذات... — د. عبدالكريم بكار، ومقتطف من كتابات بسام الهويمل.'},
      {member:'بدر الشايعي',title:'اقتصاد السعادة — كلوديا سينيك',body:'هل نحن أكثر سعادة كلما أصبحنا أكثر ثراء؟ من الأسئلة اللافتة التي يطرحها كتاب «اقتصاد السعادة» لكلوديا سينيك... — د. عبدالرحمن الجابر.'},
      {member:'بدر الشايعي',title:'مختصر منهاج القاصدين ص٣٢٤ — ابن قدامة',body:'إذا أراد الله بعبد خيرًا بصّره بعيوب نفسه، فمن كانت له بصيرة لم تخف عليه عيوبه، وإذا عرف العيوب أمكنه العلاج، ولكن أكثر الناس جاهلون بعيوبهم، يرى أحدهم القذى في عين أخيه ولا يرى الجذع في عينه. وقال رسول الله صلى الله عليه وسلم: «يبصر أحدكم القذى في عين أخيه وينسى الجذع في عينه». والقذاة القشة الصغيرة والجذع جذع النخلة. — صحيح ابن حبان ١٣/٧٥.'},
      {member:'عبدالرحمن عمر الصعب',title:'الناطق الأخرس ص٢٩ — المازني',body:'والقارئ الحقيقي لا يبالي بالمكان والزمان عندما يكون بصحبة كتابه؛ يقرأ ويطالع ويتصفح في كل وقت وفي أي موضع. كتب المازني: «ليس لي طريقة خاصة أو وقت خاص للقراءة؛ فكل وقت صالح لذلك، وكل مكان أستطيع فيه القراءة ولو كان حمامًا بغير ماء!»'},
      {member:'عبدالرحمن عمر الصعب',title:'حياة في الإدارة — القصيبي',body:'يقول ميكافيللي إن الناس يغفرون لمن قتل آباءهم ولا يغفرون لمن أخذ أموالهم، إلا أننا لسنا بحاجة إلى أن نكون ميكافيليين لندرك أهمية المصالح، يكفي أن ننظر إلى ما يدور في المحاكم من صراعات على المصالح بين الإخوة الأشقاء!'},
      {member:'عبدالرحمن عمر الصعب',title:'قصة بكر أبو زيد — تدوين الفوائد',body:'كان الشيخ العلامة بكر أبو زيد رحمه الله يدون الفوائد على أغلفة الكتب، ثم بعد الانتهاء يكلف بعض أبنائه بجرد تلك الفوائد المقيدة على الغلاف، وكل فائدة مقابلها ريال...'},
      {member:'عبدالرحمن عمر الصعب',title:'بيت شعر — مكارم الناس',body:'قد مات قوم وما ماتت مكارمهم / وعاش قوم وهم في الناس أموات.'},
      {member:'عبدالرحمن سليمان الثنيان',title:'الآثار ٤/٣٧٢ — محمد البشير الإبراهيمي',body:'قال محمد البشير الإبراهيمي: إن الكتاب الذي يقرأ كالطعام الذي يؤكل؛ فطعام يعطي آكله القوة والفراهة، وطعام يعطيه الضعف والهزال... نصيحتي للأدباء الناشئين أن يوفوا حظهم من قراءة الكتب العامرة التي تقوى بها الملكة ويفحل الطبع وتزكو الثمرة...'},
      {member:'عمر بن إبراهيم القريعان',title:'فائدة لغوية — الحكيكة',body:'من طريف لغة العرب أنها تسمي اللغز: الحكيكة؛ لأن من تلقى عليه يحك رأسه تفكرًا... وتقول العرب: جاء فلان بالحكيكات.'},
      {member:'عمر بن إبراهيم القريعان',title:'مصطفى صادق الرافعي — غرض القراءة',body:'ليكن غرضك من القراءة اكتساب قريحة مستقلة، وفكر واسع، وملكة تقوي على الابتكار، لا مجرد حشو الذاكرة بالمعلومات والمحفوظات...'},
      {member:'فهد بن عبدالعزيز الشيبان',title:'شرح رياض الصالحين — ابن عثيمين',body:'إذا طلب العلم ورأى من نفسه مللًا في مراجعة كتاب فلينتقل لكتاب آخر حتى ينشط، ثم يعود للأول؛ لأن النفوس تمل وتكل، وتحتاج إلى تنويع.'},
      {member:'فهد بن عبدالعزيز الشيبان',title:'عبدالله الوهيبي — تطلب الكمال',body:'مقال عبدالله الوهيبي في تطلب الكمال والانشغال به عن الإنجاز والعمل المستمر...'},
      {member:'فهد بن عبدالعزيز الشيبان',title:'Daniel Pink — نصائح للقراءة',body:'سبع نصائح عملية للقراءة والاستمرار فيها وتكوين العادة القرائية... — دانيال بينك.'},
      {member:'أحمد محمد الأكيزم',title:'قصة إبراهيم وهاجر وإسماعيل عليهما السلام',body:'خرج إبراهيم عليه السلام بزوجته هاجر وابنهما الرضيع إسماعيل إلى مكة، وكانت واديًا غير ذي زرع، لا ماء فيه ولا أنيس... فقالت هاجر: الله أمرك بهذا؟ قال: نعم. فقالت بيقين المؤمنة: إذن لا يضيعنا.'},
      {member:'أحمد محمد الأكيزم',title:'أبيات في الحمراء وطارق بن زياد',body:'قالت هنا الحمراء زهو جدودنا / فاقرأ على جدرانها أمجادي / أمجادها! ومسحت جرحًا نازفًا / ومسحت جرحًا ثانيًا بفؤادي / يا ليت وارثت الجميلة أدركت / أن الذين عنتهم أجدادي / عانقت فيها عندما ودعتها / رجلًا يسمى طارق ابن زياد.'},
      {member:'عبدالملك علي الضبعان',title:'الفوائد — ابن القيم: ثلاثة لا تفكر فيها',body:'لا تفكر في الفقر، فإنه يكثر الهم والغم ويزيد في الحرص... ولا تفكر فيمن ظلمك، فإنه يقسي القلب ويوغر الصدر... ولا تفكر في طول البقاء، فإنه يورث حب الجمع وتضييع العمر في التسويف.'},
      {member:'عبدالملك علي الضبعان',title:'معاوية بن أبي سفيان — العقل',body:'العقل مكيال؛ ثلثه الفطنة، وثلثاه التغافل.'},
      {member:'خالد بن عبدالرحمن الواصل',title:'الفوائد — ابن القيم ٧/٨/٢٠٢٦',body:'مقتطف من كتاب الفوائد لابن القيم الجوزية.'},
      {member:'خالد بن عبدالرحمن الواصل',title:'جزيرة العرب في القرن العشرين — حافظ وهبة',body:'مقتطف من كتاب جزيرة العرب في القرن العشرين حول أحوال الجزيرة العربية وتاريخها.'},
      {member:'إبراهيم سليمان النغيمشي',title:'الإمام الغزالي — تزكية النفس',body:'مقولة منسوبة للإمام أبي حامد الغزالي في تزكية النفس ومجاهدة الهوى والانشغال بالعلم النافع.'},
      {member:'عبد الله بن محمد المنصور',title:'مدارج السالكين — ابن القيم',body:'﴿اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم الإسلام دينًا﴾ [المائدة: ٣]. وصف الدين بالكمال والنعمة بالتمام؛ فالدين لا نقص فيه ولا عيب ولا خلل، والنعمة تامة دائمة متصلة، لا يسلبهم إياها بعد أن أعطاهموها، بل يتمها لهم في هذه الدار وفي دار القرار.'},
      {member:'عبد الله بن محمد المنصور',title:'مقتبس — القراءة والمشورة والكتابة',body:'القراءة تصنع إنسانًا كاملًا، والمشورة تصنع إنسانًا مستعدًا، والكتابة تصنع إنسانًا دقيقًا.'},
      {member:'عبد الله بن محمد المنصور',title:'صبغة الله ص٣٨',body:'معرفة دلائل صحة الإسلام وتذوق محاسنه كفيلان باليقين بصحة هذا الدين، وأنه الدين الذي ارتضاه الله لعباده واختاره لهم.'},
      {member:'أحمد مدشر الظاهر',title:'ذيل طبقات الحنابلة ٢/١٥٠ — ابن هبيرة',body:'قال ابن هبيرة في قوله تعالى: ﴿فاغفر للذين تابوا واتبعوا سبيلك﴾: علمت الملائكة أن الله يحب عباده المؤمنين فتقربوا إليه بالشفاعة فيهم، وأحسن القرب أن يسأل المحب إكرام حبيبه؛ فإنك لو سألت شخصًا أن يزيد في إكرام ولده لارتفعت عنده، حيث تحثه على إكرام محبوبه.'},
      {member:'أحمد مدشر الظاهر',title:'الأخلاق والسير — ابن حزم',body:'لو علم الناقص نقصه لكان كاملًا، فلا يخلو مخلوق من عيب، فالسعيد من قلت عيوبه ودقت...'},
      {member:'عمار عبدالله الفايز',title:'صيد الخاطر ص٣٥٠ — الشعبي',body:'قال الشعبي: «العلم أكثر من أن يحصى، فخذوا من كل شيء أحسنه».'},
      {member:'عمار عبدالله الفايز',title:'جلاء الأفهام — ابن القيم',body:'فإنه ﷺ محمود عند الله، ومحمود عند ملائكته، ومحمود عند إخوانه من المرسلين، ومحمود عند أهل الأرض كلهم.'},
      {member:'صالح عبدالله صالح السمحان',title:'ابن حزم — أبيات في الدهر',body:'هل الدهر إلا ما عرفنا وأدركنا / فجائعه تبقى ولذاته تفنى / كأن الذي كنا نسر بكونه / إذا حققته النفس لفظ بلا معنى.'},
      {member:'راكان خلف الحربي',title:'تفسير ابن كثير ٤/٥١٢ — شكر داود',body:'روي أن نبي الله داود عليه السلام قال: يا رب، كيف أشكرك وشكري لك نعمة منك علي؟ فقال الله تعالى: الآن شكرتني يا داود، أي حين اعترفت بتقصيرك عن أداء شكر النعم.'},
      {member:'محمد حمدان سهرابي',title:'الأوائل ص١٠٧ — زيد الجراعي الحنبلي',body:'عن الوليد بن عمرو: بلغني أن أول شيء يجد الميت حوله عند رجليه، فيقول: ما أنت؟ فيقول: أنا عملك. وذكر عطاء بن يسار: إذا وضع الميت في لحده فأول شيء يأتيه عمله فيضرب فخذه الشمال...'},
      {member:'البراء بن يوسف الراجحي',title:'ابدأ كتابة حياتك ص١٣',body:'«كل ابن آدم خطاء» هذا قدر الإنسان، وقدره الآخر أن له الحرية المطلقة في التحرر من ربق الخطأ مهما كان كبيرًا!!'},
      {member:'البراء بن يوسف الراجحي',title:'الحسن البصري — محاسبة النفس',body:'مقولة منسوبة للحسن البصري في محاسبة النفس والعمل للآخرة.'},
      {member:'ماجد فهد الغنيم',title:'إلى الظل — علي الفيفي',body:'عود نفسك على «آسف» لأنك بذلك تزكي نفسك فتفلح؛ فالاعتذار عند الخطأ شجاعة الكبار، وإقرار بالحق، وتطهير للنفس من الكبر والعناد.'},
      {member:'عبدالرحمن الغنيم',title:'المدخل لابن بدران — القراءة',body:'لا ينبغي لمن يقرأ كتابًا أن يتصور أنه يريد قراءته مرة ثانية، لأن هذا التصور يمنعه عن فهم جميع الكتاب. — الشيخ محمد بن عثمان الحنبلي.'},
      {member:'عبدالرحمن صالح العبيشي',title:'جامع العلوم والحكم — ابن رجب',body:'ربما دعا المؤمن المجاب الدعوة بما يعلم الله الخيرة له في غيره، فيصرف الله عنه من السوء مثلها، أو يدخرها له في الآخرة، فيكون عطاء الله له في المنع أعظم من عطائه في الإجابة.'},
      {member:'محمد صالح المزيني',title:'الإقناع — ديف لاكاني',body:'كلما زاد ما تعرفه عن الناس — دوافعهم ومخاوفهم واحتياجاتهم الحقيقية — زادت إمكانية إقناعهم والتأثير فيهم بصدق وفاعلية.'},
      {member:'شايف نعمان عايض',title:'رجال من التاريخ — علي الطنطاوي',body:'مالك بن الريب عاش قاطعًا للطريق، ومات مجاهدًا، وخلد شعره كأفضل أشعار الرثاء.'},
      {member:'فيصل عبدالرحمن الفراج',title:'حكمة إدارية — التخطيط',body:'الشخص الذي لا يخطط قد ينجح، لكن الصعوبات والعقبات والمشاكل التي تواجهه تكون أكثر وأشد؛ لأن التخطيط السليم يختصر الطريق ويكشف العقبات قبل وقوعها.'},
      {member:'عمر مجري البقمي',title:'ابن القيم — مراقبة الخواطر',body:'قال ابن القيم رحمه الله: «وأرباب الطريق مجمعون على أن مراقبة الله تعالى في الخواطر سبب لحفظها في حركات الظواهر، فمن راقب الله في سره حفظه الله في حركاته في سره وعلانيته».'},
      {member:'د. سلطان عمي',title:'غمامتان — كلمات الله',body:'هذا هو الفرق بين كلمات الله تعالى وبين كل ما أنتجته العقول البشرية من اجتهادات ناقصة أو خاطئة، ثم هي تحتاج بعد مدة إلى تصحيح وتنقيح وتحسين... ذلك الكتاب لا ريب فيه هدى للمتقين.'},
      {member:'د. سلطان عمي',title:'غمامتان — أمة الإسلام',body:'أصبح المسلمون في إثر نزول هذه السورة الكنز علماء بالعقائد وتاريخ الأمم، ولديهم أصول الفكر الإداري والاجتماعي. نعم كانت مدينة النبي صغيرة ومسجده صغيرًا وساكنوه قليلين، لكنهم بعد نزول آل عمران أصبحوا أمة من الأمم، بل خير الأمم...'},
      {member:'عبدالرحمن خالد الصقعوب',title:'الارتشاف من أدبيات السقاف — المتنبي',body:'كيد الرجال أعظم من كيد النساء... وقال أبو الطيب المتنبي: على قدر أهل العزم تأتي العزائم / وتأتي على قدر الكرام المكارم / وتعظم في عين الصغير صغارها / وتصغر في عين العظيم العظائم...'},
      {member:'هاشم علي الأخفش',title:'مقتبس — المعلومات والسلوكيات المالية',body:'المعلومات المالية تتعلق بمستوى معرفتك حول المال وإدارته، وسلوكياتك تجاه المال تتعلق بالطريقة التي تتصرف بها فعليًا عندما يتعلق الأمر بالمال. ببساطة، معلوماتك تعبر عن معرفتك وسلوكياتك تعبر عن تطبيق تلك المعرفة في حياتك اليومية.'}
    ];

    const ARTICLE_BATCH = [
      {member:'محمد عبدالعزيز العمر',title:'خاطرة: كاريزما المستبد الجميل والعمى العاطفي',date:'١٧/٦/٢٠٢٤',body:'اليوم لفت انتباهي مصطلح أو مسمى لفكرة كانت تختلج عقلي، في صراع ما بين إعجاب ونقد لشخصية أدبية عظيمة لها ما لها وعليها الشيء الكثير، وخاصة من المحافظين - جعلنا وإياكم من الحافظين والمحافظين. هذا الصراع بين عاطفتي وأدوات النقد، هذا التفكير الذي يصعد سلم الإكبار، فيشاك بشوكة نابية على وجه الطريق لا تستطيع تجاوزها حتى لو كنت منتعلًا بجلد الفيل. وهذا يقع معي ومع غيري، ويصير لي ولغيري، مما نواجههم في شخصيات وعلماء وأدباء ومشايخ ودعاة. الإعجاب بهم وأخذ البرنت الناصع عنهم يجعلك تصاب بالعمى العاطفي.\n\nلعلي لا أبتعد وأخبركم بالفائدة التي جنيتها من بستان الكتاب وأنا أقرأ فيه. هممت برميه أو القفز لفهارسه لكي لا أندم على قراءته، أو بالأصح لا أضيع الوقت في تصفحه - ولا يخفى عليكم محافظتي على الوقت - واستغفر الله من هذه الكذبة. نعم، هذا المصطلح الذي أنقذني من التذبذب في حكمي على هذه الشخصية أو تلك، ويصاب به كل نحرير - النحرير أقصد به العالم أو الأديب، مهب أنا - والنحرير هو الحاذق الفطن، وضع له القبول في الأرض. الفتح الذي أدركته اليوم هو «كاريزما المستبد الجميل». لما مررت على هذا المصطلح حالًا كتبت هذه الخاطرة لأنه كان لي مخرجًا من الزحام كمخرج ١٣ يخرجك من زحام الرياض. تركت ذكر اسم الشخصية خشية الغيبة للأموات، واستغفر الله من الكذبة الثانية، ولك الحرية في وضع أي اسم...'},
      {member:'محمد عبدالعزيز العمر',title:'خاطرة: متلازمة ملَهِّي الرِّعيان',date:'١/١/٢٠٢٦',body:'اليوم، وككل يوم، تصيبني متلازمة «ملَهِّي الرِّعيان»، ولها - والله - لذة عجيبة، وأسأل من جربها.\n\nولمن لا يعرف المثل، فهو يقال عن طائر صغير الحجم، بين الحمامة والعصفور، يشاكس الرعاة في المراعي، فيلهيهم؛ إذ لا يطير بعيدًا، فيظن الراعي أن بإمكانه الإمساك به، فيتبعه… ثم يفلت منه في كل مرة.\n\nوهكذا حالي مع الكتب وشبكات التواصل؛ أتنقل من هنا إلى هناك، أظن أني أمسكت بالفائدة، أو ظفرت بالمعلومة، فإذا بها قد ألهتني، وخرجت من المولد بلا حمص. يا ليتني مثل الراعي هبنقة، يرعى السمان ويترك المهازيل.'},
      {member:'عبدالرحمن عمر الصعب',title:'مقال تأملي: الوقوف على قارعة الطريق ونموذج التشييء',date:'١/١٢/٢٠٢٥',body:'توقفت العربة فجأة، كما يتوقف القلب عن نبضه. لم يكن نفاذ الوقود مجرد حدث ميكانيكي عابر، بل كان إعلانًا صارمًا عن عجز الآلة، وتجريدًا للإنسان من قوقعته الحديدية التي كان يظنها حصنًا حصينًا. ترجلت منها، ولفحتني شمس الظهيرة بسوط من لهب، ووقفت على قارعة الطريق وحيدًا، وكأنني نفيت من عالم الأحياء إلى هامش النسيان.\n\nوقفت أمد يدي.. تلك الحركة الانكسارية التي تجمع بين الرجاء والذل، بين حاجة الملهوف وعزة النفس التي تأبى الانحناء. السيارات تمر مسرعة، تخطف الأبصار ببريقها، ولا يلتفت إلي أحد. إنهم يمرون بي كما يمر الزمن بالأشياء المهملة، لا يرون إنسانًا، بل يرون «شيئًا» معطلًا على جانب الطريق. وهنا، وفي غمرة هذا الشعور البائس، انشق حجاب الذاكرة، ولمعت في ذهني صورة قديمة، صورة جعلتني أخفض يدي خجلًا لا تعبًا.\n\nتذكرت يومًا كنت فيه أنا السيد القابع خلف المقود، والمكيف ينسج حولي هالة من البرودة والغرور. رأيت رجلًا مثلي الآن، يقف الوقفة نفسها ويمد اليد نفسها وبالنظرة المنكسرة نفسها. مررت به يومها، لم أقف ولم ألتفت. لم يكن قلبي قاسيًا - أو هكذا كنت أزعم - لكنني كنت غارقًا في النموذج المادي للحياة؛ كنت أرى الوصول إلى وجهتي أهم من الوصول إلى إنسانيتي.\n\nفي تلك اللحظة تجلت لي الحقيقة الفلسفية العارية: نحن لا نعيش في عالم من الأشياء، بل في شبكة من العلاقات، لكن طغيان المادة حولنا إلى كائنات وظيفية. حين مررت بذلك الرجل قديمًا، لم أره أخًا في الإنسانية بحاجة إلى غوث، بل رأيته عائقًا بصريًا أو مشكلة لا تعنيني. لقد مارست عليه نوعًا من التشييء، جردته من كينونته البشرية واختزلته في كونه مجرد عطل في مشهد الطريق.\n\nوها أنا اليوم أدفع ضريبة ذلك التشييء. وقفتي هذه ليست عقوبة، بل درس وجودي. كأن الأقدار - ببراعة حبكة روائية محكمة - أرادت أن تضعني في الإحداثيات المكانية نفسها، لتعيد ترتيب إحداثياتي الأخلاقية.\n\nعدت ألوح بيدي مرة أخرى، ولكنني هذه المرة لم أكن ألوح للسيارات القادمة طلبًا للوقود، بل كنت ألوح لذلك الرجل الذي تركته خلفي في الماضي.. ألوح له معتذرًا، وكأنني أقول له عبر فجوة السنين: سامحني، لم أكن أعلم أن الطريق دائرة، وأن من يترك أخاه في العراء اليوم، سيجد نفسه عاريًا غدًا إلا من الندم.\n\nتوقفت سيارة أخيرًا، ونزل منها شاب بابتسامة طيبة، تشبه تلك الابتسامات التي نقرأ عنها في أدبنا القديم، صافية كأنها نبع ماء. ركض نحوي بوعاء الوقود، ولم يعلم أن وقوفي هناك قد امتلأ بما هو أثمن من البنزين؛ لقد امتلأ وعاء روحي بفهم جديد لمعنى أن تكون إنسانًا.\n\nفيا أيها العابرون في دروب الحياة، تمهلوا.. لا تسرعوا فتدهسوا بإطارات غفلتكم معاني الرحمة. فإن المواقف ديون، والأيام دول، ومن لا يرحم ضعف الواقفين على الرصيف، قد يطول وقوفه يومًا بلا مجير.'},
      {member:'عبدالرحمن عمر الصعب',title:'قصة حلم ساخرة: المسيري والتمور القصيمية',date:'٢٠/١٢/٢٠٢٥',body:'أغفيت إغفاءة المحب للكتاب، فانسللت من واقعي إلى برزخ الرؤى، حيث نصب لي منبر مهيب، وتحلق حولي قوم غامت ملامحهم في ضباب الحلم، وكأنهم أطياف تنتظر القول الفصل. وقفت، والأنفاس محبوسة، أتحسس أوراقي لأفتتح ندوة عن السفر العظيم: «رحلتي الفكرية».\n\nاستجمعت قواي، وبنبرة الواثق قلت: «أيها الحضور، حديثنا اليوم عن سيرة ذاتية...». وما إن غادرت «الذاتية» شفتي، حتى شعرت بكهرباء التوتر تسري في المكان. رمقني أحد الجالسين بنظرة شزراء، نظرة عارف غيور على المصطلح، وكأنه يصرخ بصمت: «ويحك! ألم تقرأ أنها سيرة غير ذاتية؟ وغير موضوعية؟».\n\nارتبكت، وحاولت تدارك الموقف وتلطيف الأجواء، فأردت أن أسترسل في عنوان الكتاب الفرعي «في البذور والجذور والثمر»، ولكن الحنين للأرض ونداء النخيل في دمي غلب لغتي، فقفز «العرق القصيمي» إلى لساني دون استئذان، فقلت بصوت جهوري: «نتحدث عن رحلته في البذور.. والجذور.. والتمور!».\n\nهنا انكسر جدار الصمت. سمعت ضحكًا مكتومًا يغالب الوقار، ورأيت ذلك الرجل الغاضب ينهض، فإذا الضباب ينقشع عن وجهه، فعقد لسان دهشتي.. إنه هو! عبدالوهاب المسيري بشحمه ولحمه ونظارته المميزة.\n\nرأيته يرمقني بمزيج عجيب من الحنق الفكري والدعابة الإنسانية، ضحكة تخرج من عبوس مصطنع، وكأنه يلوح بيده ليقول: «أبعدوا هذا الفتى عن المنبر! وآتوني بغيره، فقد حول الثمار إلى سكري وبرحي!».\n\nاستفقت بعدها فزعًا وضاحكًا، كأنه يغمز لي بأن الرحلة الفكرية قد تخللتها استراحة قصيمية عابرة.'},
      {member:'محمد عبدالعزيز العمر',title:'تأمل: أشد أنواع البخل',date:'١/٨/٢٠٢٥',body:'أشد أنواع البخل بعد البخل بالصلاة والسلام على رسول الله، المن بالثناء لمن يستحقه، والشح برد الرسالة عمن يسأل ويتطمن. بل اشكر من أسدى لك معروفًا، وأنصت قليلًا لمن جلس ساعة يبلع ثرثرتك وضجيجك، «ويل للمطففين».'},
      {member:'محمد عبدالعزيز العمر',title:'شذرة في المقال الأقصوصة',date:'١٩/٨/٢٠٢٥',body:'القارئ الجيد يكون طريقه إلى الكتابة الجيدة مفروشًا بالورود. أنا مع أن الموهبة لها دور بارز في الكتابة الإبداعية، ونستحضر مثالًا لذلك بما يعرف بـ«المقال الأقصوصة»، والذي أحب أن أسميه المقال الميّاسي نسبة إلى الأديب الإسباني خوان خيسوس ميّاس، الذي أبدع في المزج بين المقالة والقصة والفكرة غير المألوفة في حبكته، وقد دون في كتابه «الأشياء تنادينا» نصوصًا تعالج بعض الظواهر التي عاشها أو نعايشها، بأسلوب يجمع بين السخرية والفكاهة والجدية. لنأخذ مثلًا قصصه القصيرة: متع التاكسي، الكتابة ضد الرغبة، الآباء يكذبون، ثمن النجاح، والموت بأثر رجعي؛ وهي نصوص أشبه بوجبات خفيفة لكنها دسمة بالفكر والدهشة.'},
      {member:'محمد عبدالعزيز العمر',title:'خاطرة: النوستالجيا والرياضة',date:'٢٨/٨/٢٠٢٥',body:'النوستالجيا مصطلح يوناني يقصد به الحنين إلى الماضي والعودة إلى الذكريات الجميلة التي يشتاق إليها الإنسان؛ وكل الذكريات بعد مضيها تكون لذيذة. وهذا يقودنا إلى رياضة الأمس، قبل ثلاثين عامًا من اليوم ونحن في عام ٢٠٢٥، حيث كان المشهد يكتسي بالألوان؛ يومها كان التعصب والمشاكسة من الجمهور، يقابلها فن ومهارات يقدمها بعض الرموز من اللاعبين أو ما نسميهم اليوم بالأساطير. ورغم ما كان في ذلك من نزعة فردية وأنانية تضر بالفريق أحيانًا، إلا أنه كان يشبع ذائقة الجماهير، وأجمل من تكلم عن هذه اللذة الإعلامي الكويتي خليفة المزين.\n\nوتعود بنا النوستالجيا إلى عهد الرؤساء المشجعين، حين كانت الرياضة عفوية بطراوتها وحلاوتها ومشاكساتها وتصريحاتها واتهاماتها، كما عرفناها في أيام الراحلين عبدالرحمن بن سعود وعبدالله بن سعد وأحمد مسعود. ولا ننكر أن الماضي، وإن كان قاسيًا أحيانًا، يظل ذا جرس ورنين وشمة. لكننا في الوقت نفسه مع التطوير والعالمية؛ ومن هنا جاء التفريق بين الرئيس المشجع والرئيس المنتخب، فلكل منهما ميزاته الخاصة. المشجع يبث روح الحماسة والانتماء، والرئيس المنتخب يواكب متطلبات المرحلة التطويرية، داخل الملعب باللعب الجماعي وخارجه بالأنظمة والقوانين والانتخاب، وهي درجات السلم للوصول إلى العالمية.'},
      {member:'محمد عبدالعزيز العمر',title:'شذرة: في ديوانية العم أبو صالح (الثرثار وأبو العرّيف)',date:'٢٩/٨/٢٠٢٥',body:'في ديوانية العم أبو صالح نستلذ الجلسة ونتشعب في الأحاديث، والحديث ذو شجون يجر بعضه بعضًا؛ فمجلسه من متع ولذائذ الدنيا. ولا يعكر صفو هذه الشجون إلا من به مس من الجنون: الأول ثرثار كصاحب العقاد الذي أفسد عليه لذة اللقاء مع محبوبته، ونعته العقاد بـ«أحسن حمار»، والآخر يحب المخالفة والتسفيه كصديق المازني الذي وصفه بالناجح سخرية وحقيقة. والاثنان يملكان لياقة في الكلام لا يباريهما أحد؛ فهما كفرسي رهان، لا يشق لهما غبار في الهبد والعد واللد.\n\nيقول العقاد عن صاحبه: يحسن أن يبدأ الكلام في كل مكان، ولا يحسن أبدًا أن ينتهي منه... المهم عنده أن ينفض ما في صدره بغير توقف ولا مناسبة، وليس مهمًا أن ترد عليه أو تعقب على ملاحظاته وأسئلته التي يوجهها ولا ينتظر جوابها؛ فهو لا يصغي إليها ولا يسمعها ولا يفكر في معناها، إنما يقول ويقول ويقول. وصديق المازني يستهجن كل ما يستحسنه الناس ويتهمهم بضعف العقل والقصور والتخلف... فهو معارض بطبعه، إن قلت حلوًا قال مرًا وإن قلت مرًا قال حلوًا. وكل ما سبق في كفة وتحمل العم أبي صالح لهما في كفة؛ سبحان موزع العقول ومانح التحمل، والجنون فنون.'},
      {member:'محمد عبدالعزيز العمر',title:'شذرة: نَفَس الأستاذية في الكتابة',date:'٣٠/٨/٢٠٢٥',body:'النصوص التي تحمل نفس الأستاذية لا يعني ذلك تكبرًا، والتي تحمل التوجيه أنها صادقة. ما يهمنا تلقي القارئ لها؛ فإن وجدت لها مهابة وقبولًا فحيهلًا، وإن تمنعت النفس ووجدت ثقلًا وتمردًا فلا تثريب عليها. ومن مارس أنه الأعلم والأخبر ففر منه فرارك من الأسد. المهم - في نظري - ألا تنزلق أنت في كتاباتك لمثل هذه المواقف، وإذا أردت لقلمك السيرورة والديمومة فاكتب بلسان الصديق الصدوق، وصف المشهد كما هو بلا تزويق ولا تزوير. واعذرني إن لبست خاطرتي هذه لبوس الأستاذية، فهي لي حلال ولغيري حرام.'},
