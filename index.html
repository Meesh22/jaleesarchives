  <style>
    :root {
      --bg-paper: #F7F4EC;
      --card-bg: #FFFFFF;
      --header-dark: #1A3A34;
      --teal-primary: #35746C;
      --teal-light: #EBF3F1;
      --gold-accent: #C4A449;
      --gold-light: #F9F5E8;
      --text-main: #1E2B28;
      --text-muted: #5C6F6B;
      --border-soft: #E2DDD0;
      --shadow-sm: 0 2px 8px rgba(26, 58, 52, 0.06);
      --shadow-md: 0 8px 24px rgba(26, 58, 52, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-paper);
      color: var(--text-main);
      line-height: 1.7;
      min-height: 100vh;
    }

    /* Top Navigation & Logo Bar */
    .top-bar {
      background-color: var(--bg-paper);
      border-bottom: 1px solid var(--border-soft);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.75rem 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .top-bar-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
    }
    .jalees-svg-logo {
      height: 62px;
      width: auto;
      display: block;
    }
    .site-badge {
      background: var(--teal-light);
      color: var(--teal-primary);
      border: 1px solid rgba(53, 116, 108, 0.25);
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .btn {
      font-family: 'Cairo', sans-serif;
      border: none;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--teal-primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--header-dark); }
    .btn-gold {
      background: var(--gold-accent);
      color: #fff;
    }
    .btn-gold:hover { background: #b19138; }
    .btn-outline {
      background: #fff;
      color: var(--teal-primary);
      border: 1px solid var(--border-soft);
    }
    .btn-outline:hover {
      border-color: var(--teal-primary);
      background: var(--teal-light);
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, var(--header-dark) 0%, #244F47 100%);
      color: #fff;
      padding: 2.25rem 1.5rem;
      border-bottom: 4px solid var(--gold-accent);
    }
    .hero-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .hero h1 {
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 0.35rem;
      color: #fff;
    }
    .hero h1 span { color: var(--gold-accent); }
    .hero p {
      color: #D5E3DF;
      font-size: 1rem;
      max-width: 680px;
    }
    .stats-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(196, 164, 73, 0.35);
      border-radius: 14px;
      padding: 0.85rem 1.3rem;
      text-align: center;
      min-width: 115px;
    }
    .stat-num {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--gold-accent);
      line-height: 1.2;
    }
    .stat-label {
      font-size: 0.82rem;
      color: #E2ECE9;
    }

    /* Search & Filter Controls */
    .controls-section {
      max-width: 1320px;
      margin: 1.5rem auto 1rem;
      padding: 0 1.5rem;
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 0.75rem 1.1rem;
      border-radius: 12px;
      border: 1.5px solid var(--border-soft);
      background: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--teal-primary); }
    .filter-pills {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .pill {
      padding: 0.55rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: #fff;
      color: var(--text-muted);
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill.active, .pill:hover {
      background: var(--teal-primary);
      color: #fff;
      border-color: var(--teal-primary);
    }

    /* Members Grid */
    .container {
      max-width: 1320px;
      margin: 0 auto 3rem;
      padding: 0 1.5rem;
    }
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 1.1rem;
    }
    .member-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 1.2rem;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .member-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;
      background: var(--teal-primary);
      transition: background 0.2s;
    }
    .member-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--gold-accent);
    }
    .member-card:hover::before { background: var(--gold-accent); }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }
    .member-rank {
      background: var(--gold-light);
      color: #8E7121;
      border: 1px solid rgba(196, 164, 73, 0.4);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 0.15rem 0.55rem;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .member-name {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--header-dark);
      line-height: 1.4;
    }
    .member-role {
      font-size: 0.78rem;
      color: var(--gold-accent);
      font-weight: 700;
      margin-top: 0.15rem;
    }
    .card-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border-soft);
    }
    .badge-count {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 8px;
    }
    .badge-quotes {
      background: var(--teal-light);
      color: var(--teal-primary);
    }
    .badge-articles {
      background: var(--gold-light);
      color: #8E7121;
    }
    .badge-empty {
      background: #F2F2F2;
      color: #888;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 35, 31, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }
    .modal-dialog {
      background: var(--bg-paper);
      width: 100%;
      max-width: 920px;
      max-height: 90vh;
      border-radius: 20px;
      border: 2px solid var(--gold-accent);
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      background: var(--header-dark);
      color: #fff;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .modal-title-group h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
    }
    .modal-title-group span {
      font-size: 0.85rem;
      color: var(--gold-accent);
    }
    .close-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn:hover { background: var(--gold-accent); }

    .modal-tabs {
      background: #fff;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .tab-group { display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    /* Entry Item */
    .entry-card {
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .entry-card.article-type {
      border-right: 4px solid var(--gold-accent);
    }
    .entry-card.quote-type {
      border-right: 4px solid var(--teal-primary);
    }
    .entry-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
    }
    .entry-tag {
      font-size: 0.76rem;
      font-weight: 800;
      padding: 0.18rem 0.65rem;
      border-radius: 6px;
    }
    .tag-quote { background: var(--teal-light); color: var(--teal-primary); }
    .tag-article { background: var(--gold-light); color: #8E7121; }
    .entry-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .entry-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--header-dark);
      margin-bottom: 0.6rem;
    }
    .entry-text {
      font-family: 'Amiri', 'Cairo', serif;
      font-size: 1.15rem;
      line-height: 1.95;
      color: #1B2624;
      white-space: pre-line;
    }
    .entry-source {
      margin-top: 0.75rem;
      padding-top: 0.6rem;
      border-top: 1px dashed var(--border-soft);
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--teal-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .copy-btn {
      background: var(--bg-paper);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      padding: 0.25rem 0.65rem;
      border-radius: 7px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .copy-btn:hover {
      background: var(--teal-primary);
      color: #fff;
      border-color: var(--teal-primary);
    }

    /* Add Entry Form inside Modal */
    .add-form {
      background: #fff;
      border: 1.5px dashed var(--teal-primary);
      border-radius: 14px;
      padding: 1.1rem;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }
    .add-form.open { display: flex; }
    .form-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .form-row input, .form-row select, .add-form textarea {
      font-family: 'Cairo', sans-serif;
      border: 1px solid var(--border-soft);
      border-radius: 9px;
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
      width: 100%;
    }
    .form-row > * { flex: 1; min-width: 180px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      background: var(--header-dark);
      color: #fff;
      border-right: 4px solid var(--gold-accent);
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.25s ease;
      z-index: 2000;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      .jalees-svg-logo { height: 50px; }
      .hero h1 { font-size: 1.45rem; }
    }
  </style>
</head>

        <span class="site-badge">أرشيف الأعضاء</span>
      </div>

      <div class="top-actions">
        <button class="btn btn-outline" onclick="exportArchiveJSON()">📥 تصدير الأرشيف (JSON)</button>
        <button class="btn btn-gold" onclick="resetToDefault()">🔄 استعادة النسخة المعتمدة</button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <div class="hero-inner">
      <div>
        <h1>أرشيف الأعضاء — <span>نادي جليس</span></h1>
        <p>السجل الرقمي الموثق لأعضاء نادي جليس (أصدقاء القراءة)؛ يضم القائمة المعتمدة للأعضاء الـ ٦٩ مرتبين، مع كافة مقالاتهم وخواطرهم وقصصهم واقتباساتهم الأدبية والفكرية.</p>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-num" id="statMembers">69</div>
          <div class="stat-label">عضواً معتمداً</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statQuotes">0</div>
          <div class="stat-label">اقتباس موثق</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statArticles">0</div>
          <div class="stat-label">مقال وخاطرة</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Search & Filters -->
  <section class="controls-section">
    <div class="search-box">
      <input type="text" id="globalSearch" placeholder="ابحث باسم العضو، أو عنوان مقال، أو نص اقتباس، أو اسم كتاب..." oninput="renderMembers()" />
    </div>
    <div class="filter-pills">
      <button class="pill active" data-filter="all" onclick="setGlobalFilter('all', this)">جميع الأعضاء (٦٩)</button>
      <button class="pill" data-filter="hasContent" onclick="setGlobalFilter('hasContent', this)">أصحاب المشاركات</button>
      <button class="pill" data-filter="hasArticles" onclick="setGlobalFilter('hasArticles', this)">كتّاب المقالات والخواطر</button>
      <button class="pill" data-filter="hasQuotes" onclick="setGlobalFilter('hasQuotes', this)">أصحاب الاقتباسات</button>
    </div>
  </section>

  <!-- Members Grid -->
  <main class="container">
    <div class="members-grid" id="membersGrid"></div>
