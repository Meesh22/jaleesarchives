      {title:'الإمبراطورية الأمريكية: دلائل الصمود ومؤشرات التراجع — أحمد عمرو',date:'١٤/١/٢٠٢٤',body:'عدد الصفحات: ١٨٠\n\nأبرز ما تكلم عنه الكتاب: مفهوم الإمبراطورية وكيف تسقط، وكيف أصبحت أمريكا قوة عظمى وما علاقة السياسة بالاقتصاد، ومشروع القرن الأمريكي ومشكلة أمريكا الحقيقية. ثم سرد بعض النظريات وذكر سيناريوهات صعود قوى عالمية أخرى مثل روسيا والصين.'},
      {title:'صناعة التغيير — أحمد عمرو',date:'٤/٢/٢٠٢٤',body:'عدد الصفحات: ١٣٨\n\nتكلم المؤلف في الفصل الأول عن نظريات التغيير في المجتمع، وفي الفصل الثاني عن دور النخب في صناعة التغيير، ثم عن دور العمران وكذلك الاقتصاد في صناعة التغيير.'},
      {title:'شروح رسائل الإمام المجدد محمد بن عبدالوهاب، المجموعة الأولى — عبدالعزيز الراجحي',date:'١١/٢/٢٠٢٤',body:'عدد الصفحات: ٢٨٧\n\nشرح مختصر مبسط بدأ فيه المؤلف بالأصول الثلاثة، ثم القواعد الأربع، ثم النواقض العشرة، وختم الكتاب بشرح رسالة الشيخ لأهل القصيم في بيان عقيدته.'},
      {title:'التمام في أحاديث الأحكام — خالد الباتلي',date:'٢٣/٢/٢٠٢٤',body:'عدد الصفحات: ٣١٥\n\nجمع المؤلف أحاديث الأحكام من ثلاثة متون: بلوغ المرام وهو الأصل، والمحرر، وعمدة الأحكام، مع العناية بترتيب بعض الأحاديث وألفاظها من أصولها؛ فجاء بصورة مميزة ومناسبة للحفظ.'},
      {title:'ترياق — مطلق الجاسر',date:'٢٣/٢/٢٠٢٤',body:'عدد الصفحات: ٢٠٥\n\nبدأ المؤلف بذكر سبب تأليفه للكتاب، ثم فصل القول بين الوسواس والشبهات، وأصل للكلام عن الشبهات وطريقة التعامل معها بمنطقية، ثم تكلم عن بعض الشبهات ورد عليها، وختم الكتاب بمنظومة في آداب الحوار.'},
      {title:'تسريع القراءة وتنمية الاستيعاب — أنس الرفاعي ومحمد عدنان سالم',date:'٢٧/٢/٢٠٢٤',body:'عدد الصفحات: ٢٦٣\n\nتكلم المؤلفان عن طرق متعددة متدرجة في تسريع القراءة مع تدريبات لها، ثم انتقلا إلى توجيهات للطلاب وطرق الاستفادة المثمرة في الدراسة والاستذكار وكتابة البحوث. فيه نوع من المبالغة في سرعة القراءة وربما خلط بين التصفح والقراءة، مع أن بينهما فجوة كبيرة؛ وسرعة القراءة نسبية تختلف من شخص لآخر ومن كتاب لآخر. الكتاب مناسب لطلاب الثانوية والجامعة.'},
      {title:'الشرح الممتع على زاد المستقنع، المجلد الأول — محمد العثيمين',date:'٣/٣/٢٠٢٤',body:'عدد الصفحات: ٥٢٠\n\nشرح الشيخ كتاب الطهارة من متن الزاد بطريقة سهلة ميسرة يفهمها الصغير والكبير والمتعلم وغيره، وهو على اسمه غاية في الإمتاع.'},
      {title:'جامع السنة — عبدالعزيز المقحم',date:'٨/٤/٢٠٢٤',body:'عدد الصفحات: ١٧٣٤ (ثلاثة أجزاء)\n\nجمع المؤلف الأحاديث الصحيحة من ٣٧ كتابًا من كتب الحديث، مع بعض التعليقات المختصرة.'},
      {title:'مع ابن تيمية — راشد العبدالكريم',date:'٣٠/٤/٢٠٢٤',body:'عدد الصفحات: ٢٢٣\n\nتناول المؤلف كتب ابن تيمية بطريقة فريدة تجعل القارئ يبحر فيها بأسلوب سهل جذاب، فجعل الكتاب حوارًا بينه وبين ابن تيمية.'},
      {title:'منكرو السنة — هيثم طلعت',date:'١٢/٥/٢٠٢٤',body:'عدد الصفحات: ١٢٤\n\nتكلم المؤلف عن التنوير المزعوم، ثم عرج على منكري السنة، وبيّن منزلة السنة في الإسلام وفند شبهات المنكرين لها. تميز الكتاب بسهولة العبارة والاختصار وعدم التطويل.'},
      {title:'عقيدة أهل السنة والجماعة — محمد العثيمين',date:'٣١/٥/٢٠٢٤',body:'عدد الصفحات: ٤٨\n\nسرد الشيخ عقيدة أهل السنة والجماعة سردًا مختصرًا ميسرًا، يفهمه العامي ويستفيد منه الطالب.'},
      {title:'سلسلة أحسن القصص للفتيان — عبدالمنعم الهاشمي',date:'٧/٧/٢٠٢٤',body:'عدد الصفحات: ٢٠٥\n\nذكر المؤلف عددًا من القصص بأسلوب أدبي سهل وشيق، مع لمحات إيمانية وتربوية.'},
      {title:'مصطلحات ابن خلدون والمعاصرين للمذاهب الأصولية — خالد العروسي',date:'١١/٧/٢٠٢٤',body:'عدد الصفحات: ٦٤\n\nنقل المؤلف تقسيم ابن خلدون للمذاهب إلى ثلاثة: مذهب المتكلمين ويقصد بهم المالكية والشافعية والحنابلة، ومذهب الفقهاء ويقصد بهم الحنفية، ومذهب يجمع بين الطريقتين. ثم أبطل المؤلف هذا التقسيم ووصفه بأنه سقيم لا يستند إلى مستند قويم، وذكر أن غاية ما يشفع له أن قائله ولي القضاء في زمانه، ثم ختم بجهود علماء الإسلام في تنقية أصول الفقه مما يشوبه من علم الكلام المرفوض. كتيب لطيف وأسلوب مؤلفه خفيف.'},
      {title:'روجيه جارودي وموقفه من الإسلام — أحمد القاضي',date:'١٣/٧/٢٠٢٤',body:'عدد الصفحات: ١٥٥\n\nتكلم المؤلف عن جارودي، فذكر أنه ولد لأبوين ملحدين، ثم اعتنق النصرانية البروتستانتية والماركسية، وأصبح مناضلًا في سبيل مبادئه حتى وفاته. وبسبب مواقفه مع المسلمين وحقوق المستضعفين ظن بعض الناس أنه أسلم، ولكن هذا لم يحصل باعتراف جارودي نفسه، وإنما اعتنق دين الإنسانية. ثم أسس مركزه «القلعة الحرة» في قرطبة، الذي يعبر فيه عن أفكاره وجعله مزارًا.'},
      {title:'المجمع الفاتيكاني الثاني — عايض الدوسري',date:'٦/٨/٢٠٢٤',body:'عدد الصفحات: ١٢٦\n\nتكلم المؤلف عن فكرة المجمع ودوافعه وكيف تطور، ثم ذكر الانتقادات عليه من الكاثوليك، ثم البروتستانت والعلمانيين، وأخيرًا العرب والمسلمين. ويرى أن هذا المجمع يتستر بالحوار من أجل الترويج للنصرانية.'},
      {title:'الهادي والهاذي — عبدالله الهدلق',date:'١٤/٨/٢٠٢٤',body:'عدد الصفحات: ٩٠\n\nالكتاب عبارة عن رد على صاحب كتاب «الحكمة المصلوبة»، وتفنيد افتراءاته على ابن تيمية.'},
      {title:'هذه رسالات القرآن، فمن يتلقاها — فريد الأنصاري',date:'٢١/٨/٢٠٢٤',body:'عدد الصفحات: ١١٩\n\nكتيب في الرقائق، عبارة عن مجموعة مقالات تكلم فيها المؤلف عن تحديد الوجهة، ومجالس القرآن، وإنه وحي فتعرضوا له، ومفهوم التدبر، والإخلاص. وذكر الفرق بين التدبر والتفسير؛ فكل مفسر متدبر، وليس كل متدبر مفسرًا.'},
      {title:'مختصر بيان تلبيس الجهمية — ابن تيمية، اختصره عبدالله الفيفي',date:'١/٩/٢٠٢٤',body:'عدد الصفحات: ٢٨٤\n\nأصل الكتاب رد على كتاب «أساس التقديس» للفخر الرازي، وفيه مسائل خالف الرازي فيها منهج السلف؛ منها براهين إنكار علو الله، وقياس الغيب على الشاهد، ودعوى إجماع طوائف الإسلام على تأويل آيات الصفات، وقوله إن الناس يتوجهون في الدعاء إلى الملائكة لأن العرش قبلة الدعاء. كما يذكر الضعاف والموضوعات إذا وافقت كلامه، ولا يلتزم أحيانًا بألفاظ الحديث، ويستدل بأحاديث موضوعة، ويتناقض في مسائل عدة. ويبين المختصر أن آفة الرازي ومن سار على نهجه وضع قواعد فلسفية فاسدة ثم بناء العقيدة عليها، وتقديم ما ينقدح في الذهن على نصوص الوحي.'},
      {title:'تاريخ ابن غنام والدعوة النجدية: قراءة في إشكالية التاريخ والخطاب — عصر محمد النصر',date:'٦/٩/٢٠٢٤',body:'عدد الصفحات: ١٨٨\n\nتكلم المؤلف عن الشيخ محمد بن عبدالوهاب وطلبه للعلم والبيئة التي عاش فيها وبداية دعوته والظروف التي ظهرت فيها. وذكر بعض المآخذ على تاريخ ابن غنام، مبينًا أنه كتاب تاريخ وليس كتاب تأصيل، فقد يعتريه ما يعتري كتب التاريخ من عدم الدقة والتحقيق. كما تطرق إلى موقف المخالفين للدعوة وما وقعوا فيه من عدم فهم لمقاصدها أو محاولة إسقاط وتشويه لها ولرموزها، وتناول مسائل التكفير والفرق بين قيام الحجة وفهم الحجة.'},
      {title:'سيد رجال التاريخ (محمد ﷺ) — علي الطنطاوي، جمعها مجاهد ديرانية',date:'٨/٩/٢٠٢٤',body:'عدد الصفحات: ١٠٢\n\nالكتاب عبارة عن مجموعة مقالات تحوي إضاءات حول شخصية النبي ﷺ ودعوته وهجرته بأسلوب رائق.'},
      {title:'العمدة في الاعتقاد — فلاح العريفي',date:'١٥/٢/٢٠٢٥',body:'عدد الصفحات: ٢٦٠\n\nعرض المصنف أبواب العقيدة مفصلة بأسلوب ميسر، معتمدًا على الآيات والأحاديث فقط، ولم يستخدم عبث المتكلمين ولا خرافات المبطلين. مناسب للحفظ.'},
      {title:'كتاب الانتصار (العقود الدرية) — محمد بن عبدالهادي المقدسي',date:'٢٥/٢/٢٠٢٥',body:'عدد الصفحات: ٥٦٠\n\nذكر محقق الكتاب محمد السيد الجليند أن عنوان الكتاب في الأصل «الانتصار»، لكن الشيخ محمد حامد الفقي بعد أن جمعه عنونه بـ«العقود الدرية» ولم يذكر سببًا لهذا العنوان الجديد. الكتاب ترجمة مختصرة لابن تيمية؛ استفتح المؤلف بسرد كتبه ورسائله وقواعده، ثم ذكر مواقف ومناظرات ومضايقات وحبسًا، وختم بوفاته. وفي آخره ملحقان من كلام ابن رجب في ذيل الطبقات وابن كثير في البداية والنهاية.'},
      {title:'تقريب درء تعارض العقل والنقل — عبدالله بن سلمان الفيفي',date:'٢٨/٢/٢٠٢٥',body:'عدد الصفحات: ١٦٩\n\nاختصر المعدّ مسائل كتاب «درء تعارض العقل والنقل» لابن تيمية ووضع قواعد عقلية على هامش الصفحات، منها: لا يثبت الشيء بدون لازمه؛ لا يتوقف المعلوم القطعي على نفي المعارض؛ النظر في الدليل لا يستلزم الشك في المدلول؛ القدح في بعض العقليات ليس قدحًا في مجموعها؛ لا تصح التسوية بين المتباينات؛ لا يلزم من بطلان أحد القولين صحة الآخر؛ من كان للنبوة أقرب كان نظره العقلي أصح؛ ليس كل ما صح لغة صح تفسيرًا؛ وتناقض الدليل العقلي الموجب للتأويل دليل فساده.'}

    const JURAISH_SUMMARIES = [
      {title:'شرح نور البصائر والألباب — ابن سعدي، شرح بسام اليوسف',date:'٤/١٢/٢٠٢٣',body:'عدد الصفحات: نحو ١٠٠٠ صفحة.\n\nشرح مختصر محرر شامل لأغلب أبواب الفقه، مع ذكر جملة من الحقوق والآداب. وهي رسالة مختصرة للعلامة ابن سعدي اسمها «نور البصائر والألباب في أحكام العبادات والمعاملات والحقوق والآداب»، ألفها قبل وفاته بعامين على قول واحد، وهو الراجح عنده. قام الشيخ بسام اليوسف بشرحها والتعليق عليها بعبارة جميلة وترتيب رائع. مناسبة لمن أراد أن يأتي على أبواب الفقه وبعض الحقوق والآداب باختصار.'},
      {title:'ذخر المعاد في الصلاة والسلام على خير العباد ﷺ — أحمد بن غانم الأسدي',date:'٧/١٢/٢٠٢٣',body:'عدد الصفحات: ١٠٠.\n\nمن أبرك الطاعات وأنفع العبادات وأرجى القربات الصلاة والسلام على رسول الله ﷺ. وهذا مختصر نافع رائع في هذا الموضوع.'},
      {title:'الخلاف أنواعه وضوابطه وكيفية التعامل معه — حسن بن حامد العصيمي',date:'١٧/١٢/٢٠٢٣',body:'عدد الصفحات: ٢٣٠.\n\nتناول جانبًا مهمًا من الإشكالات الحاصلة في ساحات النقاش، وهو الخلاف؛ فبين أنواعه وأحكامه وفوائده وكيفية التعامل معه، وذكر لكل منها أمثلة تطبيقية. ثم تطرق لموضوع زلة العالم وكيفية التعامل معها، وأبدع فيه، وختم الكتاب بأهم النتائج. التقييم: ٤٫٥. توجد أنواع من الخلاف لم يتطرق لها أو لم يبحثها بتوسع، كالخلاف الملغي وخلاف التنوع.'},
      {title:'تهذيب كتاب الروح — ابن قيم الجوزية',date:'٢٦/١٢/٢٠٢٣',body:'عدد الصفحات: ٢١٧.\n\nتكلم رحمه الله عن إحدى وعشرين مسألة في الروح وما يتعلق بها؛ فيعنون للمسألة ثم يجيب عنها ويحكي الأقوال فيها وينصر ما يترجح له مستشهدًا بالأدلة من المنقول والمعقول، ويذكر ما في الواقع من منامات وغيرها. وختم بذكر أمور والفروق بينها، كالفرق بين التواضع والمهانة، والعفو والذل، وفرح القلب وفرح النفس، والاحتياط والوسوسة، والمبادرة والعجلة.'},
      {title:'مختصر في علم مصطلح الحديث',date:'١٨/١/٢٠٢٤',body:'عدد الصفحات: ١٧٠.\n\nمجلد لطيف ذكر أهم مسائل وقواعد وأصول فن الاصطلاح بأسلوب سهل واضح، مع ذكر الأمثلة والإحالة على كتب أخرى، وضم بعض المسائل بعضها إلى بعض للاختصار. ولا يخلو من نقد في مواضع قليلة.'},
      {title:'أحكام الهبة والهدية',date:'٣١/١/٢٠٢٤',body:'عدد الصفحات: ١٨٢.\n\nذكر فيه أهم المسائل الفقهية المتعلقة بالهبة والهدية: أحكام الهبة وفيها أربع وعشرون مسألة، وأحكام الهدية وفيها خمس وثلاثون مسألة، وخاتمة فيها أهم النتائج. تميز بذكر الأقوال مع الأدلة والترجيح باختصار، وذكر بعض المسائل المعاصرة واللطائف والفوائد المتعلقة بالموضوع.'},
      {title:'كتاب في أذكار وأحكام اليوم والليلة',date:'١٣/٢/٢٠٢٤',body:'عدد الصفحات: ٢٧٠.\n\nرائع جدًا، حوى دررًا ونفائس مما يحتاجه المسلم في يومه وليلته: من طلوع الفجر إلى ارتفاع الشمس، ومن ارتفاع الشمس إلى زوالها، ومن بعد الزوال إلى مصير ظل الشيء مثله، ومن ذلك إلى غروب الشمس، ومن الغروب إلى مغيب الشفق، ومن مغيب الشفق إلى طلوع الفجر، وفي فقه عوارض اليوم والليلة. والمؤلف محدث فقيه ومن الملازمين لابن باز رحمه الله.'},
      {title:'اختيارات من شعر المتنبي وتحليل شخصيته',date:'٢٦/٢/٢٠٢٤',body:'عدد الصفحات: ١١٠.\n\nمجلد لطيف فيه اختيارات من شعر المتنبي مع شرح مختصر لها، ثم ذكر تحليلًا مختصرًا لشخصية المتنبي من خلال شعره في عشر نقاط.'},
      {title:'نتاج الفكر في أحكام الذكر — عبدالله بن مانع الروقي',date:'٥/٣/٢٠٢٤',body:'عدد الصفحات: ٣٤٠.\n\nذكر مؤلفه خمسين حكمًا؛ يذكر أصلًا أو قاعدة أو حكمًا كليًا، ثم يذكر الأدلة عليه والاستثناءات والقيود والفوائد الفقهية والحديثية واللطائف، مع الإحاطة والتنوع في النقولات. قال مؤلفه: «بذلت فيه روحي».'},
      {title:'الإمام عبدالرحمن بن يحيى المعلمي: حياته وآثاره — أحمد بن غانم الأسدي',date:'٢٨/٤/٢٠٢٤',body:'عدد الصفحات: ٥٠٠.\n\nترجمة حافلة للعلامة اليماني عبدالرحمن بن يحيى المعلمي، تحدثت عنه من الولادة حتى الوفاة، وعن أسرته وأعماله وثناء العلماء عليه، ثم لمحات من حياته العلمية ومنتخبات من نفائس درره التاريخية والتفسيرية والحديثية. وتحدث الكتاب عن آثاره العلمية في نحو مئة صفحة وتحقيقاته وأمانيه العلمية ووصيته ومراسلاته. كتاب قيم وممتع.'},

      {title:'المربي القائد: صفاته ومهاراته القيادية والإدارية — نبيل محمد الأحمر',date:'١١/٢/٢٠٢٤',body:'عدد الصفحات: ١٦٠.\n\nقسم الكتاب إلى خمسة فصول، في كل فصل خمسة فروع: صفات المربي القائد كالصدق والأمانة والعلم والرؤية والثقة؛ ومهاراته الذاتية في تحديد المجال والقيم والرؤية والرسالة والمشاريع الحياتية؛ ومهارات تحليلية في الشخصية والمنظمات التربوية واستراتيجيات التعلم والأولويات والوقت؛ ومهارات تنفيذية في الخطط والاجتماعات والتفويض وإدارة الموظفين؛ ومهارات علاجية في تعديل السلوك وحل المشكلات واتخاذ القرار والإبداع والتواصل وبناء العلاقات.'},

      {title:'المرونة النفسية — د. بندر آل جلالة',date:'١٠/١/٢٠٢٤',body:'أنهيت -بفضل الله- كتاب «المرونة النفسية» هذا المساء في قراءة متقطعة له. تضمن نصائح وأساليب عملية لتحسين المرونة النفسية، والكاتب متخصص وأتى على جملة من الأساليب الجيدة في تحسين الحالة النفسية بشكل إيجابي.\n\nمميزات: سهولة عبارته وبساطتها واختصارها في الغالب بما يحقق وضوح الفكرة، بدون تطويل يمل القارئ أو اختصار يخل بالفهم؛ كما أتى على غالب ما يحسن الحالة النفسية وعالج كثير من المشكلات التي تخلق الحالة النفسية السلبية.\n\nعيوب: التكرار، فقد كرر عددًا من المضامين أكثر من مرة؛ ولم يعالج الصدمات من فقدان علاقات شخصية، مثل خسارة صديق مقرب أو زوج أو زميل، فهذه من أهم المشكلات التي تؤثر على نفسيات الناس اليوم.'},
      {title:'الظل والحرور — فهد الجريوي',date:'٢/٣/٢٠٢٤',body:'أتممت بفضل الله كتاب الظل والحرور، وهو كتاب أبدع الكاتب في جمعه وترتيبه وانتقاءاته. وهو نافع جدًا كدليل في قراءة السير الذاتية، نافذة جميلة للدخول إلى عالمها، يعطيك لمحة عن كل سيرة من السير المذكورة ويجول بك بين مقتطفاتها. وقد أجاد في العنونة وجمع المتفرق، ولا شك أنه بذل فيه جهدًا كبيرًا. تمنيت لو خدم بالفهرسة، ولو أضيفت ترجمة مختصرة لبعض من ذكرت سيرتهم، ولو أتى على سير لأعلام أغفلهم. أحث الجميع على إتمامه، فجمال أوله كآخره.'},
      {title:'عوارض تقادم الحقوق المالية — محمد بن عبدالمحسن السعوي',date:'١/٢/٢٠٢٥',body:'عدد الصفحات: ٦٥ (من منشورات مجلة قضاء).\n\nبذل الباحث مجهودًا بحثيًا كبيرًا في استقراء عوارض التقادم من خلال نصوص الفقهاء القائلين بالتقادم واستخرج منها ما يعد عذرًا للمدعي في عدم المطالبة بحقه أمام القضاء، وما الظروف والأحوال والأوصاف التي متى ما توفرت في المدعي عد فيها معذورًا. ثم بذل مجهودًا ذهنيًا رائعًا في استقراء الأعذار المعتبرة وصاغ جملة من الضوابط اختصرها في ثلاثة ضوابط. وقد أثار نقاطًا جيدة في نقد نظام المعاملات المدنية الجديدة، وخاصة «المانع الأدبي» في المادة ٣٠٠ فقرة ٢. البحث مختصر في صفحاته ولكنه مهم في موضوعه وعظيم الفائدة في فهم مقتضى التقادم. ولي عليه ملاحظات: لم يفصل تفصيلًا كافيًا في مسألة عوارض التقادم فيما يعد منها قاطعًا للمدة وما يعد منها موقفًا لها، ولم يتطرق في الأعذار لما يكون سبب التقادم فيه توقف الدعوى المتقادمة على الفصل في دعوى أخرى.'}

      {title:'حياتي — أحمد أمين',date:'٢/٦/٢٠٢٤',body:'عدد الصفحات: ٢٢٢ (دار العالم العربي).\n\nكتاب من كتب السير الذاتية يتحدث فيه مؤلفه عن مراحل عمره من طفولة إلى فتوة وكهولة، وكيفية عيشه فيها وأثر تربية والديه ومجتمعه عليه، وحرص والده على طلبه للعلم. كتاب رائع فيه من الدروس واللطائف الشيء الكثير لجمعه بين التاريخ ورؤيته للتعليم والتعلم والمتعة. من أبرز ما يستفيده القارئ: محبته للعلم والتعلم وبذل النفس والوقت فيه، واستفراغ جهده في القراءة لعظم الأثر في ذلك.'},
      {title:'تباريح التباريح — محمد بن عمر العقيل (ابن عقيل الظاهري)',date:'٢٦/٦/٢٠٢٤',body:'عدد الصفحات: ١٣٦.\n\nانتهى من كتابته عام ١٤١١هـ، وهي من فنون السير الذاتية. كتب ابن عقيل كتابه بأسلوب لطيف وأخذنا على رواحل السنين وجعلنا نتنزه في حدائقه الغناء الخلابة، ولم يتقيد بالتسلسل العمري بل أمرها حيث أتت. من الجميل في كتابته الوضوح وإظهار مواضع المدح في النفس وذمها، على طريقة يرتضيها الشارع، لم يصرح بنبز أحد أو سبه أو فضح نفسه فيما ستره الله. وفي هذه السيرة فوائد غزيرة وألطاف غير يسيرة.'},
      {title:'ماذا علمتني الحياة؟ — جلال أمين',date:'١٥/٨/٢٠٢٤',body:'عدد الصفحات: ٤٣٢.\n\nمن قرأ «حياتي» لأحمد أمين وهذه السيرة لجلال يرى التغير السريع العميق الذي طرأ على المجتمع المصري وسرعة تغير الناس. بالغ في صراحته في بعض المواقف وعيب عليه ذلك. سرد ممتع بأسلوب شيق، عنده ثقة فيما يكتب ويرى. أخذ الأول في الثانوية العامة على مصر، وأهم البواعث في جده في دراسته ومسيرته العلمية شعوره بالنقص والرغبة في لفت الانتباه. يشعر بخيبة أمل في طريقة حياته. قبل أن يكتب سيرته قرأ سيرًا كثيرة ليظهر أثرها فيما سيكتبه، وقال عن كتاب أبيه «حياتي»: أكاد أحفظه عن ظهر قلب من كثرة قراءته.'}

      {title:'الوقوف على أطراف الأصابع: ذكرياتي مع جائحة كورونا — د. توفيق بن فوزان الربيعة',date:'٢٧/١/٢٠٢٥',body:'مذكرات كتبها الدكتور توفيق بن فوزان الربيعة، الذي شغل منصب وزير الصحة في المملكة العربية السعودية خلال فترة تفشي جائحة كورونا. يستعرض تجربته الشخصية والمهنية خلال الجائحة، مسلطًا الضوء على التحديات التي واجهها والقرارات الحاسمة التي اتخذها لمواجهة الأزمة. يقدم الكتاب نظرة من الداخل على كيفية تعامل وزارة الصحة السعودية مع الجائحة، بما في ذلك استراتيجيات التصدي للفيروس، والتواصل مع الجمهور، والتنسيق مع الجهات المختلفة لضمان سلامة المواطنين والمقيمين.'}

    const OMAR_SUMMARIES = [
      {title:'خطى مشيناها — عباس خضر',date:'٢٨/٤/٢٠٢٤',body:'سيرة مختصرة عن المؤلف: مولده عام ١٣٢٦هـ ووفاته ١٤٠٧هـ / ١٩٠٨م - ١٩٨٧م، فتى تعلم على يد الكتاتيب، والتحق بالأزهر وهو صغير، نحيف الجسم طويل سريع العدو، والغريب أن في قاموس كلماتهم تشابهًا بيننا في نجد وبين الفيوم.\n\nعادة المذكرات أو الروايات تشدك البدايات وبعدها تضعف وربما نهايتها مملة، إلا «خطى مشيناها» تزداد الحركة والاضطراب معها في المنتصف، وذلك بزواج والده من الزنجية، وهو البدوي والحضري، وبفقره واضطراب حياته المادية ومحاولة العمل والكد وكسب العيش من الصحافة والأدب والتصحيح. وأمر آخر زاد من جمال هذه الخطى أنها بدأت بالأفراح والسعادة والآمال معلقة بالمستقبل المشرق الفتان انطلاقًا من القرية مرورًا بمدينة الفيوم وبعدها في قاهرة العز ومنارة العلم القاهرة والأزهر، ولكن هذه الرياح تشتهي العواصف والأمواج العاتية التي عصفت بالفتى عباس مما يجعلنا في ترقب لمستقبل هذا الفتى عباس وإلى عينه الناظرة وقلمه الناقد وأسلوبه السهل، كأنك في فيلم.\n\nهذه المذكرات عبر ثناياها نقد هادف للنخبة المثقفة التي أمسكت زمام الأمور بحق أو بغيره، ونقد لرجال خدمتهم الحزبية أو صنعهم الثراء، وذكر شمائل مغمورين بخستهم السياسة أو الحسد أو الفقر أو كلاهما مجتمعين.\n\nخط الرحلة الزمانية والمكانية والمعرفية في قرية من قرى الفيوم تجمع بين الحضر والبدو وبين الفلاحين والرعاة، ثم انتقل إلى الفيوم وبعدها للقاهرة.\n\nالعجيب أن عباس لديه كلمات كثيرة مشابهة لكلامنا مثل: مرمط، وصم بمعنى حفظ، والزير، والقربة، ونبلبط، وتنشيقة، وحمقت، والطاسة، وبائخ، وعِرس يقصد به الفرح بكسر العين، والبخشيش، والتلطم، ويتكرمش، ويدح، ومره يقصد امرأة، وكركرنا ضحكنا، وتمرغ، وزي قلتي. وفي طفولته لعب الكرة بالشراب وسابق أقرانه لأنه نحيف ولأنه يأكل اللحم كل أسبوع كما نعته بذلك أحد الصبيان الخاسرين. ويحب بطلنا التجارب كالسحر والغناء والشمة والتمايل في الإنشاد والأذان والمغازل والمعاكسة والإنشاد، وكثير منها يصيبه الفشل والخذلان وربما المقالب.'},
      {title:'عهد الصبا في البادية — إسحاق الدقس (ترجمة: عزيز ضياء)',date:'٢٢/١/٢٠٢٥',body:'حينما يأسرك أحدهم بحديثه فيرمي كلمة هنا وحكمة هناك، وينثر مقولات وأبياتًا واختيارات، أو يشدك عنوان ذكره أحد محدثيك، تنتظر بفارغ الصبر انقضاء تلك الجلسة، أو تنعزل خلسة عن القوم فتبحث عن تلك المقولة أو تيك التجربة أو ذلك المؤلف. وكما قال عبدالملك بن مروان: محادثة الإخوان من متع الدنيا. شدني ما ذكره الباحث الأستاذ منصور في جلسة صباحية فيها ذكريات ومذاكرات، ما ذكره عن مذكرات إسحاق الدقس «عهد الصبا في البادية»، ولست وحدي فالمرحوم عزيز ضياء وهو من نقلها لنا بالعربية شده هذا العنوان (Bedouin Boyhood)، طفولة البدو أو عهد الصبا في البادية، وقد كتب ضياء مقدمة لهذه الذكريات هي من عيون المقدمات.\n\nجمال هذه المذكرات انخراطك في أحداثها برفقة الراعي إسحاق وشادي، ومواقف الرعاة الصبيان وما يصاحبها من أحداث ومغامرات تبقى عصية على النسيان، ومنها رعي البقر، ورعي البقر مذموم في بادية الجزيرة العربية أم بادية الشام فهي جزء من حياتهم، والسعيد من يتولى رعي ورعاية البقر لأنها لا تعود إلا بعد الغروب، وهي الساعة المحببة للعشاق بعيدًا عن ضوء النهار وأعين المتلصصين وعين الرقيب تكون ساهية. حياة البدو والرعي مليئة بالدروس والعبر، وهي مدرسة الأنبياء قبل. لقد شدني وصفه للحملان وبحثها عن أمهاتها، هوليودية الرواية أو الذكريات وطابعها البانورامي وتنقلاتها الفصلية، مثلما هي تنقلات حقيقية بين فصول العمر من فتوة وخريف وصبا، ومن حيث لاف واجتماع، وسمر وحزن. هذه القفزات في السرد والأحداث يصيبك بنوبات الحنين لصباك ومغامراتك وشطحاتك، فتضحك مرة وتتألم مرات، وتكون الضاحك الباكي. لماذا الذكريات حلوة ولو كانت تعيسة؟!\n\nجلسات السمر ونغمات الربابة مع الأساطير الشعبية هي تلك الأفلام الحية في خيام القبيلة. حدثوني عن سبب تمسك البدو والحضر بالخيمة مع التقدم العلمي والتقني والمعماري، إن لها لونًا وطعمًا وراحة نظر تعجز الحروف عن وصف هذه الحالة المزاجية التي تسري في الروح والجسد حيال الخيام وحياة البدو. تتسابق فصول الرواية بالانقضاء كما يتسابق شبان وادي الحيسي على جيادهم في أيام الأعياد، لمن تكون الراية؟ قيم لا يمكن التنازل عنها: الشجاعة والفروسية والكرم. ولفت انتباهي اسم إبراهيم وليس من عادة أهل البادية التسمية بمثل هذا الاسم. الذكريات كانت مزيجًا بين حياة القرية والبادية، وحيوات البادية مثلها حياة الأرياف والمدن، مزيج من الجد والهزل والقوة والكسل، والمزح والرزح، ولعب الصبيان وجد الكبار، والصبابة والرثاء والحزن والإقدام، والربابة والمزمار والموسيقى الحزينة. أما الحب والتعارف والعشق فتنطلق شراراته من الوادي والمرعى والغدير، واسأل علي عن هيامه بنايفة وشحوب وجهه واعتلال جسمه لما انقطعت عنه محبوبته بضعة أيام. عشق الأطلال كعشق الشبابيك، وللعم جمعة الكهل المتصابي مغامرات كانت محلًا للتندر والمقالب، ومغازلته للفتيات الصغار وخاصة دهب، وما صنع بالقارورة أو الجرة حكاية لا تنسى. والتعلم في مضارب البادية يضرب أطنابه حول الخيام، وطلاب البادية والقرية والمدينة متشابهون في المشاكسة والتفلت والمقالب في المعلمين، لقد اهتم إسحاق بحمار الأستاذ وإطعامه هروبًا من الواجبات. ابن البادية تعود إطلاق بصره في الفضاء، واعتاد الحرية نابذًا قيود المدنية. لم تدم القبيلة في مراعيها، اعتدى عليهم اليهود وفرقوا شمل البادية - فرق الله شملهم -.\n\nالحياة تحتاج جد الناظر وهزل أبي زهير وإلا طحنتنا الأيام. الحياة كشهر أكتوبر في بادية الشام؛ الذبول وتساقط الورق، يقابلها النشاط والقوة في مشاهد الصبية وهم ينطلقون فرحين مرحين لمدارسهم. الحياة جعلت أبي صالح حارسًا للحقول بعد أن كان لديه حرسًا لحقوله، وتحدث عن غربته في البلاد السعودية وأنه لم يشعر بالابتعاد عن وطنه وأرضه المغصوبة. ونختم بهذه الرؤية التربوية قالها إسحاق متحدثًا عن الأمهات: «ما من أحد أكثر من الأمهات مقدرة على الإلمام بمتاعب أبنائهن، واكتشاف خواطرهم المبلبلة وقراءة أفكارهم مهما حاول هؤلاء إخفاء ما في صدورهم». هذه الرواية أو المذكرات تسرك وتأسرك.'},
      {title:'أولئك أبنائي / حياتي في حكاياتي — د. حسن الشافعي',date:'٧/٢/٢٠٢٥',body:'أولئك أبنائي.. يشير إلى طلابه، وهذا العنوان ربما يكون الأخير في سلسلة حكايات الشيخ حسن الشافعي، في كتابه «حياتي في حكاياتي». وتصاب بالذهول لأن الكتاب اشتمل على أكثر من سبعين حكاية، ولم يتذمر من حياته أو من عيشته، وأهمها الذرية، فإنه لم يرزق بأولاد صابرًا شاكرًا ومحتسبًا: «ولم أرزق أولادًا، والحمد لله على ما أعطى وأولى». وعادة أن الشاب أو من لم يرزق بأولاد يكون قاسيًا في التعليم والتربية، وهذا خلاف ما عرف عن الدكتور الشافعي. والآن قارب المئة؛ فيحدثنا عن نفسه وهو في الخامسة والثمانين فيقول: «أسعى إلى تطوير إمكاناتي وطريقتي؛ أملًا في الوصول إلى مستويات - ونماذج في ذهني - أكثر حرفية ونجاحًا. لقد كنت أشعر دائمًا أنه لا بد من القيام ببعض الأنشطة، في إطار ما يسمى بالمجتمع المدني - لخدمة المجتمع المصري -». ولقد ذكر موقفين عابرين في نظره وهما ملفتان للنظر: الطالب الماليزي الذي يجيء من ولايته بطائرة خاصة، والآخر تدريسه لحفيد برنارد شو، الطالب المهاجر من بريطانيا لاستراليا والمتعلم في مدارس الباكستان، وأجاد العربية وفاق أهلها. وكما بدأنا بالخاتمة، فإن مقدمته تعطيك انطباعًا عامًا عن تجرد الشيخ وصدقه، ويتمنى أن يقلد العميد في كتابته لسيرته، ولو سار في كتابه ككتابه للمقدمة لربما قارب سيرة العميد ولكنه لم يصل: «كل الرواة لسيرهم الذاتية يقلدون العميد - رحمه الله»، و«حياتي في حكاياتي: نبش في الذاكرة، ورقم على الورق، أريق فيه الحبر الممزوج بالهم والأسى، والذات والأنا، والألم والأمل، رسالة من جيل ينزل على السفح إلى جيل يشرع في الصعود، وحوارًا بين قرنين». الشافعي خريج المدرسة الدرعمية، وهي كلية دار العلوم، وهذه اللفظة تتكرر في ثنايا حكاياته، ووضحها لي الدكتور عبدالرحمن قائد.'},
      {title:'العقيد وأنا — دعد الشرعب',date:'٢٥/٢/٢٠٢٥',body:'«العقيد وأنا» سيرة مغمورة تحمل في طياتها أخبارًا، وفي زواياها أسرارًا، وفي النفس منها أشياء، وأحداث تجعلك تزداد يقينًا بأن ما كتبه الله لك سيكون لا محالة. دعد الشرعب تذكر لنا المنعطف الأهم في حياتها، ألا وهو سؤال طرحته أمام القذافي: «هذا السؤال هو الذي غير حياتي، وأنا أؤمن بالقدر ولا يعلم إلا الله ماذا كان سيحدث لو بقيت صامتة في ذلك اليوم!؟»، و«اسمحوا لي أن أوضح لكم أني لم أكن ثورية أبدًا، ولست مناهضة لأمريكا، ولم أكن منجذبة إلى القذافي بسبب سياساته. ومع ذلك، كنت في سن حساسة، وكان هناك شيء فيه بدأ يبهرني ويجذبني إليه».\n\nهذه الفتاة الأردنية من أصل فلسطيني، التي ولدت وترعرعت وتربت في السعودية، خرجت على عادات قومها، وشاكست الرجال، وغمطت النساء، وهي ابنة رجل الأعمال التي عوضته عن أخيها المعاق، قوية الشخصية ذات شكيمة تعشق الصعاب، وتتقن التفاوض والاتجار بالعملات، عنكبوتية العلاقات، أخطبوطية الافتراس، جريئة التحدث، فاتنة القول، واثقة الخطو، غزيرة الثقافة، تملك كاريزما المواقف. هذا المزيج وهذه السمات جعلت العقيد القذافي يفتتن بها، وتصبح المستشارة الخاصة له. وكيف تم ذلك؟ أتتها دعوة لحضور مؤتمر يخص اتحاد النساء مما وافق هوى في نفسها، ولكن الأب لم يرحب بالفكرة، ويعرف تداعيات الذهاب إلى ليبيا، وهنا تصادمت غريزة الأبوة مع تهور الفتاة؛ فالأب يدرك مآلات ومخاطر هذا الذهاب، والبنت مصرة على الإقدام؛ فنشب أول خلاف بين الأب وابنته. وفي الأثر أن الأولاد - ذكورًا وإناثًا - ثمرة القلب ومجبنة ومبخلة، وانتصرت الفتاة ذات السبعة والعشرين عامًا على والدها: «قال لي والدي مباشرة: لن تذهبي. كنت امرأة ناضجة يؤتمن عليها ملايين الدولارات، ومع ذلك شعرت أن والدي لا يزال يعاملني كطفلة، ربما للمرة الأولى في حياتي كنت على استعداد لتحديه في مسألة ذات عواقب. كنت ذاهبة إلى ليبيا القذافي، سواء أحب والدي ذلك أم لا. لقد أزعجته ليلًا ونهارًا. وفي النهاية أعطاني مباركته - على مضض شديد».\n\nونقطة التحول في حياة المصرفية دعد هو ذلك السؤال الصارخ في حضرة العقيد وأمام الملأ والأشهاد وعلى الهواء مباشرة في مؤتمر اتحاد النساء: «لماذا لا نشاهد زوجتك في هذا المحفل؟»، هنا وجم الحضور وخيم الهدوء ولو سقط دبوس على الأرض لسمعت صوته. والتغير الثاني في حياة الفتاة المشاغبة هو صداقتها مع نعيمة الصغير - راهبة الثورة ورئيس الحرس الشخصي للعقيد، ولنعيمة مواقف غريبة تستحق التأمل. ودعد قنبلة موقوتة كما وصفها رئيس المخابرات الليبي، وتعتبر اليد اليمنى للعقيد في المباحثات الخارجية، وهي محاورة ومراوغة ذكية؛ تبين ذلك من لقاءاتها المتلفزة، وإن كنت أعتقد أن هناك مبالغات وتدليسًا ربما تتضح في قادم الأيام. وهي القائلة: «تفتح الأبواب المغلقة في وجهك إذا كنت تعرف الأشخاص المناسبين في المكان المناسب».'}

      {title:'ترياق — د. مطلق الجاسر',date:'١٨/٥/٢٠٢٦',body:'من قراءتي للكتاب لاحظت بأنه يتكلم عن شخص أعرفه، دائمًا في المجالس يعطي بعض الشبهات، وكم مرة نناقشه ولكنه شخص جدلي لا ينتهي، فوجدت الكتاب تكلم عنه وعن أمثاله بأن الترك أفضل حل لهم.\n\nومن يشاهد حوار العجيري مع عمر جبران سيجد بأن العجيري والجاسر ينطلقان من نفس المبادئ، بحيث لا تناقش شخصًا بلا أي أساسيات متفق عليها.'},
      {title:'لماذا نصلي؟',date:'٢٦/٧/٢٠٢٦',body:'عدد الصفحات: ١٥٠.\n\nكتاب من ١٥٠ صفحة، لكنه يفتح لك بابًا واسعًا لفهم الصلاة من زاوية مختلفة. يجيب عن سؤال بسيط وعميق في آنٍ واحد: لماذا نصلي؟ ويأخذك في رحلة قد تكتشف خلالها معاني وأبعادًا للصلاة غفلت عنها، وربما لم تخطر لك من قبل. أراه من الكتب الجميلة التي تساعد على إعادة النظر في بعض مفاهيمنا عن الصلاة، والاقتراب منها بوعي أعمق وشعور مختلف.'},
      {title:'الذكريات — الشيخ علي الطنطاوي',date:'٣٠/٧/٢٠٢٦',body:'ما سر متعة «الذكريات»؟ ليس في أحداثها وحدها، بل في أسلوب صاحبها؛ يبدأ الحديث في أمر، ثم لا تلبث أن تجد نفسك معه في أمر آخر، ثم ثالث، ثم رابع، حتى تظن أنه ابتعد عن الموضوع، فإذا به يعود إليك وقد زادك علمًا ومتعة. تلك الاستطرادات لم تكن خروجًا عن الطريق، بل كانت هي الطريق نفسه.\n\nوكلما قرأت «الذكريات» ازددت يقينًا بأن التاريخ يعيد نفسه؛ يروي الشيخ ما جرى في الشام قبل عشرات السنين، فإذا بك ترى كثيرًا من تلك الصور يتكرر في زماننا، حتى ليخيل إليك أن الفارق بين الأمس واليوم هو التاريخ المكتوب في أعلى الصفحة.\n\nومن الطريف أن الطنطاوي كان كثيرًا ما يلوم نفسه على الاستطراد، ويراه عيبًا يلازمه في الكتابة والمحاضرات والبرامج التلفزيونية، حاول أن يتخلص منه لكنه لم يستطع، حتى قال ساخرًا: إن من سوء حظه أن الاستطراد ليس حرامًا، وإلا لأجبر نفسه على تركه!'},
      {title:'جنى الصباح — عبدالرحمن الشايع وأحمد الشدي',date:'٥/٨/٢٠٢٦',body:'في صباح اليوم، احتسيت قهوتي في مقهى قدح كافيه على طريق الأمير فهد بن تركي بن فيصل، وبين الكتب الموضوعة في المقهى استوقفني كتاب «جنى الصباح»، ولأن الوقت كان صباحًا وجدت في عنوانه ما يدعوني إلى تصفحه، فتركت الكتاب الذي أحضرته معي وأخذت أقلب صفحاته.\n\nالكتاب من تأليف عبدالرحمن الشايع وأحمد الشدي، وهما اسمان مألوفان لكل من يتابع برنامج «بك أصبحنا» في إذاعة القرآن الكريم، وفكرته تقوم على اختيار أجمل الرسائل التي بعث بها المستمعون للبرنامج، بعد أن انتقياها من بين أكثر من نصف مليون رسالة.\n\nكتاب خفيف جميل، ومن أكثر ما أعجبني فيه أنهما حرصا على ذكر اسم صاحب كل رسالة، فخرج الكتاب وكأنه باقة من الفوائد أسهم في صنعها آلاف الأشخاص وجمعت بين دفتي كتاب واحد.'},
      {title:'ابني حبيبي',date:'٧/١٠/٢٠٢٦',body:'كتاب شيق ومميز، ومن الكتب التي أحدثت في نظرتي للأحاديث والقصص النبوية تغييرًا كبيرًا.\n\nفبعد قراءته أصبحت عندما أقرأ أو أسمع موقفًا نبويًا لا أبحث فقط عن الحكم الشرعي المستفاد منه، بل أتأمل جوانبه التربوية والإنسانية والنفسية، وأحاول أن أراه من أكثر من زاوية، وهذا مما جعل قراءتي للسيرة والحديث أكثر عمقًا وفائدة.'},
      {title:'كتاب في فرط الحركة وتشتت الانتباه — أ. وديان الخضيري',date:'١٦/١٠/٢٠٢٦',body:'كتاب جميل ومهم لمن يخالط الصغار من معلمين أو أهالٍ إذا كان لديهم طفل يشتبه بأن لديه فرط حركة وتشتت انتباه.\n\nالجميل فيه أنه يتكلم من داخل الواقع المجتمعي لا فلسفات مختصين. المؤلفة أ. وديان الخضيري لها مركز متخصص بهذه الفئة في بريدة، وكثير من الحالات ترفضها لأن الطفل حركي طبيعي يحتاج فقط فهمًا من الأهل، فليس كل الحالات تحتاج تدخلًا سلوكيًا وعلاجيًا، وهذا معروف بأنه يخسرهم مبالغ مالية.'}

      {title:'تاريخ جزيرة العرب في القرن العشرين & خمسون عامًا في جزيرة العرب — حافظ وهبة',date:'٢/٩/٢٠٢٥',body:'عدد الصفحات: الأول ٤٣٥، والثاني ٣١٨.\n\nقبل الحديث عن محتوى الكتابين لا بد من تعريف بصاحبهما: حافظ وهبة مصري ولد عام ١٨٨٩م في القاهرة، وكغيره من أبناء جيله حفظ القرآن صغيرًا وتعلم عددًا من علوم الدين في الأزهر، وكان منذ صغره يكره الخرافات الدينية المنتشرة في مجتمعه ويدعو للعودة للدين الصحيح. تنقل بين البحرين والهند وتركيا والكويت إلى أن استقر به الترحال في السعودية. ومن عام ١٣٤٢هـ عمل مستشارًا سياسيًا للملك المؤسس عبدالعزيز آل سعود، ولازمه طوال حياته يستشيره في العديد من القضايا السياسية الداخلية والخارجية. والأهمية التاريخية لمحتوى الكتابين أن حافظ كتب ما كتب عن مشاهدة مباشرة ومشاركة في الأحداث، فهو شاهد عيان، وضمّن العديد من الرسائل المتبادلة بينه وبين الملك عبدالعزيز ورسائل وبيانات الملك المختلفة.\n\nالكتاب الأول: «تاريخ جزيرة العرب في القرن العشرين» في ٤٣٥ صفحة، يتحدث فيه عن البلدان في الجزيرة العربية من شرقها إلى غربها ومن شمالها إلى جنوبها، وعن تاريخ المدن ومساحاتها وعدد سكانها وطقسها وتضاريسها، وكذلك الأسر الحاكمة والعلاقات فيما بينها.\n\nالكتاب الثاني: «خمسون عامًا في جزيرة العرب» في ٣١٨ صفحة، تحدث فيه عن شخصية الملك عبدالعزيز ولقائه به وعمله معه كمستشار سياسي، ثم عن بعض الأحداث السياسية المهمة مثل ضم الحجاز للدولة السعودية.'},
      {title:'سيرة حياة عبدالرحمن بدوي — د. عبدالرحمن بدوي',date:'٢٥/٩/٢٠٢٥',body:'عدد الصفحات: ٧٢٥.\n\nفي ٧٢٥ صفحة يتحدث عبدالرحمن بدوي بصراحة شديدة عن حياته وعن حياة مجتمعه وأقرانه وزمانه، فهو في سيرته لا يتحدث عن حياته الشخصية فقط، بل يضمنها كل ما أحاط به. فعندما يزور دولة يتحدث عن تاريخها السياسي والثقافي والتحولات التي عاشتها وآثارها وأبرز العلماء فيها، كما فعل مع سويسرا، فيخرج القارئ بمادة علمية متكاملة عن تلك البلاد.\n\nولا يتورع في مذكراته عن ذكر مغامراته العاطفية ولا يستحي من ذلك، فيذكر من قابل من الجميلات وماذا فعلوا وأين، حتى أنه يتحسر على ذهاب تلك اللحظات ويعيد زيارة الأماكن التي جمعتهم. وهو رجل عاش حياته عازبًا لم يتزوج، وقال إن سبب ذلك تفرغه الكامل للعلم.\n\nوأبرز ما يلاحظه القارئ أن بدوي كثير المدح لنفسه، فهو يمدح إتقانه للغات وأعماله التي انقسمت بين تأليف وتحقيق وترجمة، وأعتقد أن سبب هذا المدح المبالغ فيه أنه عاش الكثير من الصراعات والمعارك الشخصية مع عدد من أعلام عصره، ومنهم من حاول حرمانه من بعض حقوقه العلمية والوظيفية، فهو بمدحه هذا كأنه يقول: كنت جديرًا بكل ما حاولوا سرقته من حقوقي. وعندما يتحدث عن قصة هذه المعارك يذكر أسماء الأشخاص ولا يواري، ويذكر أدق التفاصيل، وهذا أحد جماليات مذكراته برأيي؛ فمثلًا قصته مع أحمد أمين الذي يصفه بأنه حقود ضيق الأفق تأكل قلبه الغيرة، عندما تقدم بدوي لطباعة كتابه عند لجنة التأليف والترجمة والنشر فطلب أحمد أمين وضع اسمه على الكتاب ومشاركته في التأليف! وهذا ما رفضه بدوي، ويقول عنه إنه يستغل المؤلفين المبتدئين ويشاركهم في كتبهم.\n\nوبدوي صريح حاد في نقده مع الكل عربًا وعجمًا، فيصف ذاك بالضعف العلمي والآخر بالتملق والثالث بالكذب والرابع بأنه مأجور وأسلوب فلان بالركاكة. كما يذكر لنا الجانب الآخر من شخصيات المشاهير الأعلام، فهو يقول إن طه حسين شديد الخوف من الطائرة ويفضل السفر بالباخرة، وقد كان بدوي شديد الإعجاب بطه حسين الذي وصفه بقوله: لأول مرة نشاهد فيلسوفًا مصريًا.\n\nومن أهم فقرات الكتاب التي ركز عليها هجومه الكاسح على حركة الضباط ١٩٥٢م التي يصفها بأنها أكبر كارثة عانت منها مصر؛ فبدوي عاش فترة الملكية والجمهورية، ويذكر الكوارث التي حلت بمصر بسبب حركة الضباط، وينتقد سياساتهم التي جلبت لمصر الدمار على كافة الأصعدة، منها الإصلاح الزراعي الذي تأثرت به عائلة بدوي لأنهم من كبار ملاك الأراضي، كما يتحسر على انحدار الحياة العلمية والثقافية ويذكر كيف تحول أساتذة الجامعات إلى مخبرين. وبسبب كل هذه التغيرات قرر بدوي ترك مصر والعيش في فرنسا.\n\nكان بدوي منذ صغره متعلقًا بالعلم والقراءة والتعلم، واختار دراسة الفلسفة وألف فيها عشرات الكتب من أشهرها «الزمن الوجودي». كما عمل أستاذًا بالجامعة في عدد من الدول مثل مصر وفرنسا وإيران وليبيا. وكانت كتابة بدوي لمذكراته في باريس في المكتبة الوطنية سنة ١٩٨٧م، أي قبل وفاته بخمسة عشر سنة.'},
      {title:'سوانح (مقالات وديع فلسطين في مجلة الإنذار) — جمع: أ. محمد سعود الحمد',date:'٢٤/٨/٢٠٢٦',body:'الكتاب هو مجموعة مقالات نشرها وديع فلسطين في مجلة مغمورة اسمها الإنذار، وكان ينشر تحت عمود اسمه «سوانح»، وكانت هذه المقالات تراجم لشخصيات أدبية وغيرها.\n\nوعثر عليها الحمد بالمصادفة في أرشيف، فجمعها وأخرجها في هذا الكتاب.'}

      {title:'مختصر مما اتفق عليه الشيخان (٣٠٠ حديث) — علي جابر الفيفي',date:'١٢/١٠/٢٠٢٥',body:'عدد الصفحات: ١١١.\n\nصدر حديثًا للمؤلف علي جابر الفيفي، صاحب كتاب «لأنك الله» و«الرجل النبيل» وغيرها. مختصر جمع فيه شيئًا مما اتفق على صحته الشيخان، وعدد أحاديث المختصر ٣٠٠، في العقيدة والفقه والأخلاق والرقائق والوصايا والفضائل، في ١١١ صفحة.'},
      {title:'عقود الجمان في دروس شهر رمضان — الشيخ أ.د. سعد الخثلان',date:'١٦/٢/٢٠٢٦',body:'عدد الصفحات: ٢٦٠ في النسخة الإلكترونية و٢٩٦ في الورقية.\n\nكتاب الشيخ سعد الخثلان حفظه الله، عبارة عن ٤٠ درسًا لشهر رمضان في النسخة الإلكترونية، وفي النسخة الورقية زيادة ١٤ درسًا في عشر ذي الحجة. مكتوب عليه سعر مخفض بـ٢٠ ريالًا. الدروس مناسبة للقراءة بعد صلاة العصر أو العشاء في شهر رمضان، فهي ليست طويلة، تقريبًا من ٤ إلى ٥ صفحات لكل درس. كتب الله أجره.'},
      {title:'عشر حقائب تربوية — فاطمة المهدي',date:'٧/٦/٢٠٢٦',body:'عدد الصفحات: ١٩٠.\n\nذكرت الكاتبة فاطمة المهدي عشر حقائب تربوية: الاحتياجات، واللغة والتواصل، والقواعد، وتحمل المسؤولية، والسلوك والدافع، والقهر الأبوي، والتفكير النقدي، والتربية يمين شمال، وصراع المنطق والمشاعر، والأشياء مقابل الأبناء. الكتاب سهل ولطيف وفيه اللهجة العامية المصرية، تربوي جميل يحتاجه كل مربٍّ: أب وأم ومعلم، في ١٩٠ صفحة فقط.'},

      {title:'فكك عقدك النفسية — فهد بن مسلم',date:'٢٩/٨/٢٠٢٦',body:'عدد الصفحات: ٢٨٨.\n\nكتاب يقع في ٢٨٨ صفحة، جميل في بابه وخفيف سهل القراءة. أعتقد أن أحد الزملاء في النادي أشار للكتاب، وذهبت لجرير ووجدته رقم واحد في رف الأكثر مبيعًا. بكل صراحة في بداية الكتاب قلت: الله يهديه اللي أشار علي بقراءة الكتاب، ولكن كلما زدت في الصفحات لامست بعض الأفكار أشياء مهمة في حياتنا، ولعلي أرسل لكم شيئًا من جميل ما في هذا الكتاب.\n\nركز الكاتب كثيرًا على أن الحياة اختيار والسعادة قرار، وأن لا تدمر حياتك بالصراعات. وخطوات التحرر من الضغط النفسي: أولًا حدد مصدر الضغط النفسي، ثانيًا اتخذ القرار لحل المشكلة، ثالثًا ابدأ فورًا بتطبيق نظرية الاختيار - اختيار راحتك: الصديق، الزوجة، برنامجك اليومي -، رابعًا تطبيق الصورة الذهنية: أن يرى الإنسان كل شيء جميلًا.\n\nالسعادة لا تنتظر، ولا يمكن أن تسعد بوجود ثلاث فئات في حياتك: من يحاول السيطرة عليك وتوجيهك بالقوة، ومن يقلل من شأنك أو يسخر منك أمام الآخرين، والشخص السلبي المتشائم دائم الشكوى. وممارساتك اليومية هي وقود سعادتك، وتشمل: الجانب الروحي: علاقتك بالله وطمأنينتك بالإيمان؛ ووجود معنى في الحياة: هدف أو مشروع أو عمل يمنحك قيمة؛ وممارسة الرياضة لتحسين الصحة النفسية والجسدية؛ وعلاقات أسرية صحية: لا سعادة مع تفكك داخلي في العائلة.\n\nالاضطراب النفسي: قاعدة: إذا كان عقلك مشغولًا بالأفكار فاعلم أن جسدك متعب، وكل اضطراب في جسدك مرتبط بألم في نفسك. وقاعدة حياتية: لا أجلس في مكان يؤذيني، ولا مع شخص يهز ذاتي، ولا آكل ما يضرني، وأسير في الحياة بمزاجي.\n\nوالدراسات الحديثة تؤكد أن أكثر المهن ربحًا مستقبلًا هما: المحاماة لكثرة النزاعات، والطب النفسي لأن الناس مرهقون نفسيًا.'},
      {title:'هكذا ربانا جدي علي الطنطاوي — عابدة المؤيد العظم',date:'٦/٩/٢٠٢٦',body:'عدد الصفحات: ١٤٤.\n\nكتاب جميل دلني عليه المبدع أبو محمد الزويد وفقه الله. أعجبتني فكرة الكتاب، وهو عبارة عن مقالات نشرت في مجلة ثم جمعتها المؤلفة في هذا الكتاب. الفكرة هي أنها تذكر اللفتة التربوية ثم تذكر مواقف في كيفية تطبيق جدها الشيخ علي الطنطاوي رحمه الله لهذه اللفتة، وأعتقد أنها طريقة ميسرة للانطلاق في الكتابة والتأليف. يقع في ١٤٤ صفحة.'}

      {title:'الرد الوافر على من زعم أن من سمّى ابن تيميةَ شيخ الإسلام كافر — ابن ناصر الدين الدمشقي الشافعي',date:'٢٤/٥/٢٠٢٦',body:'لابن ناصر الدين الدمشقي الشافعي (ت: ٨٤٢هـ)، وهو رد على مقالة أحد علماء عصره ممن صرح بتبديع تقي الدين ابن تيمية بل كفره، ثم صار يصرح في مجلسه بأن من أطلق على ابن تيمية أنه شيخ الإسلام فإنه يكفر بهذا الإطلاق.\n\nفجمع ابن ناصر الدين كلام من أطلق على ابن تيمية أنه شيخ الإسلام من الأئمة الأعلام، منهم: الذهبي، وابن القيم، وابن سيد الناس، وابن عبدالهادي، وابن المهندس، وابن الزملكاني، وابن كثير، وابن رجب، والحافظ العراقي، والبزار، والبلقيني، وذكر أكثر من ثمانين عالمًا ممن سمى ابن تيمية شيخ الإسلام. ثم قال: ولقد تركنا جمًّا غفيرًا وأناسيَّ كثيرًا ممن نص على إمامته وما كان عليه من زهده وورعه وديانته.\n\nوفي هذه الطبعة وضعوا المخطوطة كاملة في آخر الكتاب، والتي جاءت في ١٤٨ صفحة.'},
      {title:'عبير الياسمين في سيرة الشيخ عبدالله بن عبدالرحمن الجبرين رحمه الله — أ.د. طارق بن محمد الخويطر',date:'١٢/٦/٢٠٢٦',body:'سيرة للشيخ رحمه الله عايشها المؤلف أو سمعها من الشيخ أو ممن هو قريب من الشيخ. وقد قدم بمقدمة عن فضل العلم وصحبة العلماء، ثم في سيرة الشيخ وصفاته، ثم ختم بعنوان: الشيخ بأقلام محبيه وأصدقائه.\n\nوفي هذه السيرة أشياء كثيرة لا توجد في السيرة الأخرى للشيخ «أعجوبة العصر». والمؤلف ممن اعتنى بتراث الشيخ عناية كبيرة، بل هو من النماذج المميزة في بر التلميذ بشيخه.'},
      {title:'كتاب في زغل الرواية والإسناد ومجالس السماع',date:'٢٣/٩/٢٠٢٦',body:'عدد الصفحات: ٣٧٠.\n\nحديث عن الرواية والإسناد والإجازات ومجالس السماع وما فيها من زغل ودخل وزيف، وفيه إرشادات وتوجيهات في هذا الباب وغيره، وفيه فصول في علم الرواية والسماع، وفيه علل وقصص عجيبة غريبة في باب السماع والإسناد كشمهروش ورتن الهندي وميمون الجني والجنية الصحابية وغيرهم، وفيه نماذج وصور من زغل الرواية في القديم والحديث. يقع في ٣٧٠ صفحة.'}

      {title:'هوس القراءة — جو كوينن (ترجمة: أنس غطوس)',date:'٩/٨/٢٠٢٥',body:'لاحظت أن الكاتب الأمريكي جو كوينن، في كتابه «هوس القراءة» ترجمة أنس غطوس، يتعمد الجمع بين النفي والإثبات، أو النهي والأمر، أو التحذير والإغراء، وأحيانًا صياغة سؤال افتراضي يقدمه كما لو كان حقيقة، وذلك في جملة واحدة، بقصد التشويق والإثارة وشد الانتباه. وهي طريقة فعالة، لولا الإفراط في استخدامها.\n\nومن أمثلة ذلك قوله: «ويسألني البعض: ما الذي قد يدفعك إلى قراءة رواية نجمة بقلم باميلا أندرسون، في حين يمكنك قراءة المحققون المتوحشون بقلم روبرتو بولانيو؟». ولا يخفى أن التكرار مظنة الملل، وهو ما نلمسه كثيرًا في بعض الكتابات الغربية.'},
      {title:'الإنسان في القرآن — عباس محمود العقاد',date:'٨/٩/٢٠٢٥',body:'«عود على بدء» عنوان اختاره الأديب عباس العقاد في خاتمة كتابه «الإنسان في القرآن»، مستعرضًا فيه الأدلة والبراهين، ومستشهدًا بالتجارب والنظريات، بأن القرآن هو الأصلح لعقيدة القرن العشرين وما بعده كما كان صالحًا لما قبله، وبالإيمان بالنبوة المحمدية.'},
      {title:'كارل وآنا — لينهارد فرانك',date:'٢٣/٩/٢٠٢٥',body:'«كارل وآنا» - لمن لا يعرفها - هي قصة خواطر كتبها ريتشارد عن زوجته التي عشقها حد الجنون والتي تركها لوحدها وذهب للحرب، وكارل شاب أعزب كان ينصت إلى خواطر صديقه ويستمتع بتفاصيل حياة ريتشارد مع زوجته.\n\nوموقف شبيه بهذا ولكن في مجال آخر حدث لي مع صحبة كانوا يترددون على دولة مصيفها بديع، وهواؤها عليل، وأطعمتها شهية؛ ومع سردهم المتكرر للخواطر والمواقف والحوادث حفظت أزقة وأنهار وضيعات تلك البلاد. وبعد عشر سنوات زرتها مع إخوة آخرين، فكنت أرشدهم إلى أجمل الأماكن السياحية وأحسن الضيعات والمطاعم، على الرغم من أنها زيارتي الأولى فعليًا، فاستغربوا ذلك إذ كنت في نظرهم أزعم أنها الزيارة الأولى. بعض الذكريات تنقش نفسها في الذاكرة نقشًا لا يمحى وتسري في الدم. وفي قصة آنا وكارل دروس وعبر لمن له قلب، وتأملها رجاء النقاش أحسن تأمل في تأملاته.'},
      {title:'عبادة المشاعر — ميشيل لكروا',date:'١١/١٠/٢٠٢٥',body:'شباب اليوم يجيدون الموازنة بين بهجة اللهو الجماعي وروح العمل التطوعي، فيجمعون بين المتعة والعطاء في لحظة واحدة. وهذا ما نراه في المهرجانات الفنية، التي قد تشبه في ظاهرها بعض صور الشامانية القديمة، بما فيها من انفعال جمعي وتوحد وجداني مؤقت.\n\nملخص لفكرة وردت في كتاب «عبادة المشاعر» لميشيل لكروا.'},
      {title:'القوقعة & رسالة من امرأة مجهولة — مصطفى خليفة وستيفان تسفايغ',date:'٣١/١٢/٢٠٢٥',body:'بين عدستين: عدسة القوقعة وعدسة المرأة المجهولة. الأولى جحيم يتقدم أمام ناظري الفتى المسجون بلا ذنب؛ عذاب جسدي وروح قوية استمدت قوتها من مشاهدتها. والثانية عدسة فتاة مجهولة تبصر بها كل يوم ما يؤلم الفؤاد ويعذب الروح؛ عذاب خفي يتسلل من نوافذ ضيقة إلى الروح فيعبث بها. إن العشق عذاب آخر: فالأول سجين الجسد مطلق العنان، والثاني سجين القلب والروح مطلق الجسد، يجمعهما أسر عدسة لا ترحم. وما كان الرفق في شيء إلا زانه.\n\n«القوقعة» رواية لمصطفى خليفة تحكي واقعًا مؤلمًا في السجون السورية، وتحتاج قلبًا قويًا. و«رسالة من امرأة مجهولة» ممكن نسميها رواية أو قصة طويلة لفتاة عشقت كاتبًا أو فنانًا لتسفايغ، وعليها ملاحظات.'},
      {title:'سيرة حمار — حسن أوريد',date:'٢٩/١/٢٠٢٦',body:'«سيرة حمار» رواية توثق حال الإنسان حين ينزلق وراء غرائزه ويتبع شهواته شربًا وجنسًا وسلوكًا، فينحدر إلى مرتبة البهائم. وهي رواية رمزية ساخرة أنجزها حسن أوريد، تعكس حال كثير من الشخصيات في الواقع العربي، وتكشف عورة الإنسان حين يتخلى عن عقله وقيمه.'},
      {title:'أولِ مقطِّر — ليو تولستوي',date:'١٢/٢/٢٠٢٦',body:'كأن تولستوي في قصته القصيرة «أولِ مقطِّر» يشرح حديثًا نبويًا على شكل قصة؛ فالفكرة ليست شرابًا يقطر، بل وسوسة تزرع، تبدأ كأسًا وتنتهي قطيعة.\n\nوقد سبق البيان النبوي هذا المعنى حين قال صلى الله عليه وسلم فيقول: ما تركته حتى فرقت بينه وبين أهله، فيقربه ويدنيه ويقول: نعم أنت؛ فأعظم الظفر عند الشيطان ليس المعصية، بل أن تتحول الرشفة الصغيرة وسلوكًا مستدامًا إلى شرخ في البيت والقلب والمجتمع.'},
      {title:'علاقات خطرة — د. محمد طه',date:'١٦/٢/٢٠٢٦',body:'د. محمد طه في كتابه «علاقات خطرة» ذكر ثلاثين نوعًا من العلاقات المؤذية، فبين طبيعة كل نوع ووصف ملامحه، واستشهد بأمثلة توضحه، مع طرح بعض العلاجات التي يتوقع نجاحها في التعافي. كتاب جدير بالاطلاع.\n\nما بك؟ ليه انخضيت! على لهجة إخواننا المصريين؛ كنت أرغب أن أشير إلى ذلك التفصيل الجميل في العلاقات فقط التي أسهب في شرحها الدكتور محمد طه؛ وإذا بالكتاب كله جيد؛ فلا فضل لفصل على باب، وزادت حلاوته تلك اللهجة المصرية في ثناياه؛ فبسطت الفكرة وسهلت الفهم؛ كأنك مع طبيب نفسي في صالون مي زيادة وتشاهدون مسلسلًا مصريًا وبرفقتكم محمد عفيفي وصلاح السعدني ومحفوظ رفعت أو حلقة من حلقات دكتور مبروك عطية.'},
      {title:'الحرب والسلام (قصة نيكولا روستوف) — ليو تولستوي',date:'٢٩/٧/٢٠٢٦',body:'من المشاهد التي تتكرر في جميع طبقات المجتمعات أيًا كان مذهبها وعرقها ودينها: ذلك الابن المستهتر الذي يستند إلى ثراء أبيه ومكانته ووجاهته ومنصبه ونفوذه، فيرتكب الخطأ تلو الخطأ، ثم يترك لأبيه أو أسرته تبعات الأذى.\n\nوهذا ما نجده عند تولستوي في «الحرب والسلام» في قصة نيكولا روستوف مع أبيه العجوز الكونت إيليا أندرييفيتش، حين خسر في المقامرة، ثم لجأ إلى أبيه ليخرج من ورطته، رغم أن والده كان قد حذره من قبل من تبديد المال وتبذيره. والأجمل أن نيكولا، وإن بدا في حديثه مع أبيه لا مباليا، كان في داخله يشعر بالذنب، ويعرف أنه ارتكب خطأً لا يغتفر، وأنه أثقل كاهل أبيه. لكنه يكابر أن يظهر هذا الندم؛ فسنه وطيش الشباب لا يسمحان له أن يعترف اعترافًا صريحًا، فيخفي خجله وندمه خلف اللامبالاة.\n\nوهذا ما نراه كثيرًا بين الأبناء؛ فالابن قد يعرف في داخله أنه أخطأ، لكنه لا يملك شجاعة الاعتراف. ومتى شعر بعظم المسؤولية، وأدرك أن أخطاءه لا يتحملها وحده، بل يدفع ثمنها أبوه وأسرته، بدأ يتعلم معنى المسؤولية، وتردد قبل أن يكرر خطأه، وهذا ينطبق على الشاب والفتاة. رفقًا - يا شباب ويا فتيات - بالآباء والأمهات، لا تجرفكم الرأسمالية والمقارنة والطموح السارب.'},
      {title:'مذكرات عربي أفغاني',date:'٢٢/٨/٢٠٢٦',body:'نادرًا جدًا ما أعيد قراءة كتاب مرة أخرى، وهذا من عيوبي، إلا أن تكون الإعادة عن طريق الخطأ، وهذا - ولله الحمد - من فطنتي وذهانتي، أو يكون الكتاب للمازني.\n\nأما الخطأ فقد وقع لي مع كتاب «مذكرات عربي أفغاني»؛ أسرتني مقدمته فاسترسلت في القراءة، ثم أخذني شعور غريب بأن هذا الكلام قد مر علي من قبل. بحثت في تدويناتي، فإذا بي قد قرأت الكتاب قبل سنتين أو ثلاث - شك من الرائي وهو ثقة ثبت -. وبالعادة إذا علمت أنني قرأت الكتاب من قبل أو أنه قد مر علي فإني أتوقف مباشرة ولا أكمله، لكن هذا الكتاب كان استثناء؛ إذ أكملت قراءته بسبب طريقته في السرد، ولا سيما حديثه عن ذهابه إلى الجهاد وعن وصف تلك المرحلة، مرحلة التسعينات الميلادية.'},
      {title:'حول العالم في ٢٠٠ يوم — أنيس منصور',date:'٢٨/٩/٢٠٢٦',body:'يقول أنيس منصور في مقدمة الطبعة الثانية أو الثالثة - نسيت - من كتابه «حول العالم في ٢٠٠ يوم» إن هذه الطبعة تختلف عن سابقتها في أمر مهم جدًا: أنه حذف كلمة «جدًا» من «جدًا جدًا جدًا»؛ فقد كان في الطبعة الأولى يقولها ثلاث مرات، أما في الطبعة الثانية فقد رأى أن مرتين تكفيان!\n\nوالشيء بالشيء يذكر، فهذا من الكتب الجميلة التي يتحدث فيها أنيس منصور عن رحلاته، وكعادته يأخذك معه إلى كل شيء؛ فيقول إنه سكن جميع المساكن، ودخل جميع المستشفيات، ونام في جميع الأجواء، وركب جميع المواصلات كالحناطير مثلًا، وأكل جميع الأكلات حتى الثعابين، إلى آخر تلك التفاصيل التي تجعل الرحلة عنده رحلة في الدنيا كلها لا في البلدان وحدها. ولو زاد حبتين لبلغ مبلغ ابن بطوطة الطنجي.\n\nوهي من الكتب التي تستحق القراءة ومسلية، خاصة لمن يحب أنيس منصور حين يحول الرحلة إلى حكايات وملاحظات وتأملات، وفيها من طرافته الشيء الكثير.'}

      {title:'حكايتي بعد التسعين — د. عبدالعزيز علي النعيم',date:'١٧/١٠/٢٠٢٦',body:'عدد الصفحات: ٣٧٨.\n\nسيرة ذاتية للدكتور عبدالعزيز علي النعيم، كتبها بعد أن جاوز التسعين عامًا، وبلغ عدد صفحاتها ٣٧٨. بدأ بالحديث عن أن والدته كانت حاملًا به وكانت معركة السبلة تدور رحاها في عام ١٣٧٤هـ، وبعد ولادته أحبته أمه جدًا لكونه الأكبر بين إخوته، وكانت تناديه «جمار كبدي»، وكان في عينيه حول وفيه سمنة، وكان هذا يسبب تندر الصبية عليه. ثم سرد بعض الذكريات التي ما زالت عالقة في ذهنه، كتنك القاز الذي يؤتى بالجمال من عبادان والكويت ومختوم عليه ختم الشركة المصنعة (ساكوني فاكوم) وهي شركة نفط أمريكية، وتحدث عن روبيان عنيزة وهو الجراد، وعن بعض وصايا والدته كـ«امسك يد أخوك وكونوا قريبين من بعض»، وقد جاوزت التسعين وما زال ممسكًا بيده. وتحدث عن أجواء عنيزة إبان الحرب العالمية، وعن مدارس عنيزة ولهجتها، وعن بعض الفروق في الطباع بين بريدة وعنيزة، فذكر أن أهل عنيزة لا يعددون عكس أهل بريدة، وأن رجلًا من عنيزة تزوج امرأة من بريدة فأراد أن يتزوج بأخرى فقالت له: ما قبلت الزواج بك إلا لأن أهل عنيزة لا يعددون، فقال: وأنا ما تزوجت من بريدة إلا لأن أهلها يعددون، فحريمهم اعتدن على التعدد. ثم تحدث عن زواجه وعن أول إذاعة في عنيزة وعن دراسته في القاهرة وتعيينه في هيئة الخبراء وأمور أخرى عديدة. من أجمل كتب السيرة الذاتية التي قرأتها.'}

    function applyQuoteBatch(memberName, batch, marker) {
      if (localStorage.getItem(marker)) return;
      const existing = archiveData[memberName] || (archiveData[memberName] = []);
      const titles = new Set(existing.map(item => item.title));
      batch.forEach(item => {
        if (!titles.has(item.title)) existing.push({ type: 'quote', title: item.title, date: '', body: item.body });
      });
      localStorage.setItem(marker, '1');
      saveArchive();
    }

    function saveArchive() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(archiveData));
      } catch (e) {}
      updateStats();
    }

    function updateStats() {
      let totalQuotes = 0;
      let totalArticles = 0;
      let totalSummaries = 0;
      DEFAULT_MEMBERS.forEach(m => {
        const list = archiveData[m.name] || [];
        list.forEach(item => {
          if (item.type === 'article') totalArticles++;
          else if (item.type === 'summary') totalSummaries++;
          else if (item.type === 'quote') totalQuotes++;
        });
      });
      document.getElementById('statMembers').textContent = DEFAULT_MEMBERS.length;
      document.getElementById('statQuotes').textContent = totalQuotes;
      document.getElementById('statArticles').textContent = totalArticles;
      document.getElementById('statSummaries').textContent = totalSummaries;
    }

    function setGlobalFilter(filter, btn) {
      globalFilter = filter;
      document.querySelectorAll('.controls-section .pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderMembers();
    }

    function renderMembers() {
      const q = document.getElementById('globalSearch').value.trim().toLowerCase();
      const grid = document.getElementById('membersGrid');
      grid.innerHTML = '';

      DEFAULT_MEMBERS.forEach(member => {
        const items = archiveData[member.name] || [];
        const quotesCount = items.filter(i => i.type === 'quote').length;
        const articlesCount = items.filter(i => i.type === 'article').length;
        const summariesCount = items.filter(i => i.type === 'summary').length;

        if (globalFilter === 'hasContent' && items.length === 0) return;
        if (globalFilter === 'hasArticles' && articlesCount === 0) return;
        if (globalFilter === 'hasQuotes' && quotesCount === 0) return;
        if (globalFilter === 'hasSummaries' && summariesCount === 0) return;

        if (q) {
          const nameMatch = member.name.toLowerCase().includes(q);
          const contentMatch = items.some(i =>
            (i.title && i.title.toLowerCase().includes(q)) ||
            (i.body && i.body.toLowerCase().includes(q))
          );
          if (!nameMatch && !contentMatch) return;
        }

        const card = document.createElement('div');
        card.className = 'member-card';
        card.onclick = () => openMemberModal(member);

        let badgesHTML = '';
        if (articlesCount > 0) {
          badgesHTML += `<span class="badge-count badge-articles">✍️ ${articlesCount} مقال وخاطرة</span>`;
        }
        if (quotesCount > 0) {
          badgesHTML += `<span class="badge-count badge-quotes">📖 ${quotesCount} اقتباس</span>`;
        }
        if (summariesCount > 0) {
          badgesHTML += `<span class="badge-count tag-summary">📚 ${summariesCount} ملخص كتاب</span>`;
        }
        if (items.length === 0) {
          badgesHTML = `<span class="badge-count badge-empty">سجل العضو (اضغط للإضافة)</span>`;
        }

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div>
                <div class="member-name">${member.name}</div>
              </div>
              <span class="member-rank">#${member.id}</span>
            </div>
          </div>
          <div class="card-badges">${badgesHTML}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openMemberModal(member) {
      currentMemberName = member.name;
      currentModalTab = 'all';
      document.getElementById('modalMemberName').textContent = member.name;
      document.getElementById('modalMemberSubtitle').textContent = `الترتيب في النادي: #${member.id} — ${member.role}`;
      document.getElementById('addEntryForm').classList.remove('open');
      updateModalTabsUI();
      renderModalEntries();
      document.getElementById('memberModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('memberModal').classList.remove('open');
      currentMemberName = null;
    }

    function setModalTab(tab) {
      currentModalTab = tab;
      updateModalTabsUI();
      renderModalEntries();
    }

    function updateModalTabsUI() {
      document.getElementById('tabAll').classList.toggle('active', currentModalTab === 'all');
      document.getElementById('tabArticles').classList.toggle('active', currentModalTab === 'article');
      document.getElementById('tabQuotes').classList.toggle('active', currentModalTab === 'quote');
      document.getElementById('tabSummaries').classList.toggle('active', currentModalTab === 'summary');
    }

    function renderModalEntries() {
      const container = document.getElementById('modalEntriesList');
      const items = archiveData[currentMemberName] || [];
      const filtered = currentModalTab === 'all' ? items : items.filter(i => i.type === currentModalTab);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:2.5rem 1rem; color:var(--text-muted); background:#fff; border-radius:14px; border:1px dashed var(--border-soft);">لا توجد مشاركات مسجلة في هذا القسم حالياً. يمكنك إضافة مشاركة جديدة من الزر أعلاه.</div>`;
        return;
      }

      container.innerHTML = filtered.map((item, idx) => {
        const isArticle = item.type === 'article';
        const isSummary = item.type === 'summary';
        const cardType = isArticle ? 'article-type' : isSummary ? 'summary-type' : 'quote-type';
        const tagClass = isArticle ? 'tag-article' : isSummary ? 'tag-summary' : 'tag-quote';
        const tagText = isArticle ? 'مقال / خاطرة' : isSummary ? 'ملخص كتاب' : 'اقتباس موثق';
        const sourceText = isSummary ? '📚 ملخص كتاب' : !isArticle && item.title ? '📚 ' + item.title : '✍️ ' + currentMemberName;
        return `
          <article class="entry-card ${cardType}">
            <div class="entry-meta">
              <span class="entry-tag ${tagClass}">${tagText}</span>
              ${item.date ? `<span class="entry-date">📅 ${item.date}</span>` : ''}
            </div>
            ${(isArticle || isSummary) && item.title ? `<h3 class="entry-title">${item.title}</h3>` : ''}
            <div class="entry-text">${item.body}</div>
            <div class="entry-source">
              <span>${sourceText}</span>
              <button class="copy-btn" onclick="copyText(${idx})">📋 نسخ النص</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function toggleAddForm() {
      document.getElementById('addEntryForm').classList.toggle('open');
    }

    function saveNewEntry(e) {
      e.preventDefault();
      if (!currentMemberName) return;
      const type = document.getElementById('entryType').value;
      const title = document.getElementById('entryTitle').value.trim();
      const date = document.getElementById('entryDate').value.trim();
      const body = document.getElementById('entryBody').value.trim();

      if (!archiveData[currentMemberName]) archiveData[currentMemberName] = [];
      archiveData[currentMemberName].unshift({ type, title, date, body });
      saveArchive();
      renderMembers();
      renderModalEntries();
      e.target.reset();
      toggleAddForm();
      showToast('تم حفظ المشاركة في سجل العضو بنجاح');
    }

    function copyText(filteredIndex) {
      const items = archiveData[currentMemberName] || [];
      const filtered = currentModalTab === 'all' ? items : items.filter(i => i.type === currentModalTab);
      const item = filtered[filteredIndex];
      if (!item) return;
      const full = `${item.title ? item.title + '\n' : ''}${item.body}\n— ${currentMemberName} (نادي جليس)`;
      navigator.clipboard.writeText(full).then(() => showToast('تم نسخ النص إلى الحافظة'));
    }

    function exportArchiveJSON() {
      const payload = {
        club: "نادي جليس - أصدقاء القراءة",
        title: "أرشيف الأعضاء",
        exportedAt: new Date().toISOString(),
        membersCount: DEFAULT_MEMBERS.length,
        members: DEFAULT_MEMBERS,
        archive: archiveData
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'jalees-archive.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('تم تصدير ملف الأرشيف (JSON)');
    }

    function resetToDefault() {
      if (!confirm('هل تريد استعادة النسخة المعتمدة من الأرشيف؟')) return;
      archiveData = JSON.parse(JSON.stringify(INITIAL_ARCHIVE));
      saveArchive();
      renderMembers();
      if (currentMemberName) renderModalEntries();
      showToast('تمت استعادة النسخة المعتمدة بنجاح');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadArchive();
      updateStats();
      renderMembers();
    });
